# Spike config: Squid 7.7 as Lenny central CONNECT proxy (level 2 via external ACL helper).
pid_filename none
cache deny all
http_port 3128
include /conf/bump.conf

logformat lenny %ts.%03tu peer=%>a user=%un %Ss/%>Hs %rm %ru dst=%<a hier=%Sh/%<A tag=%et ea=%ea route=%{route_}note dur=%trms up=%<st down=%>st sni=%ssl::>sni
access_log stdio:/logs/access.log lenny
cache_log stdio:/logs/cache.log
debug_options ALL,1

auth_param basic program /usr/bin/python3 /helpers/auth_any.py
auth_param basic realm lenny-egress
auth_param basic credentialsttl 5 seconds
acl authed proxy_auth REQUIRED

external_acl_type lenny_decide ttl=10 negative_ttl=3 children-max=5 children-startup=1 %>rd %>rP %>a %ul %>h{Proxy-Authorization} /usr/bin/python3 /helpers/decide.py
acl decide external lenny_decide

acl CONNECT method CONNECT
# R3: refuse IP-literal authorities without DNS (IPv4 dotted, any IPv6 literal, decimal/hex/octal-ish integer forms)
acl ip_literal dstdom_regex -n ^[0-9.]+$ ^\[.*\]$ : ^[0-9]+$ ^0x[0-9a-f]+$
# R3: refuse resolved private/loopback/link-local/metadata/CGNAT/ULA addresses (dst triggers DNS by Squid itself)
acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 64:ff9b::/96 fc00::/7 fe80::/10 ff00::/8
# lab exception so the R4 tests can reach a long-lived target on the private Docker network
acl lab_target dstdomain spike-lab

http_access deny !CONNECT
http_access deny ip_literal
# after ssl_bump splice Squid re-checks http_access on a synthetic CONNECT without Proxy-Authorization;
# admit it when this client connection was already approved by the decision helper
acl conn_approved note clt_conn_tag lenny-approved-direct lenny-approved-upA lenny-approved-upB
http_access allow conn_approved !private_dst
http_access allow lab_target authed decide
http_access deny private_dst
http_access allow authed decide
http_access deny all

# R5: per-request parent selection from the helper's route= annotation
cache_peer spike-up-a parent 3128 0 no-query no-digest no-netdb-exchange name=upA
cache_peer spike-up-b parent 3128 0 no-query no-digest no-netdb-exchange name=upB login=tenantB:secretB
acl route_upA_tx note route_ upA
acl route_upA_conn note clt_conn_tag lenny-approved-upA
acl route_upA any-of route_upA_tx route_upA_conn
acl route_upB_tx note route_ upB
acl route_upB_conn note clt_conn_tag lenny-approved-upB
acl route_upB any-of route_upB_tx route_upB_conn
acl route_direct_tx note route_ direct
acl route_direct_conn note clt_conn_tag lenny-approved-direct
acl route_direct any-of route_direct_tx route_direct_conn
cache_peer_access upA allow route_upA
cache_peer_access upA deny all
cache_peer_access upB allow route_upB
cache_peer_access upB deny all
never_direct allow route_upA
never_direct allow route_upB
always_direct allow route_direct

# R4
client_lifetime 30 seconds
read_timeout 20 seconds
