# R8: SNI peek without decryption on a second port
http_port 3129 ssl-bump generate-host-certificates=off tls-cert=/certs/ca.pem
external_acl_type sni_check ttl=0 negative_ttl=0 %>rd %ssl::>sni /usr/bin/python3 /helpers/sni_check.py
acl sni_matches external sni_check
acl step1 at_step SslBump1
acl step2 at_step SslBump2
ssl_bump peek step1
ssl_bump splice step2 sni_matches
ssl_bump terminate all
