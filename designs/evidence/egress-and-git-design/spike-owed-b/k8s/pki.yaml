apiVersion: v1
kind: Namespace
metadata: {name: lenny-system}
---
apiVersion: v1
kind: Namespace
metadata: {name: agents}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: lenny-egress-selfsign, namespace: lenny-system}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: lenny-egress-ca, namespace: lenny-system}
spec:
  isCA: true
  commonName: lenny-egress-ca
  secretName: lenny-egress-ca
  duration: 87600h
  renewBefore: 2160h
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Never}
  issuerRef: {name: lenny-egress-selfsign, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: lenny-egress-ca, namespace: lenny-system}
spec:
  ca: {secretName: lenny-egress-ca}
