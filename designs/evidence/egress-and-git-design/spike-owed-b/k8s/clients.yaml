  - {name: wca, image: ob-tools:1, imagePullPolicy: Never, command: [ob, watchfile, /ca/ca.crt], volumeMounts: [{name: ca, mountPath: /ca, readOnly: true}]}
  volumes: [{name: ca, configMap: {name: lenny-egress-ca}}]
