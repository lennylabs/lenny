apiVersion: v1
kind: Namespace
metadata: {name: lenny-dns}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: proxied-dns, namespace: lenny-dns}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: spike-proxied-dns}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:coredns}
subjects: [{kind: ServiceAccount, name: proxied-dns, namespace: lenny-dns}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: proxied-dns, namespace: lenny-dns}
data:
  Corefile: |
    cluster.local:53 in-addr.arpa:53 ip6.arpa:53 {
        errors
        log
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            ttl 30
        }
        cache 30
    }
    .:53 {
        errors
        log
        health :8080
        ready :8181
        template ANY ANY {
            rcode NXDOMAIN
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: proxied-dns, namespace: lenny-dns}
spec:
  replicas: 1
  selector: {matchLabels: {app: proxied-dns}}
  template:
    metadata: {labels: {app: proxied-dns}}
    spec:
      serviceAccountName: proxied-dns
      containers:
      - name: coredns
        image: registry.k8s.io/coredns/coredns:v1.13.1
        args: ["-conf", "/etc/coredns/Corefile"]
        ports: [{containerPort: 53, protocol: UDP, name: dns}, {containerPort: 53, protocol: TCP, name: dns-tcp}]
        readinessProbe: {httpGet: {path: /ready, port: 8181}}
        livenessProbe: {httpGet: {path: /health, port: 8080}}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {add: [NET_BIND_SERVICE], drop: [ALL]}, readOnlyRootFilesystem: true}
        volumeMounts: [{name: cfg, mountPath: /etc/coredns, readOnly: true}]
      volumes: [{name: cfg, configMap: {name: proxied-dns}}]
---
apiVersion: v1
kind: Service
metadata: {name: proxied-dns, namespace: lenny-dns}
spec:
  selector: {app: proxied-dns}
  ports: [{name: dns, port: 53, protocol: UDP}, {name: dns-tcp, port: 53, protocol: TCP}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: egress-proxy, namespace: spike}
spec:
  replicas: 1
  selector: {matchLabels: {app: lenny-egress}}
  template:
    metadata: {labels: {app: lenny-egress}}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: proxy
        image: spike-net:v1
        imagePullPolicy: Never
        args: ["proxy"]
        ports: [{containerPort: 3128}]
        securityContext: {runAsUser: 65534, runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: lenny-egress, namespace: spike}
spec:
  selector: {app: lenny-egress}
  ports: [{port: 3128, targetPort: 3128}]
