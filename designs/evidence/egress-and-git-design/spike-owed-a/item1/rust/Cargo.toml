[package]
name = "ncrust"
version = "0.1.0"
edition = "2021"
[dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "rustls-tls-native-roots", "native-tls", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring","std","tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
