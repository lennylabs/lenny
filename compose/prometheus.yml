#
# §17.4 Compose Mode observability profile. Scrapes the gateway
# at the §10.1.6 gateway interval (10s). The gateway serves
# /metrics on the same listener as the API (:8080).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: lenny-gateway
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
