# Compose profile: default
#
# Provisions the backing stores the tier-3 contract and tier-4
# integration suites depend on. The in-process stubs (OIDC, KMS,
# mock LLM provider, SIEM) run inside the test process; they are
# not part of the compose stack.
#
# Usage:
#   docker compose -f compose/default.yml up -d
#   docker compose -f compose/default.yml down
#
# Or, via lenny-test:
#   lenny-test infra up   --profile compose
#   lenny-test infra down --profile compose
#
# Architecture: TESTING.md §10.3 profile=compose.

services:

  postgres:
    image: postgres:16-alpine
    container_name: lenny-postgres
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny
      POSTGRES_DB: lenny
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - lenny-postgres-data:/var/lib/postgresql/data

  # §12.2.2 connection-pooler context-leak harness. The pooler runs
  # in session pooling mode so a returned connection retains its
  # SET LOCAL state. The tier-2 TestRLSPoolerReuseDoesNotLeakContext
  # scaffold uses this to exercise the gateway's pre-checkout
  # tenant-context reset.
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1
    container_name: lenny-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: lenny
      DB_PASSWORD: lenny
      DB_NAME: lenny
      POOL_MODE: session
      MAX_CLIENT_CONN: "50"
      DEFAULT_POOL_SIZE: "10"
      AUTH_TYPE: scram-sha-256
    ports: ["16432:5432"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/127.0.0.1/5432"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: lenny-redis
    command:
      ["redis-server", "--appendonly", "no", "--save", "", "--replica-announce-ip", "redis"]
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # §12.8 Redis Sentinel topology. The default profile runs a single
  # master (the `redis` service above) plus one replica plus three
  # Sentinel nodes — the minimum quorum to elect a new master when
  # the original fails. The tier-8 TestRedisSentinelFailover chaos
  # scaffold uses this to drive an automatic failover under fault
  # injection. Production deployments run a Kubernetes Sentinel-based
  # operator; this compose is a fault-injection harness, not a
  # production posture.
  redis-replica:
    image: redis:7-alpine
    container_name: lenny-redis-replica
    command:
      ["redis-server", "--appendonly", "no", "--save", "", "--replicaof", "redis", "6379",
       "--replica-announce-ip", "redis-replica"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis-sentinel-1: &redis-sentinel
    image: redis:7-alpine
    container_name: lenny-redis-sentinel-1
    entrypoint:
      ["sh", "-c",
       "echo 'sentinel resolve-hostnames yes\nsentinel announce-hostnames yes\nsentinel monitor lenny-master redis 6379 2\nsentinel down-after-milliseconds lenny-master 2000\nsentinel failover-timeout lenny-master 5000\nsentinel parallel-syncs lenny-master 1' > /tmp/sentinel.conf && redis-server /tmp/sentinel.conf --sentinel"]
    ports: ["26379:26379"]
    depends_on:
      redis:
        condition: service_healthy
      redis-replica:
        condition: service_started
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis-sentinel-2:
    <<: *redis-sentinel
    container_name: lenny-redis-sentinel-2
    ports: ["26380:26379"]

  redis-sentinel-3:
    <<: *redis-sentinel
    container_name: lenny-redis-sentinel-3
    ports: ["26381:26379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lenny-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: lenny
      MINIO_ROOT_PASSWORD: lenny-secret
    ports:
      - "19000:9000"  # S3 API
      - "19001:9001"  # console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - lenny-minio-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: lenny-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "14317:4317"  # OTLP gRPC
      - "14318:4318"  # OTLP HTTP

volumes:
  lenny-postgres-data:
  lenny-minio-data:
