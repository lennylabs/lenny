# SPDX-License-Identifier: MIT

# Quarantined tests registry per TESTING.md §21.4.
#
# Only a flaky test enters this list: one for which `lenny-test stress
# --test <name> --runs 50` observes a non-deterministic failure on one
# commit. A deterministic failure on `main` never enters it; it is fixed
# or reverted before any other branch merges (.claude/rules/
# test-coverage.md, "Gates", rules 2 and 4). The author has one week from the `quarantined_at` date to land a fix or remove the
# test; after that, nightly invocations of phase-launch-gate fail.
#
# The quarantine is capped. `cap` is the largest number of entries the
# list may hold, and `lenny-test validate` fails while the list holds
# more. A test enters quarantine only when it names its owner (the person
# who fixes or deletes it) and its reason (what the failure is and why it
# is not a defect in the code under test). When the list is at the cap, a
# quarantined test is fixed or deleted before another enters. A
# quarantined test also skips with a reason in the `quarantined:`
# category, so the skip-reason classifier admits it.
#
# Every entry also carries an associated issue link and an ETA, per
# TESTING.md §21.4. The validator that enforces this file is
# validateFlakeBudgetYAML in cmd/lenny-test, which `lenny-test
# validate` runs in the static gate.

version: 1

cap: 5

quarantined:
  - test: TestImpersonationSessionIsSharedAcrossReplicas_spec_13_3
    package: tests/integration
    owner: jafargas
    reason: >-
      Passes and fails on one commit of main under host load (6 of 7 on
      343c04eb7); its expiry subtest sleeps to the session's exp across two
      replicas, so a slow replica, Redis, or Postgres lands an assertion past
      its deadline. No defect in the code under test has been observed.
    quarantined_at: 2026-11-17
    issue: https://github.com/lennylabs/lenny/blob/main/issues/TOKX/TOKX-I1-impersonation-cross-replica-test-flaky-under-load.md
    eta: 2026-12-15
    root_cause: flaky-time
  - test: TestRuntimeSDKOverlappingCreationsAreEachReleasedOnce_spec_28_5_3
    package: tests/contract/sdks
    owner: jafargas
    reason: >-
      The go subtest passes and fails on one commit of main (1 of 10 and 2 of
      20 runs on fd4ea4def): when it asserts, the SDK has recorded the first
      creation's release but not yet the second's. Either the test reads the
      releases before the second asynchronous release lands, or the Go SDK
      releases the second creation late or not at all.
    quarantined_at: 2026-11-19
    issue: https://github.com/lennylabs/lenny/blob/main/issues/RTPSDK/RTPSDK-I1-overlapping-creations-release-order-flaky.md
    eta: 2026-12-15
    root_cause: flaky-ordering
    notes: Quarantined at the owner's direction on 2026-11-17.

# Schema for entries when populated:
#
#   - test: TestName
#     package: pkg/path/...
#     owner: github-handle                 # required
#     reason: What fails and why it is not the change's defect.  # required
#     quarantined_at: YYYY-MM-DD
#     issue: https://github.com/lennylabs/lenny/issues/N
#     eta: YYYY-MM-DD
#     root_cause: flaky-time | flaky-network | flaky-ordering | genuine | unknown
#     notes: Optional free-form explanation.
