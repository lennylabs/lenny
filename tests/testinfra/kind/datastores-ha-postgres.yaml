# SPDX-License-Identifier: MIT
#
# Postgres HA overlay for the tier-8 chaos failover tests.
#
# The base datastores.yaml deploys a single Postgres Deployment with
# emptyDir storage. This overlay augments that baseline with a hot-
# standby replica that streams WAL from the primary, so the §12.8
# Postgres failover chaos test (TestPostgresFailover) can drive a
# primary-kill and observe the gateway continuing to read from the
# replica through the documented connection-string substitution.
#
# The promotion path is operator-managed: there is no in-cluster
# failover controller. A chaos test that needs automatic promotion
# uses the same code-pointed primary as the base test, fails it over
# by `kubectl exec`-ing `pg_ctl promote` on the replica, and rewires
# the gateway's connection string to the replica's Service. The
# composite end-to-end exercise (primary-kill + automatic promotion)
# is the cloud-overlay deliverable; the in-Kind exercise pins the
# primary-down recovery half.
#
# Apply on top of the base datastores.yaml:
#
#   kubectl apply -f tests/testinfra/k8s/datastores.yaml
#   kubectl apply -f tests/testinfra/kind/datastores-ha-postgres.yaml
#
# Fixed connection facts:
#
#   Primary  Service lenny-postgres.lenny-system.svc:5432 (existing base)
#   Replica  Service lenny-postgres-replica.lenny-system.svc:5432
#            (read-only; falls into the read-write path after promotion)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lenny-postgres-ha-init
  namespace: lenny-system
data:
  # The replica's postgresql.conf overrides. Streaming-replication
  # parameters that the §17.3 RPO=0 model requires.
  postgresql.conf: |
    hot_standby = on
    hot_standby_feedback = on
    primary_conninfo = 'host=lenny-postgres.lenny-system.svc port=5432 user=replicator password=replicator-pw application_name=replica1'
    max_wal_senders = 4
    wal_keep_size = 64MB
  # pg_hba entries the replica reads against the primary. The
  # replication account is the same one the primary's
  # pg_hba already admits (see the bootstrap below).
  pg_hba.conf: |
    host all     all 0.0.0.0/0   md5
    host replication replicator 0.0.0.0/0 md5
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lenny-postgres-ha-bootstrap
  namespace: lenny-system
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        # Not app.kubernetes.io/name: lenny — that label is the
        # control-plane-readiness selector kind.InstallLenny (and
        # install.sh's own Step 9 wait) uses to confirm every chart
        # component is Running. A completed Job's pod stays around in
        # phase Completed (never Running again), which would
        # permanently fail that all-Running check for the rest of the
        # test run. tests/testinfra/kind/migrate-job.yaml documents and
        # avoids the same trap for the schema-migration Job.
        app.kubernetes.io/name: lenny-e2e-postgres-ha-bootstrap
        app.kubernetes.io/component: e2e-datastore-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: bootstrap
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              # Wait for primary then ensure the replication role and
              # replication slot exist. The base Postgres image
              # initialises only the lenny user / db; this Job adds the
              # replicator credentials the standby uses to stream WAL.
              until pg_isready -h lenny-postgres.lenny-system.svc -U lenny; do
                sleep 1
              done
              PGPASSWORD=lenny psql -h lenny-postgres.lenny-system.svc -U lenny -d lenny <<SQL
                DO \$\$
                BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'replicator') THEN
                    CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD 'replicator-pw';
                  END IF;
                  IF NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name = 'replica1') THEN
                    PERFORM pg_create_physical_replication_slot('replica1');
                  END IF;
                END
                \$\$;
              SQL
              # The role grant above is necessary but not sufficient: the
              # primary's pg_hba.conf (generated by the base image's
              # entrypoint) has no rule admitting a *replication*
              # connection from a non-localhost address — its "host all
              # all all" catch-all does not match the replication
              # pseudo-database, so pg_basebackup from the standby pod
              # fails with "no pg_hba.conf entry for replication
              # connection". Append the missing rule via COPY TO PROGRAM
              # (runs server-side, so it can write the primary's own
              # pg_hba.conf) and reload; the grep guard makes this
              # idempotent across Job retries and re-applies of this
              # overlay.
              HBA_FILE=$(PGPASSWORD=lenny psql -h lenny-postgres.lenny-system.svc -U lenny -d lenny -tAc "SHOW hba_file;")
              PGPASSWORD=lenny psql -h lenny-postgres.lenny-system.svc -U lenny -d lenny -v ON_ERROR_STOP=1 -c "COPY (SELECT 1) TO PROGRAM 'grep -qxF \"host replication replicator 0.0.0.0/0 md5\" ${HBA_FILE} || echo \"host replication replicator 0.0.0.0/0 md5\" >> ${HBA_FILE}';"
              PGPASSWORD=lenny psql -h lenny-postgres.lenny-system.svc -U lenny -d lenny -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf();"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lenny-postgres-replica
  namespace: lenny-system
  labels:
    app.kubernetes.io/name: lenny
    app.kubernetes.io/component: e2e-datastore
    lenny.dev/e2e-datastore: postgres-replica
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      lenny.dev/e2e-datastore: postgres-replica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lenny
        app.kubernetes.io/component: e2e-datastore
        lenny.dev/e2e-datastore: postgres-replica
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        - name: pg-basebackup
          # Same image the primary runs (tests/testinfra/k8s/datastores.yaml),
          # not the plain postgres:16-alpine image. Physical (WAL-level)
          # streaming replication replays the primary's catalog verbatim,
          # including its pg_extension row for pgvector; a standby whose
          # image lacks the compiled vector.so then fails any query that
          # touches the extension ("could not access file $libdir/vector")
          # even though the base backup itself completes cleanly, because
          # pg_basebackup only copies files and does not care about
          # extensions.
          image: pgvector/pgvector:pg16
          command:
            - sh
            - -c
            - |
              # Pull a fresh base backup from the primary into a
              # subdirectory of the emptyDir mount, not the mount point
              # itself. Kubernetes creates the emptyDir mount point
              # (/var/lib/postgresql/data) owned by root; pg_basebackup
              # can still write into it (mode 777 via fsGroup), but
              # Postgres's own startup ownership check stats PGDATA
              # itself and refuses to start when PGDATA is the mount
              # point, because that directory's owner is root rather
              # than the uid Postgres runs as. Using a subdirectory that
              # pg_basebackup creates fresh (owned by the container's
              # own uid) avoids the check entirely — the same technique
              # tests/testinfra/k8s/datastores.yaml's primary uses via
              # its PGDATA=.../data/pgdata. Re-run is safe because
              # emptyDir starts empty.
              if [ -s /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
                echo "data dir already initialised; skipping base backup"
                exit 0
              fi
              until pg_isready -h lenny-postgres.lenny-system.svc -U replicator; do
                sleep 1
              done
              PGPASSWORD=replicator-pw pg_basebackup \
                -h lenny-postgres.lenny-system.svc \
                -U replicator \
                -D /var/lib/postgresql/data/pgdata \
                -X stream \
                -P \
                -R \
                -S replica1
              # The standby.signal file is created by pg_basebackup -R
              # when target Postgres is 12+, so the replica boots in
              # standby mode automatically.
          env:
            - name: PGPASSWORD
              value: replicator-pw
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: postgres
          # Matches the primary's image (see the pg-basebackup init
          # container above) so the replayed catalog's pgvector
          # extension entry resolves to an actual installed vector.so.
          image: pgvector/pgvector:pg16
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, lenny, -d, lenny]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, lenny, -d, lenny]
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lenny-postgres-replica
  namespace: lenny-system
  labels:
    app.kubernetes.io/name: lenny
    app.kubernetes.io/component: e2e-datastore
    lenny.dev/e2e-datastore: postgres-replica
spec:
  selector:
    lenny.dev/e2e-datastore: postgres-replica
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
