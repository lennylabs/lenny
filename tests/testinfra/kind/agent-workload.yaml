# SPDX-License-Identifier: MIT
#
# Agent-pod workloads for the tier-5/8/9 e2e suite. install.sh applies
# this after the Lenny chart so the WarmPoolController has pools to
# reconcile and the Sandbox reconciler produces real agent pods in the
# lenny-agents namespace.
#
# Two pools exercise the two §4.7 deployment models: echo-pool-sidecar
# runs the runtime in a separate container that bridges the §15.4.1
# JSONL framing to the adapter over an abstract Unix socket;
# echo-pool-embedded runs a single container whose runtime image embeds
# the adapter and serves the gRPC contract directly.
#
# The Sandbox reconciler stamps runtimeClassName onto every agent pod
# from the §5.3 isolation profile (standard -> runc). Kind nodes run
# containerd whose default handler is runc, but no RuntimeClass object
# named runc exists by default, so this RuntimeClass maps the standard
# profile onto the node's stock runc handler.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: runc
handler: runc
---
apiVersion: lenny.dev/v1
kind: Runtime
metadata:
  name: echo-runtime-sidecar
spec:
  type: agent
  image: lenny-runtime-echo:e2e
  integrationLevel: basic
  executionMode: session
  isolationProfile: standard
  deploymentModel: sidecar
---
apiVersion: lenny.dev/v1
kind: Runtime
metadata:
  name: echo-runtime-embedded
spec:
  type: agent
  image: lenny-runtime-echo-embedded:e2e
  integrationLevel: basic
  executionMode: session
  isolationProfile: standard
  deploymentModel: embedded
---
apiVersion: lenny.dev/v1
kind: SandboxTemplate
metadata:
  name: echo-template-sidecar
  namespace: lenny-agents
spec:
  runtimeRef: echo-runtime-sidecar
  isolationProfile: standard
  executionMode: session
---
apiVersion: lenny.dev/v1
kind: SandboxTemplate
metadata:
  name: echo-template-embedded
  namespace: lenny-agents
spec:
  runtimeRef: echo-runtime-embedded
  isolationProfile: standard
  executionMode: session
---
apiVersion: lenny.dev/v1
kind: SandboxWarmPool
metadata:
  name: echo-pool-sidecar
  namespace: lenny-agents
spec:
  templateRef: echo-template-sidecar
  minWarm: 1
  maxWarm: 2
---
apiVersion: lenny.dev/v1
kind: SandboxWarmPool
metadata:
  name: echo-pool-embedded
  namespace: lenny-agents
spec:
  templateRef: echo-template-embedded
  minWarm: 1
  maxWarm: 2
---
# §12.9.8 tier-9 credential-leakage probe runtime. The cred-shell-echo
# image keeps /bin/sh so kubectl exec ... cat /proc/<pid>/environ
# works, and the runtime declares credentialPoolRefs so the §4.9
# credential delivery path actually runs against it. Production
# installs reject this runtime via the lenny-pod-security webhook;
# the e2e overlay deploys it explicitly for the tier-9 scaffolds.
apiVersion: lenny.dev/v1
kind: Runtime
metadata:
  name: cred-shell-echo-runtime
spec:
  type: agent
  image: lenny-runtime-cred-shell-echo:e2e
  integrationLevel: basic
  executionMode: session
  isolationProfile: standard
  deploymentModel: embedded
---
apiVersion: lenny.dev/v1
kind: SandboxTemplate
metadata:
  name: cred-shell-echo-template
  namespace: lenny-agents
spec:
  runtimeRef: cred-shell-echo-runtime
  isolationProfile: standard
  executionMode: session
---
apiVersion: lenny.dev/v1
kind: SandboxWarmPool
metadata:
  name: cred-shell-echo-pool
  namespace: lenny-agents
spec:
  templateRef: cred-shell-echo-template
  minWarm: 1
  maxWarm: 1
---
# §9.2 tier-9 tamper-detect probe runtime. The elicitation-echo
# Standard-level runtime calls lenny/request_elicitation on every
# inbound message so the §9.2 chain walker exercises the
# tamper-detect path end to end.
apiVersion: lenny.dev/v1
kind: Runtime
metadata:
  name: elicitation-echo-runtime
spec:
  type: agent
  image: lenny-runtime-elicitation-echo:e2e
  integrationLevel: standard
  executionMode: session
  isolationProfile: standard
  deploymentModel: sidecar
---
apiVersion: lenny.dev/v1
kind: SandboxTemplate
metadata:
  name: elicitation-echo-template
  namespace: lenny-agents
spec:
  runtimeRef: elicitation-echo-runtime
  isolationProfile: standard
  executionMode: session
---
apiVersion: lenny.dev/v1
kind: SandboxWarmPool
metadata:
  name: elicitation-echo-pool
  namespace: lenny-agents
spec:
  templateRef: elicitation-echo-template
  minWarm: 1
  maxWarm: 1
