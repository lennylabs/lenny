# SPDX-License-Identifier: MIT
#
# Runtime CRs and the runc RuntimeClass for the tier-5/8/9 e2e suite.
# install.sh applies this after the Lenny chart.
#
# Pools (SandboxTemplate + SandboxWarmPool) are NOT defined here. The
# admission plane treats §5.2 pools as Postgres-authoritative: the
# pool-config-validator webhook rejects any manual kubectl write to a
# SandboxTemplate or SandboxWarmPool with UNAUTHORIZED_POOL_CONFIG_WRITE,
# because only the §4.6.2 PoolScalingController service account may
# create them. The pools are therefore seeded into Postgres through the
# §17.6 bootstrap.pools list in e2e-values.yaml; the PoolScalingController
# reconciles each Postgres pool row into its SandboxTemplate +
# SandboxWarmPool CRD pair, keyed by pool name, in the lenny-agents
# namespace. The Sandbox reconciler then produces real agent pods so the
# tier-5/8/9 tests that need a live agent pod run against a real workload.
#
# The Runtime CRs below stay kubectl-applied: the Sandbox reconciler reads
# the Runtime CR's spec.image to build each agent pod (§4.7), so the
# digest-pinned image must exist as a Kubernetes object. The Runtime CRD
# is not gated by the pool-config-validator webhook (only SandboxTemplate
# and SandboxWarmPool are); the §13.1 admin/CRD digest requirement is what
# rejects a bare :e2e tag. install.sh therefore substitutes each
# __*_IMAGE__ placeholder below with the runtime image's current
# `image:e2e@sha256:<digest>` reference (resolved with `docker image
# inspect`) before `kubectl apply`, so the reference is always pinned to
# the freshly-built image rather than a stale hardcoded digest.
#
# The Sandbox reconciler stamps runtimeClassName onto every agent pod from
# the §5.3 isolation profile (standard -> runc). Kind nodes run containerd
# whose default handler is runc, but no RuntimeClass object named runc
# exists by default, so this RuntimeClass maps the standard profile onto
# the node's stock runc handler.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: runc
handler: runc
---
# §4.7 sidecar deployment model: cmd/runtimes/echo is a stdin/stdout JSONL
# exec target and the lenny-adapter sidecar bridges it over an abstract
# Unix socket. Backs the pod-warm echo-pool-sidecar pool.
apiVersion: lenny.dev/v1alpha1
kind: Runtime
metadata:
  name: echo-runtime-sidecar
spec:
  type: agent
  image: __ECHO_IMAGE__
  integrationLevel: basic
  executionMode: session
  isolationProfile: standard
  deploymentModel: sidecar
---
# §4.7 embedded deployment model: cmd/runtimes/echo-embedded links the
# adapter into one container that serves the gRPC contract directly. Backs
# the echo-pool-embedded pool.
apiVersion: lenny.dev/v1alpha1
kind: Runtime
metadata:
  name: echo-runtime-embedded
spec:
  type: agent
  image: __ECHO_EMBEDDED_IMAGE__
  integrationLevel: basic
  executionMode: session
  isolationProfile: standard
  deploymentModel: embedded
---
# §6.1 SDK-warm reference runtime. preconnect-echo declares
# capabilities.preConnect, so the WarmPoolController warms its pods
# through the warming -> sdk_connecting -> idle path and the gateway drives
# them via ConfigureWorkspace / DemoteSDK. The §6.3 startup_latency
# benchmark drives a session against the preconnect-echo-pool as the
# SDK-warm arm and against echo-pool-sidecar as the pod-warm arm, on the
# runc/standard class the Kind cluster carries. spec: §6.1, §6.3.
#
# deploymentModel is embedded: cmd/runtimes/preconnect-echo links the
# adapter into its own process and serves the adapter gRPC contract on
# :50051 directly (the same single-container embedded model as
# echo-runtime-embedded). Declaring it sidecar makes the Sandbox reconciler
# inject a separate lenny-adapter container that also binds :50051, so the
# embedded runtime fails with "address already in use" and the pod never
# becomes Ready. spec: §4.7.
apiVersion: lenny.dev/v1alpha1
kind: Runtime
metadata:
  name: preconnect-echo-runtime
spec:
  type: agent
  image: __PRECONNECT_ECHO_IMAGE__
  integrationLevel: basic
  executionMode: session
  isolationProfile: standard
  deploymentModel: embedded
  capabilities:
    preConnect: true
---
# §12.9.8 tier-9 credential-leakage probe runtime. The cred-shell-echo
# image keeps /bin/sh so kubectl exec ... cat /proc/<pid>/environ works.
# cred-shell-echo is a stdin/stdout §15.4.1 binary (it does not link the
# adapter), so the §4.7 sidecar deployment model is the correct fit: the
# lenny-adapter sidecar serves the gRPC contract and bridges to
# cred-shell-echo over the abstract Unix socket. Production installs reject
# this runtime via the lenny-pod-security webhook; the e2e overlay deploys
# it explicitly for the tier-9 scaffolds.
apiVersion: lenny.dev/v1alpha1
kind: Runtime
metadata:
  name: cred-shell-echo-runtime
spec:
  type: agent
  image: __CRED_SHELL_ECHO_IMAGE__
  integrationLevel: basic
  executionMode: session
  isolationProfile: standard
  deploymentModel: sidecar
---
# §9.2 tier-9 tamper-detect probe runtime. The elicitation-echo
# Standard-level runtime calls lenny/request_elicitation on every inbound
# message so the §9.2 chain walker exercises the tamper-detect path end to
# end.
apiVersion: lenny.dev/v1alpha1
kind: Runtime
metadata:
  name: elicitation-echo-runtime
spec:
  type: agent
  image: __ELICITATION_ECHO_IMAGE__
  integrationLevel: standard
  executionMode: session
  isolationProfile: standard
  deploymentModel: sidecar
