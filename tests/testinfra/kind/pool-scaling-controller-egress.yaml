# SPDX-License-Identifier: MIT
#
# allow-pool-scaling-controller-egress is an e2e-only NetworkPolicy that
# re-admits the §4.6.2 PoolScalingController egress the §13.2
# lenny-system default-deny otherwise blocks: kube-system CoreDNS (so the
# controller resolves the lenny-postgres / kube-apiserver Service names)
# and the kube-apiserver (so the controller watches and writes the
# SandboxTemplate / SandboxWarmPool CRD pair it derives from each Postgres
# pool row).
#
# The chart's allow-controller-egress policy is meant to cover both the
# WarmPoolController and the PoolScalingController, but its podSelector
# matches lenny.dev/component: controller while the PoolScalingController
# Deployment labels its pods lenny.dev/component: pool-scaling-controller,
# so the chart policy does not select them. Without egress the controller
# cannot reach Postgres or the apiserver and never reconciles the seeded
# pools into warm pods. This e2e manifest closes that gap for the Kind
# install; the controller's egress to the in-cluster Postgres datastore is
# already admitted by the allow-egress-to-e2e-datastores policy in
# datastores.yaml (podSelector: {} on the e2e-datastore pods).
#
# This is a test-infra-only object applied by install.sh, so it does not
# alter the production chart rendering.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pool-scaling-controller-egress
  namespace: lenny-system
  labels:
    app.kubernetes.io/name: lenny
    app.kubernetes.io/managed-by: e2e-install
spec:
  podSelector:
    matchLabels:
      lenny.dev/component: pool-scaling-controller
  egress:
    # kube-apiserver: the controller watches and writes the CRD pair.
    - to:
        - ipBlock:
            cidr: 10.96.0.0/12
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # kube-system CoreDNS: Service-name resolution for Postgres and the
    # apiserver.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
  policyTypes: [Egress]
