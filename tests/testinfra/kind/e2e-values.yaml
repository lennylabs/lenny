# SPDX-License-Identifier: MIT
#
# Helm values overlay for the tier-5 e2e Kind cluster. It points every
# workload at the locally-built `lenny-*:e2e` images (loaded onto the
# cluster nodes by `kind load docker-image`) with `pullPolicy: Never`
# so the install never reaches a remote registry, and runs the gateway
# in dev mode so it starts without external Postgres, Redis, or MinIO.
#
# This overlay is for the e2e test harness only. Production installs
# use the chart defaults with real images and external data stores.

controller:
  image:
    repository: lenny-controller
    tag: e2e
    pullPolicy: Never
  # The Sandbox reconciler stamps this adapter image into every agent
  # pod. install.sh builds and kind-loads lenny-adapter:e2e.
  adapterImage: lenny-adapter:e2e
  # §12.9.8 tier-9 egress-capture sidecar. The reconciler injects it
  # into every Sandbox whose template carries the
  # `lenny.dev/test-egress-capture-upstream` annotation (today, only
  # the cred-shell-echo template in agent-workload.yaml).
  egressCaptureImage: lenny-egress-capture:e2e

admissionWebhooks:
  image:
    repository: lenny-webhook
    tag: e2e
    pullPolicy: Never

tokenService:
  image:
    repository: lenny-token-service
    tag: e2e
    pullPolicy: Never

gateway:
  image:
    repository: lenny-gateway
    tag: e2e
    pullPolicy: Never
  # The tier-7 load smoke suite drives sustained session creation
  # against the e2e gateway. The chart's 512Mi default limit is sized
  # for a quiet control plane; a load run accumulates session and
  # billing state and OOM-kills the pod at that limit. The e2e cluster
  # has headroom, so the overlay raises the gateway limit for the
  # benefit of tests/tier7_load.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1536Mi

ops:
  image:
    repository: lenny-ops
    tag: e2e
    pullPolicy: Never

preflight:
  image:
    repository: lenny-preflight
    tag: e2e
    pullPolicy: Never

backups:
  image:
    repository: lenny-backup
    tag: e2e
    pullPolicy: Never

bootstrap:
  image:
    repository: lenny-ctl
    tag: e2e
    pullPolicy: Never
  # Seed the §17.6 Day-1 fixture data the tier-3/4/7 scenarios assume:
  # an `acme` tenant, an `alice@acme.com` user with tenant-admin, and
  # the `claude-code` and `echo` runtimes the tier-7 scenarios use as
  # session runtimeRef. The bootstrap Job is idempotent; re-runs are
  # safe and the Job runs on every helm install/upgrade.
  tenants:
    - id: acme
      displayName: Acme Corp
  users:
    - subject: alice@acme.com
      tenantId: acme
      roles:
        - tenant-admin
  runtimes:
    - name: claude-code
      type: agent
      image: lenny-runtime-echo:e2e@sha256:67004f3e8d61a71973397685b58933e013089ff61cf5eb59833a0e47eba4a069
      integrationLevel: basic
      executionMode: session
      isolationProfile: standard
    - name: echo
      type: agent
      image: lenny-runtime-echo:e2e@sha256:67004f3e8d61a71973397685b58933e013089ff61cf5eb59833a0e47eba4a069
      integrationLevel: basic
      executionMode: session
      isolationProfile: standard
    # The §4.7 sidecar / embedded reference runtimes the tier-5/8
    # sessiondriver harness drives by name. Their Runtime CRDs are
    # applied via agent-workload.yaml; the runtimestore copy here
    # makes the gateway's runtime lookup succeed when the test posts
    # POST /v1/sessions with runtimeRef = echo-runtime-sidecar /
    # echo-runtime-embedded.
    - name: echo-runtime-sidecar
      type: agent
      image: lenny-runtime-echo:e2e@sha256:67004f3e8d61a71973397685b58933e013089ff61cf5eb59833a0e47eba4a069
      integrationLevel: basic
      executionMode: session
      isolationProfile: standard
    - name: echo-runtime-embedded
      type: agent
      image: lenny-runtime-echo-embedded:e2e@sha256:98579a97400b6a3134ec46cfeed4095f96c018a8ca9ec0df9fd477793de7bc4d
      integrationLevel: basic
      executionMode: session
      isolationProfile: standard

# Dev mode stays on for e2e so the gateway keeps its dev-header auth
# shortcuts. The data stores below are real in-cluster services, so
# the gateway and controller persist to them rather than falling back
# to in-memory backends.
global:
  devMode: true

# In-cluster data stores. install.sh deploys Postgres, Redis, and MinIO
# from datastores.yaml into lenny-system and runs the lenny-migrate Job
# before the chart install. These keys point the gateway and controller
# at those Services by their cluster DNS names. The chart renders the
# data-store env vars and the lenny-datastore-conn Secret only because
# these values are set; a production install leaves them empty.
#
# sslmode=disable is the simplest working setting for the in-cluster
# e2e Postgres, which has no TLS configured. Plaintext is acceptable
# inside the test cluster; this does not change any production default.
postgres:
  dsn: "postgres://lenny:lenny@lenny-postgres.lenny-system.svc:5432/lenny?sslmode=disable"

redis:
  url: "redis://lenny-redis.lenny-system.svc:6379"

minio:
  endpoint: "lenny-minio.lenny-system.svc:9000"
  accessKey: "lennyminio"
  secretKey: "lennyminio123"
  bucket: "lenny-artifacts"
  useSSL: false

# Enable the feature-gated admission webhooks so the tier-5
# admission_featuregated tests can exercise their behavioural half:
# lenny-direct-mode-isolation (llmProxy), lenny-drain-readiness
# (drainReadiness), and lenny-data-residency-validator +
# lenny-t4-node-isolation (compliance).
features:
  llmProxy: true
  drainReadiness: true
  compliance: true
