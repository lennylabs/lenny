# SPDX-License-Identifier: MIT
#
# Helm values overlay for the tier-5 e2e Kind cluster. It points every
# workload at the locally-built `lenny-*:e2e` images (loaded onto the
# cluster nodes by `kind load docker-image`) with `pullPolicy: Never`
# so the install never reaches a remote registry, and runs the gateway
# in dev mode so it starts without external Postgres, Redis, or MinIO.
#
# This overlay is for the e2e test harness only. Production installs
# use the chart defaults with real images and external data stores.

# The §25.8 ImageResolver prepends platform.registry.url to every
# component image name (lenny.componentImage helper), so the chart
# default ghcr.io/lennylabs would render ghcr.io/lennylabs/lenny-*:e2e.
# install.sh builds and `kind load docker-image`s the bare lenny-*:e2e
# names instead, so with pullPolicy: Never the kubelet reports
# ErrImageNeverPull for any pod whose image carries the registry prefix.
# A long-running control-plane pod survives because it was admitted on a
# prior install, but the per-upgrade lenny-preflight hook Job re-pulls a
# fresh pod every time and fails closed, hanging at activeDeadlineSeconds
# (DeadlineExceeded) and aborting the chart install. Clearing the URL
# routes the helper to the bare image.repository names below, which match
# the kind-loaded images. This is the e2e harness only; production installs
# keep the registry URL.
platform:
  registry:
    url: ""

# Run the cluster-internal gRPC links in plaintext (dev posture). With
# mtls.enabled=true (the chart default) the gateway dials each agent pod's
# adapter over mTLS (--adapter-tls-cert/key/ca), but the Sandbox reconciler
# does not yet stamp a per-pod serving certificate onto the adapter
# container, so the adapter serves :50051 in plaintext. The gateway's mTLS
# dial then fails the handshake ("tls: first record does not look like a
# TLS handshake") and POST /v1/sessions/start returns 503
# SESSION_CREATION_FAILED, which breaks the §6.3 startup benchmark. The
# per-pod adapter serving cert is the deferred SPIFFE/cert-manager work
# tracked by the broader chart-wide mTLS gap (BUILD-GAPS F-10.3.10); until
# it lands, the e2e runs gateway↔adapter and gateway↔Token-Service in
# plaintext so the two sides agree. This is the e2e harness overlay only;
# production keeps mtls.enabled=true.
mtls:
  enabled: false

controller:
  # Run a single WarmPoolController replica on the e2e cluster. The chart
  # default is 2 (a leader plus a hot standby for production HA), but on a
  # single-host Kind cluster the standby pod is CPU-starved during the heavy
  # install: its controller-runtime health-probe server cannot answer the 1s
  # /readyz and /healthz probes, so the liveness probe kills it in a restart
  # loop and it never reports Ready. The install's control-plane Ready wait
  # (kubectl wait --for=condition=Ready over every app.kubernetes.io/name=lenny
  # pod) then blocks on that standby and times out, even though the elected
  # leader is healthy and reconciling. One replica still runs --leader-elect
  # and acquires the lease immediately, which is all the §6.3 benchmark and
  # the tier-5/8/9 suites need (none exercise controller failover). This is
  # the e2e harness overlay only; production keeps the 2-replica HA default.
  replicas: 1
  image:
    repository: lenny-controller
    tag: e2e
    pullPolicy: Never
  # The Sandbox reconciler stamps this adapter image into every agent
  # pod. install.sh builds and kind-loads lenny-adapter:e2e.
  adapterImage: lenny-adapter:e2e
  # §12.9.8 tier-9 egress-capture sidecar. The reconciler injects it
  # into every Sandbox whose template carries the
  # `lenny.dev/test-egress-capture-upstream` annotation (today, only
  # the cred-shell-echo template in agent-workload.yaml).
  egressCaptureImage: lenny-egress-capture:e2e
  # Shrink the §5.2 resource classes for the Kind cluster. The e2e pools
  # default to the `medium` class (500m/2Gi request, 2/2Gi limit) per
  # container, and each agent pod runs two containers (adapter + runtime),
  # so five warm pools demand 20Gi of memory requests across two ~8Gi
  # worker nodes and most pods stay Pending with Insufficient memory. The
  # echo reference runtimes are tiny, so the e2e overlay retunes every
  # class to a Kind-sized footprint. The limit clears the §6.4 576Mi tmpfs
  # reservation the controller validates at startup (a class whose memory
  # limit is below it fails buildResourceClasses). This is the e2e harness
  # only; production keeps the chart-default class sizing.
  resourceClasses:
    small:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "640Mi" }
    medium:
      requests: { cpu: "100m", memory: "192Mi" }
      limits: { cpu: "1", memory: "768Mi" }
    large:
      requests: { cpu: "150m", memory: "256Mi" }
      limits: { cpu: "2", memory: "1Gi" }

admissionWebhooks:
  image:
    repository: lenny-webhook
    tag: e2e
    pullPolicy: Never

tokenService:
  image:
    repository: lenny-token-service
    tag: e2e
    pullPolicy: Never

sandbox:
  # The e2e agent-workload registers SandboxTemplates with
  # isolationProfile: standard (matching the §13.1 cluster lacking
  # a Kata / microVM runtime class). Without this override the
  # gateway falls back to its compiled-in `sandboxed` default and
  # `POST /v1/sessions/start` returns 503 POD_CLAIM_FAILED for every
  # session that omits the profile — every k6 scenario does.
  defaultIsolationProfile: standard

# Disable the §26 reference-runtime catalog on the Kind overlay. The
# chart's catalog ships ghcr.io/lennylabs/runtime-<name>:1.0.0 images
# the local Kind cluster cannot pull, and one of those entries
# (claude-code) collides with the agent-workload.yaml's claude-code
# Runtime + SandboxTemplate + SandboxWarmPool the tier-7 load
# scenarios target. The agent-workload owns the e2e runtime set.
referenceRuntimes:
  enabled: false

gateway:
  image:
    repository: lenny-gateway
    tag: e2e
    pullPolicy: Never
  # The tier-7 load smoke suite drives sustained session creation
  # against the e2e gateway. The chart's 512Mi default limit is sized
  # for a quiet control plane; a load run accumulates session and
  # billing state and OOM-kills the pod at that limit. The e2e cluster
  # has headroom, so the overlay raises the gateway limit for the
  # benefit of tests/tier7b_load_kind.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1536Mi

ops:
  image:
    repository: lenny-ops
    tag: e2e
    pullPolicy: Never

# The §6.1 SDK-warm runtime image and the schema-migration Job image are
# loaded onto the Kind nodes by `kind load docker-image`; like every other
# component image on this overlay they must use pullPolicy: Never with the
# :e2e tag. Without this override the chart's migrate Job defaults to
# ghcr.io/lennylabs/lenny-migrate and ImagePullBackOffs on the offline Kind
# cluster, blocking the gateway rollout.
migrate:
  image:
    repository: lenny-migrate
    tag: e2e
    pullPolicy: Never

preflight:
  # The Kind e2e cluster validates functional gateway and runtime behaviour,
  # not the production admission-plane gate. Two pre-install preflight checks
  # cannot pass in this context: cluster-cidr-discovery needs `get services`
  # which the preflight ClusterRole does not grant (it grants only `list`),
  # and lenny-ops-sa-rbac hard-fails because the main-phase ops Role/ClusterRole
  # is not yet applied when the pre-install hook runs (the same ordering the
  # conversion-webhook check tolerates). Disable the gate so the chart installs;
  # the functional tiers exercise the control plane directly.
  enabled: false
  image:
    repository: lenny-preflight
    tag: e2e
    pullPolicy: Never
  # The §17.9.2 airgap path drops the backend-reachability probes (MinIO
  # SSE, BYO-Redis maxmemory, OTLP TLS handshake, ops-admin internal-TLS)
  # while keeping the admission-plane cluster-API checks the install needs.
  # The e2e MinIO runs plaintext at lenny-minio.lenny-system.svc:9000, but
  # the chart keys its MinIO TLS posture on minio.tls.enabled (default
  # true) rather than the minio.useSSL set above, so the preflight Job
  # otherwise probes MinIO over TLS at a plaintext endpoint and hangs until
  # activeDeadlineSeconds (default 120s) kills the Job with DeadlineExceeded
  # at the pre-install/pre-upgrade hook, aborting the chart install. Setting
  # backends: embedded to flip the TLS posture is not available on this
  # overlay (it uses real in-cluster data stores), so the airgap probe-skip
  # is the targeted fix. The cluster-API admission-plane checks still run.
  skipNetworkProbes: true
  # Raise the activeDeadlineSeconds floor so a cold-cache cluster-API sweep
  # on a loaded Kind host completes within the hook deadline.
  timeoutSeconds: 300

backups:
  image:
    repository: lenny-backup
    tag: e2e
    pullPolicy: Never

# The §4.6.2 PoolScalingController Deployment image, built and loaded by
# install.sh like the other control-plane components.
poolScalingController:
  image:
    repository: lenny-pool-scaling-controller
    tag: e2e
    pullPolicy: Never

# The dedicated §13.2 CoreDNS instance is disabled on the Kind e2e. Its
# image (ghcr.io/lennylabs/lenny-coredns) bundles the coredns-ratelimit and
# coredns-filter plugins; coredns-ratelimit has no public Go module source
# (github.com/coredns/ratelimit 404s on the module proxy), so the image
# cannot be built offline and the private ghcr image cannot be pulled by the
# air-gapped Kind kubelet. Left enabled it sits in ImagePullBackOff and the
# install hangs on `helm install --wait`. The tier-7 startup_latency
# benchmark creates sessions on echo runtimes that do no DNS lookups, so the
# dedicated DNS path is not exercised.
#
# With coredns.deploy=false the chart skips the CoreDNS Deployment, Service,
# ConfigMap, and PDB, and the controller-deployment omits the
# --dedicated-dns-cluster-ip flag (it is gated on coredns.deploy AND
# coredns.clusterIP). The Sandbox reconciler's applyDedicatedDNS then returns
# early without an IP, so agent pods keep the default ClusterFirst resolver
# (kube-system kube-dns) rather than dnsPolicy:None. The agent-namespace
# allow-pod-egress-base NetworkPolicy re-admits kube-system DNS egress under
# global.devMode when coredns.deploy is false, so echo agent pods resolve
# normally. clusterIP and image.pullPolicy are unused while deploy is false.
coredns:
  deploy: false

# The §16.7 deployment-config-sync post-install hook is disabled on the Kind
# e2e. The hook runs lenny-ctl `admin deployment sync-config` against the
# gateway to emit the §16.7 gateway.*/platform.*/deployment.* transition
# audit events. Its pods carry lenny.dev/component: deployment-config-sync;
# the chart now ships an allow-deployment-config-sync-egress NetworkPolicy
# admitting their gateway:8080 + DNS egress (the production fix), but the
# Kind cluster's kindnet kube-network-policies enforcer does not reliably
# program the allow for these freshly-created hook pods during the
# post-install pod-churn window, so the pods hang on "gateway not ready" and
# the post-install helm hook exhausts its backoffLimit, aborting the install
# with DeadlineExceeded. The tier-7 startup_latency benchmark exercises
# session creation and the warm-pool lifecycle, not the §16.7 deployment
# transition audit stream, so the hook is not needed here. Disabling it skips
# the hook Job and its ConfigMap while leaving the production audit path
# (and its NetworkPolicy) intact for real installs.
deploymentAudit:
  enabled: false

bootstrap:
  image:
    repository: lenny-ctl
    tag: e2e
    pullPolicy: Never
  # Seed the §17.6 Day-1 fixture data the tier-3/4/7 scenarios assume:
  # an `acme` tenant and an `alice@acme.com` user with tenant-admin.
  # The bootstrap Job is idempotent; re-runs are safe and the Job runs
  # on every helm install/upgrade.
  tenants:
    - id: acme
      displayName: Acme Corp
  users:
    - subject: alice@acme.com
      tenantId: acme
      roles:
        - tenant-admin
  # bootstrap.runtimes and bootstrap.pools are NOT declared here. Their
  # runtime images must be digest-pinned (§13.1) to the freshly-built
  # lenny-runtime-*:e2e images, whose digests change on every build, so a
  # hardcoded digest goes stale and ImagePullBackOffs. install.sh resolves
  # each image's current digest with `docker image inspect` and writes a
  # generated overlay (bootstrap-overlay.gen.yaml) carrying the full
  # bootstrap.runtimes and bootstrap.pools lists with the resolved
  # digests. Helm replaces a list value wholesale when a later -f sets it,
  # so the overlay's lists supersede anything declared here while the
  # tenants/users maps above deep-merge through. The pools are seeded into
  # Postgres (rather than applied as SandboxTemplate/SandboxWarmPool CRs)
  # because the pool-config-validator webhook rejects any manual kubectl
  # write to those resources: only the PoolScalingController service
  # account may create them, and it does so by reconciling each seeded
  # Postgres pool row. spec: §17.6, §4.6.2, §13.1.

# Dev mode stays on for e2e so the gateway keeps its dev-header auth
# shortcuts. The data stores below are real in-cluster services, so
# the gateway and controller persist to them rather than falling back
# to in-memory backends.
global:
  devMode: true
  # §10.3 (NET-064) F-10.3.4: global.spiffeTrustDomain is a required chart
  # value with no default; the gateway-deployment annotation wraps it in
  # `required`. The Kind e2e overlay pins a deployment-unique placeholder.
  spiffeTrustDomain: lenny-kind-e2e

# In-cluster data stores. install.sh deploys Postgres, Redis, and MinIO
# from datastores.yaml into lenny-system and runs the lenny-migrate Job
# before the chart install. These keys point the gateway and controller
# at those Services by their cluster DNS names. The chart renders the
# data-store env vars and the lenny-datastore-conn Secret only because
# these values are set; a production install leaves them empty.
#
# sslmode=disable is the simplest working setting for the in-cluster
# e2e Postgres, which has no TLS configured. Plaintext is acceptable
# inside the test cluster; this does not change any production default.
postgres:
  dsn: "postgres://lenny:lenny@lenny-postgres.lenny-system.svc:5432/lenny?sslmode=disable"

redis:
  url: "redis://lenny-redis.lenny-system.svc:6379"

minio:
  endpoint: "lenny-minio.lenny-system.svc:9000"
  accessKey: "lennyminio"
  secretKey: "lennyminio123"
  bucket: "lenny-artifacts"
  useSSL: false
  # The in-cluster e2e MinIO serves plaintext HTTP. The chart derives the
  # gateway and bucket-lifecycle Job MinIO scheme from minio.tls.enabled, and
  # the §12.5 assertion permits tls.enabled: false on a non-embedded backend
  # only under global.devMode (set below). Without this the bucket-lifecycle
  # Job speaks HTTPS to the plaintext endpoint and fails.
  tls:
    enabled: false

# Enable the feature-gated admission webhooks so the tier-5
# admission_featuregated tests can exercise their behavioural half:
# lenny-direct-mode-isolation (llmProxy), lenny-drain-readiness
# (drainReadiness), and lenny-data-residency-validator +
# lenny-t4-node-isolation (compliance).
features:
  llmProxy: true
  drainReadiness: true
  compliance: true
