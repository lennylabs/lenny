# Concrete subset definitions referenced by groups.yaml.
# Each entry is a named subset that resolves to a set of test patterns.
# Patterns can be:
#   - exact test names (e.g., TestSandboxClaimSkipLocked)
#   - file globs (e.g., tests/tier5_e2e_kind/sandbox_claim_*_test.go)
#   - tier-relative suite names (e.g., admission/inventory)
#
# The harness resolves patterns against the change graph and the discovered
# test list. Unresolved patterns fail `lenny-test validate-maps`.

version: 1

subsets:

  # ---- Tier 5 e2e Kind subsets ----

