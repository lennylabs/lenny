# SPDX-License-Identifier: MIT

# Concrete subset definitions referenced by groups.yaml.
# Each entry is a named subset that resolves to a set of test patterns.
# Patterns can be:
#   - exact test names (e.g., TestPodClaimSkipLocked)
#   - file globs (e.g., tests/e2e_kind/sandbox_claim_*_test.go)
#   - tier-relative suite names (e.g., admission/inventory)
#
# The harness resolves patterns against the change graph and the discovered
# test list. Unresolved patterns fail `lenny-test validate-maps`.

version: 1

subsets:

  # ---- e2e_kind Kind subsets ----

  critical-path:
    tier: e2e_kind
    tests:
      - tests/e2e_kind/warm_pool_test.go
      - tests/e2e_kind/sandbox_claim_test.go
      - tests/e2e_kind/pod_lifecycle_test.go
      - tests/e2e_kind/mtls_enforcement_test.go
      - tests/e2e_kind/admission_policy_test.go
      - tests/e2e_kind/admission_inventory_test.go
      - tests/e2e_kind/lenny_ops_first_deploy_test.go
      - tests/e2e_kind/bootstrap_first_install_test.go

  admission-critical-path:
