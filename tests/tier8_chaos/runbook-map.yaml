# SPDX-License-Identifier: MIT

# Mapping from runbook → chaos test scenario.
#
# §12.8 says every runbook in docs/runbooks/ implies at least one
# chaos test. This file is the cross-reference: when a new runbook
# ships, add a row here naming the test that exercises the failure
# mode. When `lenny-test --tier chaos` runs the test suite, the
# harness validates that every runbook listed under docs/runbooks/
# appears as a key.
#
# Format:
#
#   <runbook-slug>:
#     test: <TestName>
#     severity: <P0|P1|P2|P3>
#     coverage: <core|extended|cloud>

version: 1

