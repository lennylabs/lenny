  # The channel contract cards and the end-to-end scenario traces. Each
  # heading landed with its section and has no implementation key yet,
  # so it is exempt under pending-implementation until the remediation
  # step named in its blocker lands the tests that encode it. The entry
  # is replaced by a tests/spec-map.json key in the change that closes
  # the blocker.
  - section: "28.5"
    reason: pending-implementation
    justification: The contract-card template. No gate reads the card fields yet; the specification and test tooling step lands the gate that holds every card to the stated field order.
    blocker: R3
    opened_at: 2026-08-15
  - section: "28.5.1"
    reason: pending-implementation
    justification: The gateway-to-pod cards. The generation stamp every operational gateway-to-pod RPC carries is validated by the pod only once the holder eviction path lands it.
    blocker: R16
    opened_at: 2026-08-15
  - section: "28.5.2"
    reason: pending-implementation
    justification: The pod-to-gateway cards. The adapter-to-gateway control direction and its hold state have no client today, so no test exercises the channel this boundary carries.
    blocker: R12
    opened_at: 2026-08-15
  - section: "28.5.4"
    reason: pending-implementation
    justification: The inter-replica card. The transport the card states is unimplemented; the step that lands it carries the tests.
    blocker: R18
    opened_at: 2026-08-15
  - section: "28.5.5"
    reason: pending-implementation
    justification: The pod-egress cards. The proxy dialects the boundary carries reach no route today, so the card's contract is untested.
    blocker: R11
    opened_at: 2026-08-15
  - section: "28.5.6"
    reason: pending-implementation
    justification: The control-plane card. The drain-readiness webhook the card names renders under a flag that is off by default; the deployment-boundary step flips it and gates it.
    blocker: R6
    opened_at: 2026-08-15
  - section: "28.5.7"
    reason: pending-implementation
    justification: The gateway-to-store card. Cross-replica event relay is unimplemented, so no test exercises the channel this boundary carries.
    blocker: R19
    opened_at: 2026-08-15
  - section: "28.6"
    reason: pending-implementation
    justification: The exclusivity and concurrency model. The multi-replica and concurrent-slot harness is the surface that can assert one holder at a time and the disposition of a second opener.
    blocker: R7
    opened_at: 2026-08-15
  - section: "29"
    reason: pending-implementation
    justification: The chapter carries the off-holder matrix keyed by session-scoped client route. The session REST surface gains its coordinator gate, and the matrix its assertions, in the step that lands that gate.
    blocker: R10
    opened_at: 2026-08-15
  - section: "29.1"
    reason: non-normative
    justification: Participant glossary and step notation for the traces that follow. Fixes how a trace is written and introduces no participant or boundary of its own.
  - section: "29.2"
    reason: pending-implementation
    justification: The session-start trace. Bind-time coordinator resolution is the leg the trace turns on and it is unimplemented.
    blocker: R13
    opened_at: 2026-08-15
  - section: "29.3"
    reason: pending-implementation
    justification: The interactive message-send trace. Message-plane durability and the cross-replica input wait are the legs the trace turns on and they are unimplemented.
    blocker: R20
    opened_at: 2026-08-15
  - section: "29.5"
    reason: pending-implementation
    justification: The checkpoint-capture trace. The barrier acknowledgement and the hold state the trace passes through land with the adapter-to-gateway control direction.
    blocker: R12
    opened_at: 2026-08-15
  - section: "29.6"
    reason: pending-implementation
    justification: The restore-and-resume trace. A concurrent-session pool cannot be restored onto a concurrent pod today; the concurrent-slot resume and restore step lands the path the trace states.
    blocker: R22
    opened_at: 2026-08-15
  - section: "29.7"
    reason: pending-implementation
    justification: The gateway-drain trace. The preStop checkpoint and the barrier-timeout partial-capture path the trace follows land with the holder eviction path.
    blocker: R16
    opened_at: 2026-08-15
  - section: "29.8"
    reason: pending-implementation
    justification: The coordinator handoff and crash-takeover trace. Coordinator resolution at bind time is the mechanism the handoff rests on and it is unimplemented.
    blocker: R13
    opened_at: 2026-08-15
  - section: "29.9"
    reason: pending-implementation
    justification: The agent-pod eviction trace. The adapter emits no eviction event and the preStop hook drives no checkpoint today; both land with the holder eviction path.
    blocker: R16
    opened_at: 2026-08-15
