# SPDX-License-Identifier: MIT

# Spec sections explicitly exempt from the "every section has at least one
# test" rule. Each exemption requires a justification. `lenny-test validate-maps`
# reads this file when reconciling spec headings against the spec map.

version: 1

exceptions:

  - section: "18"
    reason: non-normative
    justification: Build sequence is directional guidance for implementing agents. Mapped to TESTING.md §13 phase-gate groups.

  - section: "19"
    reason: indirect-coverage
    justification: Resolved decisions become ADRs under docs/adr/. Each decision is covered by the test surface of the feature it codifies.

  - section: "20"
    reason: empty
    justification: Spec §20 is "Open Questions". All open questions have been resolved per the spec's own note. Re-validated nightly via the ADR catalog check.

  - section: "21"
    reason: post-v1
    justification: Planned post-V1 features. Test infrastructure remains forward-compatible per TESTING.md §23 but no v1 tests are required.

  - section: "22"
    reason: anti-feature
    justification: Explicit non-decisions. Tier 0 lint asserts no eval/guardrail/memory-extraction logic ships in the platform code.

  - section: "23"
    reason: non-normative
    justification: Competitive landscape and community strategy. No behavior to verify.

  - section: "23.1"
    reason: non-normative
    justification: Why-Lenny positioning statement. No behavior to verify.

  - section: "23.2"
    reason: non-normative
    justification: Community adoption strategy. Non-technical content.

  - section: "26.1"
    reason: non-normative
    justification: Reference runtime catalog overview. Describes the catalog without defining executable behavior; per-runtime behavior is verified by the §26.3-§26.11 entries.

  - section: "26.12"
    reason: non-normative
    justification: Procedural guidance for adding new reference runtimes. The conformance harness in §15.4 validates whatever runtime is added.

  - section: "27.1"
    reason: non-normative
    justification: Web playground purpose and non-goals. Aspirational framing for the feature.

  - section: "27.4"
    reason: non-normative
    justification: Web playground UI surface. Visual layout description without executable behavior; the bundled SPA assets are covered by the §27.7 asset-serving tests.

  - section: "27.10"
    reason: non-normative
    justification: Web playground roll-forward notes. Forward-compatibility guidance, no executable behavior.


