\* Two replicas with a token lifetime of 10 min (20 ticks), longer than the
\* overlap window, as --max-created-state-timeout-seconds=600 sets it. A
\* replaced key then verifies for 15 min (30 ticks). Other durations as
\* r2_default.cfg.
\* One session, created by POST /v1/sessions; one cut of a replica's link to
\* Postgres or to the KMS, which may heal; one forced rotation.
CONSTANTS
    Replicas = {r1, r2}
    Sessions = {s1}
    StartSessions = {}
    FinalizeReplicas = {}
    Refresh = 1
    Lead = 4
    Overlap = 10
    Lifetime = 20
    RotInt = 6
    MaxTime = 36
    MaxKeys = 3
    FaultKinds = {"pg", "kms"}
    MaxFaults = 1
    MaxRestarts = 0
    MaxForced = 1
    MaxRowDeletes = 0
    NoTime = NoTime
    NoRow = NoRow
SYMMETRY Symmetry
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    HealthyReplicaVerifies
    RecentReplicaVerifies
    StaleReplicaVerifiesHeldKeys
    IssuedExpiresBeforeKeyDeletion
    NoAcceptAfterKeyDeletion
    MintOnlyWithinStaleBound
    MintNeverAfterHeldRetirement
    StaleMintBounded
    HealthyReplicaCanMint
    FreshReplicaCanMint
    OneKeyPerSlot
    ReachableReplicaVerifies
PROPERTIES
    RetirementOnlyEarlier
