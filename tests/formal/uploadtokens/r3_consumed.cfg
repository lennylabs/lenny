\* Three replicas that all serve the finalize requests of session s1,
\* created by POST /v1/sessions, with the default durations. No link cut,
\* no restart, and no rotation within the bound.
CONSTANTS
    Replicas = {r1, r2, r3}
    Sessions = {s1}
    StartSessions = {}
    FinalizeReplicas = {r1, r2, r3}
    Refresh = 1
    Lead = 4
    Overlap = 10
    Lifetime = 10
    RotInt = 6
    MaxTime = 6
    MaxKeys = 3
    FaultKinds = {"pg", "kms"}
    MaxFaults = 0
    MaxRestarts = 0
    MaxForced = 0
    MaxRowDeletes = 0
    NoTime = NoTime
    NoRow = NoRow
SYMMETRY Symmetry
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    HealthyReplicaVerifies
    RecentReplicaVerifies
    StaleReplicaVerifiesHeldKeys
    IssuedExpiresBeforeKeyDeletion
    NoAcceptAfterKeyDeletion
    MintOnlyWithinStaleBound
    MintNeverAfterHeldRetirement
    StaleMintBounded
    HealthyReplicaCanMint
    FreshReplicaCanMint
    OneKeyPerSlot
    ReachableReplicaVerifies
    FinalizeOnce
    StartTokenRefused
    ConsumedOnlyByFinalizeOrStart
PROPERTIES
    RetirementOnlyEarlier
    ConsumedMarkKept
