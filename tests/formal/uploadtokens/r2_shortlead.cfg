\* Two replicas, changed durations: one tick is 30 seconds: refresh 1 min, publish lead 1.5 min (the
\* shortest lead, in ticks, that the start check accepts at that refresh),
\* overlap window 2 min, token lifetime 3 min, and rotation interval
\* 2 min. A replaced key verifies for 5 min (10 ticks), so the sweep runs
\* within the bound.
\* One session, created by POST /v1/sessions; one cut of a replica's link to
\* Postgres or to the KMS, which may heal; one forced rotation.
CONSTANTS
    Replicas = {r1, r2}
    Sessions = {s1}
    StartSessions = {}
    FinalizeReplicas = {}
    Refresh = 2
    Lead = 3
    Overlap = 4
    Lifetime = 6
    RotInt = 4
    MaxTime = 18
    MaxKeys = 3
    FaultKinds = {"pg", "kms"}
    MaxFaults = 1
    MaxRestarts = 0
    MaxForced = 1
    MaxRowDeletes = 0
    NoTime = NoTime
    NoRow = NoRow
SYMMETRY Symmetry
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    HealthyReplicaVerifies
    RecentReplicaVerifies
    StaleReplicaVerifiesHeldKeys
    IssuedExpiresBeforeKeyDeletion
    NoAcceptAfterKeyDeletion
    MintOnlyWithinStaleBound
    MintNeverAfterHeldRetirement
    StaleMintBounded
    HealthyReplicaCanMint
    FreshReplicaCanMint
    OneKeyPerSlot
    ReachableReplicaVerifies
PROPERTIES
    RetirementOnlyEarlier
