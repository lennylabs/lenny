\* Three replicas, the changed durations of r2_shortlead.cfg.
\* One session, created by POST /v1/sessions; one cut of a replica's link to
\* Postgres or to the KMS, which may heal; one forced rotation.
CONSTANTS
    Replicas = {r1, r2, r3}
    Sessions = {s1}
    StartSessions = {}
    FinalizeReplicas = {}
    Refresh = 2
    Lead = 3
    Overlap = 4
    Lifetime = 6
    RotInt = 4
    MaxTime = 16
    MaxKeys = 3
    FaultKinds = {"pg", "kms"}
    MaxFaults = 1
    MaxRestarts = 0
    MaxForced = 1
    MaxRowDeletes = 0
    NoTime = NoTime
    NoRow = NoRow
SYMMETRY Symmetry
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    HealthyReplicaVerifies
    RecentReplicaVerifies
    StaleReplicaVerifiesHeldKeys
    IssuedExpiresBeforeKeyDeletion
    NoAcceptAfterKeyDeletion
    MintOnlyWithinStaleBound
    MintNeverAfterHeldRetirement
    StaleMintBounded
    HealthyReplicaCanMint
    FreshReplicaCanMint
    OneKeyPerSlot
    ReachableReplicaVerifies
PROPERTIES
    RetirementOnlyEarlier
