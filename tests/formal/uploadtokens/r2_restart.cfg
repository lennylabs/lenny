\* Two replicas, the default durations, one replica restart, one link cut,
\* and one forced rotation. One session.
CONSTANTS
    Replicas = {r1, r2}
    Sessions = {s1}
    StartSessions = {}
    FinalizeReplicas = {}
    Refresh = 1
    Lead = 4
    Overlap = 10
    Lifetime = 10
    RotInt = 6
    MaxTime = 16
    MaxKeys = 3
    FaultKinds = {"pg", "kms"}
    MaxFaults = 1
    MaxRestarts = 1
    MaxForced = 1
    MaxRowDeletes = 0
    NoTime = NoTime
    NoRow = NoRow
SYMMETRY Symmetry
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    HealthyReplicaVerifies
    RecentReplicaVerifies
    StaleReplicaVerifiesHeldKeys
    IssuedExpiresBeforeKeyDeletion
    NoAcceptAfterKeyDeletion
    MintOnlyWithinStaleBound
    MintNeverAfterHeldRetirement
    StaleMintBounded
    HealthyReplicaCanMint
    FreshReplicaCanMint
    OneKeyPerSlot
    ReachableReplicaVerifies
PROPERTIES
    RetirementOnlyEarlier
