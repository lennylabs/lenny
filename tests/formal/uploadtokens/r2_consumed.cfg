\* Two replicas, the default durations. Session s1 is created by
\* POST /v1/sessions and both replicas serve its finalize requests; session
\* s2 is created by POST /v1/sessions/start. One restart, one cut of a
\* replica's link to Postgres, no forced rotation.
CONSTANTS
    Replicas = {r1, r2}
    Sessions = {s1, s2}
    StartSessions = {s2}
    FinalizeReplicas = {r1, r2}
    Refresh = 1
    Lead = 4
    Overlap = 10
    Lifetime = 10
    RotInt = 6
    MaxTime = 6
    MaxKeys = 3
    FaultKinds = {"pg"}
    MaxFaults = 1
    MaxRestarts = 1
    MaxForced = 0
    MaxRowDeletes = 0
    NoTime = NoTime
    NoRow = NoRow
SYMMETRY Symmetry
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    HealthyReplicaVerifies
    RecentReplicaVerifies
    StaleReplicaVerifiesHeldKeys
    IssuedExpiresBeforeKeyDeletion
    NoAcceptAfterKeyDeletion
    MintOnlyWithinStaleBound
    MintNeverAfterHeldRetirement
    StaleMintBounded
    HealthyReplicaCanMint
    FreshReplicaCanMint
    OneKeyPerSlot
    ReachableReplicaVerifies
    FinalizeOnce
    StartTokenRefused
    ConsumedOnlyByFinalizeOrStart
PROPERTIES
    RetirementOnlyEarlier
    ConsumedMarkKept
