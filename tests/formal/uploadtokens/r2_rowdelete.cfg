\* Two replicas, the default durations, and an operator who deletes up to
\* three rows of platform_signing_keys by hand, which the operator guide
\* says not to do. One forced rotation and one restart, no link cut. The
\* configuration checks what step 0177.S4 builds for that case: a retired
\* key never signs again, and a key written again at a deleted slot never
\* moves the replaced key's instants later. A deleted row's key stops
\* verifying and a replica with no active key mints nothing, as the
\* operator guide states, so U1 and U5 are not listed.
CONSTANTS
    Replicas = {r1, r2}
    Sessions = {s1}
    StartSessions = {}
    FinalizeReplicas = {}
    Refresh = 1
    Lead = 4
    Overlap = 10
    Lifetime = 10
    RotInt = 6
    MaxTime = 16
    MaxKeys = 3
    FaultKinds = {"pg", "kms"}
    MaxFaults = 0
    MaxRestarts = 1
    MaxForced = 1
    MaxRowDeletes = 3
    NoTime = NoTime
    NoRow = NoRow
SYMMETRY Symmetry
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    StaleReplicaVerifiesHeldKeys
    IssuedExpiresBeforeKeyDeletion
    NoAcceptAfterKeyDeletion
    MintOnlyWithinStaleBound
    MintNeverAfterHeldRetirement
    StaleMintBounded
    OneKeyPerSlot
PROPERTIES
    RetirementOnlyEarlier
