\* Two replicas, the default durations: one tick is 30 seconds: refresh 30 s, publish lead 2 min, overlap
\* window and stale bound 5 min, token lifetime 5 min, so a replaced key
\* verifies for 10 min (20 ticks). The rotation interval is scaled down to
\* 3 min so that scheduled rotations happen within the bound.
\* One session, created by POST /v1/sessions; one cut of a replica's link to
\* Postgres or to the KMS, which may heal; one forced rotation.
CONSTANTS
    Replicas = {r1, r2}
    Sessions = {s1}
    StartSessions = {}
    FinalizeReplicas = {}
    Refresh = 1
    Lead = 4
    Overlap = 10
    Lifetime = 10
    RotInt = 6
    MaxTime = 28
    MaxKeys = 3
    FaultKinds = {"pg", "kms"}
    MaxFaults = 1
    MaxRestarts = 0
    MaxForced = 1
    MaxRowDeletes = 0
    NoTime = NoTime
    NoRow = NoRow
SYMMETRY Symmetry
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    HealthyReplicaVerifies
    RecentReplicaVerifies
    StaleReplicaVerifiesHeldKeys
    IssuedExpiresBeforeKeyDeletion
    NoAcceptAfterKeyDeletion
    MintOnlyWithinStaleBound
    MintNeverAfterHeldRetirement
    StaleMintBounded
    HealthyReplicaCanMint
    FreshReplicaCanMint
    OneKeyPerSlot
    ReachableReplicaVerifies
PROPERTIES
    RetirementOnlyEarlier
