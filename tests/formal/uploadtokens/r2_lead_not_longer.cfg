\* Two replicas with a publish lead equal to the refresh interval, a
\* setting the gateway refuses at start (signingkeys.Open). It shows why the
\* start check exists: HealthyReplicaVerifies is expected to fail. No link
\* cut; one forced rotation.
CONSTANTS
    Replicas = {r1, r2}
    Sessions = {s1}
    StartSessions = {}
    FinalizeReplicas = {}
    Refresh = 1
    Lead = 1
    Overlap = 10
    Lifetime = 10
    RotInt = 6
    MaxTime = 10
    MaxKeys = 3
    FaultKinds = {"pg", "kms"}
    MaxFaults = 0
    MaxRestarts = 0
    MaxForced = 1
    MaxRowDeletes = 0
    NoTime = NoTime
    NoRow = NoRow
SYMMETRY Symmetry
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    HealthyReplicaVerifies
    RecentReplicaVerifies
    StaleReplicaVerifiesHeldKeys
    IssuedExpiresBeforeKeyDeletion
    NoAcceptAfterKeyDeletion
    MintOnlyWithinStaleBound
    MintNeverAfterHeldRetirement
    StaleMintBounded
    HealthyReplicaCanMint
    FreshReplicaCanMint
    OneKeyPerSlot
    ReachableReplicaVerifies
PROPERTIES
    RetirementOnlyEarlier
