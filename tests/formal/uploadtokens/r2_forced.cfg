\* Two replicas, the default durations, and three forced rotations
\* (POST /v1/admin/upload-token-keys/rotate) on either replica at any
\* instant, with scheduled rotations every 3 minutes. No link cut and no
\* restart. The configuration checks the bound of decision 13 of change
\* 0177: a forced rotation writes nothing while the newest key is a forced
\* key that is not active yet, and a scheduled key that is not active yet
\* does not stop a forced rotation.
CONSTANTS
    Replicas = {r1, r2}
    Sessions = {s1}
    StartSessions = {}
    FinalizeReplicas = {}
    Refresh = 1
    Lead = 4
    Overlap = 10
    Lifetime = 10
    RotInt = 6
    MaxTime = 16
    MaxKeys = 5
    FaultKinds = {"pg", "kms"}
    MaxFaults = 0
    MaxRestarts = 0
    MaxForced = 3
    MaxRowDeletes = 0
    NoTime = NoTime
    NoRow = NoRow
SYMMETRY Symmetry
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    HealthyReplicaVerifies
    RecentReplicaVerifies
    StaleReplicaVerifiesHeldKeys
    IssuedExpiresBeforeKeyDeletion
    NoAcceptAfterKeyDeletion
    MintOnlyWithinStaleBound
    MintNeverAfterHeldRetirement
    StaleMintBounded
    HealthyReplicaCanMint
    FreshReplicaCanMint
    OneKeyPerSlot
    ReachableReplicaVerifies
    OneForcedPending
PROPERTIES
    RetirementOnlyEarlier
