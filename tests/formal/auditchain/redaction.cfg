\* Two erasure jobs redact the dead-lettered newest row while a replica appends and the query and window verifiers run.
SPECIFICATION Spec
CONSTANTS
  Variant = "S3"
  NWriters = 1
  AppendsPerWriter = 1
  BatchSize = 1
  BypassWriter = FALSE
  TriggerMode = "none"
  NJobs = 2
  InitRows = 2
  InitDL = {2}
  InitGdpr = {}
  InitRedacted = {}
  MaxSeq = 5
  MaxAborts = 0
  MaxTime = 0
  MaxSweeps = 0
  Adversary = "none"
  MaxTamper = 0
  Accepted = {}
  RedactionGuard = FALSE
  Rotation = "none"
  ListRetired = TRUE
  MaxRotSteps = 0
  NReplicas = 1
  RunVerifiers = TRUE
  WindowN = 10
INVARIANTS
  TypeOK
  LinearChain
  NoFork
  NoWindowFalseAlarm
  NoScanFalseAlarm
  NoQueryFalseAlarm
  NoRefusedAppend
  NoJobFailsOnRedactedRow
