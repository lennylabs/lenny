\* The free configuration: two request processes, each choosing any operation,
\* over three initial tokens and the two tokens the processes mint.
\* The runner adds the Variant constant (Main, TF, or I13Lock).
SPECIFICATION Spec
CONSTANTS
  Scenario = "free"
  MaxAborts = 1
  MaxClientRetries = 0
  MaxLoss = 0
  MaxRestarts = 0
INVARIANTS
  TypeOK
  CascadeComplete
  NoStaleSource
  RotateOnce
  IssuedOnlyAfterCommit
  RowIffAudit
  AdvisoryLockExclusive
  CacheOnlyCommitted
  AcceptRevokedOnlyInFlight
  AcceptedCallerLive
  MutualRevokeOneWins
  ImpersonationEndedOrInWindow
  ImpersonationEndedOrInWindowExceptFailedStart
  FullRevokeComplete
  NoUndetectedWait
  NoSelfWait
  CallerAcceptedOnlyFromOwnStep
  NoSessionEndedByRevokedCaller
  F1RootRevoked
  RetryCompletesStep
  StepWithoutAll
  NestedWritesOnlyNamedRows
PROPERTIES
  RequestsTerminate
