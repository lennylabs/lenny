\* The propagation of revocations to the replicas' revocation caches: a cascade
\* and a rotation, two replicas, one lost event, and one restart.
\* The runner adds the Variant constant (Main, TF, or I13Lock).
SPECIFICATION Spec
CONSTANTS
  Scenario = "cache"
  MaxAborts = 0
  MaxClientRetries = 0
  MaxLoss = 1
  MaxRestarts = 1
INVARIANTS
  TypeOK
  CascadeComplete
  NoStaleSource
  RotateOnce
  IssuedOnlyAfterCommit
  RowIffAudit
  AdvisoryLockExclusive
  CacheOnlyCommitted
  AcceptRevokedOnlyInFlight
  AcceptedCallerLive
  MutualRevokeOneWins
  ImpersonationEndedOrInWindow
  ImpersonationEndedOrInWindowExceptFailedStart
  FullRevokeComplete
  NoUndetectedWait
  NoSelfWait
  CallerAcceptedOnlyFromOwnStep
  NoSessionEndedByRevokedCaller
  F1RootRevoked
  RetryCompletesStep
  StepWithoutAll
  NestedWritesOnlyNamedRows
PROPERTIES
  RequestsTerminate
  RevocationReachesEveryReplica
