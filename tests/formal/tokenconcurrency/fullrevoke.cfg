\* A full revoke of alice racing a mint: bob narrows K, a child of alice's A,
\* or mints a child with A as actor_token, while alice rotates A, mints a
\* playground bearer from A, or starts an impersonation from A.
\* The runner adds the Variant constant (Main, TF, or I13Lock).
SPECIFICATION Spec
CONSTANTS
  Scenario = "fullrevoke"
  MaxAborts = 1
  MaxClientRetries = 0
  MaxLoss = 0
  MaxRestarts = 0
INVARIANTS
  TypeOK
  CascadeComplete
  NoStaleSource
  RotateOnce
  IssuedOnlyAfterCommit
  RowIffAudit
  AdvisoryLockExclusive
  CacheOnlyCommitted
  AcceptRevokedOnlyInFlight
  AcceptedCallerLive
  MutualRevokeOneWins
  ImpersonationEndedOrInWindow
  ImpersonationEndedOrInWindowExceptFailedStart
  FullRevokeComplete
  NoUndetectedWait
  NoSelfWait
  CallerAcceptedOnlyFromOwnStep
  NoSessionEndedByRevokedCaller
  F1RootRevoked
  RetryCompletesStep
  StepWithoutAll
  NestedWritesOnlyNamedRows
PROPERTIES
  RequestsTerminate
