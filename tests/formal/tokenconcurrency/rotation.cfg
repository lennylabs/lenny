\* A rotation racing a child mint that presents the rotated token as
\* actor_token, and two rotations of one token, on any replica, with one abort
\* for write-before-issue.
\* The runner adds the Variant constant (Main, TF, or I13Lock).
SPECIFICATION Spec
CONSTANTS
  Scenario = "rotation"
  MaxAborts = 1
  MaxClientRetries = 0
  MaxLoss = 0
  MaxRestarts = 0
INVARIANTS
  TypeOK
  CascadeComplete
  NoStaleSource
  RotateOnce
  IssuedOnlyAfterCommit
  RowIffAudit
  AdvisoryLockExclusive
  CacheOnlyCommitted
  AcceptRevokedOnlyInFlight
  AcceptedCallerLive
  MutualRevokeOneWins
  ImpersonationEndedOrInWindow
  ImpersonationEndedOrInWindowExceptFailedStart
  FullRevokeComplete
  NoUndetectedWait
  NoSelfWait
  CallerAcceptedOnlyFromOwnStep
  NoSessionEndedByRevokedCaller
  F1RootRevoked
  RetryCompletesStep
  StepWithoutAll
  NestedWritesOnlyNamedRows
PROPERTIES
  RequestsTerminate
