\* Concurrent recursive-revocation requests that revoke each other's caller
\* token, with a self-revocation or a rotation of one caller as a third
\* request.
\* The runner adds the Variant constant (Main, TF, or I13Lock).
SPECIFICATION Spec
CONSTANTS
  Scenario = "mutual"
  MaxAborts = 1
  MaxClientRetries = 0
  MaxLoss = 0
  MaxRestarts = 0
INVARIANTS
  TypeOK
  CascadeComplete
  NoStaleSource
  RotateOnce
  IssuedOnlyAfterCommit
  RowIffAudit
  AdvisoryLockExclusive
  CacheOnlyCommitted
  AcceptRevokedOnlyInFlight
  AcceptedCallerLive
  MutualRevokeOneWins
  ImpersonationEndedOrInWindow
  ImpersonationEndedOrInWindowExceptFailedStart
  FullRevokeComplete
  NoUndetectedWait
  NoSelfWait
  CallerAcceptedOnlyFromOwnStep
  NoSessionEndedByRevokedCaller
  F1RootRevoked
  RetryCompletesStep
  StepWithoutAll
  NestedWritesOnlyNamedRows
PROPERTIES
  RequestsTerminate
