\* The chain r -> a -> b with one transfer, release, or hand-off by a parent
\* or the root's client (0166 "Leaving the parent"; 0146 SL-4, SL-7, SL-9).
\* One suspension call; no pod loss, expiry, kill, or crash. Cap 3,
\* parallelism 1.
CONSTANTS
    Shape = "chain3"
    None = None
    Causes = {"client"}
    Cap = 3
    MaxPar = 1
    MaxSuspend = 1
    MaxPodLoss = 0
    MaxLeave = 1
    MaxKill = 0
    MaxCrash = 0
    AllowHandoff = TRUE
    WakeOnExpired = TRUE
    AgeStopsInACA = TRUE
    RootOpes = {"close_all"}
    TrackActor = TRUE
    WithExpiry = FALSE
SPECIFICATION Spec
VIEW View
INVARIANTS
    TypeOK
    NoCycle
    BlockedUnderPausedAncestor
    NoBlockedUnderEndedSession
    LiveUnderPausedExempt
    DirectResumeHonoured
    CapsHold
    ParallelismHolds
    OnParentEndOrder
    InboxClosed
    HandoffSuccessor
PROPERTIES
    TerminalStays
    LegalMoves
    OnlyRootClientLifts
    SuspensionCutsTurn
    IdleKeepsPodForRunningDescendant
    CloseRule
    ACANoExpiryWhileAncestorPaused
    ParentActsOnlyWhenRunning
