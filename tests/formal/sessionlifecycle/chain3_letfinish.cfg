\* The chain r -> a -> b with both values of onParentEnd on the root, so the
\* let_finish cases run on a chain of three. One suspension call by the root's
\* client and one pod loss; no leave, kill, or crash. Cap 3, parallelism 1. It
\* lists the checks of chain3_client except P4b and P6, which fail with any
\* suspension (G1, R1) until open decision O6 and issue DTREE-I4 are settled.
CONSTANTS
    Shape = "chain3"
    None = None
    Causes = {"client"}
    Cap = 3
    MaxPar = 1
    MaxSuspend = 1
    MaxPodLoss = 1
    MaxLeave = 0
    MaxKill = 0
    MaxCrash = 0
    AllowHandoff = FALSE
    WakeOnExpired = TRUE
    AgeStopsInACA = TRUE
    RootOpes = {"close_all", "let_finish"}
    TrackActor = TRUE
    WithExpiry = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS
    TypeOK
    NoCycle
    BlockedUnderPausedAncestor
    LiveUnderPausedExempt
    CapsHold
    ParallelismHolds
    OnParentEndOrder
    InboxClosed
    HandoffSuccessor
PROPERTIES
    TerminalStays
    LegalMoves
    OnlyRootClientLifts
    SuspensionCutsTurn
    IdleKeepsPodForRunningDescendant
    CloseRule
    ACANoExpiryWhileAncestorPaused
    ParentActsOnlyWhenRunning
