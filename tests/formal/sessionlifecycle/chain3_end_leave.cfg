\* As chain3_end, with one transfer or release that can race the cascade of a
\* parent's end or a force-terminate (0166 DPR-16). One kill; no suspension,
\* pod loss, expiry, or crash.
CONSTANTS
    Shape = "chain3"
    None = None
    Causes = {"client"}
    Cap = 3
    MaxPar = 1
    MaxSuspend = 0
    MaxPodLoss = 0
    MaxLeave = 1
    MaxKill = 1
    MaxCrash = 0
    AllowHandoff = FALSE
    WakeOnExpired = TRUE
    AgeStopsInACA = TRUE
    RootOpes = {"close_all", "let_finish"}
    TrackActor = FALSE
    WithExpiry = FALSE
SPECIFICATION FairSpec
INVARIANTS
    TypeOK
    NoCycle
    OnParentEndOrder
PROPERTIES
    ParentEndReachesChildren
    ForceReachesDescendants
