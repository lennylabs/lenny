\* The chain r -> a -> b with suspensions by the root's client and by an
\* external limit (L42, L45): one suspension call or limit signal; no pod
\* loss; no leave, kill, or crash. Cap 3, parallelism 1.
CONSTANTS
    Shape = "chain3"
    None = None
    Causes = {"client", "external_limit"}
    Cap = 3
    MaxPar = 1
    MaxSuspend = 1
    MaxPodLoss = 0
    MaxLeave = 0
    MaxKill = 0
    MaxCrash = 0
    AllowHandoff = FALSE
    WakeOnExpired = TRUE
    AgeStopsInACA = TRUE
    RootOpes = {"close_all"}
    TrackActor = TRUE
    WithExpiry = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS
    TypeOK
    NoCycle
    BlockedUnderPausedAncestor
    NoBlockedUnderEndedSession
    LiveUnderPausedExempt
    DirectResumeHonoured
    CapsHold
    ParallelismHolds
    OnParentEndOrder
    InboxClosed
    HandoffSuccessor
PROPERTIES
    TerminalStays
    LegalMoves
    OnlyRootClientLifts
    SuspensionCutsTurn
    IdleKeepsPodForRunningDescendant
    CloseRule
    ACANoExpiryWhileAncestorPaused
    ParentActsOnlyWhenRunning
