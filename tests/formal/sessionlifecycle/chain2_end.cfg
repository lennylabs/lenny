\* Liveness of the cascade on the chain r -> a under FairSpec (SL-9, SLR-31):
\* a parent's end, a force-terminate, and a tree terminate reach the child,
\* also while it is paused. One kill, one suspension call; no pod loss,
\* leave, expiry, or crash.
CONSTANTS
    Shape = "chain2"
    None = None
    Causes = {"client"}
    Cap = 3
    MaxPar = 1
    MaxSuspend = 1
    MaxPodLoss = 0
    MaxLeave = 0
    MaxKill = 1
    MaxCrash = 0
    AllowHandoff = FALSE
    WakeOnExpired = TRUE
    AgeStopsInACA = TRUE
    RootOpes = {"close_all", "let_finish"}
    TrackActor = FALSE
    WithExpiry = FALSE
SPECIFICATION FairSpec
INVARIANTS
    TypeOK
    NoCycle
    OnParentEndOrder
PROPERTIES
    ParentEndReachesChildren
    ForceReachesDescendants
