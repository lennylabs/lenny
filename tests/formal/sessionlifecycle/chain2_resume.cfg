\* Liveness of the tree resume and of the backlog sweep on the chain r -> a
\* under FairSpec (SLR-6, SLR-20): two suspension calls, one of which a
\* coordinator crash may cut after the suspension root's row is written. No
\* pod loss, leave, kill, or expiry.
CONSTANTS
    Shape = "chain2"
    None = None
    Causes = {"client"}
    Cap = 3
    MaxPar = 1
    MaxSuspend = 2
    MaxPodLoss = 0
    MaxLeave = 0
    MaxKill = 0
    MaxCrash = 1
    AllowHandoff = FALSE
    WakeOnExpired = TRUE
    AgeStopsInACA = TRUE
    RootOpes = {"close_all"}
    TrackActor = FALSE
    WithExpiry = FALSE
SPECIFICATION FairSpec
INVARIANTS
    TypeOK
    NoCycle
    OnParentEndOrder
PROPERTIES
    TreeResumeReachesBlocked
    PartialSuspensionCompletes
