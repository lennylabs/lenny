\* The chain r -> a with suspensions by the root's client and by an external
\* limit (L42, L45): two suspension calls or limit signals, one pod loss; no
\* leave, kill, or crash. Cap 2, parallelism 1.
CONSTANTS
    Shape = "chain2"
    None = None
    Causes = {"client", "external_limit"}
    Cap = 2
    MaxPar = 1
    MaxSuspend = 2
    MaxPodLoss = 1
    MaxLeave = 0
    MaxKill = 0
    MaxCrash = 0
    AllowHandoff = FALSE
    WakeOnExpired = TRUE
    AgeStopsInACA = TRUE
    RootOpes = {"close_all", "let_finish"}
    TrackActor = TRUE
    WithExpiry = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS
    TypeOK
    NoCycle
    BlockedUnderPausedAncestor
    NoBlockedUnderEndedSession
    LiveUnderPausedExempt
    DirectResumeHonoured
    CapsHold
    ParallelismHolds
    OnParentEndOrder
    InboxClosed
    HandoffSuccessor
PROPERTIES
    TerminalStays
    LegalMoves
    OnlyRootClientLifts
    SuspensionCutsTurn
    IdleKeepsPodForRunningDescendant
    CloseRule
    ACANoExpiryWhileAncestorPaused
    ParentActsOnlyWhenRunning
