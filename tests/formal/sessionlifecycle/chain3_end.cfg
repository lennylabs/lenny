\* Liveness of the cascade on the chain r -> a -> b under FairSpec (SL-9,
\* SLR-31), with a grandchild created while its parent's cascade runs. One
\* kill; no suspension, pod loss, leave, expiry, or crash.
CONSTANTS
    Shape = "chain3"
    None = None
    Causes = {"client"}
    Cap = 3
    MaxPar = 1
    MaxSuspend = 0
    MaxPodLoss = 0
    MaxLeave = 0
    MaxKill = 1
    MaxCrash = 0
    AllowHandoff = FALSE
    WakeOnExpired = TRUE
    AgeStopsInACA = TRUE
    RootOpes = {"close_all", "let_finish"}
    TrackActor = FALSE
    WithExpiry = FALSE
SPECIFICATION FairSpec
INVARIANTS
    TypeOK
    NoCycle
    OnParentEndOrder
PROPERTIES
    ParentEndReachesChildren
    ForceReachesDescendants
