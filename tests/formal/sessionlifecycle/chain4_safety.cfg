\* The bounds of chain4_leave with every safety check except P4, P4b, P6,
\* and P7, which fail on this chain (R2, G1, R1, R3) until open decisions
\* O6, O7, and O8 and issue DTREE-I4 are settled. chain4_leave keeps the
\* checks that reproduce R2 and R3.
CONSTANTS
    Shape = "chain4"
    None = None
    Causes = {"client"}
    Cap = 3
    MaxPar = 1
    MaxSuspend = 1
    MaxPodLoss = 0
    MaxLeave = 1
    MaxKill = 0
    MaxCrash = 0
    AllowHandoff = FALSE
    WakeOnExpired = TRUE
    AgeStopsInACA = TRUE
    RootOpes = {"close_all"}
    TrackActor = TRUE
    WithExpiry = FALSE
SPECIFICATION Spec
VIEW View
INVARIANTS
    TypeOK
    NoCycle
    LiveUnderPausedExempt
    CapsHold
    ParallelismHolds
    OnParentEndOrder
    InboxClosed
    HandoffSuccessor
PROPERTIES
    TerminalStays
    LegalMoves
    SuspensionCutsTurn
    IdleKeepsPodForRunningDescendant
    CloseRule
    ACANoExpiryWhileAncestorPaused
    ParentActsOnlyWhenRunning
