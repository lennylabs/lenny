\* The chain r -> a -> b -> c, deep enough that a transfer re-links a session
\* past a paused ancestor between the root and its former parent. One
\* suspension call and one transfer or release; no pod loss, expiry, kill,
\* or crash. Cap 3, parallelism 1. It lists only the checks that its
\* counterexamples break: its state space grows past what TLC explores in
\* ten minutes with two workers, so the other checks run on the chains of
\* two and three.
CONSTANTS
    Shape = "chain4"
    None = None
    Causes = {"client"}
    Cap = 3
    MaxPar = 1
    MaxSuspend = 1
    MaxPodLoss = 0
    MaxLeave = 1
    MaxKill = 0
    MaxCrash = 0
    AllowHandoff = FALSE
    WakeOnExpired = TRUE
    AgeStopsInACA = TRUE
    RootOpes = {"close_all"}
    TrackActor = TRUE
    WithExpiry = FALSE
SPECIFICATION Spec
VIEW View
INVARIANTS
    TypeOK
    NoCycle
    BlockedUnderPausedAncestor
PROPERTIES
    OnlyRootClientLifts
