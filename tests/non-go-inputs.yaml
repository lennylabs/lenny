# SPDX-License-Identifier: MIT
#
# Inputs no Go package owns, mapped to the tests that read them.
#
# `lenny-test run --changed` selects a changed Go file, and a file a Go
# package embeds or keeps under its directory, through the import graph.
# This list covers the tracked files outside every Go package directory
# that a test reads, executes, renders, or deploys. Each row names path
# patterns, the targets that read them, and a reason.
#
# - `paths`: repo-relative patterns. `*` matches within one path segment,
#   `**` across segments, and `?` one character of a segment.
# - `runs`: tier names and Go package directories. A tier name runs the
#   whole tier, and names a tier every package of which reads the input. A
#   package directory is treated as changed, so a test package runs, and a
#   helper package that reads the input for its importers selects every
#   test that imports it.
# - `reason`: how the targets read the paths.
#
# A changed path that no package owns and no row matches selects the static
# tier only, and the selection notes name it. `lenny-test validate-maps`
# fails a row whose pattern matches no tracked file or whose target is
# neither a tier name nor a Go package directory. TESTING.md, "Selection
# algorithm", describes the sources of a selection.
kind: non-go-inputs
version: 1
inputs:
  - paths: ["charts/lenny/**"]
    runs:
      - e2e_kind
      - e2e_cloud
      - load_kind
      - load_cloud
      - chaos
      - security
      - integration
      - docs
      - tests/testinfra/helm
      - tests/testinfra/kind
      - tests/component/pgbouncerchart
      - tests/component/observability
      - pkg/chart/values
      - pkg/ctlcli
      - pkg/admission/podclaim_guard
      - cmd/lenny-gateway
    reason: >-
      The Kind and cloud tiers, and the chaos, security, and load_kind tiers on
      the Kind cluster, run on the chart the install scripts deploy. The
      integration, security, and component packages and the unit packages named
      here render the chart with Helm or read its values and alert rules, and the
      documentation tier reads its values and alert rules.
  - paths: ["charts/lenny/crds/**"]
    runs:
      - tests/testinfra/envtest
      - tests/contract/crd_schema
      - pkg/embedded/crds
    reason: >-
      The envtest helper installs the chart's CRDs into every envtest
      kube-apiserver, so every test that imports it reads them; the CRD schema
      contract and the embedded CRD package read the files.
  - paths: ["Dockerfile", "Dockerfile.supervisor"]
    runs:
      - e2e_kind
      - e2e_cloud
      - load_kind
      - load_cloud
      - chaos
      - security
      - tests/testinfra/kind/imagetag
    reason: >-
      The Kind install script and the cloud image builds build the platform and
      supervisor images from these files, and the image-tag helper hashes them.
  - paths: ["supervisor/**"]
    runs:
      - e2e_kind
      - e2e_cloud
      - load_kind
      - load_cloud
      - chaos
      - security
      - tests/testinfra/supervisorbuild
      - tests/testinfra/kind/imagetag
      - tests/contract/adapter_supervise
      - pkg/adapter
    reason: >-
      The supervisor image copies these sources; the supervisor build helper and
      the supervise contract compile them with make; the adapter's bounds test
      reads supervisor.h.
  - paths: ["docker-compose.yml", "Makefile"]
    runs:
      - tests/contract/compose_mode
      - tests/testinfra/kind
    reason: >-
      The compose-mode contract reads the compose file and the Makefile targets,
      and the Kind helper's image pins test reads the compose file.
  - paths: ["compose/**"]
    runs:
      - tests/contract/compose_mode
      - tests/testinfra/compose
      - tests/testinfra/kind
    reason: >-
      The compose helper runs the stack these files define for the tests that
      import it; the compose-mode contract reads the smoke test and the
      Prometheus file; the Kind helper's image pins test reads compose/default.yml.
  - paths: ["compose/redis-cluster/**"]
    runs:
      - tests/testinfra/containers
    reason: The container helper starts a Redis cluster with compose/redis-cluster/start.sh.
  - paths: ["deploy/**", "scripts/cloud/**"]
    runs:
      - e2e_cloud
      - load_cloud
      - tests/testinfra/cloud
    reason: >-
      The cloud helper runs the cloud scripts, which apply the Terraform under
      deploy/ and install the chart, for the cloud tiers.
  - paths: ["docs/**", "spec/**"]
    runs:
      - docs
    reason: >-
      The documentation tier checks the documentation and the specification as
      a whole. Test functions that cite an edited section or identifier are
      selected from the annotations in addition.
  - paths: ["docs/runbooks/**"]
    runs:
      - e2e_kind
      - tests/component/runbooks
      - tests/testinfra/chaos
      - tests/testinfra/kind/imagetag
      - pkg/alerting/rules
      - pkg/gateway/operability/health
    reason: >-
      The platform image copies the runbooks for the e2e_kind runbook index
      test; the runbook component test, the chaos helper's runbook map, the alert
      rules, and the operability health bundle read them.
  - paths: ["spec/**"]
    runs:
      - tests/conformance
      - pkg/observability/tracing
      - pkg/gateway/externalapi/openapi
    reason: >-
      These packages read specification pages at test time: the intra-pod
      pointer conformance test, the tracing attribute test, and the OpenAPI
      completeness test.
  - paths:
      - "TESTING.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "BUILD-GAPS.md"
      - "TEST-GAPS.md"
      - "PROPOSAL-QUEUE.md"
      - "gateway-runtime-comms.md"
      - "gateway-runtime-comms-remediation.md"
      - "proposals/**"
    runs:
      - docs
    reason: >-
      Documentation-tier tests read these root documents and proposals.
  - paths: ["sdks/client/python/**", "sdks/client/typescript/**", "sdks/runtime/python/**", "sdks/runtime/typescript/**"]
    runs:
      - tests/contract/sdks
    reason: The SDK contract tests run the Python and TypeScript SDK helpers as subprocesses.
  - paths: ["tests/gate/**", "tests/non-go-inputs.yaml"]
    runs:
      - cmd/lenny-test
    reason: >-
      The harness's secret-scan coverage test reads the gate image's Dockerfile,
      and its selector tests read this list.
