# SPDX-License-Identifier: MIT
#
# The register of the gateway wiring check (tests/static/lint/gatewaywiring,
# run over cmd/lenny-gateway by TestGatewayWiringCrossesOnlyThroughTheSeam).
# It lists each value of one gateway part that the composition root passes
# where another part expects an interface or a function not declared in
# pkg/gateway/seam, and where the import rules refuse the receiving part
# importing the value's package, as the check found them when it landed
# with decisions 9 and 12 of change 0117 (gateway package layout), step
# 0117.S2. A value of an adapter type the composition root declares is
# attributed to the values its fields hold, and a function literal or a
# method value of the composition root to what its body calls and
# captures; type then names the adapter or the method with the attributed
# value in parentheses, or func(...) for a literal.
# It also lists each value whose named type a package GW-R2 confines that
# the composition root hands to a part GW-R2 does not allow that package.
#
# to and interface name the target: the package that declares it, and the
# type, Struct.Field, Func(n) for the n-th parameter, or Func.n for the n-th
# result. from and type name
# the value: its package, and its type, Type.Method for a method value, or
# a function. step names the step of change 0117 that routes the crossing
# through the seam interface: the step that moves the part other than the
# session core, or the later of the two parts' steps when neither is the
# core.
#
# The check fails on a crossing this register does not carry and on a row
# that no longer occurs, and TestGatewayWiringRegisterOnlyShrinks compares
# the register with its copy at the merge base, so it only shrinks.
version: 1
