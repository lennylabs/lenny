# SPDX-License-Identifier: MIT
#
# The register of the gateway layout gate (tests/static/lint/gatewaylayout,
# run over the tree by TestGatewayLayoutHoldsTheImportRule). It lists the
# violations of the layout that existed when the gate landed with change
# 0117 (gateway package layout), step 0117.S2.
#
# packages: each package under pkg/gateway that sits outside the directory
# of its part. `part` names the part it belongs to: a part of the gateway
# layout (seam-interface, stream-proxy, upload-handler, platform-tools,
# metering-proxy, core, api-front, drain, scaling, ops-endpoints, replica,
# or playground), `domain` for a package that leaves pkg/gateway for a
# concern directory under pkg/, or `removed` for a package a member change
# of the v1 program removes. A moved package names the step that moves it;
# a removed package names the change that removes it (`removed-by`).
#
# imports: each non-test import that breaks a rule of the gate, with the
# rule and the step that ends it. The rows with rule confined-imports are the
# importers of the credential and admission packages that GW-R2 confines
# (decision 10 of change 0117); the step that moves the importer's part
# routes each through the seam interface.
#
# The gate fails on a violation this register does not carry and on a row
# that no longer occurs, so the register only shrinks. Each step that moves
# a package deletes its rows in the same commit. Step 0117.S13 moves what a
# removal leaves, so the register is empty when the v1 program closes.
version: 1
