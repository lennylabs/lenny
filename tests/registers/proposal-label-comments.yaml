#
# Per-file counts of proposal scaffolding labels in Go comments.
#
# Each count is how many proposal change identifiers (a lane prefix such as
# the code or spec lane, a hyphen, and a letter or number) and bare build
# steps (an S and one or two digits, the S3 service name excepted) the
# comments of the file carried when the proposal-label ratchet landed. A
# file that carries none holds no entry here, and it fails tier 0 on its
# first one.
#
# tests/tier0_static/proposal_label_comment_test.go reads this file. It
# fails a file whose count rises above its entry and a file whose count
# fell below it, so a removal is written back here in the same change and
# the ratchet only tightens. Replace a label with a `// spec:` citation or a
# description of the behavior it names.
