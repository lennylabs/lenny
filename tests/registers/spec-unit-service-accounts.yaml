# SPDX-License-Identifier: MIT
#
# The ServiceAccount each running unit of the specification tree runs
# under, keyed by the unit's page code.
#
# The contribution gate in tests/static/spec_page_gates_test.go reads
# this register to hold each grant, rbac-grant, and network-rule block
# against the chart: a block's unit names a page code, the register names
# the ServiceAccount the chart renders for that unit, the gate reads the
# Roles and ClusterRoles bound to it, and it finds the unit's pods by the
# workloads whose pod template runs under it. A block may name its
# ServiceAccount itself with its service-account field, which takes
# precedence over the register.
#
# The same test holds the register to the tree and the chart: each code is
# the code of a page, and each ServiceAccount is one `helm template`
# renders. Add a unit here when a page first states a contribution block
# for it.
kind: spec-unit-service-accounts
version: 1
units:
  BKJOB:
    service-account: lenny-backup-sa
  GW:
    service-account: lenny-gateway
  LOPS:
    service-account: lenny-ops-sa
  PREFLT:
    service-account: lenny-preflight
  PSC:
    service-account: lenny-pool-scaling-controller
  TOKSVC:
    service-account: lenny-token-service
  WEBHOOK:
    service-account: lenny-webhook
  WPC:
    service-account: lenny-controller
