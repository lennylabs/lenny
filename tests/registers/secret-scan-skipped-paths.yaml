#
# Reviewed text files under the paths gitleaks skips.
#
# The secret scan's .gitleaks.toml extends the default gitleaks
# configuration, whose global allowlist skips some files and directories
# by path before gitleaks reads them (the patterns, copied from the pinned
# release, are in cmd/lenny-test/secretscan_skipped.go). The scan keeps
# that allowlist, and the static tier's secret scan fails when a tracked
# text file matches one of its path patterns, or sits in a directory that
# matches one, and this list does not name the file (change 0158,
# decision 5). An archive or binary file under such a path is named in
# binary-files.yaml instead, so each file has one entry. An entry that
# names a file the tree does not track, or a file no pattern skips, fails
# as well.
#
# Each entry names a file the default allowlist skips for a reason that
# holds in this repository, with that reason. A file that has no such
# reason moves to a path gitleaks reads. This directory is reviewed before
# it merges (.claude/rules/git-workflow.md, "Review changes to the merge
# gate"), and so are go.mod, go.sum, and .gitleaks.toml themselves. The
# entries carry no hash, so this list does not bring a later edit of a
# listed file back to review.
#
# The entries were built from the tree on 2026-11-17 (change 0158, step
# S2), and each file was scanned with gitleaks v8.30.1 under a name the
# path allowlist does not skip. The only findings were go.sum lines for
# modules whose paths contain "secret", "token", "auth", or "key".
kind: secret-scan-skipped-paths
version: 1
entries:
  - path: .gitleaks.toml
    reason: >-
      The secret scan's own configuration. Its allowlist entries quote the
      fake secrets they allow, so scanning it would report each of them.
  - path: docs/assets/diagrams/architecture-overview.svg
    reason: >-
      Documentation diagram in SVG text: shapes and labels, with no
      embedded image or credential.
