  - path: go.mod
    reason: >-
      Go module requirements: module paths and versions, which hold no
      credential.
  - path: go.sum
    reason: >-
      Go module checksums. The generic rule reports the base64 hashes that
      follow module paths containing "secret", "token", "auth", or "key"
      as keys.
  - path: sdks/client/typescript/package-lock.json
    reason: >-
      npm lockfile of the client SDK: package names, versions, integrity
      hashes, and registry.npmjs.org URLs with no credential.
  - path: sdks/runtime/typescript/package-lock.json
    reason: >-
      npm lockfile of the runtime SDK: package names, versions, integrity
      hashes, and registry.npmjs.org URLs with no credential.
