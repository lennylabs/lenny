#
# Committed text files under the paths gitleaks skips, which the secret
# scan reads under another name.
#
# The secret scan's .gitleaks.toml extends the default gitleaks
# configuration, whose global allowlist skips some files and directories
# by path before gitleaks reads them (the patterns, copied from the pinned
# release, are in cmd/lenny-test/secretscan_skipped.go). The static tier's
# secret scan writes each committed file under such a path into its scan
# tree under a renamed path that no pattern matches, so gitleaks reads its
# content on every run (cmd/lenny-test/secretscan_tree.go), and a finding
# names the repository path. This list records which files are scanned
# that way: the scan fails when a committed text file matches a path
# pattern, or sits in a directory that matches one, and this list does not
# name the file (change 0158, decision 5). An archive, binary file, or
# symbolic link under such a path is named in binary-files.yaml instead,
# so each file has one entry. An entry that names a file the commit does
# not hold, or a file no pattern skips, fails as well.
#
# Each entry names a file the default allowlist would skip, with the
# reason the repository carries it at that path. This directory is
# reviewed before it merges (.claude/rules/git-workflow.md, "Review
# changes to the merge gate"), and so are go.mod, go.sum, and
# .gitleaks.toml themselves. A finding in a renamed file is allowed like
# any other, by an exact-value entry in .gitleaks.toml whose path is the
# renamed one, as the entries for go.sum and for .gitleaks.toml itself
# are.
#
# The entries were built from the tree on 2026-11-17 (change 0158, step
# S2). The only findings in these files were go.sum hashes next to module
# paths that contain "secret", "token", "auth", or "key", and the fake
# values .gitleaks.toml quotes in its own comments.
kind: secret-scan-skipped-paths
version: 1
entries:
  - path: .gitleaks.toml
    reason: >-
      The secret scan's own configuration, at the path gitleaks reads it
      from. Its comments quote some of the fake values it allows, which an
      exact-value entry for its renamed path allows.
  - path: docs/assets/diagrams/architecture-overview.svg
    reason: >-
      Documentation diagram in SVG text: shapes and labels, with no
      embedded image or credential.
