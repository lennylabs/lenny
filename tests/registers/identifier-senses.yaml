  - file: spec/15_external-api-surface.md
    occurrence: 5
    channel: CH-RUNTIMEOPS
  # The occurrence stands in the file argument of an Azure storage
  # management-policy command, which names a policy document rather than
  # the mechanism the naming table retires the spelling for.
  - file: spec/17_deployment-topology.md
    occurrence: 1
    not-a-channel: true
  - file: spec/18_build-sequence.md
    occurrence: 1
    channel: CH-RUNTIMEOPS
  # The file-name entries. The naming law reaches the file-name stem, so
  # the run that rewrites the identifier inside a carrier is the run that
  # moves the carrier whose own name carries it.
  - file: pkg/adapter/adapterevents.go
    path: true
    channel: CH-ADAPTEREVENTS
    carrier: path
  - file: pkg/adapter/adapterevents_test.go
    path: true
    channel: CH-ADAPTEREVENTS
    carrier: path
  - file: pkg/adapter/runtimeops.go
    path: true
    channel: CH-RUNTIMEOPS
    carrier: path
  - file: pkg/adapter/runtimeops_test.go
    path: true
    channel: CH-RUNTIMEOPS
    carrier: path
  - file: schemas/runtime-ops-events.schema.json
    path: true
    channel: CH-RUNTIMEOPS
    carrier: path
  # The occurrences outside spec/. Two dispositions appear below. An
  # entry naming a channel resolves which of the two channels the
  # occurrence denotes, and, where the channel states a spelling in more
  # than one carrier the form of the site does not select between, names
  # the naming-table row the substitution is read from. An entry marked
  # not-a-channel records an occurrence that is not a channel reference:
  # every one of them stands in a test fixture that declares a retired
  # spelling as data, either as a path inside a synthetic fixture tree
  # the test builds or as a naming-table row the case feeds the loader,
  # so the spelling names the fixture rather than the mechanism.
  - file: .claude/workflows/change-proposal.js
    occurrence: 1
    channel: CH-RUNTIMEOPS
