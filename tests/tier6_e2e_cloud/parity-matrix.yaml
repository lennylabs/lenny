# SPDX-License-Identifier: MIT

# Provider parity matrix per TESTING.md §12.6.
#
# Each capability listed here is documented somewhere in the spec or
# the Helm chart and is exercised against the providers marked
# `validated`. A capability that the spec claims but is missing from
# this matrix fails the Tier 0 static gate.
#
# Cells:
#   validated: capability is exercised against the provider and asserted to pass
#   planned: capability is documented but the test does not yet exist
#   skip: capability is intentionally not validated against the provider (with reason)
#
# Validation invariants (enforced by cmd/lenny-test validate-maps):
#   - Every capability has at least one `validated` provider.
#   - Every provider listed across rows is in the allow-list (gke, eks, aks).
#   - Every `skip` carries a `reason`.

version: 1

providers:
  - gke
  - eks
  - aks

capabilities:

  - name: gvisor_isolation
    spec_section: "12.6"
    status:
      gke: planned
      eks: planned
      aks: planned

  - name: kata_isolation
    spec_section: "12.6"
    status:
      gke: planned
      eks:
        state: skip
        reason: AWS does not offer a first-party Kata RuntimeClass; Firecracker-via-Fargate is covered separately under firecracker_isolation.
      aks: planned

  - name: firecracker_isolation
    spec_section: "12.6"
    status:
      gke:
        state: skip
        reason: Firecracker integration is AWS-specific.
      eks: planned
      aks:
        state: skip
        reason: Firecracker integration is AWS-specific.

  - name: confidential_containers
    spec_section: "12.6"
    status:
      gke:
        state: skip
        reason: Confidential Containers is the named AKS Pod Sandboxing variant; GKE's sandbox option is gvisor_isolation.
      eks:
        state: skip
        reason: Confidential Containers is the named AKS Pod Sandboxing variant; EKS's sandbox options are kata_isolation and firecracker_isolation.
      aks: planned

  - name: multi_zone_dr
    spec_section: "17.3"
    status:
      gke: planned
      eks: planned
      aks: planned

  - name: managed_ingress
    spec_section: "12.6"
    status:
      gke: planned
      eks: planned
      aks: planned

  - name: cloud_csi
    spec_section: "12.5"
    status:
      gke: planned
      eks: planned
      aks: planned

  - name: cloud_kms
    spec_section: "13"
    status:
      gke: planned
      eks: planned
      aks: planned

  - name: cloud_oidc
    spec_section: "13"
    status:
      gke: planned
      eks: planned
      aks: planned

  - name: cloud_secret_store
    spec_section: "13"
    status:
      gke: planned
      eks: planned
      aks: planned

  - name: multi_az_minio
    spec_section: "12.5"
    status:
      gke: planned
      eks: planned
      aks: planned

  - name: cloud_observability
    spec_section: "16"
    status:
      gke: planned
      eks: planned
      aks: planned

  - name: cloud_billing_export
    spec_section: "16"
    status:
      gke: planned
      eks: planned
      aks: planned

  # ArtifactStore cross-region replication residency: the runtime
  # residency preflight's provider-native jurisdiction-tag probe
  # (s3:GetBucketTagging or provider equivalent) against a real
  # destination bucket, the same-jurisdiction `active` state, and the
  # cross-jurisdiction fail-closed suspension
  # (suspended_residency_violation + ARTIFACT_REPLICATION_REGION_UNRESOLVABLE).
  # Exercised by TestCloudArtifactReplicationResidency; tier-1/tier-2
  # cover only the FakeDriver, so no provider validates the provider-native
  # path yet.
  - name: artifact_replication_residency
    spec_section: "25.11"
    status:
      gke: planned
      eks: planned
      aks: planned

  # lenny-ops operability surface: the chart-deployed lenny-ops
  # Deployment is Ready and its /readyz + /v1/admin/diagnostics/
  # connectivity responses report Postgres and the Kubernetes API (and,
  # when the cloud install is wired to a managed cache, Redis) as
  # reachable from outside the cluster. Exercised by
  # TestCloudOpsSurfaceHealthy against the managed RDS / ElastiCache
  # provisioning path on AWS; no provider run has validated it live yet.
  - name: ops_operability_surface
    spec_section: "25.1"
    status:
      gke: planned
      eks: planned
      aks: planned

  # lenny-ops caller-discovery endpoint: GET /v1/admin/me answers with
  # the documented identity/authorization/platform/capabilities/links
  # envelope from a lenny-ops deployed against the cloud install's
  # managed-store ipBlock egress. Exercised by TestCloudOpsAdminMe on
  # AWS; no provider run has validated it live yet.
  - name: ops_me
    spec_section: "25.4"
    status:
      gke: planned
      eks: planned
      aks: planned

  # lenny-ops remediation-lock coordination: a lock acquire followed by
  # a release against whichever lock tier (Postgres, Redis, or
  # in-memory) the cloud install's managed-store wiring resolves to.
  # Exercised by TestCloudOpsRemediationLockAcquireRelease on AWS; no
  # provider run has validated it live yet.
  - name: ops_locks
    spec_section: "25.4"
    status:
      gke: planned
      eks: planned
      aks: planned

  # lenny-ops escalation creation and listing against the cloud
  # install's managed-store wiring. No tier6 test exists yet.
  - name: ops_escalations
    spec_section: "25.4"
    status:
      gke: planned
      eks: planned
      aks: planned

  # lenny-ops full/incremental backup and restore against the cloud
  # install's managed object storage. No tier6 test exists yet; the
  # existing tier6 artifact_replication_residency capability above
  # covers ArtifactStore residency, a related but distinct surface.
  - name: ops_backup
    spec_section: "25.11"
    status:
      gke: planned
      eks: planned
      aks: planned

  # lenny-ops drift detection and reconciliation against the cloud
  # install's live gateway admin API. No tier6 test exists yet.
  - name: ops_drift
    spec_section: "25.10"
    status:
      gke: planned
      eks: planned
      aks: planned

  # §25.8 version aggregation: GET /v1/admin/platform/version/full
  # against the cloud-deployed lenny-ops, confirming the report
  # carries the compiled-in "ops" component version. A read-only,
  # no-op aggregation call — it starts no upgrade. Exercised by
  # TestCloudPlatformVersionAggregation; no provider run has
  # validated it live yet.
  - name: platform_upgrade
    spec_section: "25.8"
    status:
      gke: planned
      eks: planned
      aks: planned

  # §25.8 cert-manager integration: GET /v1/admin/ops/health against
  # the cloud-deployed lenny-ops, confirming the cert_manager
  # self-health check reports one of the three documented states
  # (healthy, degraded, unhealthy). A read-only observation of the
  # check the CertExpiryImminent alert keys off; no certificate is
  # rotated. Exercised by TestCloudCertManagerHealthObservation; no
  # provider run has validated it live yet.
  - name: cert_manager_lifecycle
    spec_section: "25.8"
    status:
      gke: planned
      eks: planned
      aks: planned
