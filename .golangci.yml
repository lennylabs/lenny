# golangci-lint config. Tier 0 of TESTING.md.
#
# Conservative defaults for Phase 1. Linters expand in later phases as
# more code lands and false-positives get tuned out.

run:
  timeout: 2m
  go: "1.22"
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gofumpt
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/lennylabs/lenny

issues:
  # golangci-lint 1.61's bundled type-checker fails to resolve external
  # imports for tests/tier0_static (the jsonschema/v5 package in
  # particular). The directory's test suite is exercised by
  # `go test ./tests/tier0_static/...` in the static-tier runner, so
  # skipping the lint pass does not reduce coverage. Revisit after the
  # next golangci-lint bump.
  exclude-dirs:
    - tests/tier0_static
    - tests/testinfra/schematest
  exclude-rules:
    # Don't penalise the agent-generated boilerplate while it stabilises.
    - path: "tests/tier3_contract/.*_test\\.go"
      text: "not implemented"
      linters:
        - govet
