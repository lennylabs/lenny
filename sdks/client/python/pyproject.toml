# SPDX-License-Identifier: MIT

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lenny-client"
version = "0.1.0"
description = "Official Python client SDK for the Lenny gateway"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["lenny", "agent", "sdk", "client"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

# The SDK uses only the Python standard library at runtime. The
# transport is urllib.request and the webhook verifier is hmac plus
# hashlib, so no third-party package is required to install or run the
# client, including the tier-3 contract test-helper.
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
]

[tool.setuptools]
packages = ["lenny"]

[tool.setuptools.package-data]
lenny = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["lenny"]
