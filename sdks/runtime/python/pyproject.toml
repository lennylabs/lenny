# SPDX-License-Identifier: MIT

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lenny-runtime"
version = "0.1.0"
description = "Official Python runtime-author SDK for the Lenny agent-session platform"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["lenny", "agent", "sdk", "runtime"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

# The SDK uses only the Python standard library at runtime. The §15.4.1
# binary protocol runs on sys.stdin/sys.stdout, the §15.4.3 intra-pod
# MCP and Full-level lifecycle channels use the socket module, and the
# JSON codec is the json module, so no third-party package is required
# to install or run a runtime built on this SDK.
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
]

[project.scripts]
lenny-runtime-example-echo = "lenny_runtime.examples.echo:main"
lenny-runtime-example-delegate = "lenny_runtime.examples.delegate:main"
lenny-runtime-example-lifecycle = "lenny_runtime.examples.lifecycle:main"

[tool.setuptools]
packages = ["lenny_runtime", "lenny_runtime.examples"]

[tool.setuptools.package-data]
lenny_runtime = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["lenny_runtime"]
