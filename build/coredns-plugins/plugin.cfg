# CoreDNS plugin chain for the dedicated lenny-system instance (spec
# §13.2 lines 498-536). This is CoreDNS's stock plugin.cfg ordering with
# the two non-standard plugins inserted: `ratelimit` runs early (before
# the answer is cached or forwarded) so throttled queries never reach the
# upstream, and `filter` runs after `cache` so it inspects the resolved
# response before it returns to the agent pod.
#
# Lines are ordered; CoreDNS evaluates plugins top to bottom. Only the
# entries relevant to the dedicated instance's Corefile are listed here;
# a full build appends the remaining stock entries.

ratelimit:github.com/coredns/ratelimit
log:log
errors:errors
health:health
ready:ready
prometheus:metrics
cache:cache
filter:github.com/milgradesec/filter
forward:forward
reload:reload
