// Gateway ↔ pod control protocol. This is the gRPC contract the gateway uses
// to drive a pod's adapter sidecar: deliver messages, push credentials,
// interrupt, request checkpoints, and report usage. The adapter ↔ agent
// channel is JSON Lines (see lenny-adapter-jsonl.schema.json); this proto
// covers only the gateway-facing surface.
//
// See spec/15_external-api-surface.md §15.3 and §15.4.
//
// Phase 1 ships the service skeleton and the canonical message types.
// Field shapes for individual RPCs are deliberately conservative: Phase 2
// implementation fleshes them out and `buf breaking` catches incompatible
// changes against this baseline.

syntax = "proto3";

package lenny.adapter.v1;

option go_package = "github.com/lennylabs/lenny/pkg/proto/adapter/v1;adapterv1";

// =====================================================================
// Service
// =====================================================================

// Adapter is the long-running gRPC server hosted by the adapter sidecar
// inside every Lenny pod. The gateway connects over mTLS and uses it for
// session lifecycle, credential delivery, interrupt control, checkpoint
// orchestration, and usage reporting. Pod → gateway traffic is initiated
// by the gateway only; the adapter responds to RPCs and emits structured
// events via a separate streaming RPC (the lifecycle channel).
service Adapter {
  // PrepareWorkspace accepts streamed upload-file content into the pod's
  // staging area. It is the first RPC in the §4.7 session assignment
  // sequence (PrepareWorkspace, FinalizeWorkspace, RunSetup,
  // StartSession). Frames sharing an upload_ref are concatenated in
  // arrival order into one staged file; FinalizeWorkspace then
  // materializes the uploadFile and uploadArchive plan sources from the
  // staged content.
  rpc PrepareWorkspace(stream PrepareWorkspaceRequest) returns (PrepareWorkspaceResponse) {}

  // FinalizeWorkspace validates the staged workspace content and
  // materializes the §14 WorkspacePlan into /workspace/current. It is
  // the second RPC in the §4.7 session assignment sequence
  // (PrepareWorkspace, FinalizeWorkspace, RunSetup, StartSession).
  rpc FinalizeWorkspace(FinalizeWorkspaceRequest) returns (FinalizeWorkspaceResponse) {}

  // RunSetup executes the §14 WorkspacePlan setup commands against the
  // materialized workspace. It is the third RPC in the §4.7 session
  // assignment sequence (PrepareWorkspace, FinalizeWorkspace, RunSetup,
  // StartSession). The §5.1 setupPolicy in the request bounds the
  // aggregate setup phase.
  rpc RunSetup(RunSetupRequest) returns (RunSetupResponse) {}

  // StartSession starts the agent runtime on this pod. It is the final
  // RPC of the §4.7 session assignment sequence (PrepareWorkspace,
  // FinalizeWorkspace, RunSetup, StartSession): the workspace is already
  // materialized by FinalizeWorkspace and setup is already run by
  // RunSetup. Returns Unavailable if the pod is not in `idle` state.
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse) {}

  // ConfigureWorkspace points a pre-connected SDK-warm session at the
  // finalized working directory (§4.7 SDK-warm mode). It is the SDK-warm
  // counterpart of StartSession: the runtime has already connected its SDK
  // at warm time, so instead of starting it fresh the adapter delivers the
  // final cwd. Timeout: 10s. Idempotent — sending the same cwd twice is
  // safe. On failure the gateway calls DemoteSDK and falls back to pod-warm
  // materialization. Applies only to runtimes that declare
  // capabilities.preConnect: true; pod-warm adapters return Unimplemented.
  rpc ConfigureWorkspace(ConfigureWorkspaceRequest) returns (ConfigureWorkspaceResponse) {}

  // SendMessage delivers a content message to the agent over the adapter's
  // stdin JSONL channel. See lenny-adapter-jsonl.schema.json `message`.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {}

  // Attach opens the bidirectional content stream between the gateway and a
  // running session (spec §4.7 RPC table: "Connect client stream to running
  // session"). The gateway streams client-to-agent envelopes in; the adapter
  // streams the agent's response, tool-call, and status envelopes back.
  // Envelope payloads are §15.4.1 JSONL frames carried verbatim as JSON
  // bytes, mirroring SendMessage.envelope_json.
  rpc Attach(stream AttachRequest) returns (stream AttachResponse) {}

  // AssignCredentials pushes a per-session credential lease map to the
  // adapter. Adapter writes the credential file under /run/lenny/. Atomic
  // across providers; partial failures are rolled back.
  rpc AssignCredentials(AssignCredentialsRequest) returns (AssignCredentialsResponse) {}

  // RotateCredentials replaces a previously assigned credential lease with
  // a new lease. Emits a `credentials_rotated` lifecycle event to the
  // agent. Used for hot rotation without pod restart.
  rpc RotateCredentials(RotateCredentialsRequest) returns (RotateCredentialsResponse) {}

  // RevokeCredentials removes a credential lease immediately. The agent
  // receives no chance to drain in-flight requests; emergency revocation.
  rpc RevokeCredentials(RevokeCredentialsRequest) returns (RevokeCredentialsResponse) {}

  // Interrupt asks the agent to pause and (optionally) checkpoint. Two
  // modes: clean (graceful, with deadline) and hard (SIGTERM/SIGKILL).
  rpc Interrupt(InterruptRequest) returns (InterruptResponse) {}

  // Checkpoint requests an immediate checkpoint of the current session
  // state to the artifact store. Used for eviction, drain, and session
  // suspend.
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse) {}

  // Resume restores a session's workspace from a checkpoint on a
  // replacement pod (§4.7, §7.1). The adapter claims the session,
  // rebuilds /workspace/current from the named checkpoint, and starts
  // the runtime — the replacement-pod counterpart of StartSession.
  rpc Resume(ResumeRequest) returns (ResumeResponse) {}

  // ExportPaths packages files from /workspace/current for delegation,
  // rebased per the export spec (§8.7). The adapter resolves each export
  // source glob inside the workspace root, rejects any matched file whose
  // realpath escapes the workspace via symlink, strips the glob's base
  // path, and re-roots each file under the export's dest_prefix. The
  // gateway applies the lease's fileExportLimits and optional content
  // scanning to the returned set. Spec: §4.7 line 633, §8.7.
  rpc ExportPaths(ExportPathsRequest) returns (ExportPathsResponse) {}

  // ReportUsage returns token-usage and time-usage accounting since the
  // last call. The gateway uses this for budget enforcement and billing.
  rpc ReportUsage(ReportUsageRequest) returns (ReportUsageResponse) {}

  // Shutdown asks the adapter to terminate the agent and release the pod.
  // The adapter forwards a JSONL `shutdown` to the agent with the supplied
  // deadline. Returns when the agent process has exited.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse) {}

  // DemoteSDK is required for runtimes that declare
  // `capabilities.preConnect: true`. The gateway calls DemoteSDK when an
  // SDK-warm pod's incoming WorkspacePlan matches a `sdkWarmBlockingPaths`
  // pattern, instructing the adapter to tear down the pre-connected SDK
  // and demote the pod to pod-warm before workspace materialization
  // proceeds. Pods without preConnect: true return Unimplemented.
  // Spec: §4.7, §6.1, §15.4.
  rpc DemoteSDK(DemoteSDKRequest) returns (DemoteSDKResponse) {}

  // NegotiateVersion is called once per gateway↔adapter handshake.
  // The adapter advertises the protocol versions and capabilities it
  // supports; the gateway selects a compatible version. Subsequent
  // RPCs assume the negotiated version. See spec §15.5 (versioning).
  rpc NegotiateVersion(NegotiateVersionRequest) returns (NegotiateVersionResponse) {}

  // LifecycleChannel is a bidirectional stream the adapter uses to surface
  // Full-level lifecycle events (checkpoint_ready, interrupt_acknowledged,
  // credentials_acknowledged, deadline_approaching). See spec §15.4 for
  // the event taxonomy.
  rpc LifecycleChannel(stream LifecycleChannelRequest) returns (stream LifecycleChannelResponse) {}
}

// GatewayControl is the adapter→gateway control surface. It is the
// inverse direction of the Adapter service: the gateway hosts this
// gRPC server and the adapter dials it as a client. Adapter traffic
// on this service is initiated by the adapter, in contrast to the
// Adapter service where the gateway initiates every RPC.
//
// The service exists because a few §8 control operations originate at
// the pod and need a gateway decision. ExtendLease is the first such
// operation: the adapter cannot resolve a token-budget extension
// itself because the layered §8.6 ceiling and the per-tree budget
// state live on the gateway.
service GatewayControl {
  // ExtendLease is the adapter's request to the gateway for additional
  // token budget. Per spec §8.6 the adapter issues it when the LLM
  // proxy rejects a call for budget exhaustion. Response carries one
  // of GRANTED, PARTIALLY_GRANTED, CEILING_REACHED, REJECTED. On
  // CEILING_REACHED or REJECTED the adapter MUST NOT retry the
  // extension; it propagates BUDGET_EXHAUSTED to the runtime.
  rpc ExtendLease(ExtendLeaseRequest) returns (ExtendLeaseResponse) {}
}

// =====================================================================
// gRPC Health Checking Protocol binding
// =====================================================================
//
// The adapter also serves the standard `grpc.health.v1.Health` service
// (defined in https://github.com/grpc/grpc-proto). It is not redeclared
// here to avoid wire-incompatible duplication; Phase 2's implementation
// registers `google.golang.org/grpc/health` with the same gRPC server
// alongside Adapter. The gateway probes liveness via the standard
// `Health.Check` and `Health.Watch` RPCs.

// =====================================================================
// Error envelope
// =====================================================================
//
// Every RPC failure carries a structured error envelope alongside the
// gRPC status code. The Category dimension classifies whether a caller
// should retry (Transient), surface the failure (Permanent), or treat
// it as a policy decision the operator must change (Policy). The Code
// field is the spec-mandated error code from spec §15.1's catalog.

message Error {
  ErrorCode code = 1;
  Category category = 2;
  string message = 3;
  // retryable mirrors the REST/MCP `retryable` flag in spec §15.1. True
  // implies Category = CATEGORY_TRANSIENT; false implies Permanent or
  // Policy.
  bool retryable = 4;
  // docs_url points at the operator runbook or spec section for this
  // error code. Same shape as the REST error envelope.
  string docs_url = 5;

  enum Category {
    CATEGORY_UNSPECIFIED = 0;
    // CATEGORY_TRANSIENT: retry with backoff may succeed.
    CATEGORY_TRANSIENT = 1;
    // CATEGORY_PERMANENT: caller should not retry; surface the failure.
    CATEGORY_PERMANENT = 2;
    // CATEGORY_POLICY: rejected by policy (quota, budget, RBAC, scope).
    // Caller may not change anything; the operator must.
    CATEGORY_POLICY = 3;
  }

  enum ErrorCode {
    ERROR_CODE_UNSPECIFIED = 0;
    // The catalog below mirrors spec §15.1. New codes are added in the
    // phase that introduces them. Reserved ranges keep wire compatibility
    // when a code is renamed (the integer never changes).
    ERROR_CODE_SESSION_NOT_FOUND = 1;
    ERROR_CODE_INVALID_WORKSPACE_PLAN = 2;
    ERROR_CODE_WORKSPACE_PLAN_SCHEMA_UNSUPPORTED = 3;
    ERROR_CODE_RUNTIME_UNAVAILABLE = 4;
    ERROR_CODE_RUNTIME_OPTIONS_INVALID = 5;
    ERROR_CODE_CREDENTIAL_POOL_EXHAUSTED = 6;
    ERROR_CODE_TOKEN_BUDGET_EXHAUSTED = 7;
    ERROR_CODE_RATE_LIMITED = 8;
    ERROR_CODE_BUDGET_EXHAUSTED = 9;
    ERROR_CODE_DEADLINE_EXCEEDED = 10;
    ERROR_CODE_DUPLICATE_MESSAGE_ID = 11;
    ERROR_CODE_OUTPUTPART_TOO_LARGE = 12;
    ERROR_CODE_OUTPUTPART_INLINE_REF_CONFLICT = 13;
    ERROR_CODE_ENV_VAR_BLOCKLISTED = 14;
    ERROR_CODE_GIT_CLONE_REF_RESOLVE_TRANSIENT = 15;
    ERROR_CODE_GIT_CLONE_REF_UNRESOLVABLE = 16;
    ERROR_CODE_GIT_CLONE_AUTH_UNSUPPORTED_HOST = 17;
    ERROR_CODE_GIT_CLONE_AUTH_HOST_AMBIGUOUS = 18;
    ERROR_CODE_DELEGATION_BUDGET_UNAVAILABLE = 19;
    ERROR_CODE_DELEGATION_DENIED = 20;
    ERROR_CODE_MAX_DELEGATION_DEPTH_EXCEEDED = 21;
    ERROR_CODE_ISOLATION_MONOTONICITY_VIOLATED = 22;
    ERROR_CODE_CROSS_TENANT_MESSAGE_DENIED = 23;
    ERROR_CODE_ELICITATION_CONTENT_TAMPERED = 24;
    ERROR_CODE_EXTENSION_COOL_OFF_ACTIVE = 25;
    ERROR_CODE_PLATFORM_DEGRADED = 26;
    ERROR_CODE_PROTOCOL_VERSION_INCOMPATIBLE = 27;
    // Reserved range for Phase 2+ additions. Do not assign 1000–1999 to
    // anything that does not survive a wire-compat audit.
  }
}

// =====================================================================
// Common types
// =====================================================================

// SessionId identifies a session. Format: UUIDv8 (per spec §10.1 routing).
message SessionId {
  string value = 1;
}

// SlotId identifies a slot in a concurrent-workspace pod. Empty in
// session-mode pods.
message SlotId {
  string value = 1;
}

// WorkspacePlan is the proto-encoded form of the JSON Schema in
// workspaceplan-v1.json. The gateway translates between JSON and proto;
// the wire schema is authoritative.
//
// schema_version MUST be > 0 on every WorkspacePlan the gateway emits or
// accepts. Per §14.1 the only currently-valid value is 1; a 0 value
// (the proto3 default for an unset field) is rejected by the gateway
// validator at ingress with WORKSPACE_PLAN_INVALID. Consumers that
// receive a value > 1 they don't recognize follow the §15.4.1
// forward-read rule: keep the field, log a degraded-fidelity event,
// and proceed.
//
// setup_commands carry the §14 plan-declared setup commands. The
// gateway re-emits the same setup_commands on the dedicated RunSetup
// RPC (see RunSetupRequest below); the field's presence here is a
// transport convenience so a downstream that handles the WorkspacePlan
// (the §10.7 ref-resolver, audit log, partial-replay snapshot) sees the
// plan as a single document. The adapter MUST NOT execute setup
// commands from this field — it runs them only on the explicit
// RunSetup RPC, which §5.2 line 415 specifies fires once per pod at
// start (task-mode pods reuse the materialized workspace across tasks
// and skip the second RunSetup; the first-task gate is owned by the
// task-mode lifecycle, F-5.2.18). See also F-5.2.24.
message WorkspacePlan {
  int32 schema_version = 1;
  repeated WorkspaceSource sources = 2;
  repeated SetupCommand setup_commands = 3;
}

message WorkspaceSource {
  string type = 1;             // inlineFile|uploadFile|uploadArchive|mkdir|gitClone
  string path = 2;
  string content = 3;          // inlineFile only
  string upload_ref = 4;       // uploadFile, uploadArchive
  string format = 5;           // uploadArchive only
  int32 strip_components = 6;  // uploadArchive only
  string mode = 7;             // file/dir mode as octal string
  string url = 8;              // gitClone only
  string git_ref = 9;          // gitClone only
  int32 depth = 10;            // gitClone only
  bool submodules = 11;        // gitClone only
  GitAuth auth = 12;           // gitClone only
  string resolved_commit_sha = 13; // gateway-written, readonly
}

message GitAuth {
  string mode = 1;        // credential-lease
  string lease_scope = 2; // vcs.<provider>.(read|write)
}

message SetupCommand {
  string cmd = 1;
  int32 timeout_seconds = 2;
}

// =====================================================================
// RPC request/response messages
// =====================================================================

// ExperimentContext carries a session's §10.7 experiment enrollment so
// the runtime can tag traces with variant metadata. Absent when the
// session is not enrolled in any experiment.
message ExperimentContext {
  string experiment_id = 1;
  string variant_id = 2;
  // inherited is true when the context was propagated from a parent
  // session under the §8.3 inherit or control propagation mode.
  bool inherited = 3;
}

// PrepareWorkspaceRequest is one frame of the PrepareWorkspace upload
// stream. Frames sharing an upload_ref are concatenated in arrival
// order into a single staged file.
message PrepareWorkspaceRequest {
  SessionId session_id = 1;
  // upload_ref matches the WorkspaceSource.upload_ref of the uploadFile
  // or uploadArchive source this content backs. It MUST be a plain file
  // name with no path separators.
  string upload_ref = 2;
  bytes chunk = 3;
}

// PrepareWorkspaceResponse reports the total staged upload set.
message PrepareWorkspaceResponse {
  int64 staged_bytes = 1;
  int32 staged_files = 2;
}

// FinalizeWorkspaceRequest carries the §14 WorkspacePlan the adapter
// materializes into the workspace root.
message FinalizeWorkspaceRequest {
  SessionId session_id = 1;
  WorkspacePlan workspace_plan = 2;
}

// FinalizeWorkspaceResponse carries per-source advisory warnings the
// adapter raised during materialization. The adapter returns a gRPC
// error only on fatal materialization failures; non-fatal §14 plan
// warnings (entries the §7.4 line 459 strip-components rule skipped,
// etc.) ride here so the gateway can republish them on the session's
// SSE event stream and append them to the §11.7 audit trail.
message FinalizeWorkspaceResponse {
  // workspace_plan_warnings transcribes the §14 closed warning enum
  // for the adapter side of materialization. The §7.4 line 459
  // `workspace_plan_strip_components_skip` warning per skipped archive
  // entry is the only producer in v1; future codes ride the same
  // surface so the proto need not grow per warning kind. F-7.4.15.
  repeated WorkspacePlanWarning workspace_plan_warnings = 1;
}

// WorkspacePlanWarning is one §14 advisory the adapter raised against
// a workspace source during FinalizeWorkspace materialization. The
// (code, source_index, entry) tuple is the same shape the
// workspaceplan parser emits; an empty entry signals the warning
// applies to the source as a whole rather than to a specific archive
// entry. F-7.4.15.
message WorkspacePlanWarning {
  // code is the §14 WarningCode enum value, e.g.
  // `workspace_plan_strip_components_skip`.
  string code = 1;
  // source_index is the workspace plan's 0-based source index the
  // warning refers to.
  int32 source_index = 2;
  // entry is the archive entry path that triggered the warning. Empty
  // when the warning is not entry-scoped.
  string entry = 3;
  // message carries a human-readable explanation for the warning.
  string message = 4;
}

// RunSetupRequest carries the §14 WorkspacePlan setup commands the
// adapter runs against the materialized workspace. setup_policy bounds
// the aggregate setup phase per §5.1. The setup_commands here are the
// authoritative execution payload — see WorkspacePlan.setup_commands
// for why the same commands also ride on the plan document.
//
// Per §5.2 line 415 setup commands run once per pod at start, not per
// task. The gateway issues RunSetup once on first session/task assignment;
// on subsequent task-mode assignments the gateway skips the RunSetup RPC
// entirely so the adapter's pod-level setup-completion state is
// implicit (no second RunSetup means no second execution). The
// task-mode lifecycle owner of this gate is the first-task pod
// transition (F-5.2.18).
message RunSetupRequest {
  SessionId session_id = 1;
  repeated SetupCommand setup_commands = 2;
  SetupPolicy setup_policy = 3;
}

// RunSetupResponse is empty: RunSetup either completes the setup phase
// or returns a gRPC error.
message RunSetupResponse {}

message StartSessionRequest {
  // Field 3 (workspace_plan) and field 7 (setup_policy) were removed
  // when workspace materialization and setup-command execution moved to
  // the FinalizeWorkspace and RunSetup staging RPCs (§4.7).
  reserved 3, 7;
  reserved "workspace_plan", "setup_policy";
  SessionId session_id = 1;
  string runtime = 2;
  map<string, string> labels = 4;
  // experiment_context is the §8.3 / §10.7 experiment enrollment
  // delivered to the runtime in the adapter manifest. Absent for an
  // unenrolled session.
  ExperimentContext experiment_context = 5;
  // tracing_context is the §8.3 opaque tracing-identifier map the
  // runtime receives in the adapter manifest to stitch its native
  // traces into the parent's trace tree. Empty when none is set.
  map<string, string> tracing_context = 6;
  // task_id is the §4.7 current task identifier written into the adapter
  // manifest. Empty in session mode, where the adapter defaults the
  // manifest taskId to the session id (the session is its single task).
  string task_id = 8;
  // agent_interface is the runtime's §5.1 agentInterface descriptor,
  // JSON-encoded, written verbatim into the adapter manifest's
  // agentInterface field. Empty when the runtime declares none (the
  // manifest field is then null).
  bytes agent_interface = 9;
  // min_platform_version is the runtime's §5.1 minPlatformVersion (semver)
  // written into the adapter manifest. Empty when the runtime specifies no
  // minimum.
  string min_platform_version = 10;
}

// SetupPolicy is the §5.1 runtime setupPolicy: the aggregate cap on the
// setup phase and the disposition when it is exceeded.
message SetupPolicy {
  // timeout_seconds is the aggregate cap on the setup phase. Zero means
  // no aggregate cap.
  int32 timeout_seconds = 1;
  // on_timeout is the §5.1 disposition when the cap is hit: "fail"
  // aborts pod startup, "warn" proceeds to runtime start. An empty
  // value is the conservative "fail" default.
  string on_timeout = 2;
}

message StartSessionResponse {
  // Empty on success. Non-empty on graceful refusal (the pod is degraded
  // but reachable).
  string refusal_reason = 1;
}

message SendMessageRequest {
  SessionId session_id = 1;
  SlotId slot_id = 2;
  // Opaque JSON-encoded MessageEnvelope (lenny-adapter-jsonl.schema.json
  // `message`). The adapter writes it verbatim to the agent's stdin.
  bytes envelope_json = 3;
}

message SendMessageResponse {}

// AttachRequest is one frame the gateway streams to the adapter over
// Attach. session_id is set on every message so the adapter can reject a
// stream bound to a session the pod does not hold.
message AttachRequest {
  SessionId session_id = 1;
  SlotId slot_id = 2;
  // Opaque JSON-encoded client-to-agent frame (lenny-adapter-jsonl.schema.json
  // `message`, `tool_result`, `heartbeat`, ...). The adapter writes it
  // verbatim to the agent's stdin.
  bytes envelope_json = 3;
}

// AttachResponse is one frame the adapter streams back over Attach as
// the agent produces output.
message AttachResponse {
  // Opaque JSON-encoded agent-to-gateway frame (lenny-adapter-jsonl.schema.json
  // `response`, `tool_call`, `status`, `heartbeat_ack`, ...) read verbatim
  // from the agent's stdout.
  bytes envelope_json = 1;
}

message AssignCredentialsRequest {
  SessionId session_id = 1;
  map<string, CredentialLease> leases = 2; // keyed by provider
}

message AssignCredentialsResponse {}

message RotateCredentialsRequest {
  SessionId session_id = 1;
  map<string, CredentialLease> leases = 2;
  // rotation_trigger is the §4.9 rotationTrigger that drove this
  // rotation. It governs the §4.7 Full-level in-flight gate ceiling:
  // any value other than "proactive_renewal" caps the in-flight wait at
  // 300s and falls through to the standard rotation path on ceiling hit
  // (spec §4.7 line 822). The renewal trigger keeps the unbounded wait
  // because the old credential is still valid. Empty is treated as a
  // fault trigger (capped) for fail-closed safety.
  string rotation_trigger = 3;
}

message RotateCredentialsResponse {}

message RevokeCredentialsRequest {
  SessionId session_id = 1;
  repeated string providers = 2;
  string reason = 3;
}

message RevokeCredentialsResponse {}

message CredentialLease {
  string lease_id = 1;
  string provider = 2;
  int64 expires_at_unix_ms = 3;
  int64 renew_before_unix_ms = 4;
  // Provider-specific payload. The adapter writes it under /run/lenny/.
  bytes payload = 5;
}

message InterruptRequest {
  SessionId session_id = 1;
  Mode mode = 2;
  int32 deadline_ms = 3;
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_CLEAN = 1; // SIGTERM with grace
    MODE_HARD = 2;  // immediate SIGKILL
  }
}

message InterruptResponse {
  bool acknowledged = 1;
  Status status = 2;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACKNOWLEDGED = 1;     // runtime reached a safe stop point
    STATUS_INTERRUPT_TIMEOUT = 2; // deadline elapsed with no acknowledgement (§4.7)
    STATUS_BUSY = 3;             // operation lock rejected the interrupt (§4.7)
  }
}

message CheckpointRequest {
  SessionId session_id = 1;
  int32 deadline_ms = 2;
}

message CheckpointResponse {
  string checkpoint_id = 1;
  int64 size_bytes = 2;
}

message ResumeRequest {
  SessionId session_id = 1;
  string runtime = 2;        // runtime name, as in StartSessionRequest
  string checkpoint_id = 3;  // checkpoint to restore the workspace from
  // experiment_context and tracing_context are re-delivered to the
  // restored runtime in the adapter manifest — the session's §8.3
  // enrollment and tracing identifiers survive a resume onto a fresh
  // pod. Absent when unset.
  ExperimentContext experiment_context = 4;
  map<string, string> tracing_context = 5;
  // task_id, agent_interface, and min_platform_version are re-delivered to
  // the restored runtime in the adapter manifest, the same as
  // StartSessionRequest, so a resume onto a fresh pod reproduces the
  // §15.4 manifest field set.
  string task_id = 6;
  bytes agent_interface = 7;
  string min_platform_version = 8;
  // recovery_generation is the session's §4.2 / §7.3 pod-recovery
  // counter at the time the gateway issued this Resume. Re-delivered
  // to the adapter so per-pod traces, logs, and any partial-manifest
  // row the adapter writes can carry the (coordination, recovery)
  // tuple that authored the replay. Zero when the gateway has not
  // recorded a generation for the session.
  int64 recovery_generation = 9;
  // expected_workspace_bytes is the session's
  // `last_checkpoint_workspace_bytes` recorded on the gateway side —
  // the uncompressed total the adapter is expected to extract for
  // this Resume. The adapter compares it against
  // `workspace_size_limit_bytes` (the §4.4 hard workspace size limit)
  // before quiescing the runtime to refuse a restore whose archive
  // would blow past the pod's emptyDir budget. Zero when the gateway
  // has no recorded size; the adapter then falls back to the kubelet
  // emptyDir guard.
  int64 expected_workspace_bytes = 10;
  // workspace_size_limit_bytes is the §4.4 / §10.1 per-pod hard
  // workspace size cap the SandboxTemplate or runtime resolves to.
  // The adapter uses it together with expected_workspace_bytes for
  // the symmetric pre-extraction size check. Zero disables the
  // gateway-supplied limit (the kubelet emptyDir guard is the
  // backstop).
  int64 workspace_size_limit_bytes = 11;
  // expected_workspace_root is the absolute `cwd` path the original
  // session ran against — §7.3 step (d) "Recreate same absolute `cwd`
  // path." The gateway passes it so the adapter can assert the
  // replacement pod was provisioned with an identical workspace mount
  // before extracting any checkpoint bytes. A mismatch (typically caused
  // by a SandboxTemplate or runtime workspaceRoot change between the
  // original and replacement pods) aborts the Resume with
  // FailedPrecondition so the gateway can surface the cause to the
  // client rather than silently restoring into the wrong absolute path.
  // Empty disables the assertion (the gateway has no recorded value for
  // legacy sessions); the assertion is purely a runtime template-drift
  // guard.
  string expected_workspace_root = 12;
}

message ResumeResponse {
  int64 restored_bytes = 1;  // uncompressed workspace bytes restored
  // mode reports how the adapter restored the workspace per §4.4 /
  // §7.2 ResumeMode: "full" when the named checkpoint was extracted
  // intact, "partial_workspace" when only a partial manifest was
  // available, "conversation_only" when no workspace was restored,
  // or "coordinator_handoff" for the §10.4 reattach path. Empty when
  // the adapter cannot classify the resume; the gateway falls back to
  // its own classification.
  string mode = 2;
  // recovery_generation echoes the value the gateway supplied on
  // ResumeRequest.recovery_generation so the gateway can verify the
  // adapter consumed the right generation under split-brain.
  int64 recovery_generation = 3;
}

// ExportSpec is one §8.7 file-export entry: a source glob resolved
// inside the parent's /workspace/current and an optional dest_prefix
// the matched files are re-rooted under in the child's workspace.
message ExportSpec {
  // source is the glob resolved relative to /workspace/current. Its
  // base path (the longest non-wildcard prefix) is stripped from each
  // matched file's path during rebasing (§8.7).
  string source = 1;
  // dest_prefix is the relative directory the rebased files are placed
  // under in the child workspace. Empty places them at the root. It
  // must be a relative path with no "..": the gateway rejects an
  // absolute or escaping prefix before the call (§8.7 validation).
  string dest_prefix = 2;
}

message ExportPathsRequest {
  SessionId session_id = 1;
  // exports are applied in order; later entries overwrite earlier ones
  // on path collision (§8.7 "Multiple exports").
  repeated ExportSpec exports = 2;
}

// ExportedFile is one rebased file the adapter packaged for delegation.
message ExportedFile {
  // path is the child-workspace-relative destination after rebasing,
  // always forward-slash separated and root-relative (no leading "./").
  string path = 1;
  // content is the file's bytes. The gateway re-derives sha256 when an
  // interceptor MODIFIES the bytes at PreExportMaterialization (§8.7).
  bytes content = 2;
  // sha256 is the lowercase hex digest of content, for the gateway's
  // export-size and dedup accounting.
  string sha256 = 3;
  // size_bytes is len(content), surfaced so the gateway can sum the
  // export against fileExportLimits without re-reading content.
  int64 size_bytes = 4;
}

message ExportPathsResponse {
  // files are the rebased export set, deduplicated by path with
  // last-write-wins across overlapping exports (§8.7).
  repeated ExportedFile files = 1;
  // total_bytes is the sum of size_bytes across files, for the
  // gateway's fileExportLimits.maxBytes check.
  int64 total_bytes = 2;
}

message ReportUsageRequest {
  SessionId session_id = 1;
}

message ReportUsageResponse {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 wall_clock_ms = 3;
}

message ExtendLeaseRequest {
  SessionId session_id = 1;
  int64 requested_tokens = 2;
  int32 requested_seconds = 3;
}

message ExtendLeaseResponse {
  Status status = 1;
  int64 granted_tokens = 2;
  int32 granted_seconds = 3;
  // When status is REJECTED, the gateway includes the cool-off expiry.
  int64 cool_off_expiry_unix_ms = 4;
  // subtree_id is the §8.6 denied subtree (the session whose adapter
  // issued the ExtendLease request that triggered the user rejection
  // or, on an in-flight denial, that observed the denial inside the
  // grant-commit transaction). Set only when status is REJECTED.
  // spec: §15.1 line 1080
  string subtree_id = 5;
  // cool_off_expires_at is the §15.1 line 1080 UTC RFC 3339 timestamp
  // marking when the rejection cool-off window ends. Mirrors
  // cool_off_expiry_unix_ms with the spec-named ISO 8601 string. Set
  // only when status is REJECTED.
  // spec: §15.1 line 1080
  string cool_off_expires_at = 6;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_GRANTED = 1;
    STATUS_PARTIALLY_GRANTED = 2;
    STATUS_CEILING_REACHED = 3;
    STATUS_REJECTED = 4;
  }
}

message ShutdownRequest {
  SessionId session_id = 1;
  string reason = 2;
  int32 deadline_ms = 3;
}

message ShutdownResponse {
  bool exited_cleanly = 1;
  int32 exit_code = 2;
}

// ConfigureWorkspaceRequest carries the finalized working directory to a
// pre-connected SDK-warm session (§4.7). It replaces StartSession on the
// SDK-warm fast path.
message ConfigureWorkspaceRequest {
  SessionId session_id = 1;
  // cwd is the finalized working directory the pre-connected SDK session
  // is pointed at — /workspace/current in production. Idempotent: sending
  // the same cwd twice is safe.
  string cwd = 2;
  // experiment_context and tracing_context are written into the adapter
  // manifest the runtime re-reads when the workspace is configured, the
  // same as StartSession.
  ExperimentContext experiment_context = 3;
  map<string, string> tracing_context = 4;
}

// ConfigureWorkspaceResponse is empty on success. A non-empty
// refusal_reason is a graceful refusal: the pre-connected SDK could not be
// pointed at the workspace, so the gateway calls DemoteSDK and falls back
// to pod-warm materialization (§4.7).
message ConfigureWorkspaceResponse {
  string refusal_reason = 1;
}

message DemoteSDKRequest {
  // Why the gateway is demoting the pod. Typically the WorkspacePlan
  // included a path matching the runtime's sdkWarmBlockingPaths.
  string reason = 1;
}

message DemoteSDKResponse {
  // True once the SDK process has exited and the pod is back to
  // pod-warm state, ready for fresh workspace materialization.
  bool demoted = 1;
}

message NegotiateVersionRequest {
  // Versions the gateway is willing to speak, highest preference first.
  // Format: semver (e.g., "1.0.0", "1.1.0"). The adapter picks the
  // highest version it also supports.
  repeated string accepted_protocol_versions = 1;
  // Capabilities the gateway expects the adapter to declare. Empty
  // means the gateway will work with whatever the adapter advertises.
  repeated string requested_capabilities = 2;
}

message NegotiateVersionResponse {
  // The protocol version both sides agreed on.
  string selected_protocol_version = 1;
  // Adapter capabilities. The platform-known set includes (but is not
  // limited to): preConnect, multiTurn, fullLifecycle, taskMode,
  // concurrentWorkspace, immediateInjection, queuedInjection.
  repeated string capabilities = 2;
  // The adapter's own version string, surfaced for observability.
  string adapter_version = 3;
  // True when the adapter could not satisfy the gateway's accepted
  // versions. The connection should be torn down and the pod evicted.
  bool incompatible = 4;
  // workspace_root is the §7.3 line 408 / §6.1 absolute cwd path the
  // adapter mounts the session workspace into — the value of
  // `--workspace-root` on `lenny-adapter`. The gateway captures it on
  // the first Bind and persists it on the session row so a subsequent
  // Resume can pass it back as `expected_workspace_root` and the
  // replacement pod's adapter can assert "same absolute cwd path".
  // F-7.3.15.
  string workspace_root = 5;
}

// Opaque lifecycle event envelope. The lifecycle event taxonomy is defined
// in lenny-adapter-jsonl.schema.json under the lifecycle section in the
// spec. Kept opaque here so the proto schema does not need to evolve every
// time a lifecycle event is added. Request and response carry the same
// payload but are typed separately per proto-RPC convention.
message LifecycleChannelRequest {
  bytes envelope_json = 1;
}

message LifecycleChannelResponse {
  bytes envelope_json = 1;
}
