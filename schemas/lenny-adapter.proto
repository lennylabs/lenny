// Gateway ↔ pod control protocol. This is the gRPC contract the gateway uses
// to drive a pod's adapter sidecar: deliver messages, push credentials,
// interrupt, request checkpoints, and report usage. The adapter ↔ agent
// channel is JSON Lines (see lenny-adapter-jsonl.schema.json); this proto
// covers only the gateway-facing surface.
//
// See spec/15_external-api-surface.md §15.3 and §15.4.
//
// Phase 1 ships the service skeleton and the canonical message types.
// Field shapes for individual RPCs are deliberately conservative: Phase 2
// implementation fleshes them out and `buf breaking` catches incompatible
// changes against this baseline.

syntax = "proto3";

package lenny.adapter.v1;

option go_package = "github.com/lennylabs/lenny/pkg/proto/adapter/v1;adapterv1";

// =====================================================================
// Service
// =====================================================================

// Adapter is the long-running gRPC server hosted by the adapter sidecar
// inside every Lenny pod. The gateway connects over mTLS and uses it for
// session lifecycle, credential delivery, interrupt control, checkpoint
// orchestration, and usage reporting. Pod → gateway traffic is initiated
// by the gateway only; the adapter responds to RPCs and emits structured
// events via a separate streaming RPC (the lifecycle channel).
service Adapter {
  // PrepareWorkspace accepts streamed upload-file content into the pod's
  // staging area. It is the first RPC in the §4.7 session assignment
  // sequence (PrepareWorkspace, FinalizeWorkspace, RunSetup,
  // StartSession). Frames sharing an upload_ref are concatenated in
  // arrival order into one staged file; FinalizeWorkspace then
  // materializes the uploadFile and uploadArchive plan sources from the
  // staged content.
  rpc PrepareWorkspace(stream PrepareWorkspaceRequest) returns (PrepareWorkspaceResponse) {}

  // FinalizeWorkspace validates the staged workspace content and
  // materializes the §14 WorkspacePlan into /workspace/current. It is
  // the second RPC in the §4.7 session assignment sequence
  // (PrepareWorkspace, FinalizeWorkspace, RunSetup, StartSession).
  rpc FinalizeWorkspace(FinalizeWorkspaceRequest) returns (FinalizeWorkspaceResponse) {}

  // RunSetup executes the §14 WorkspacePlan setup commands against the
  // materialized workspace. It is the third RPC in the §4.7 session
  // assignment sequence (PrepareWorkspace, FinalizeWorkspace, RunSetup,
  // StartSession). The §5.1 setupPolicy in the request bounds the
  // aggregate setup phase.
  rpc RunSetup(RunSetupRequest) returns (RunSetupResponse) {}

  // StartSession starts the agent runtime on this pod. It is the final
  // RPC of the §4.7 session assignment sequence (PrepareWorkspace,
  // FinalizeWorkspace, RunSetup, StartSession): the workspace is already
  // materialized by FinalizeWorkspace and setup is already run by
  // RunSetup. Returns Unavailable if the pod is not in `idle` state.
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse) {}

  // ConfigureWorkspace points a pre-connected SDK-warm session at the
  // finalized working directory (§4.7 SDK-warm mode). It is the SDK-warm
  // counterpart of StartSession: the runtime has already connected its SDK
  // at warm time, so instead of starting it fresh the adapter delivers the
  // final cwd. Timeout: 10s. Idempotent — sending the same cwd twice is
  // safe. On failure the gateway calls DemoteSDK and falls back to pod-warm
  // materialization. Applies only to runtimes that declare
  // capabilities.preConnect: true; pod-warm adapters return Unimplemented.
  rpc ConfigureWorkspace(ConfigureWorkspaceRequest) returns (ConfigureWorkspaceResponse) {}

  // SendMessage delivers a content message to the agent over the adapter's
  // stdin JSONL channel. See lenny-adapter-jsonl.schema.json `message`.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {}

  // Attach opens the bidirectional content stream between the gateway and a
  // running session (spec §4.7 RPC table: "Connect client stream to running
  // session"). The gateway streams client-to-agent envelopes in; the adapter
  // streams the agent's response, tool-call, and status envelopes back.
  // Envelope payloads are §15.4.1 JSONL frames carried verbatim as JSON
  // bytes, mirroring SendMessage.envelope_json.
  rpc Attach(stream AttachRequest) returns (stream AttachResponse) {}

  // AssignCredentials pushes a per-session credential lease map to the
  // adapter. Adapter writes the credential file under /run/lenny/. Atomic
  // across providers; partial failures are rolled back.
  rpc AssignCredentials(AssignCredentialsRequest) returns (AssignCredentialsResponse) {}

  // RotateCredentials replaces a previously assigned credential lease with
  // a new lease. Emits a `credentials_rotated` lifecycle event to the
  // agent. Used for hot rotation without pod restart.
  rpc RotateCredentials(RotateCredentialsRequest) returns (RotateCredentialsResponse) {}

  // RevokeCredentials removes a credential lease immediately. The agent
  // receives no chance to drain in-flight requests; emergency revocation.
  rpc RevokeCredentials(RevokeCredentialsRequest) returns (RevokeCredentialsResponse) {}

  // Interrupt asks the agent to pause and (optionally) checkpoint. Two
  // modes: clean (graceful, with deadline) and hard (SIGTERM/SIGKILL).
  rpc Interrupt(InterruptRequest) returns (InterruptResponse) {}

  // Checkpoint requests an immediate checkpoint of the current session
  // state to the artifact store. Used for eviction, drain, and session
  // suspend.
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse) {}

  // SignalDeadline warns the running session's runtime that the session is
  // approaching its §11.3 line 240 deadline so the agent can checkpoint and
  // the client can wrap up. The gateway watchdog fires it once, five minutes
  // before `maxSessionAge` expires. The adapter forwards it as a
  // DEADLINE_APPROACHING frame over the §15.4.6 lifecycle channel; a
  // Basic/Standard runtime with no lifecycle channel cannot receive advance
  // notice (§15 line 2141) and the call returns delivered=false rather than
  // erroring so the watchdog's best-effort warning never fails. One-way: the
  // adapter does not block on a runtime acknowledgement.
  rpc SignalDeadline(SignalDeadlineRequest) returns (SignalDeadlineResponse) {}

  // Resume restores a session's workspace from a checkpoint on a
  // replacement pod (§4.7, §7.1). The adapter claims the session,
  // rebuilds /workspace/current from the named checkpoint, and starts
  // the runtime — the replacement-pod counterpart of StartSession.
  rpc Resume(ResumeRequest) returns (ResumeResponse) {}

  // CoordinatorFence announces a new `coordination_generation` to the pod
  // on coordinator handoff (§4.7 line 632, §10.1). The pod records the new
  // generation and from this point rejects any RPC carrying an older one.
  // Deadline: 5 s (hard-coded, §11.3). Includes gap detection: if the
  // received generation skips one or more values relative to the last
  // acknowledged fence, the adapter cancels and discards every in-flight
  // RPC received under the missing generation(s), resets transient
  // tool-call state, and logs a `coordinator_generation_gap` event before
  // acknowledging the new generation. The first call on a pod's lifetime
  // is never treated as a gap regardless of value.
  rpc CoordinatorFence(CoordinatorFenceRequest) returns (CoordinatorFenceResponse) {}

  // CheckpointBarrier dispatches a barrier signal during gateway graceful
  // drain (§4.7 line 631, §10.1). The adapter validates the request's
  // `coordination_generation` against the last fenced generation, quiesces
  // tool-call dispatch, flushes a best-effort checkpoint, and acknowledges
  // via `CheckpointBarrierAck` on the LifecycleChannel control stream
  // (§4.7 line 660 — fields: `barrier_id`, `last_tool_call_id`,
  // `checkpoint_ref`). The RPC return value mirrors the ack so a
  // synchronous caller has the same information; the control-stream emit
  // is the canonical surface for the gateway's barrier-target reconciler.
  // The single wall-clock deadline `checkpointBarrierAckTimeoutSeconds`
  // is enforced by the gateway across all coordinated pods.
  rpc CheckpointBarrier(CheckpointBarrierRequest) returns (CheckpointBarrierResponse) {}

  // ExportPaths packages files from /workspace/current for delegation,
  // rebased per the export spec (§8.7). The adapter resolves each export
  // source glob inside the workspace root, rejects any matched file whose
  // realpath escapes the workspace via symlink, strips the glob's base
  // path, and re-roots each file under the export's dest_prefix. The
  // gateway applies the lease's fileExportLimits and optional content
  // scanning to the returned set. Spec: §4.7 line 633, §8.7.
  rpc ExportPaths(ExportPathsRequest) returns (ExportPathsResponse) {}

  // ReportUsage returns token-usage and time-usage accounting since the
  // last call. The gateway uses this for budget enforcement and billing.
  rpc ReportUsage(ReportUsageRequest) returns (ReportUsageResponse) {}

  // Shutdown asks the adapter to terminate the agent and release the pod.
  // The adapter forwards a JSONL `shutdown` to the agent with the supplied
  // deadline. Returns when the agent process has exited.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse) {}

  // DemoteSDK is required for runtimes that declare
  // `capabilities.preConnect: true`. The gateway calls DemoteSDK when an
  // SDK-warm pod's incoming WorkspacePlan matches a `sdkWarmBlockingPaths`
  // pattern, instructing the adapter to tear down the pre-connected SDK
  // and demote the pod to pod-warm before workspace materialization
  // proceeds. Pods without preConnect: true return Unimplemented.
  // Spec: §4.7, §6.1, §15.4.
  rpc DemoteSDK(DemoteSDKRequest) returns (DemoteSDKResponse) {}

  // NegotiateVersion is called once per gateway↔adapter handshake.
  // The adapter advertises the protocol versions and capabilities it
  // supports; the gateway selects a compatible version. Subsequent
  // RPCs assume the negotiated version. See spec §15.5 (versioning).
  rpc NegotiateVersion(NegotiateVersionRequest) returns (NegotiateVersionResponse) {}

  // GetObservedIntegrationLevel reports the §5.1 / §15.4.3 integration
  // level the adapter observed the runtime actually implement, derived
  // from whether the runtime completed the §4.7
  // lifecycle_capabilities/lifecycle_support exchange (full) and whether
  // it connected to the intra-pod platform MCP server (standard). The
  // gateway calls it once per runtime on the first session assignment to
  // compare the observed level against the runtime's declared
  // integrationLevel and reject an underperforming runtime
  // (RUNTIME_LEVEL_UNDERPERFORMS). See spec §5.1.
  rpc GetObservedIntegrationLevel(GetObservedIntegrationLevelRequest) returns (GetObservedIntegrationLevelResponse) {}

  // LifecycleChannel is a bidirectional stream the adapter uses to surface
  // Full-level lifecycle events (checkpoint_ready, interrupt_acknowledged,
  // credentials_acknowledged, deadline_approaching). See spec §15.4 for
  // the event taxonomy.
  rpc LifecycleChannel(stream LifecycleChannelRequest) returns (stream LifecycleChannelResponse) {}
}

// GatewayControl is the adapter→gateway control surface. It is the
// inverse direction of the Adapter service: the gateway hosts this
// gRPC server and the adapter dials it as a client. Adapter traffic
// on this service is initiated by the adapter, in contrast to the
// Adapter service where the gateway initiates every RPC.
//
// The service exists because a few §8 control operations originate at
// the pod and need a gateway decision. ExtendLease is the first such
// operation: the adapter cannot resolve a token-budget extension
// itself because the layered §8.6 ceiling and the per-tree budget
// state live on the gateway.
service GatewayControl {
  // ExtendLease is the adapter's request to the gateway for additional
  // token budget. Per spec §8.6 the adapter issues it when the LLM
  // proxy rejects a call for budget exhaustion. Response carries one
  // of GRANTED, PARTIALLY_GRANTED, CEILING_REACHED, REJECTED. On
  // CEILING_REACHED or REJECTED the adapter MUST NOT retry the
  // extension; it propagates BUDGET_EXHAUSTED to the runtime.
  rpc ExtendLease(ExtendLeaseRequest) returns (ExtendLeaseResponse) {}

  // ListPlatformTools returns the §9.1 platform tool catalog (lines
  // 14-31: lenny/delegate_task, lenny/await_children, ...) the adapter's
  // intra-pod platform MCP server advertises to a type:agent runtime on
  // tools/list. The catalog is sourced from the gateway's platform tool
  // surface so the intra-pod server never duplicates the tool schemas.
  // spec: §9.1 lines 14-31.
  rpc ListPlatformTools(ListPlatformToolsRequest) returns (ListPlatformToolsResponse) {}

  // CallPlatformTool dispatches one §9.1 platform tool call a type:agent
  // runtime made against the adapter's intra-pod platform MCP server
  // (the @lenny-platform-mcp socket) to the gateway's platform tool
  // surface, scoped to the calling session. The gateway runs the same
  // handler the gateway-edge /mcp surface runs, so the intra-pod and
  // edge surfaces stay in lockstep. The response carries the JSON-encoded
  // MCP tool result; a tool-level failure is an is_error result rather
  // than a gRPC error. spec: §9.1 line 14; §4.7 line 942.
  rpc CallPlatformTool(CallPlatformToolRequest) returns (CallPlatformToolResponse) {}

  // ListSessionConnectors returns the §9.3 connectors a session's
  // effective delegation policy permits. The adapter opens one intra-pod
  // MCP server (the @lenny-connector-<id> socket) per returned connector
  // and lists them in the manifest connectorServers array, so a
  // type:agent runtime can reach every external tool its policy admits.
  // The gateway filters the tenant's connector registry by the calling
  // session's delegation policy, so a connector the policy denies is
  // never advertised to the pod. spec: §9.3 line 142.
  rpc ListSessionConnectors(ListSessionConnectorsRequest) returns (ListSessionConnectorsResponse) {}

  // ListConnectorTools returns the tool catalog a single §9.3 connector
  // exposes, for the adapter's intra-pod per-connector MCP server to
  // advertise on tools/list. The gateway acts as the MCP client to the
  // external endpoint (the connector's mcpServerUrl), using the
  // gateway-held OAuth credential — the credential never transits the
  // pod. A connector the calling session's policy denies is rejected.
  // spec: §9.3 lines 142-164.
  rpc ListConnectorTools(ListConnectorToolsRequest) returns (ListConnectorToolsResponse) {}

  // CallConnectorTool forwards one §9.3 external tool call a type:agent
  // runtime made against the adapter's intra-pod @lenny-connector-<id>
  // socket to the gateway, which validates the connector_id against the
  // calling pod's effective delegation policy (line 164) and proxies the
  // tools/call to the external MCP endpoint with the gateway-held
  // credential. The response carries the JSON-encoded MCP tool result; a
  // tool-level failure is an is_error result rather than a gRPC error.
  // spec: §9.3 lines 142-164.
  rpc CallConnectorTool(CallConnectorToolRequest) returns (CallConnectorToolResponse) {}

  // ReportSessionScrub reports the outcome of the per-slot cleanup the
  // adapter runs on every session release (§5.2), across the
  // `maxConcurrentSessions > 1` and recycling cases alike. The outcome is
  // RELEASED when the slot's runtime, credential timers, and per-slot
  // directory tree were torn down cleanly, or LEAKED when a resource could
  // not be reclaimed. The gateway resolves the pod from pod_id, increments
  // sessionsServed on its agent_pod_state row, and feeds a LEAKED outcome
  // into the unhealthy-threshold ledger behind the lenny.dev/drain-request
  // annotation (§4.6.3). The adapter initiates this RPC; a transport
  // failure is a gRPC status error.
  // spec: §4.7 (Adapter → Gateway RPCs); §5.2 scrub model.
  rpc ReportSessionScrub(ReportSessionScrubRequest) returns (ReportSessionScrubResponse) {}

  // ReportPodScrub reports the binary outcome of the whole-pod scrub the
  // adapter runs when occupancy reaches zero on a recycling pod and the
  // gateway has patched the pod's SandboxClaim to recycling (§5.2). The
  // outcome is SUCCEEDED when the §5.2 scrub sequence completed, or
  // FAILED otherwise. The gateway resolves the pod from pod_id; on FAILED
  // it increments scrubFailureCount on the agent_pod_state row and
  // computes the recycle disposition against sessionPolicy (§4.6.3), and
  // on SUCCEEDED it records the rewarmStartedAt stamp and coordinates the
  // SDK re-warm on a preConnect pool, or patches the claim directly to
  // reserved otherwise. A missing report is bounded by a gateway-side
  // timeout (cleanupTimeoutSeconds plus a grace period). The adapter
  // initiates this RPC; a transport failure is a gRPC status error.
  // spec: §4.7 (Adapter → Gateway RPCs); §5.2 scrub model; §3.4 recycle disposition.
  rpc ReportPodScrub(ReportPodScrubRequest) returns (ReportPodScrubResponse) {}
}

// ListPlatformToolsRequest asks the gateway for the §9.1 platform tool
// catalog visible to session_id. The session scopes the catalog to the
// runtimes and capabilities the session's effective delegation policy
// admits.
message ListPlatformToolsRequest {
  SessionId session_id = 1;
}

// PlatformTool is one entry in the §9.1 platform tool catalog: the tool
// name (e.g. `lenny/delegate_task`), its human description, and the
// JSON-Schema for its arguments. The adapter relays each entry verbatim
// on the intra-pod tools/list response.
message PlatformTool {
  string name = 1;
  string description = 2;
  // input_schema is the tool's JSON-Schema, encoded as JSON bytes.
  bytes input_schema = 3;
}

// ListPlatformToolsResponse carries the platform tool catalog.
message ListPlatformToolsResponse {
  repeated PlatformTool tools = 1;
}

// CallPlatformToolRequest dispatches one §9.1 platform tool call to the
// gateway on behalf of session_id. arguments is the raw JSON `arguments`
// object from the runtime's MCP tools/call request.
message CallPlatformToolRequest {
  SessionId session_id = 1;
  string tool_name = 2;
  bytes arguments = 3;
}

// CallPlatformToolResponse carries the §15.2 MCP tool result. result is
// the JSON-encoded MCP result object (a `content` array, optionally with
// `isError`). is_error mirrors the result's isError flag so the adapter
// does not have to parse the body to know the call failed. A transport
// or authorization failure (unknown session, unregistered tool) is a
// gRPC status error instead.
message CallPlatformToolResponse {
  bytes result = 1;
  bool is_error = 2;
}

// ListSessionConnectorsRequest asks the gateway which §9.3 connectors
// session_id's effective delegation policy permits.
message ListSessionConnectorsRequest {
  SessionId session_id = 1;
}

// SessionConnector is one §9.3 connector the calling session may use:
// its registry id (e.g. `github`) and human-facing display name. The
// adapter derives the intra-pod socket name from the id.
message SessionConnector {
  string id = 1;
  string display_name = 2;
}

// ListSessionConnectorsResponse carries the policy-filtered connector
// list the adapter renders into the manifest connectorServers array.
message ListSessionConnectorsResponse {
  repeated SessionConnector connectors = 1;
}

// ListConnectorToolsRequest asks the gateway for the tool catalog one
// §9.3 connector exposes, scoped to the calling session.
message ListConnectorToolsRequest {
  SessionId session_id = 1;
  string connector_id = 2;
}

// ListConnectorToolsResponse carries the connector's tool catalog,
// reusing PlatformTool (name, description, JSON-Schema) since the
// intra-pod tools/list wire entry is identical for platform and
// connector tools.
message ListConnectorToolsResponse {
  repeated PlatformTool tools = 1;
}

// CallConnectorToolRequest forwards one §9.3 external tool call to the
// gateway on behalf of session_id. arguments is the raw JSON `arguments`
// object from the runtime's MCP tools/call request.
message CallConnectorToolRequest {
  SessionId session_id = 1;
  string connector_id = 2;
  string tool_name = 3;
  bytes arguments = 4;
}

// CallConnectorToolResponse carries the §15.2 MCP tool result of the
// external tool call. result is the JSON-encoded MCP result object; the
// adapter relays it verbatim to the runtime. is_error mirrors the
// result's isError flag. A policy or transport failure (denied
// connector, unknown session, dial failure) is a gRPC status instead.
message CallConnectorToolResponse {
  bytes result = 1;
  bool is_error = 2;
}

// SessionScrubOutcome is the result of the §5.2 per-slot cleanup the
// adapter runs on every session release.
enum SessionScrubOutcome {
  SESSION_SCRUB_OUTCOME_UNSPECIFIED = 0;
  // SESSION_SCRUB_OUTCOME_RELEASED — the slot's runtime, credential
  // timers, and per-slot directory tree were torn down cleanly and the
  // slot was released. spec: §5.2 (slot_cleanup → released).
  SESSION_SCRUB_OUTCOME_RELEASED = 1;
  // SESSION_SCRUB_OUTCOME_LEAKED — a resource could not be reclaimed at
  // the session release. The gateway feeds the outcome into the
  // unhealthy-threshold ledger behind the lenny.dev/drain-request
  // annotation. spec: §5.2 (leaked slot semantics); §4.6.3.
  SESSION_SCRUB_OUTCOME_LEAKED = 2;
}

// ReportSessionScrubRequest carries the §5.2 per-slot cleanup outcome the
// adapter reports on every session release. pod_id is the agent_pod_state
// row key the gateway increments sessionsServed on; session_id names the
// released session; slot_id is set only when the pod runs concurrent
// sessions (`maxConcurrentSessions > 1`) and identifies the released slot.
// spec: §4.7; §5.2.
message ReportSessionScrubRequest {
  string pod_id = 1;
  SessionId session_id = 2;
  SlotId slot_id = 3;
  SessionScrubOutcome outcome = 4;
}

// ReportSessionScrubResponse acknowledges the §5.2 per-slot cleanup
// report. It carries no body; the gateway's bookkeeping side effects
// (sessionsServed increment, drain-request ledger) are gateway-side. A
// gateway-side failure is a gRPC status error rather than a populated
// response.
message ReportSessionScrubResponse {}

// PodScrubOutcome is the binary result of the §5.2 whole-pod scrub the
// adapter runs at the occupancy-zero recycle boundary.
enum PodScrubOutcome {
  POD_SCRUB_OUTCOME_UNSPECIFIED = 0;
  // POD_SCRUB_OUTCOME_SUCCEEDED — the §5.2 whole-pod scrub sequence
  // completed. The gateway records rewarmStartedAt and coordinates the
  // SDK re-warm on a preConnect pool, or patches the claim directly to
  // reserved otherwise. spec: §3.4 recycle disposition.
  POD_SCRUB_OUTCOME_SUCCEEDED = 1;
  // POD_SCRUB_OUTCOME_FAILED — the §5.2 whole-pod scrub did not complete.
  // The gateway increments scrubFailureCount and computes the disposition
  // against sessionPolicy (retire under onScrubFailure: fail or
  // maxScrubFailures). spec: §3.4 recycle disposition; §4.6.3.
  POD_SCRUB_OUTCOME_FAILED = 2;
}

// ReportPodScrubRequest carries the §5.2 whole-pod scrub outcome the
// adapter reports when occupancy reaches zero on a recycling pod and the
// gateway has patched the pod's SandboxClaim to recycling. pod_id is the
// agent_pod_state row key the gateway resolves the claim and disposition
// from; there is no session_id because occupancy is zero at the recycle
// boundary. detail carries an optional adapter-side failure description
// for the audit trail on a FAILED outcome. spec: §4.7; §5.2; §3.4.
message ReportPodScrubRequest {
  string pod_id = 1;
  PodScrubOutcome outcome = 2;
  string detail = 3;
}

// ReportPodScrubResponse acknowledges the §5.2 whole-pod scrub report. It
// carries no body; the gateway's disposition computation and claim patch
// are gateway-side. A gateway-side failure is a gRPC status error.
message ReportPodScrubResponse {}

// =====================================================================
// gRPC Health Checking Protocol binding
// =====================================================================
//
// The adapter also serves the standard `grpc.health.v1.Health` service
// (defined in https://github.com/grpc/grpc-proto). It is not redeclared
// here to avoid wire-incompatible duplication; Phase 2's implementation
// registers `google.golang.org/grpc/health` with the same gRPC server
// alongside Adapter. The gateway probes liveness via the standard
// `Health.Check` and `Health.Watch` RPCs.

// =====================================================================
// Error envelope
// =====================================================================
//
// Every RPC failure carries a structured error envelope alongside the
// gRPC status code. The Category dimension classifies whether a caller
// should retry (Transient), surface the failure (Permanent), or treat
// it as a policy decision the operator must change (Policy). The Code
// field is the spec-mandated error code from spec §15.1's catalog.

message Error {
  ErrorCode code = 1;
  Category category = 2;
  string message = 3;
  // retryable mirrors the REST/MCP `retryable` flag in spec §15.1. True
  // implies Category = CATEGORY_TRANSIENT; false implies Permanent or
  // Policy.
  bool retryable = 4;
  // docs_url points at the operator runbook or spec section for this
  // error code. Same shape as the REST error envelope.
  string docs_url = 5;

  enum Category {
    CATEGORY_UNSPECIFIED = 0;
    // CATEGORY_TRANSIENT: retry with backoff may succeed.
    CATEGORY_TRANSIENT = 1;
    // CATEGORY_PERMANENT: caller should not retry; surface the failure.
    CATEGORY_PERMANENT = 2;
    // CATEGORY_POLICY: rejected by policy (quota, budget, RBAC, scope).
    // Caller may not change anything; the operator must.
    CATEGORY_POLICY = 3;
  }

  enum ErrorCode {
    ERROR_CODE_UNSPECIFIED = 0;
    // The catalog below mirrors spec §15.1. New codes are added in the
    // phase that introduces them. Reserved ranges keep wire compatibility
    // when a code is renamed (the integer never changes).
    ERROR_CODE_SESSION_NOT_FOUND = 1;
    ERROR_CODE_INVALID_WORKSPACE_PLAN = 2;
    ERROR_CODE_WORKSPACE_PLAN_SCHEMA_UNSUPPORTED = 3;
    ERROR_CODE_RUNTIME_UNAVAILABLE = 4;
    ERROR_CODE_RUNTIME_OPTIONS_INVALID = 5;
    ERROR_CODE_CREDENTIAL_POOL_EXHAUSTED = 6;
    ERROR_CODE_TOKEN_BUDGET_EXHAUSTED = 7;
    ERROR_CODE_RATE_LIMITED = 8;
    ERROR_CODE_BUDGET_EXHAUSTED = 9;
    ERROR_CODE_DEADLINE_EXCEEDED = 10;
    ERROR_CODE_DUPLICATE_MESSAGE_ID = 11;
    ERROR_CODE_OUTPUTPART_TOO_LARGE = 12;
    ERROR_CODE_OUTPUTPART_INLINE_REF_CONFLICT = 13;
    ERROR_CODE_ENV_VAR_BLOCKLISTED = 14;
    ERROR_CODE_GIT_CLONE_REF_RESOLVE_TRANSIENT = 15;
    ERROR_CODE_GIT_CLONE_REF_UNRESOLVABLE = 16;
    ERROR_CODE_GIT_CLONE_AUTH_UNSUPPORTED_HOST = 17;
    ERROR_CODE_GIT_CLONE_AUTH_HOST_AMBIGUOUS = 18;
    ERROR_CODE_DELEGATION_BUDGET_UNAVAILABLE = 19;
    ERROR_CODE_DELEGATION_DENIED = 20;
    ERROR_CODE_MAX_DELEGATION_DEPTH_EXCEEDED = 21;
    ERROR_CODE_ISOLATION_MONOTONICITY_VIOLATED = 22;
    ERROR_CODE_CROSS_TENANT_MESSAGE_DENIED = 23;
    ERROR_CODE_ELICITATION_CONTENT_TAMPERED = 24;
    ERROR_CODE_EXTENSION_COOL_OFF_ACTIVE = 25;
    ERROR_CODE_PLATFORM_DEGRADED = 26;
    ERROR_CODE_PROTOCOL_VERSION_INCOMPATIBLE = 27;
    // Reserved range for Phase 2+ additions. Do not assign 1000–1999 to
    // anything that does not survive a wire-compat audit.
  }
}

// =====================================================================
// Common types
// =====================================================================

// SessionId identifies a session. Format: UUIDv8 (per spec §10.1 routing).
message SessionId {
  string value = 1;
}

// SlotId identifies a slot on a pod that runs concurrent sessions
// (`sessionPolicy.maxConcurrentSessions > 1`). Empty when
// `maxConcurrentSessions: 1`, where a session claims the whole pod.
message SlotId {
  string value = 1;
}

// WorkspacePlan is the proto-encoded form of the JSON Schema in
// workspaceplan-v1.json. The gateway translates between JSON and proto;
// the wire schema is authoritative.
//
// schema_version MUST be > 0 on every WorkspacePlan the gateway emits or
// accepts. Per §14.1 the only currently-valid value is 1; a 0 value
// (the proto3 default for an unset field) is rejected by the gateway
// validator at ingress with WORKSPACE_PLAN_INVALID. Consumers that
// receive a value > 1 they don't recognize follow the §15.5 item 7
// forward-read rule: keep the field, log a degraded-fidelity event,
// and proceed.
//
// setup_commands carry the §14 plan-declared setup commands. The
// gateway re-emits the same setup_commands on the dedicated RunSetup
// RPC (see RunSetupRequest below); the field's presence here is a
// transport convenience so a downstream that handles the WorkspacePlan
// (the §10.7 ref-resolver, audit log, partial-replay snapshot) sees the
// plan as a single document. The adapter MUST NOT execute setup
// commands from this field — it runs them only on the explicit
// RunSetup RPC, which §5.2 line 415 specifies fires once per pod at
// start (a recycled pod skips the second RunSetup on its subsequent
// session assignments; the gateway owns the once-per-pod gate). See
// also F-5.2.24.
message WorkspacePlan {
  int32 schema_version = 1;
  repeated WorkspaceSource sources = 2;
  repeated SetupCommand setup_commands = 3;
}

message WorkspaceSource {
  string type = 1;             // inlineFile|uploadFile|uploadArchive|mkdir|gitClone|symlink
  string path = 2;
  string content = 3;          // inlineFile only
  string upload_ref = 4;       // uploadFile, uploadArchive
  string format = 5;           // uploadArchive only
  int32 strip_components = 6;  // uploadArchive only
  string mode = 7;             // file/dir mode as octal string
  string url = 8;              // gitClone only
  string git_ref = 9;          // gitClone only
  int32 depth = 10;            // gitClone only
  bool submodules = 11;        // gitClone only
  GitAuth auth = 12;           // gitClone only
  string resolved_commit_sha = 13; // gateway-written, readonly
  // link_target is the symlink target for a gateway-produced `symlink`
  // source. The gateway extracts §14 uploadArchive sources in its own
  // §4.1 Upload Handler subsystem (§7.4 line 448; §13.4 line 652 — the
  // pod never decompresses), validates each symlink target with
  // pkg/upload.ValidateSymlinkTarget against the workspace root, and
  // rewrites a symlink-bearing archive entry into a `symlink` source so
  // the adapter recreates the link without canonicalizing untrusted
  // input. symlink only. F-7.4.1, F-13.4.1.
  string link_target = 14;
}

message GitAuth {
  string mode = 1;        // credential-lease
  string lease_scope = 2; // vcs.<provider>.(read|write)
}

message SetupCommand {
  string cmd = 1;
  int32 timeout_seconds = 2;
}

// =====================================================================
// RPC request/response messages
// =====================================================================

// ExperimentContext carries a session's §10.7 experiment enrollment so
// the runtime can tag traces with variant metadata. Absent when the
// session is not enrolled in any experiment.
message ExperimentContext {
  string experiment_id = 1;
  string variant_id = 2;
  // inherited is true when the context was propagated from a parent
  // session under the §8.3 inherit or control propagation mode.
  bool inherited = 3;
}

// PrepareWorkspaceRequest is one frame of the PrepareWorkspace upload
// stream. Frames sharing an upload_ref are concatenated in arrival
// order into a single staged file.
message PrepareWorkspaceRequest {
  SessionId session_id = 1;
  // upload_ref matches the WorkspaceSource.upload_ref of the uploadFile
  // or uploadArchive source this content backs. It MUST be a plain file
  // name with no path separators.
  string upload_ref = 2;
  bytes chunk = 3;
  // slot_id, when set, stages this slot's uploads into the §6.4 per-slot
  // staging area /workspace/slots/{slotId}/staging/ instead of the single
  // /workspace/staging. Empty when `maxConcurrentSessions: 1` (the base
  // layout). spec: §6.4 lines 385-405.
  SlotId slot_id = 4;
}

// PrepareWorkspaceResponse reports the total staged upload set.
message PrepareWorkspaceResponse {
  int64 staged_bytes = 1;
  int32 staged_files = 2;
}

// FinalizeWorkspaceRequest carries the §14 WorkspacePlan the adapter
// materializes into the workspace root.
message FinalizeWorkspaceRequest {
  SessionId session_id = 1;
  WorkspacePlan workspace_plan = 2;
  // archive_policy is the §13.4 per-Runtime opt-in surface the gateway
  // delivers to the adapter for uploadArchive extraction. An unset
  // message means "platform defaults" (symlinks rejected). spec: §7.4
  // lines 458, 462; §13.4 lines 663-672 — F-7.4.4.
  ArchivePolicy archive_policy = 3;
  // mid_session marks a §7.4 line 433 mid-session upload: the session is
  // already running and the named sources are overlaid onto the existing
  // /workspace/current rather than replacing the whole tree. The adapter
  // builds the sources in /workspace/staging, validates them, atomically
  // moves each entry onto /workspace/current (preserving the agent's
  // existing files), then emits a `files_updated` lifecycle signal to the
  // runtime so the agent re-reads the workspace only after promotion. The
  // proto3 default false is the pre-start whole-tree materialization the
  // §4.7 assignment sequence uses. spec: §7.4 line 433 — F-7.4.6.
  bool mid_session = 4;
  // slot_id, when set, materializes this slot's workspace under the §6.4
  // per-slot tree (staging /workspace/slots/{slotId}/staging/ promoted to
  // current /workspace/slots/{slotId}/current/) instead of the single
  // /workspace/current. Empty when `maxConcurrentSessions: 1`. spec: §6.4
  // lines 385-405.
  SlotId slot_id = 5;
}

// ArchivePolicy carries the §13.4 per-Runtime archive-extraction opts.
// The platform ceilings (256 MiB / 100:1 / 10 000 entries / 64 MiB per
// entry / depth 32 / path 4096 bytes) are normative and non-tunable
// per §13.4 — only the per-Runtime AllowSymlinks toggle and the
// adapter's workspace_root path travel on the wire. spec: §7.4 lines
// 448-462; §13.4 — F-7.4.2, F-7.4.4.
message ArchivePolicy {
  // allow_symlinks lifts the §7.4 line 458 default-deny on symlink
  // entries. The adapter still validates every symlink target with
  // pkg/upload.ValidateSymlinkTarget (relative-to-workspace canonical
  // path; rejects /proc, /sys, /dev, /run/lenny). False (the default)
  // aborts extraction on any symlink with details.reason = "symlink".
  bool allow_symlinks = 1;
  // workspace_root is the adapter's absolute workspace path. The
  // gateway derives it from the SandboxTemplate so the per-Runtime
  // workspace-tier and slot-scoped paths flow through correctly. The
  // adapter falls back to its own configured root when this field is
  // empty (workspaces materialized into /workspace/current). F-7.4.4.
  string workspace_root = 2;
}

// FinalizeWorkspaceResponse carries per-source advisory warnings the
// adapter raised during materialization. The adapter returns a gRPC
// error only on fatal materialization failures; non-fatal §14 plan
// warnings (entries the §7.4 line 459 strip-components rule skipped,
// etc.) ride here so the gateway can republish them on the session's
// SSE event stream and append them to the §11.7 audit trail.
message FinalizeWorkspaceResponse {
  // workspace_plan_warnings transcribes the §14 closed warning enum
  // for the adapter side of materialization. The §7.4 line 459
  // `workspace_plan_strip_components_skip` warning per skipped archive
  // entry is the only producer in v1; future codes ride the same
  // surface so the proto need not grow per warning kind. F-7.4.15.
  repeated WorkspacePlanWarning workspace_plan_warnings = 1;
}

// WorkspacePlanWarning is one §14 advisory the adapter raised against
// a workspace source during FinalizeWorkspace materialization. The
// (code, source_index, entry_path) tuple is the same shape the
// workspaceplan parser emits; an empty entry_path signals the warning
// applies to the source as a whole rather than to a specific archive
// entry. F-7.4.15.
message WorkspacePlanWarning {
  // code is the §14 WarningCode enum value, e.g.
  // `workspace_plan_strip_components_skip`.
  string code = 1;
  // source_index is the workspace plan's 0-based source index the
  // warning refers to. spec: §14 line 100 — `sourceIndex` is the
  // first field listed in the strip-components-skip warning fields.
  int32 source_index = 2;
  // entry_path is the archive entry path that triggered the warning.
  // Empty when the warning is not entry-scoped. spec: §14 line 100 —
  // `entryPath` is the per-entry path the strip-components rule
  // discarded. F-14.1.18.
  string entry_path = 3;
  // message carries a human-readable explanation for the warning.
  string message = 4;
  // segment_count is the number of `/`-separated segments the rejected
  // entry path had after stripping any leading/trailing empty
  // segments. spec: §14 line 100 — `segmentCount`. Populated on
  // `workspace_plan_strip_components_skip` warnings; zero on other
  // codes. F-14.1.18.
  int32 segment_count = 5;
  // strip_components is the configured `stripComponents` value the
  // entry was tested against. spec: §14 line 100 —
  // `stripComponents`. Populated on
  // `workspace_plan_strip_components_skip` warnings; zero on other
  // codes. F-14.1.18.
  int32 strip_components = 6;
  // unknown_type is the open-string `source.type` discriminator the
  // materializer did not recognize and skipped. spec: §14 line 334 —
  // `unknownType`. Populated only on `workspace_plan_unknown_source_type`
  // warnings the adapter raises when it is the live consumer of a plan
  // carrying a source type a newer gateway injected; empty on other
  // codes. F-14.1.2.
  string unknown_type = 7;
  // schema_version is the plan's declared §14.1 `schemaVersion`, copied
  // onto the warning so a consumer correlating warnings to plans does
  // not have to re-read the request body. spec: §14 line 334 —
  // `schemaVersion`. Populated only on
  // `workspace_plan_unknown_source_type` warnings; zero on other codes.
  // F-14.1.2.
  int32 schema_version = 8;
  // path is the workspace-relative path two sources resolved to during
  // materialization. spec: §14 line 338 — `path`. Populated only on
  // `workspace_plan_path_collision` warnings; empty on other codes.
  // F-14.1.9.
  string path = 9;
  // winning_source_index is the later (last-writer-wins) source index
  // whose content survives the collision. spec: §14 line 338 —
  // `winningSourceIndex`. Populated only on
  // `workspace_plan_path_collision` warnings; equals source_index.
  // F-14.1.9.
  int32 winning_source_index = 10;
  // losing_source_index is the earlier source index the later write
  // overwrote. spec: §14 line 338 — `losingSourceIndex`. Populated only
  // on `workspace_plan_path_collision` warnings. F-14.1.9.
  int32 losing_source_index = 11;
}

// RunSetupRequest carries the §14 WorkspacePlan setup commands the
// adapter runs against the materialized workspace. setup_policy bounds
// the aggregate setup phase per §5.1. The setup_commands here are the
// authoritative execution payload — see WorkspacePlan.setup_commands
// for why the same commands also ride on the plan document.
//
// Per §5.2 setup commands run once per pod at start. The gateway issues
// RunSetup once on first pod assignment; on a recycled pod's subsequent
// session assignments the gateway skips the RunSetup RPC entirely so the
// adapter's pod-level setup-completion state is implicit (no second
// RunSetup means no second execution). Per-session setup belongs in the
// runtime's initialization rather than in setupCommands.
message RunSetupRequest {
  SessionId session_id = 1;
  repeated SetupCommand setup_commands = 2;
  SetupPolicy setup_policy = 3;
  // slot_id, when set, runs setup against this slot's materialized cwd
  // /workspace/slots/{slotId}/current/ instead of /workspace/current.
  // Empty when `maxConcurrentSessions: 1`. spec: §6.4 lines 401-405.
  SlotId slot_id = 4;
}

// RunSetupResponse reports the per-command setup output the adapter
// captured. The §7.5 line 475 contract requires "Fully logged
// (stdout/stderr captured)" so the gateway can persist the trail on the
// session row and surface it through the §15.1 GET /v1/sessions/{id}
// envelope and the §11.7 audit log. The returned outputs preserve the
// submission order and include every executed command — including the
// one whose non-zero exit aborted the phase. RunSetup still returns a
// gRPC error on aggregate-cap fail or a per-command non-zero exit; the
// error path's outputs ride in the trailer metadata (`outputs`) for the
// gateway to recover them after a failure. F-7.5.4.
message RunSetupResponse {
  repeated SetupCommandOutput outputs = 1;
}

// SetupCommandOutput is the structured record of one §7.5 setup command's
// execution: the command text, captured stdout and stderr, the exit code,
// and the wall-clock duration. The adapter truncates each stream to a
// bounded byte budget before returning so a chatty command cannot blow
// the gRPC message size. F-7.5.4 / F-7.5.11.
message SetupCommandOutput {
  // cmd echoes the submitted command text so a downstream consumer can
  // correlate the record with the WorkspacePlan entry.
  string cmd = 1;
  // exit_code is the §7.5 line 475 captured exit status. 0 is a clean
  // exit; non-zero is a failure (the §7.3 setup_command_failed signal).
  int32 exit_code = 2;
  // stdout is the captured standard output, truncated to a per-stream
  // budget the adapter declares. UTF-8 lossy on non-text bytes.
  string stdout = 3;
  // stderr is the captured standard error, truncated to a per-stream
  // budget the adapter declares.
  string stderr = 4;
  // duration_ms is the wall-clock duration of the command in
  // milliseconds.
  int64 duration_ms = 5;
  // truncated reports whether stdout or stderr were truncated by the
  // adapter's per-stream budget. When true a downstream consumer should
  // surface that fact alongside the captured bytes.
  bool truncated = 6;
}

message StartSessionRequest {
  // Field 3 (workspace_plan) and field 7 (setup_policy) were removed
  // when workspace materialization and setup-command execution moved to
  // the FinalizeWorkspace and RunSetup staging RPCs (§4.7).
  reserved 3, 7;
  reserved "workspace_plan", "setup_policy";
  SessionId session_id = 1;
  string runtime = 2;
  map<string, string> labels = 4;
  // experiment_context is the §8.3 / §10.7 experiment enrollment
  // delivered to the runtime in the adapter manifest. Absent for an
  // unenrolled session.
  ExperimentContext experiment_context = 5;
  // tracing_context is the §8.3 opaque tracing-identifier map the
  // runtime receives in the adapter manifest to stitch its native
  // traces into the parent's trace tree. Empty when none is set.
  map<string, string> tracing_context = 6;
  // task_id is the §4.7 task identifier written into the adapter
  // manifest. A session has exactly one execution, so task_id is frozen
  // equal to the session's root task identifier ("Task" is the external
  // protocol name for the session: an MCP or A2A Task, or a
  // lenny/delegate_task child). Empty when the gateway sets no explicit
  // task identifier, where the adapter defaults the manifest taskId to
  // the session id. spec: §3.5 session and task.
  string task_id = 8;
  // agent_interface is the runtime's §5.1 agentInterface descriptor,
  // JSON-encoded, written verbatim into the adapter manifest's
  // agentInterface field. Empty when the runtime declares none (the
  // manifest field is then null).
  bytes agent_interface = 9;
  // min_platform_version is the runtime's §5.1 minPlatformVersion (semver)
  // written into the adapter manifest. Empty when the runtime specifies no
  // minimum.
  string min_platform_version = 10;
  // slot_id, when set, claims a §6.4 per-slot workspace rather than the
  // whole pod: the adapter registers the slot (alongside sibling slots),
  // ensures the per-slot tree exists, and starts the slot's runtime
  // against /workspace/slots/{slotId}/current/. Set only when the pod
  // runs concurrent sessions (`maxConcurrentSessions > 1`); empty when
  // `maxConcurrentSessions: 1` (the one-session-per-pod claim). spec:
  // §6.4 lines 385-405; §5.2.
  SlotId slot_id = 11;
}

// SetupPolicy is the §5.1 runtime setupPolicy: the aggregate cap on the
// setup phase and the disposition when it is exceeded.
message SetupPolicy {
  // timeout_seconds is the aggregate cap on the setup phase. Zero means
  // no aggregate cap.
  int32 timeout_seconds = 1;
  // on_timeout is the §5.1 disposition when the cap is hit: "fail"
  // aborts pod startup, "warn" proceeds to runtime start. An empty
  // value is the conservative "fail" default.
  string on_timeout = 2;
  // shell carries the §7.5 setupCommandPolicy.shell flag from the gateway
  // to the adapter. When true the adapter runs each command via
  // `/bin/sh -c`; when false the adapter splits the command on whitespace
  // and execs the argv directly, neutering pipes, backtick substitution,
  // glob expansion, redirects, and `&&` chaining per §7.5 line 490. The
  // proto3 default is false (argv-mode); the gateway sends `true` only
  // when the runtime's policy explicitly requests shell execution. F-7.5.2.
  bool shell = 3;
}

message StartSessionResponse {
  // Empty on success. Non-empty on graceful refusal (the pod is degraded
  // but reachable).
  string refusal_reason = 1;
}

message SendMessageRequest {
  SessionId session_id = 1;
  SlotId slot_id = 2;
  // Opaque JSON-encoded MessageEnvelope (lenny-adapter-jsonl.schema.json
  // `message`). The adapter writes it verbatim to the agent's stdin.
  bytes envelope_json = 3;
}

message SendMessageResponse {}

// AttachRequest is one frame the gateway streams to the adapter over
// Attach. session_id is set on every message so the adapter can reject a
// stream bound to a session the pod does not hold.
message AttachRequest {
  SessionId session_id = 1;
  SlotId slot_id = 2;
  // Opaque JSON-encoded client-to-agent frame (lenny-adapter-jsonl.schema.json
  // `message`, `tool_result`, `heartbeat`, ...). The adapter writes it
  // verbatim to the agent's stdin.
  bytes envelope_json = 3;
}

// AttachResponse is one frame the adapter streams back over Attach as
// the agent produces output.
message AttachResponse {
  // Opaque JSON-encoded agent-to-gateway frame (lenny-adapter-jsonl.schema.json
  // `response`, `tool_call`, `status`, `heartbeat_ack`, ...) read verbatim
  // from the agent's stdout.
  bytes envelope_json = 1;
}

message AssignCredentialsRequest {
  SessionId session_id = 1;
  map<string, CredentialLease> leases = 2; // keyed by provider
  // slot_id, when set, writes this slot's independent credential lease to
  // the §6.1 per-slot credential file /run/lenny/slots/{slotId}/credentials.json
  // instead of the single global /run/lenny/credentials.json, so a
  // rotation on one slot does not disrupt sibling slots. Empty when
  // `maxConcurrentSessions: 1`. spec: §6.1 line 28.
  SlotId slot_id = 3;
}

message AssignCredentialsResponse {}

message RotateCredentialsRequest {
  SessionId session_id = 1;
  map<string, CredentialLease> leases = 2;
  // rotation_trigger is the §4.9 rotationTrigger that drove this
  // rotation. It governs the §4.7 Full-level in-flight gate ceiling:
  // any value other than "proactive_renewal" caps the in-flight wait at
  // 300s and falls through to the standard rotation path on ceiling hit
  // (spec §4.7 line 822). The renewal trigger keeps the unbounded wait
  // because the old credential is still valid. Empty is treated as a
  // fault trigger (capped) for fail-closed safety.
  string rotation_trigger = 3;
  // slot_id, when set, rotates the lease in this slot's §6.1 per-slot
  // credential file independently of sibling slots. Empty when
  // `maxConcurrentSessions: 1`. spec: §6.1 line 28.
  SlotId slot_id = 4;
}

message RotateCredentialsResponse {}

message RevokeCredentialsRequest {
  SessionId session_id = 1;
  repeated string providers = 2;
  string reason = 3;
  // slot_id, when set, revokes from this slot's §6.1 per-slot credential
  // file independently of sibling slots. Empty when
  // `maxConcurrentSessions: 1`. spec: §6.1 line 28.
  SlotId slot_id = 4;
}

message RevokeCredentialsResponse {}

message CredentialLease {
  string lease_id = 1;
  string provider = 2;
  int64 expires_at_unix_ms = 3;
  int64 renew_before_unix_ms = 4;
  // Provider-specific payload. The adapter writes it under /run/lenny/.
  bytes payload = 5;
}

message InterruptRequest {
  SessionId session_id = 1;
  Mode mode = 2;
  int32 deadline_ms = 3;
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_CLEAN = 1; // SIGTERM with grace
    MODE_HARD = 2;  // immediate SIGKILL
  }
}

message InterruptResponse {
  bool acknowledged = 1;
  Status status = 2;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACKNOWLEDGED = 1;     // runtime reached a safe stop point
    STATUS_INTERRUPT_TIMEOUT = 2; // deadline elapsed with no acknowledgement (§4.7)
    STATUS_BUSY = 3;             // operation lock rejected the interrupt (§4.7)
  }
}

message CheckpointRequest {
  SessionId session_id = 1;
  int32 deadline_ms = 2;
}

message CheckpointResponse {
  string checkpoint_id = 1;
  int64 size_bytes = 2;
}

message SignalDeadlineRequest {
  SessionId session_id = 1;
  // remaining_ms is the wall-clock left before the session's deadline
  // (~300000 for the §11.3 line 240 five-minute pre-expiry warning).
  int32 remaining_ms = 2;
  // trigger names which deadline is approaching: "session_age" (the
  // §11.3 maxSessionAge cap), "budget", or "idle".
  string trigger = 3;
}

message SignalDeadlineResponse {
  // delivered is true when the warning reached the runtime over the
  // lifecycle channel; false when the pod's runtime has no lifecycle
  // channel (Basic/Standard integration level — §15 line 2141).
  bool delivered = 1;
}

message ResumeRequest {
  SessionId session_id = 1;
  string runtime = 2;        // runtime name, as in StartSessionRequest
  string checkpoint_id = 3;  // checkpoint to restore the workspace from
  // experiment_context and tracing_context are re-delivered to the
  // restored runtime in the adapter manifest — the session's §8.3
  // enrollment and tracing identifiers survive a resume onto a fresh
  // pod. Absent when unset.
  ExperimentContext experiment_context = 4;
  map<string, string> tracing_context = 5;
  // task_id, agent_interface, and min_platform_version are re-delivered to
  // the restored runtime in the adapter manifest, the same as
  // StartSessionRequest, so a resume onto a fresh pod reproduces the
  // §15.4 manifest field set.
  string task_id = 6;
  bytes agent_interface = 7;
  string min_platform_version = 8;
  // recovery_generation is the session's §4.2 / §7.3 pod-recovery
  // counter at the time the gateway issued this Resume. Re-delivered
  // to the adapter so per-pod traces, logs, and any partial-manifest
  // row the adapter writes can carry the (coordination, recovery)
  // tuple that authored the replay. Zero when the gateway has not
  // recorded a generation for the session.
  int64 recovery_generation = 9;
  // expected_workspace_bytes is the session's
  // `last_checkpoint_workspace_bytes` recorded on the gateway side —
  // the uncompressed total the adapter is expected to extract for
  // this Resume. The adapter compares it against
  // `workspace_size_limit_bytes` (the §4.4 hard workspace size limit)
  // before quiescing the runtime to refuse a restore whose archive
  // would blow past the pod's emptyDir budget. Zero when the gateway
  // has no recorded size; the adapter then falls back to the kubelet
  // emptyDir guard.
  int64 expected_workspace_bytes = 10;
  // workspace_size_limit_bytes is the §4.4 / §10.1 per-pod hard
  // workspace size cap the SandboxTemplate or runtime resolves to.
  // The adapter uses it together with expected_workspace_bytes for
  // the symmetric pre-extraction size check. Zero disables the
  // gateway-supplied limit (the kubelet emptyDir guard is the
  // backstop).
  int64 workspace_size_limit_bytes = 11;
  // expected_workspace_root is the absolute `cwd` path the original
  // session ran against — §7.3 step (d) "Recreate same absolute `cwd`
  // path." The gateway passes it so the adapter can assert the
  // replacement pod was provisioned with an identical workspace mount
  // before extracting any checkpoint bytes. A mismatch (typically caused
  // by a SandboxTemplate or runtime workspaceRoot change between the
  // original and replacement pods) aborts the Resume with
  // FailedPrecondition so the gateway can surface the cause to the
  // client rather than silently restoring into the wrong absolute path.
  // Empty disables the assertion (the gateway has no recorded value for
  // legacy sessions); the assertion is purely a runtime template-drift
  // guard.
  string expected_workspace_root = 12;
}

message ResumeResponse {
  int64 restored_bytes = 1;  // uncompressed workspace bytes restored
  // mode reports how the adapter restored the workspace per §4.4 /
  // §7.2 ResumeMode: "full" when the named checkpoint was extracted
  // intact, "partial_workspace" when only a partial manifest was
  // available, "conversation_only" when no workspace was restored,
  // or "coordinator_handoff" for the §10.4 reattach path. Empty when
  // the adapter cannot classify the resume; the gateway falls back to
  // its own classification.
  string mode = 2;
  // recovery_generation echoes the value the gateway supplied on
  // ResumeRequest.recovery_generation so the gateway can verify the
  // adapter consumed the right generation under split-brain.
  int64 recovery_generation = 3;
}

// CoordinatorFenceRequest announces a new coordination generation to the
// pod (§4.7 line 632 / §10.1). The pod records the new generation and
// from this point rejects every RPC carrying a strictly older generation
// with FailedPrecondition + a `coordinator_handoff_stale` detail string,
// which the gateway counts on `lenny_coordinator_handoff_stale_total`.
message CoordinatorFenceRequest {
  SessionId session_id = 1;
  // coordination_generation is the new generation the acquiring
  // coordinator wrote to Postgres in step 1 of the §10.1 handoff
  // protocol. Strictly monotonic on the pod side per session.
  int64 coordination_generation = 2;
}

// CoordinatorFenceResponse acknowledges the new generation. accepted is
// true when the pod records the generation; false when the supplied
// generation is not greater than the last fenced generation (the
// gateway should re-read Postgres and re-issue). gap_detected reports
// that the new generation skips one or more values relative to the last
// fenced generation; the adapter still acknowledges (the new coordinator
// can proceed) but logged a `coordinator_generation_gap` event and
// reset transient tool-call state per §10.1 line 36.
message CoordinatorFenceResponse {
  bool accepted = 1;
  int64 last_fenced_generation = 2;
  bool gap_detected = 3;
}

// CheckpointBarrierRequest dispatches a barrier during gateway graceful
// drain (§4.7 line 631 / §10.1). barrier_id is the gateway's unique
// identifier for this barrier (echoed in the ack). coordination_generation
// must match the last fenced generation, or the adapter rejects with
// FailedPrecondition; this is the same generation gate Coordinator
// Fence installs.
message CheckpointBarrierRequest {
  SessionId session_id = 1;
  // coordination_generation is the gateway's view of the active
  // coordination generation. The adapter rejects with FailedPrecondition
  // when this is not strictly equal to the last fenced generation.
  int64 coordination_generation = 2;
  // barrier_id is the gateway's correlation id for this barrier. Echoed
  // verbatim in the CheckpointBarrierAck.
  string barrier_id = 3;
}

// CheckpointBarrierResponse is the synchronous mirror of the
// CheckpointBarrierAck event emitted on the LifecycleChannel control
// stream (§4.7 line 660). barrier_id echoes the request. last_tool_call_id
// is the id of the last tool call the adapter dispatched before
// quiescing; the gateway uses it to deduplicate replays on resume per
// §10.1 line 173. checkpoint_ref is the storage reference of the
// best-effort checkpoint flushed during the barrier (empty when the
// adapter could not flush one — e.g. checkpoint sink unwired or
// archive failed). quiesced_ms reports the wall-clock the adapter spent
// quiescing the runtime; the gateway records it on
// `lenny_checkpoint_barrier_ack_duration_seconds`.
message CheckpointBarrierResponse {
  string barrier_id = 1;
  string last_tool_call_id = 2;
  string checkpoint_ref = 3;
  int64 quiesced_ms = 4;
}

// ExportSpec is one §8.7 file-export entry: a source glob resolved
// inside the parent's /workspace/current and an optional dest_prefix
// the matched files are re-rooted under in the child's workspace.
message ExportSpec {
  // source is the glob resolved relative to /workspace/current. Its
  // base path (the longest non-wildcard prefix) is stripped from each
  // matched file's path during rebasing (§8.7).
  string source = 1;
  // dest_prefix is the relative directory the rebased files are placed
  // under in the child workspace. Empty places them at the root. It
  // must be a relative path with no "..": the gateway rejects an
  // absolute or escaping prefix before the call (§8.7 validation).
  string dest_prefix = 2;
}

message ExportPathsRequest {
  SessionId session_id = 1;
  // exports are applied in order; later entries overwrite earlier ones
  // on path collision (§8.7 "Multiple exports").
  repeated ExportSpec exports = 2;
}

// ExportedFile is one rebased file the adapter packaged for delegation.
message ExportedFile {
  // path is the child-workspace-relative destination after rebasing,
  // always forward-slash separated and root-relative (no leading "./").
  string path = 1;
  // content is the file's bytes. The gateway re-derives sha256 when an
  // interceptor MODIFIES the bytes at PreExportMaterialization (§8.7).
  bytes content = 2;
  // sha256 is the lowercase hex digest of content, for the gateway's
  // export-size and dedup accounting.
  string sha256 = 3;
  // size_bytes is len(content), surfaced so the gateway can sum the
  // export against fileExportLimits without re-reading content.
  int64 size_bytes = 4;
}

message ExportPathsResponse {
  // files are the rebased export set, deduplicated by path with
  // last-write-wins across overlapping exports (§8.7).
  repeated ExportedFile files = 1;
  // total_bytes is the sum of size_bytes across files, for the
  // gateway's fileExportLimits.maxBytes check.
  int64 total_bytes = 2;
}

message ReportUsageRequest {
  SessionId session_id = 1;
}

message ReportUsageResponse {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 wall_clock_ms = 3;
}

// FileExportLimitsDelta is the §8.6 line 643 fileExportLimits extension:
// the additional file-count and total-byte headroom an ExtendLease
// request asks for, and the amount the gateway granted on the response.
// fileExportLimits is one of the six extendable dimensions; it carries
// two scalar components so the wire mirrors the policy field's shape.
// F-8.6.1.
message FileExportLimitsDelta {
  int64 additional_max_files = 1;
  int64 additional_max_bytes = 2;
}

message ExtendLeaseRequest {
  SessionId session_id = 1;
  int64 requested_tokens = 2;
  int32 requested_seconds = 3;
  // §8.6 line 643 extendable dimensions beyond maxTokenBudget (field 2)
  // and perChildMaxAge (field 3). Zero — or an absent message, for
  // file_export_limits — requests no change on that dimension. F-8.6.1.
  int64 requested_children = 4;          // additionalChildren → maxChildrenTotal
  int64 requested_parallel_children = 5; // maxParallelChildren
  int64 requested_tree_size = 6;         // maxTreeSize
  FileExportLimitsDelta requested_file_export_limits = 7; // fileExportLimits
}

message ExtendLeaseResponse {
  Status status = 1;
  int64 granted_tokens = 2;
  int32 granted_seconds = 3;
  // When status is REJECTED, the gateway includes the cool-off expiry.
  int64 cool_off_expiry_unix_ms = 4;
  // subtree_id is the §8.6 denied subtree (the session whose adapter
  // issued the ExtendLease request that triggered the user rejection
  // or, on an in-flight denial, that observed the denial inside the
  // grant-commit transaction). Set only when status is REJECTED.
  // spec: §15.1 line 1080
  string subtree_id = 5;
  // cool_off_expires_at is the §15.1 line 1080 UTC RFC 3339 timestamp
  // marking when the rejection cool-off window ends. Mirrors
  // cool_off_expiry_unix_ms with the spec-named ISO 8601 string. Set
  // only when status is REJECTED.
  // spec: §15.1 line 1080
  string cool_off_expires_at = 6;
  // error is the §15.1 typed error envelope. Populated when the
  // gateway auto-rejects a REJECTED outcome with one of the §15.1
  // delegation error codes (currently EXTENSION_COOL_OFF_ACTIVE on
  // both the pre-grant rejection-cool-off path and the §8.6 line 731
  // in-flight atomic re-check). Unset on every non-REJECTED outcome
  // and on a STATUS_REJECTED outcome that does not map to a §15.1
  // typed code. Mirrors the REST/MCP error envelope so clients and
  // admin tooling can distinguish "user just denied" from "the
  // subtree is inside an existing cool-off window" without parsing
  // the status field.
  // spec: §15.1 line 1080; F-8.6.9
  Error error = 7;
  // §8.6 granted amounts for the extendable dimensions beyond
  // granted_tokens (field 2) and granted_seconds (field 3). Each is the
  // amount actually added to the tree budget after the §8.6 ceilings,
  // so the adapter knows exactly what it received per dimension.
  // F-8.6.1.
  int64 granted_children = 8;
  int64 granted_parallel_children = 9;
  int64 granted_tree_size = 10;
  FileExportLimitsDelta granted_file_export_limits = 11;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_GRANTED = 1;
    STATUS_PARTIALLY_GRANTED = 2;
    STATUS_CEILING_REACHED = 3;
    STATUS_REJECTED = 4;
  }
}

message ShutdownRequest {
  SessionId session_id = 1;
  string reason = 2;
  int32 deadline_ms = 3;
  // slot_id, when set, tears down just this §6.4 per-slot session (its
  // runtime, credential timers, and per-slot directory tree) while
  // sibling slots on the pod keep running. Empty when
  // `maxConcurrentSessions: 1` (the whole-pod shutdown). spec: §6.4 lines
  // 401-405.
  SlotId slot_id = 4;
}

message ShutdownResponse {
  bool exited_cleanly = 1;
  int32 exit_code = 2;
}

// ConfigureWorkspaceRequest carries the finalized working directory to a
// pre-connected SDK-warm session (§4.7). It replaces StartSession on the
// SDK-warm fast path.
message ConfigureWorkspaceRequest {
  SessionId session_id = 1;
  // cwd is the finalized working directory the pre-connected SDK session
  // is pointed at — /workspace/current in production. Idempotent: sending
  // the same cwd twice is safe.
  string cwd = 2;
  // experiment_context and tracing_context are written into the adapter
  // manifest the runtime re-reads when the workspace is configured, the
  // same as StartSession.
  ExperimentContext experiment_context = 3;
  map<string, string> tracing_context = 4;
}

// ConfigureWorkspaceResponse is empty on success. A non-empty
// refusal_reason is a graceful refusal: the pre-connected SDK could not be
// pointed at the workspace, so the gateway calls DemoteSDK and falls back
// to pod-warm materialization (§4.7).
message ConfigureWorkspaceResponse {
  string refusal_reason = 1;
}

message DemoteSDKRequest {
  // Why the gateway is demoting the pod. Typically the WorkspacePlan
  // included a path matching the runtime's sdkWarmBlockingPaths.
  string reason = 1;
}

message DemoteSDKResponse {
  // True once the SDK process has exited and the pod is back to
  // pod-warm state, ready for fresh workspace materialization.
  bool demoted = 1;
}

message NegotiateVersionRequest {
  // Versions the gateway is willing to speak, highest preference first.
  // Format: semver (e.g., "1.0.0", "1.1.0"). The adapter picks the
  // highest version it also supports.
  repeated string accepted_protocol_versions = 1;
  // Capabilities the gateway expects the adapter to declare. Empty
  // means the gateway will work with whatever the adapter advertises.
  repeated string requested_capabilities = 2;
}

message NegotiateVersionResponse {
  // The protocol version both sides agreed on.
  string selected_protocol_version = 1;
  // Adapter capabilities. The platform-known set includes (but is not
  // limited to): preConnect, multiTurn, fullLifecycle, concurrentWorkspace,
  // immediateInjection, queuedInjection.
  repeated string capabilities = 2;
  // The adapter's own version string, surfaced for observability.
  string adapter_version = 3;
  // True when the adapter could not satisfy the gateway's accepted
  // versions. The connection should be torn down and the pod evicted.
  bool incompatible = 4;
  // workspace_root is the §7.3 line 408 / §6.1 absolute cwd path the
  // adapter mounts the session workspace into — the value of
  // `--workspace-root` on `lenny-adapter`. The gateway captures it on
  // the first Bind and persists it on the session row so a subsequent
  // Resume can pass it back as `expected_workspace_root` and the
  // replacement pod's adapter can assert "same absolute cwd path".
  // F-7.3.15.
  string workspace_root = 5;
}

message GetObservedIntegrationLevelRequest {
  // wait_ms bounds how long the adapter waits for the runtime to complete
  // its first §4.7 lifecycle handshake before classifying. A Full-level
  // runtime dials the lifecycle channel shortly after boot, so a generous
  // window avoids misclassifying a slow-to-connect runtime; the window is
  // only fully consumed when the runtime never opens the channel. Zero
  // classifies from the runtime's current connection state with no wait.
  int32 wait_ms = 1;
}

message GetObservedIntegrationLevelResponse {
  // observed_level is "basic", "standard", or "full" — the §5.1 level the
  // adapter observed the runtime actually implement. "full" when the
  // runtime completed the lifecycle handshake; "standard" when it
  // connected to the platform MCP server but not the lifecycle channel;
  // "basic" otherwise (stdin/stdout binary protocol only).
  string observed_level = 1;
}

// Opaque lifecycle event envelope. The lifecycle event taxonomy is defined
// in lenny-adapter-jsonl.schema.json under the lifecycle section in the
// spec. Kept opaque here so the proto schema does not need to evolve every
// time a lifecycle event is added. Request and response carry the same
// payload but are typed separately per proto-RPC convention.
message LifecycleChannelRequest {
  bytes envelope_json = 1;
}

message LifecycleChannelResponse {
  bytes envelope_json = 1;
}
