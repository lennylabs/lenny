        - alert: CheckpointDurationBurnRateSlow
          expr: (1 - (sum(rate(lenny_checkpoint_duration_seconds_bucket{le="2"}[1h])) / sum(rate(lenny_checkpoint_duration_seconds_count[1h])))) / 0.05 > scalar(lenny_slo_burn_rate_slow_multiplier or vector(3))
