<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .b-bg { fill: #ffffff; }
      .actor { fill: #ffe9c7; stroke: #1f2933; stroke-width: 2; }
      .title { fill: #1f2933; font-size: 17px; font-weight: 600; }
      .body { fill: #1f2933; font-size: 13px; }
      .step { fill: #b56b1f; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
      .sub { fill: #54616e; font-size: 12px; font-style: italic; }
      .mono { font-family: 'SF Mono','Menlo','Consolas',monospace; fill: #1f2933; font-size: 12px; }
      .ln { stroke: #1f2933; stroke-width: 1.6; fill: none; stroke-linecap: round; }
      .lifeline { stroke: #c0b290; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    </style>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect class="b-bg" width="1100" height="460"/>

  <rect class="actor" x="120" y="20" width="200" height="50" rx="8"/>
  <text class="title" x="220" y="52" text-anchor="middle">Client</text>

  <rect class="actor" x="780" y="20" width="200" height="50" rx="8"/>
  <text class="title" x="880" y="52" text-anchor="middle">Lenny</text>

  <path class="lifeline" d="M 220 76 L 220 440"/>
  <path class="lifeline" d="M 880 76 L 880 440"/>

  <text class="step" x="40" y="118">STEP 1</text>
  <path class="ln" d="M 224 130 L 876 130" marker-end="url(#ar)"/>
  <text class="body" x="550" y="120" text-anchor="middle">Create session with callbackUrl</text>
  <text class="sub" x="550" y="148" text-anchor="middle">Lenny creates session and starts agent</text>

  <text class="step" x="40" y="200">STEP 2</text>
  <path class="ln" d="M 876 212 L 224 212" marker-end="url(#ar)"/>
  <text class="mono" x="550" y="202" text-anchor="middle">{ "sessionId": "...", "state": "running" }</text>

  <text class="step" x="40" y="260">STEP 3</text>
  <text class="sub" x="220" y="272" text-anchor="middle">Do other work</text>

  <text class="step" x="40" y="332">STEP 4</text>
  <path class="ln" d="M 876 344 L 224 344" marker-end="url(#ar)"/>
  <text class="body" x="550" y="334" text-anchor="middle">POST to callbackUrl</text>
  <text class="mono" x="550" y="362" text-anchor="middle">CloudEvents { "type": "dev.lenny.session_completed" }</text>

  <text class="step" x="40" y="416">STEP 5</text>
  <path class="ln" d="M 224 428 L 876 428" marker-end="url(#ar)"/>
  <text class="mono" x="550" y="418" text-anchor="middle">GET /v1/sessions/{id}/artifacts</text>
</svg>
