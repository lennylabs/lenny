<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .b-bg { fill: #ffffff; }
      .card-mustard { fill: #ffe9c7; stroke: #1f2933; stroke-width: 2.2; }
      .card-cream { fill: #fffaf0; stroke: #1f2933; stroke-width: 2; }
      .card-sage { fill: #d6e9d2; stroke: #1f2933; stroke-width: 2; }
      .sub-cream { fill: #fffaf0; stroke: #1f2933; stroke-width: 1.6; }
      .title { fill: #1f2933; font-size: 17px; font-weight: 600; }
      .sub { fill: #54616e; font-size: 14px; }
      .section { fill: #b56b1f; font-size: 14px; letter-spacing: 0.04em; }
      .foot { fill: #8a7755; font-size: 13px; }
      .ln { stroke: #1f2933; stroke-width: 1.8; fill: none; stroke-linecap: round; }
      .cluster { fill: none; stroke: #c0b290; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .netpol { fill: none; stroke: #c84a1d; stroke-width: 1.6; stroke-dasharray: 5 4; }
    </style>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect class="b-bg" width="980" height="750"/>

  <!-- Clients, outside the cluster -->
  <rect class="card-cream" x="180" y="24" width="260" height="56" rx="8"/>
  <text class="title" x="310" y="50" text-anchor="middle">Clients</text>
  <text class="sub" x="310" y="70" text-anchor="middle">SDKs, CLI, and MCP hosts</text>

  <path class="ln" d="M 310 80 L 310 152" marker-end="url(#ar)"/>
  <text class="sub" x="324" y="112">REST, MCP, OpenAI Chat Completions, and Open Responses</text>

  <!-- Cluster boundary -->
  <rect class="cluster" x="30" y="96" width="920" height="630" rx="10"/>
  <text class="section" x="50" y="122">KUBERNETES CLUSTER</text>

  <!-- Gateway -->
  <rect class="card-mustard" x="60" y="158" width="500" height="112" rx="10"/>
  <text class="title" x="310" y="200" text-anchor="middle">Gateway</text>
  <text class="sub" x="310" y="226" text-anchor="middle">Authentication, policy, session routing,</text>
  <text class="sub" x="310" y="246" text-anchor="middle">credential leasing, and audit</text>

  <!-- Dependencies -->
  <rect class="card-cream" x="660" y="158" width="260" height="50" rx="6"/>
  <text class="title" x="680" y="189">Token Service</text>

  <rect class="card-cream" x="660" y="220" width="260" height="50" rx="6"/>
  <text class="title" x="680" y="251">Postgres and Redis</text>

  <rect class="card-cream" x="660" y="282" width="260" height="50" rx="6"/>
  <text class="title" x="680" y="313">Object storage</text>

  <path class="ln" d="M 560 183 L 654 183" marker-end="url(#ar)"/>
  <path class="ln" d="M 560 245 L 654 245" marker-end="url(#ar)"/>
  <path class="ln" d="M 610 245 L 610 307 L 654 307" marker-end="url(#ar)"/>

  <!-- Gateway to pods -->
  <text class="sub" x="330" y="304" text-anchor="middle">mTLS gRPC</text>

  <!-- Agent namespace -->
  <rect class="netpol" x="60" y="330" width="540" height="370" rx="10"/>
  <text class="section" x="80" y="660">AGENT NAMESPACE</text>
  <text class="foot" x="80" y="680">Default-deny NetworkPolicy; ingress only from the gateway</text>

  <rect class="card-cream" x="90" y="372" width="220" height="250" rx="10"/>
  <text class="section" x="106" y="612">AGENT POD</text>
  <rect class="sub-cream" x="110" y="428" width="180" height="62" rx="6"/>
  <text class="title" x="200" y="465" text-anchor="middle">Adapter</text>
  <rect class="sub-cream" x="110" y="510" width="180" height="78" rx="6"/>
  <text class="title" x="200" y="554" text-anchor="middle">Agent</text>

  <rect class="card-cream" x="350" y="372" width="220" height="250" rx="10"/>
  <text class="section" x="366" y="612">AGENT POD</text>
  <rect class="sub-cream" x="370" y="428" width="180" height="62" rx="6"/>
  <text class="title" x="460" y="465" text-anchor="middle">Adapter</text>
  <rect class="sub-cream" x="370" y="510" width="180" height="78" rx="6"/>
  <text class="title" x="460" y="554" text-anchor="middle">Agent</text>

  <!-- Gateway arrows drawn over the pod cards so the heads stay visible -->
  <path class="ln" d="M 200 270 L 200 422" marker-end="url(#ar)"/>
  <path class="ln" d="M 460 270 L 460 422" marker-end="url(#ar)"/>

  <!-- Controllers -->
  <rect class="card-sage" x="660" y="440" width="260" height="96" rx="8"/>
  <text class="title" x="680" y="470">Controllers</text>
  <text class="sub" x="680" y="494">Warm Pool Controller and</text>
  <text class="sub" x="680" y="514">PoolScalingController</text>
  <path class="ln" d="M 660 488 L 606 488" marker-end="url(#ar)"/>
  <text class="foot" x="680" y="560">Create, claim, and drain pods</text>
  <text class="foot" x="680" y="578">through Sandbox resources</text>
</svg>
