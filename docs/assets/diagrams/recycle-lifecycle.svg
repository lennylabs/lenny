<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .b-bg { fill: #ffffff; }
      .card { fill: #fffaf0; stroke: #1f2933; stroke-width: 1.8; }
      .card-primary { fill: #ffe9c7; stroke: #1f2933; stroke-width: 2.2; }
      .card-accent { fill: #d6e9d2; stroke: #1f2933; stroke-width: 1.8; }
      .title { fill: #1f2933; font-size: 16px; font-weight: bold; }
      .mono { font-family: 'SF Mono','Menlo','Consolas',monospace; fill: #1f2933; font-size: 13px; }
      .sub { fill: #54616e; font-size: 12px; }
      .body { fill: #1f2933; font-size: 12px; font-style: italic; }
      .foot { fill: #8a7755; font-size: 13px; }
      .ln { stroke: #1f2933; stroke-width: 1.8; fill: none; stroke-linecap: round; }
    </style>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect class="b-bg" width="1120" height="340"/>

  <text class="title" x="40" y="44">Recycle lifecycle (recycle.enabled: true, preConnect pool)</text>

  <rect class="card-primary" x="40" y="100" width="150" height="56" rx="8"/>
  <text class="mono" x="115" y="126" text-anchor="middle">claimed</text>
  <text class="sub" x="115" y="144" text-anchor="middle">session bound</text>

  <rect class="card" x="250" y="100" width="190" height="56" rx="8"/>
  <text class="mono" x="345" y="126" text-anchor="middle">recycling</text>
  <text class="sub" x="345" y="144" text-anchor="middle">whole-pod scrub</text>

  <rect class="card" x="500" y="100" width="200" height="56" rx="8"/>
  <text class="mono" x="600" y="126" text-anchor="middle">sdk_connecting</text>
  <text class="sub" x="600" y="144" text-anchor="middle">SDK re-warm</text>

  <rect class="card-accent" x="760" y="100" width="170" height="56" rx="8"/>
  <text class="mono" x="845" y="126" text-anchor="middle">reserved</text>
  <text class="sub" x="845" y="144" text-anchor="middle">tenant hold</text>

  <rect class="card-primary" x="760" y="244" width="170" height="56" rx="8"/>
  <text class="mono" x="845" y="270" text-anchor="middle">claimed</text>
  <text class="sub" x="845" y="288" text-anchor="middle">same-tenant rebind</text>

  <rect class="card" x="990" y="100" width="100" height="56" rx="8"/>
  <text class="mono" x="1040" y="126" text-anchor="middle">idle</text>
  <text class="sub" x="1040" y="144" text-anchor="middle">hold expiry</text>

  <path class="ln" d="M 192 128 L 246 128" marker-end="url(#ar)"/>
  <text class="body" x="219" y="118" text-anchor="middle">occ. zero</text>

  <path class="ln" d="M 442 128 L 496 128" marker-end="url(#ar)"/>
  <text class="body" x="469" y="118" text-anchor="middle">scrub ok</text>

  <path class="ln" d="M 702 128 L 756 128" marker-end="url(#ar)"/>
  <text class="body" x="729" y="116" text-anchor="middle">re-warm</text>

  <path class="ln" d="M 845 158 L 845 240" marker-end="url(#ar)"/>
  <text class="body" x="855" y="202" text-anchor="start">within TTL</text>

  <path class="ln" d="M 932 128 L 986 128" marker-end="url(#ar)"/>
  <text class="body" x="959" y="116" text-anchor="middle">expires</text>

  <text class="foot" x="40" y="324">On a non-preConnect pool the scrub success patches recycling directly to reserved with no SDK re-warm leg. A failed or crashed session, or a reached recycle limit, drains the pod instead.</text>
</svg>
