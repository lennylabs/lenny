<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .b-bg { fill: #ffffff; }
      .card-mustard { fill: #ffe9c7; stroke: #1f2933; stroke-width: 2.2; }
      .card-cream { fill: #fffaf0; stroke: #1f2933; stroke-width: 2; }
      .card-sage { fill: #d6e9d2; stroke: #1f2933; stroke-width: 2; }
      .sub-cream { fill: #fffaf0; stroke: #1f2933; stroke-width: 1.6; }
      .title { fill: #1f2933; font-size: 17px; font-weight: 600; }
      .body { fill: #1f2933; font-size: 14px; }
      .sub { fill: #54616e; font-size: 14px; }
      .lite { fill: #8a7755; font-size: 14px; }
      .section { fill: #b56b1f; font-size: 14px; letter-spacing: 0.04em; }
      .mono { font-family: 'SF Mono','Menlo','Consolas',monospace; fill: #1f2933; font-size: 13px; }
      .foot { fill: #8a7755; font-size: 13px; }
      .ln { stroke: #1f2933; stroke-width: 2; fill: none; stroke-linecap: round; }
      .ln-lite { stroke: #8a7755; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; stroke-linecap: round; }
    </style>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#1f2933"/>
    </marker>
    <marker id="ar-lite" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#8a7755"/>
    </marker>
  </defs>
  <rect class="b-bg" width="1100" height="600"/>

  <!-- Token Service -->
  <rect class="card-sage" x="400" y="24" width="300" height="104" rx="8"/>
  <text class="title" x="420" y="52">Token Service</text>
  <text class="body" x="420" y="78">•</text>
  <text class="body" x="436" y="78">Credential pools, KMS-encrypted</text>
  <text class="body" x="420" y="100">•</text>
  <text class="body" x="436" y="100">Connector OAuth tokens</text>
  <text class="foot" x="720" y="96">Connector OAuth tokens</text>
  <text class="foot" x="720" y="114">never reach the pod</text>

  <path class="ln" d="M 550 128 L 550 184" marker-end="url(#ar)"/>
  <text class="sub" x="562" y="161">Provider credentials</text>

  <!-- Agent pod -->
  <rect class="card-cream" x="40" y="190" width="220" height="250" rx="10"/>
  <text class="title" x="150" y="222" text-anchor="middle">Agent pod</text>
  <rect class="sub-cream" x="60" y="372" width="180" height="50" rx="6"/>
  <text class="mono" x="150" y="402" text-anchor="middle">credentials.json</text>

  <!-- Gateway -->
  <rect class="card-mustard" x="420" y="190" width="260" height="250" rx="10"/>
  <text class="title" x="550" y="222" text-anchor="middle">Gateway</text>
  <rect class="sub-cream" x="440" y="236" width="220" height="50" rx="6"/>
  <text class="title" x="550" y="267" text-anchor="middle">LLM Proxy</text>

  <!-- LLM provider -->
  <rect class="card-cream" x="840" y="190" width="220" height="250" rx="10"/>
  <text class="title" x="950" y="222" text-anchor="middle">LLM provider</text>

  <!-- Proxy mode -->
  <text class="section" x="340" y="248" text-anchor="middle">PROXY MODE</text>
  <text class="body" x="340" y="276" text-anchor="middle">Request with</text>
  <text class="mono" x="340" y="296" text-anchor="middle">leaseToken</text>
  <path class="ln" d="M 260 311 L 414 311" marker-end="url(#ar)"/>

  <text class="body" x="760" y="276" text-anchor="middle">Request with</text>
  <text class="body" x="760" y="296" text-anchor="middle">provider key</text>
  <path class="ln" d="M 680 311 L 834 311" marker-end="url(#ar)"/>

  <!-- Direct mode -->
  <text class="section" x="340" y="364" text-anchor="middle">DIRECT MODE</text>
  <text class="lite" x="340" y="386" text-anchor="middle">Lease with provider</text>
  <text class="lite" x="340" y="404" text-anchor="middle">credentials</text>
  <path class="ln-lite" d="M 420 418 L 246 418" marker-end="url(#ar-lite)"/>

  <path class="ln-lite" d="M 150 440 L 150 490 L 950 490 L 950 446" marker-end="url(#ar-lite)"/>
  <text class="lite" x="550" y="512" text-anchor="middle">Request with provider credentials, sent from the pod</text>

  <text class="foot" x="550" y="560" text-anchor="middle">Proxy mode keeps the provider key in the gateway. Direct mode writes provider credentials into the pod.</text>
</svg>
