<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .b-bg { fill: #ffffff; }
      .actor { fill: #ffe9c7; stroke: #1f2933; stroke-width: 2; }
      .title { fill: #1f2933; font-size: 16px; font-weight: 600; }
      .body { fill: #1f2933; font-size: 13px; }
      .step { fill: #b56b1f; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
      .mono { font-family: 'SF Mono','Menlo','Consolas',monospace; fill: #1f2933; font-size: 12px; }
      .ln { stroke: #1f2933; stroke-width: 1.6; fill: none; stroke-linecap: round; }
      .lifeline { stroke: #c0b290; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    </style>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect class="b-bg" width="1120" height="500"/>

  <rect class="actor" x="60" y="20" width="180" height="50" rx="8"/>
  <text class="title" x="150" y="52" text-anchor="middle">Client</text>

  <rect class="actor" x="440" y="20" width="240" height="50" rx="8"/>
  <text class="title" x="560" y="52" text-anchor="middle">Identity provider</text>

  <rect class="actor" x="880" y="20" width="180" height="50" rx="8"/>
  <text class="title" x="970" y="52" text-anchor="middle">Lenny gateway</text>

  <path class="lifeline" d="M 150 76 L 150 480"/>
  <path class="lifeline" d="M 560 76 L 560 480"/>
  <path class="lifeline" d="M 970 76 L 970 480"/>

  <text class="step" x="20" y="120">STEP 1</text>
  <path class="ln" d="M 154 132 L 556 132" marker-end="url(#ar)"/>
  <text class="body" x="355" y="124" text-anchor="middle">Authorization request</text>

  <text class="step" x="20" y="178">STEP 2</text>
  <path class="ln" d="M 556 190 L 154 190" marker-end="url(#ar)"/>
  <text class="body" x="355" y="182" text-anchor="middle">Authorization code</text>

  <text class="step" x="20" y="236">STEP 3</text>
  <path class="ln" d="M 154 248 L 556 248" marker-end="url(#ar)"/>
  <text class="body" x="355" y="240" text-anchor="middle">Token request (code)</text>

  <text class="step" x="20" y="294">STEP 4</text>
  <path class="ln" d="M 556 306 L 154 306" marker-end="url(#ar)"/>
  <text class="body" x="355" y="298" text-anchor="middle">ID token + access token</text>

  <text class="step" x="20" y="362">STEP 5</text>
  <path class="ln" d="M 154 374 L 966 374" marker-end="url(#ar)"/>
  <text class="body" x="560" y="358" text-anchor="middle">API request</text>
  <text class="mono" x="560" y="394" text-anchor="middle">Authorization: Bearer &lt;access_token&gt;</text>

  <text class="step" x="20" y="442">STEP 6</text>
  <path class="ln" d="M 966 454 L 154 454" marker-end="url(#ar)"/>
  <text class="body" x="560" y="446" text-anchor="middle">Response</text>
</svg>
