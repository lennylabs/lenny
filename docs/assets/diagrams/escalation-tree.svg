<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .b-bg { fill: #ffffff; }
      .card-mustard { fill: #ffe9c7; stroke: #1f2933; stroke-width: 2.2; }
      .card-cream { fill: #fffaf0; stroke: #1f2933; stroke-width: 1.8; }
      .card-sage { fill: #d6e9d2; stroke: #1f2933; stroke-width: 2; }
      .title { fill: #1f2933; font-size: 16px; font-weight: 600; }
      .body { fill: #1f2933; font-size: 13px; }
      .sub { fill: #54616e; font-size: 12px; }
      .step { fill: #b56b1f; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; }
      .ln { stroke: #1f2933; stroke-width: 1.8; fill: none; stroke-linecap: round; }
    </style>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect class="b-bg" width="1200" height="800"/>

  <rect class="card-mustard" x="500" y="20" width="200" height="50" rx="8"/>
  <text class="title" x="600" y="52" text-anchor="middle">Platform operator</text>

  <path class="ln" d="M 600 72 L 600 106" marker-end="url(#ar)"/>

  <rect class="card-cream" x="370" y="110" width="460" height="110" rx="8"/>
  <text class="title" x="600" y="138" text-anchor="middle">Can you fix this with:</text>
  <text class="body" x="390" y="166">lenny-ctl or admin API (preferred)</text>
  <text class="body" x="390" y="186">kubectl or Helm</text>
  <text class="body" x="390" y="206">cloud console (managed services)</text>

  <path class="ln" d="M 480 224 L 280 280" marker-end="url(#ar)"/>
  <text class="step" x="364" y="248">NO</text>

  <path class="ln" d="M 720 224 L 920 280" marker-end="url(#ar)"/>
  <text class="step" x="826" y="248">YES</text>

  <rect class="card-mustard" x="80" y="286" width="400" height="64" rx="8"/>
  <text class="title" x="280" y="324" text-anchor="middle">Identify the layer</text>

  <rect class="card-sage" x="720" y="286" width="400" height="64" rx="8"/>
  <text class="title" x="920" y="312" text-anchor="middle">Apply remediation</text>
  <text class="sub" x="920" y="334" text-anchor="middle">Verify recovery</text>

  <path class="ln" d="M 280 354 L 280 372 L 400 372 L 400 386" marker-end="url(#ar)"/>

  <rect class="card-cream" x="80" y="390" width="640" height="58" rx="6"/>
  <text class="body" x="100" y="416">Kubernetes layer</text>
  <text class="sub" x="100" y="436">node pressure, quotas, CNI, webhook TLS rotation</text>
  <rect class="card-cream" x="760" y="390" width="360" height="58" rx="6"/>
  <text class="title" x="940" y="424" text-anchor="middle">Cluster admin</text>
  <path class="ln" d="M 724 419 L 756 419" marker-end="url(#ar)"/>

  <rect class="card-cream" x="80" y="464" width="640" height="58" rx="6"/>
  <text class="body" x="100" y="490">Managed service</text>
  <text class="sub" x="100" y="510">Postgres, Redis, object store, KMS</text>
  <rect class="card-cream" x="760" y="464" width="360" height="58" rx="6"/>
  <text class="title" x="940" y="498" text-anchor="middle">Cloud provider support</text>
  <path class="ln" d="M 724 493 L 756 493" marker-end="url(#ar)"/>

  <rect class="card-cream" x="80" y="538" width="640" height="58" rx="6"/>
  <text class="body" x="100" y="564">Data or compliance impact</text>
  <text class="sub" x="100" y="584">credential compromise, audit gap, PII exposure</text>
  <rect class="card-cream" x="760" y="538" width="360" height="58" rx="6"/>
  <text class="title" x="940" y="572" text-anchor="middle">Security and compliance on-call</text>
  <path class="ln" d="M 724 567 L 756 567" marker-end="url(#ar)"/>

  <rect class="card-cream" x="80" y="612" width="640" height="58" rx="6"/>
  <text class="body" x="100" y="638">Billing accuracy impact</text>
  <text class="sub" x="100" y="658">quota, lease, measured usage disagrees</text>
  <rect class="card-cream" x="760" y="612" width="360" height="58" rx="6"/>
  <text class="title" x="940" y="646" text-anchor="middle">Finance ops</text>
  <text class="sub" x="940" y="664" text-anchor="middle">billing reconciliation runbook</text>
  <path class="ln" d="M 724 641 L 756 641" marker-end="url(#ar)"/>

  <rect class="card-cream" x="80" y="686" width="640" height="58" rx="6"/>
  <text class="body" x="100" y="720">Unclear or multi-layer</text>
  <rect class="card-cream" x="760" y="686" width="360" height="58" rx="6"/>
  <text class="title" x="940" y="720" text-anchor="middle">Lenny platform on-call</text>
  <path class="ln" d="M 724 715 L 756 715" marker-end="url(#ar)"/>
</svg>
