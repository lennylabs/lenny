<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .b-bg { fill: #ffffff; }
      .card { fill: #fffaf0; stroke: #1f2933; stroke-width: 1.8; }
      .card-primary { fill: #ffe9c7; stroke: #1f2933; stroke-width: 2.2; }
      .mono { font-family: 'SF Mono','Menlo','Consolas',monospace; fill: #1f2933; font-size: 13px; }
      .body { fill: #1f2933; font-size: 13px; font-style: italic; }
      .ln { stroke: #1f2933; stroke-width: 1.8; fill: none; stroke-linecap: round; }
    </style>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect class="b-bg" width="1000" height="200"/>

  <rect class="card-primary" x="40" y="74" width="140" height="48" rx="6"/>
  <text class="mono" x="110" y="104" text-anchor="middle">attached</text>

  <rect class="card" x="240" y="74" width="160" height="48" rx="6"/>
  <text class="mono" x="320" y="104" text-anchor="middle">task_cleanup</text>

  <rect class="card" x="460" y="74" width="140" height="48" rx="6"/>
  <text class="mono" x="530" y="104" text-anchor="middle">idle</text>

  <rect class="card-primary" x="800" y="74" width="160" height="48" rx="6"/>
  <text class="mono" x="880" y="104" text-anchor="middle">attached</text>

  <path class="ln" d="M 182 98 L 236 98" marker-end="url(#ar)"/>
  <path class="ln" d="M 402 98 L 456 98" marker-end="url(#ar)"/>
  <path class="ln" d="M 602 98 L 796 98" marker-end="url(#ar)"/>
  <text class="body" x="699" y="90" text-anchor="middle">next task</text>
</svg>
