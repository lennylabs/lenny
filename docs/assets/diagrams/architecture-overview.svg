<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .b-bg { fill: #ffffff; }
      .card-mustard { fill: #ffe9c7; stroke: #1f2933; stroke-width: 2.2; }
      .card-cream { fill: #fffaf0; stroke: #1f2933; stroke-width: 2; }
      .card-sage { fill: #d6e9d2; stroke: #1f2933; stroke-width: 2; }
      .card-coral { fill: #fde2d6; stroke: #c84a1d; stroke-width: 2; }
      .sub-cream { fill: #fffaf0; stroke: #1f2933; stroke-width: 1.6; }
      .title { fill: #1f2933; font-size: 17px; font-weight: 600; }
      .body { fill: #1f2933; font-size: 14px; }
      .sub { fill: #54616e; font-size: 13px; }
      .section { fill: #b56b1f; font-size: 13px; letter-spacing: 0.04em; }
      .mono { font-family: 'SF Mono','Menlo','Consolas',monospace; fill: #1f2933; font-size: 12px; }
      .foot { fill: #8a7755; font-size: 12px; }
      .ln { stroke: #1f2933; stroke-width: 1.8; fill: none; stroke-linecap: round; }
      .ln-dash { stroke: #c84a1d; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; stroke-linecap: round; }
    </style>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#1f2933"/>
    </marker>
    <marker id="ar-co" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#c84a1d"/>
    </marker>
  </defs>
  <rect class="b-bg" width="1000" height="880"/>

  <rect class="card-cream" x="280" y="30" width="440" height="58" rx="8"/>
  <text class="title" x="500" y="65" text-anchor="middle">Client / MCP Host</text>

  <path class="ln" d="M 500 88 L 500 142" marker-end="url(#ar)"/>
  <text class="sub" x="510" y="118">REST, MCP, OpenAI Chat Completions, Open Responses</text>

  <rect class="card-mustard" x="40" y="148" width="920" height="148" rx="10"/>
  <text class="section" x="60" y="170">GATEWAY EDGE REPLICAS</text>

  <rect class="sub-cream" x="50" y="184" width="210" height="98" rx="6"/>
  <text class="title" x="155" y="220" text-anchor="middle">Auth / OIDC</text>
  <text class="sub" x="155" y="244" text-anchor="middle">Tenant resolution,</text>
  <text class="sub" x="155" y="262" text-anchor="middle">token validation</text>

  <rect class="sub-cream" x="280" y="184" width="210" height="98" rx="6"/>
  <text class="title" x="385" y="220" text-anchor="middle">Policy engine</text>
  <text class="sub" x="385" y="244" text-anchor="middle">Interceptor chain,</text>
  <text class="sub" x="385" y="262" text-anchor="middle">guardrails, routing</text>

  <rect class="sub-cream" x="510" y="184" width="210" height="98" rx="6"/>
  <text class="title" x="615" y="220" text-anchor="middle">Session router</text>
  <text class="sub" x="615" y="244" text-anchor="middle">Pool claim, attach,</text>
  <text class="sub" x="615" y="262" text-anchor="middle">variant assignment</text>

  <rect class="sub-cream" x="740" y="184" width="210" height="98" rx="6"/>
  <text class="title" x="845" y="220" text-anchor="middle">MCP fabric</text>
  <text class="sub" x="845" y="244" text-anchor="middle">Tasks, elicitation,</text>
  <text class="sub" x="845" y="262" text-anchor="middle">delegation</text>

  <rect class="card-cream" x="40" y="336" width="180" height="98" rx="8"/>
  <text class="title" x="130" y="368" text-anchor="middle">Session manager</text>
  <text class="sub" x="130" y="392" text-anchor="middle">Postgres, Redis</text>

  <rect class="card-cream" x="240" y="336" width="180" height="98" rx="8"/>
  <text class="title" x="330" y="368" text-anchor="middle">Token service</text>
  <text class="sub" x="330" y="392" text-anchor="middle">KMS-backed</text>

  <rect class="card-cream" x="440" y="336" width="180" height="98" rx="8"/>
  <text class="title" x="530" y="362" text-anchor="middle">Event and</text>
  <text class="title" x="530" y="382" text-anchor="middle">checkpoint store</text>
  <text class="sub" x="530" y="406" text-anchor="middle">Resume, replay</text>

  <rect class="card-cream" x="640" y="336" width="180" height="98" rx="8"/>
  <text class="title" x="730" y="368" text-anchor="middle">Artifact store</text>
  <text class="sub" x="730" y="392" text-anchor="middle">S3-compatible</text>

  <rect class="card-coral" x="840" y="336" width="120" height="98" rx="8"/>
  <text class="title" x="900" y="362" text-anchor="middle">External</text>
  <text class="title" x="900" y="382" text-anchor="middle">connectors</text>
  <text class="sub" x="900" y="406" text-anchor="middle">GitHub, Jira,</text>
  <text class="sub" x="900" y="422" text-anchor="middle">Slack, etc.</text>

  <path class="ln" d="M 130 300 L 130 332" marker-end="url(#ar)"/>
  <path class="ln" d="M 330 300 L 330 332" marker-end="url(#ar)"/>
  <path class="ln" d="M 530 300 L 530 332" marker-end="url(#ar)"/>
  <path class="ln" d="M 730 300 L 730 332" marker-end="url(#ar)"/>

  <path class="ln-dash" d="M 330 434 L 330 450 L 900 450 L 900 434"/>
  <text class="foot" x="615" y="446" text-anchor="middle">OAuth tokens, encrypted via KMS, cached in Redis. Pods never see tokens.</text>

  <rect class="card-sage" x="40" y="466" width="920" height="78" rx="8"/>
  <text class="title" x="60" y="498">Warm pool controller</text>
  <text class="sub" x="60" y="520">Pod lifecycle, agent-sandbox CRDs, claim and drain</text>
  <text class="title" x="540" y="498">PoolScalingController</text>
  <text class="sub" x="540" y="520">Scaling decisions, variant pool sizing</text>

  <path class="ln" d="M 200 544 L 200 620" marker-end="url(#ar)"/>
  <path class="ln" d="M 500 544 L 500 620" marker-end="url(#ar)"/>
  <path class="ln" d="M 800 544 L 800 620" marker-end="url(#ar)"/>

  <text class="foot" x="500" y="616" text-anchor="middle">Gateway to pods over mTLS gRPC (data plane); controllers manage pod lifecycle</text>

  <rect class="card-cream" x="80" y="624" width="240" height="220" rx="10"/>
  <text class="section" x="100" y="648">POD A</text>
  <rect class="sub-cream" x="100" y="664" width="200" height="62" rx="6"/>
  <text class="title" x="200" y="702" text-anchor="middle">Adapter</text>
  <rect class="sub-cream" x="100" y="744" width="200" height="86" rx="6"/>
  <text class="title" x="200" y="794" text-anchor="middle">Agent</text>

  <rect class="card-cream" x="380" y="624" width="240" height="220" rx="10"/>
  <text class="section" x="400" y="648">POD B</text>
  <rect class="sub-cream" x="400" y="664" width="200" height="62" rx="6"/>
  <text class="title" x="500" y="702" text-anchor="middle">Adapter</text>
  <rect class="sub-cream" x="400" y="744" width="200" height="86" rx="6"/>
  <text class="title" x="500" y="794" text-anchor="middle">Agent</text>

  <rect class="card-cream" x="680" y="624" width="240" height="220" rx="10"/>
  <text class="section" x="700" y="648">POD C</text>
  <rect class="sub-cream" x="700" y="664" width="200" height="62" rx="6"/>
  <text class="title" x="800" y="702" text-anchor="middle">Adapter</text>
  <rect class="sub-cream" x="700" y="744" width="200" height="86" rx="6"/>
  <text class="title" x="800" y="794" text-anchor="middle">Agent</text>
</svg>
