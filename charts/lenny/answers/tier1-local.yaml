# Answer file for `lenny-ctl install --answer-file` — Tier 1, local.
#
# This drives a Tier 1 install for a local cluster or a development
# environment. The wizard layers presets/values-tier1.yaml under the
# per-question overrides composed from this file.
#
# Run:
#   lenny-ctl install --answer-file charts/lenny/answers/tier1-local.yaml
#
# The answer-file schema is documented in charts/lenny/answers/README.md.

release:
  name: lenny
  namespace: lenny-system

# Target environment. local enables global.devMode and accepts the dev
# auth mode below; no OIDC issuer is required.
environment: local

# Capacity tier. tier1 is the smallest published envelope (§17.8.2).
tier: tier1

# Profile is advisory metadata recorded from cluster detection.
profile: laptop

# dev auth mode is valid only for the local environment. It sets
# global.devMode so the multi-tenant admission controls are relaxed for
# local work.
auth:
  mode: dev

# Postgres, Redis, and objectStorage are left blank. A local install
# uses the chart defaults, which fall back to in-memory stores.
postgres:
  dsn: ""
redis:
  url: ""
objectStorage:
  endpoint: ""
  bucket: ""

# No optional admission webhooks for a local install.
features:
  llmProxy: false
  drainReadiness: false
  compliance: false
