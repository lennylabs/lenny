# §17.9.2 answer file: openshift-self-managed.
#
# Dimensions fixed: cluster=openshift, backends=self-managed
# (CloudNativePG + Redis Sentinel + MinIO), environment=prod,
# isolationProfile=sandboxed. Self-managed backends deploy PgBouncer,
# Redis Sentinel, and MinIO as Kubernetes workloads (§17.9.5).
#
# Layering: with presets/values-tierN.yaml. Supply the Sentinel and
# MinIO endpoints in an overrides file (the placeholders below are
# replaced per deployment).
#
# Leaves open: capacity tier, connection endpoints, bucket name.

cluster: openshift
backends: self-managed
environment: prod
isolationProfile: sandboxed
postgres:
  # pgbouncer: the in-cluster PgBouncer enforces the connect_query
  # __unset__ sentinel for RLS checkout safety (§12.3).
  connectionPooler: pgbouncer
redis:
  provider: sentinel
  sentinelMaster: mymaster
  sentinels:
    - "REPLACE-redis-sentinel-0.redis:26379"
    - "REPLACE-redis-sentinel-1.redis:26379"
    - "REPLACE-redis-sentinel-2.redis:26379"
objectStorage:
  provider: minio
minio:
  endpoint: "REPLACE-minio.lenny-system:9000"
  bucket: "lenny-artifacts"
