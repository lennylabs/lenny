# §17.9.2 answer file: aks-production.
#
# Dimensions fixed: cluster=aks, backends=cloud-managed (Azure Database
# for PostgreSQL + Azure Cache for Redis + Azure Blob Storage),
# environment=prod, isolationProfile=sandboxed.
#
# Layering: with presets/values-tierN.yaml. Supply the Azure Database,
# Azure Cache, and Blob Storage endpoints in an overrides file. Azure
# Blob requires the S3-compatible gateway or a thin ArtifactStore
# implementation using the Azure SDK (§17.9.3).
#
# Leaves open: capacity tier, connection endpoints, container name.

cluster: aks
backends: cloud-managed
environment: prod
isolationProfile: sandboxed
# Network posture (§13.2, §17.6). The chart's universal egress except-rules
# block RFC1918 ranges and the cloud metadata endpoint (169.254.169.254,
# the Azure IMDS) on every cluster (NET-002/057/062), so an aks install needs
# no cluster-specific egress tightening here. webhookIngressCIDR stays
# 0.0.0.0/0 by default because the AKS control plane calls admission webhooks
# from a control-plane IP that is impractical to pin without cloud-specific
# knowledge (§17.9). Narrow it to the cluster's API-server-authorized-range
# CIDR when you operate one.
# webhookIngressCIDR: "REPLACE-aks-control-plane-cidr"
postgres:
  # Azure Database for PostgreSQL ships a built-in PgBouncer.
  connectionPooler: external
  dsn: "postgres://lenny@REPLACE-acme.postgres.database.azure.com:5432/lenny?sslmode=require"
redis:
  provider: external
  url: "rediss://REPLACE-acme.redis.cache.windows.net:6380"
objectStorage:
  provider: azure
  bucket: "REPLACE-acme-lenny-artifacts"
  accountUrl: "https://REPLACE-acme.blob.core.windows.net"
