suite: §4.9 credentials namespace
release:
  name: lenny
  namespace: lenny-system
templates:
  - credentials-namespace.yaml
  - gateway-deployment.yaml
  - token-service-deployment.yaml
set:
  global.spiffeTrustDomain: lenny-test
tests:
  # spec: §4.9 "Credentials namespace." rule 1, §17.2.
  - it: renders the default Namespace with the keep annotation
    template: credentials-namespace.yaml
    documentSelector:
      path: kind
      value: Namespace
    asserts:
      - equal:
          path: metadata.name
          value: lenny-credentials
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  # spec: §4.9 "Credentials namespace." rule 2.
  - it: refuses every pod with a pods zero ResourceQuota
    template: credentials-namespace.yaml
    documentSelector:
      path: kind
      value: ResourceQuota
    asserts:
      - equal:
          path: metadata.name
          value: lenny-credentials-no-pods
      - equal:
          path: metadata.namespace
          value: lenny-credentials
      - equal:
          path: spec.hard
          value:
            pods: "0"

  # spec: §4.9 "Credentials namespace." rule 2. The quota is a security
  # control, so the agent-namespace capacity gate does not remove it.
  - it: keeps the quota when the agent-namespace quota gate is off
    template: credentials-namespace.yaml
    set:
      resourceGovernance.resourceQuota.enabled: false
    documentSelector:
      path: kind
      value: ResourceQuota
    asserts:
      - equal:
          path: spec.hard.pods
          value: "0"

  # spec: §17.6 credentials.namespace.
  - it: follows a custom credentials.namespace on every object
    template: credentials-namespace.yaml
    set:
      credentials.namespace: acme-credentials
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: metadata.namespace
          value: acme-credentials
        documentSelector:
          path: kind
          value: Role
          matchMany: true
      - equal:
          path: metadata.namespace
          value: acme-credentials
        documentSelector:
          path: kind
          value: RoleBinding
          matchMany: true
      - equal:
          path: metadata.name
          value: acme-credentials
        documentSelector:
          path: kind
          value: Namespace

  # spec: §4.9 "Credentials namespace." rule 3.
  - it: grants the Token Service get only with no resourceNames
    template: credentials-namespace.yaml
    asserts:
      - isKind:
          of: Role
        documentIndex: 2
      - equal:
          path: metadata.name
          value: lenny-token-service-credentials
        documentIndex: 2
      - isKind:
          of: RoleBinding
        documentIndex: 3
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get"]
        documentIndex: 2
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: lenny-token-service
              namespace: lenny-system
        documentIndex: 3
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: lenny-token-service-credentials
        documentIndex: 3

  # spec: §4.9 "Credentials namespace." rule 4.
  - it: grants the gateway the write verbs only with no resourceNames
    template: credentials-namespace.yaml
    asserts:
      - isKind:
          of: Role
        documentIndex: 4
      - equal:
          path: metadata.name
          value: lenny-gateway-credential-writer
        documentIndex: 4
      - isKind:
          of: RoleBinding
        documentIndex: 5
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["create", "update", "delete", "deletecollection"]
        documentIndex: 4
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: lenny-gateway
              namespace: lenny-system
        documentIndex: 5
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: lenny-gateway-credential-writer
        documentIndex: 5

  # spec: §4.9 "Credentials namespace." rule 5.
  - it: renders the Namespace and the quota with no Token Service
    template: credentials-namespace.yaml
    set:
      tokenService.enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Namespace
        documentIndex: 0
      - isKind:
          of: ResourceQuota
        documentIndex: 1

  # spec: §4.9 "Credentials namespace." rule 6.
  - it: refuses the release namespace
    template: credentials-namespace.yaml
    set:
      credentials.namespace: lenny-system
    asserts:
      - failedTemplate:
          errorPattern: "credentials.namespace is \"lenny-system\", which is the release namespace"

  - it: refuses the first agent namespace
    template: credentials-namespace.yaml
    set:
      credentials.namespace: acme-agents
      agentNamespaces:
        - name: acme-agents
        - name: acme-agents-kata
    asserts:
      - failedTemplate:
          errorPattern: "credentials.namespace is \"acme-agents\", which is an agentNamespaces entry"

  - it: refuses a later agent namespace
    template: credentials-namespace.yaml
    set:
      credentials.namespace: acme-agents-kata
      agentNamespaces:
        - name: acme-agents
        - name: acme-agents-kata
    asserts:
      - failedTemplate:
          errorPattern: "credentials.namespace is \"acme-agents-kata\", which is an agentNamespaces entry"

  # spec: §17.6 credentials.namespace. A null override removes the default,
  # so the render stops rather than passing the binaries an empty flag. The
  # schema refuses an empty string before any template runs.
  - it: refuses a null credentials.namespace
    template: token-service-deployment.yaml
    set:
      credentials.namespace: null
    asserts:
      - failedTemplate:
          errorPattern: "credentials.namespace is required"

  # spec: §4.9 "Credentials namespace.", §17.6. Both binaries read one helper.
  - it: passes the namespace to the Token Service
    template: token-service-deployment.yaml
    set:
      credentials.namespace: acme-credentials
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --secret-namespace=acme-credentials

  - it: passes the same namespace to the gateway
    template: gateway-deployment.yaml
    set:
      credentials.namespace: acme-credentials
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --credentials-namespace=acme-credentials

  # spec: §4.9 "Secret references and registration." The admin handlers parse
  # refs with or without a Token Service, so the flag stays on the dev profile.
  - it: passes the namespace to the gateway with no Token Service
    template: gateway-deployment.yaml
    set:
      tokenService.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --credentials-namespace=lenny-credentials
