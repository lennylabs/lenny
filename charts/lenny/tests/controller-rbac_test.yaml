suite: lenny-controller rbac
templates:
  - controller-rbac.yaml
tests:
  - it: renders the service account, cluster role, and bindings
    asserts:
      - hasDocuments:
          count: 5

  - it: creates the lenny-controller service account
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: lenny-controller

  - it: defines a cluster role carrying access rules
    documentIndex: 1
    asserts:
      - isKind:
          of: ClusterRole
      - isNotEmpty:
          path: rules

  - it: grants read-only Node and NetworkPolicy access for CIDR drift detection
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["nodes"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["get", "list", "watch"]

  - it: binds the cluster role to the controller service account
    documentIndex: 2
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: lenny-controller
      - equal:
          path: subjects[0].name
          value: lenny-controller

  - it: grants leader-election lease access
    documentIndex: 3
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: lenny-controller-leader-election
