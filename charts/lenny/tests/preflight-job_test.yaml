suite: §5.3/§5.2 lenny-preflight RuntimeClass and termination-grace checks
templates:
  - preflight-job.yaml
tests:
  - it: requires the sandboxed gVisor RuntimeClass by default
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--required-runtime-classes=sandboxed=gvisor"

  # spec: §10.3 lines 316, 334 (NET-064) — the preflight Job needs the
  # values at hand to feed CheckSPIFFETrustDomainUniqueness /
  # CheckSATokenAudienceUniqueness. F-10.3.5.
  - it: passes --spiffe-trust-domain and --sa-token-audience to the preflight binary
    set:
      global.saTokenAudience: lenny-gateway-acme
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--spiffe-trust-domain=cluster.local"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--sa-token-audience=lenny-gateway-acme"

  - it: still passes an empty --sa-token-audience when global.saTokenAudience is unset (chart default)
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--sa-token-audience="

  - it: requires both gVisor and Kata when microvm is also enabled
    set:
      runtimeClasses.profiles.microvm.enabled: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--required-runtime-classes=microvm=kata,sandboxed=gvisor"

  - it: requires no RuntimeClass in dev mode (runc fallback per §5.3)
    set:
      global.devMode: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--required-runtime-classes=sandboxed=gvisor"

  - it: requires no RuntimeClass when the chart renders them itself
    set:
      runtimeClasses.create: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--required-runtime-classes=sandboxed=gvisor"

  - it: grants the preflight SA RuntimeClass and SandboxTemplate read
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["node.k8s.io"]
            resources: ["runtimeclasses"]
            verbs: ["get", "list"]
      - contains:
          path: rules
          content:
            apiGroups: ["lenny.dev"]
            resources: ["sandboxtemplates"]
            verbs: ["list"]

  # spec: §13.1 lines 23/25 — the host-sharing and credential-fsGroup
  # audits reach the agent namespaces, so the workload and pod list
  # permissions are cluster-wide on the ClusterRole. F-13.1.7 / F-13.1.4.
  - it: grants cluster-wide workload and pod read for the §13.1 agent-namespace audits
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments", "daemonsets"]
            verbs: ["list"]
      - contains:
          path: rules
          content:
            apiGroups: ["batch"]
            resources: ["jobs"]
            verbs: ["list"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["list"]

  # spec: §13.1 lines 23/25 — the Job tells the preflight binary which
  # agent namespaces to scan. F-13.1.7 / F-13.1.4.
  - it: passes the chart agent namespaces to the preflight binary
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--agent-namespaces=lenny-agents,lenny-agents-kata"

  # spec: §17.6 line 534 — the preflight Job ships with a hard runtime
  # cap so a slow control plane does not hang the install.
  - it: caps preflight runtime via activeDeadlineSeconds (default 120s)
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 120

  - it: honors preflight.timeoutSeconds override
    set:
      preflight.timeoutSeconds: 240
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 240

  # spec: §17.9.3 / §17.6 line 488 — preflight passes the connection-pooler
  # selection so the CloudPoolerSentinelDefense check fires only when
  # the deployer fronts Postgres with an external proxy.
  - it: defaults --connection-pooler to pgbouncer
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--connection-pooler=pgbouncer"

  - it: surfaces --connection-pooler=external for cloud-managed Postgres
    set:
      postgres.connectionPooler: external
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--connection-pooler=external"

  - it: rejects an unrecognized postgres.connectionPooler value
    set:
      postgres.connectionPooler: rdsproxy
    asserts:
      - failedTemplate:
          errorMessage: '§17.9.3: postgres.connectionPooler must be "pgbouncer" or "external", got "rdsproxy"'

  # spec: §27.2 lines 41–42 + §27.3 — the preflight Job renders the
  # playground.* chart values into --playground-* flags so the
  # CheckPlaygroundConfig install-time gate sees them.
  # F-27.2.2 / F-27.2.4 / F-27.2.5 / F-27.2.6 / F-27.9.3.
  - it: renders the playground-config preflight inputs from chart values
    set:
      playground.enabled: true
      playground.authMode: oidc
      playground.devTenantId: alice
      playground.acknowledgeApiKeyMode: true
      tenancy.mode: multi
      global.devMode: false
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-enabled=true"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-auth-mode=oidc"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-dev-tenant-id=alice"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-multi-tenant=true"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-global-dev-mode=false"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-acknowledge-api-key-mode=true"

  - it: renders the playground-config preflight inputs at chart defaults
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-enabled=false"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-multi-tenant=false"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-acknowledge-api-key-mode=false"

  # spec: §17.2 line 56 — the fail-closed lenny-registry-digest webhook
  # must be tracked by the preflight inventory when digest pinning is on,
  # so an air-gap install cannot ship without it. F-17.2.13.
  - it: passes --feature-registry-digest=false at chart defaults
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--feature-registry-digest=false"

  - it: passes --feature-registry-digest=true when platform.registry.requireDigest is set
    set:
      platform.registry.requireDigest: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--feature-registry-digest=true"

  # §5.3 line 669 (F-5.3.5): the cosign-production advisory inputs reach
  # the preflight binary. At chart defaults the environment is dev and
  # cosign is disabled, so the advisory short-circuits to a pass.
  - it: passes --environment and --feature-cosign-verify at chart defaults
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--feature-cosign-verify=false"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--environment=dev"

  - it: surfaces --environment=prod and cosign enabled for a production install
    set:
      environment: prod
      imageVerification.cosign.enabled: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--environment=prod"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--feature-cosign-verify=true"

  # §12.4 (F-12.4.15): the BYO-Redis maxmemory-policy audit is opt-in.
  # At chart defaults no --redis-url flag is rendered.
  - it: omits --redis-url at chart defaults
    documentSelector:
      path: kind
      value: Job
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--redis-url=rediss://:pw@redis-master:6379"

  - it: renders --redis-url when checkRedisMaxmemoryPolicy is set
    set:
      preflight.checkRedisMaxmemoryPolicy: true
      redis.url: "rediss://:pw@redis-master:6379"
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--redis-url=rediss://:pw@redis-master:6379"

# §10.3 (NET-064) F-10.3.4: global.spiffeTrustDomain is a required chart
# value with no default; a placeholder lets the gateway-deployment
# annotation `required` guard render in this suite.
set:
  global.spiffeTrustDomain: cluster.local
