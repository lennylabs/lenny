suite: §5.3/§5.2 lenny-preflight RuntimeClass and termination-grace checks
templates:
  - preflight-job.yaml
tests:
  - it: requires the sandboxed gVisor RuntimeClass by default
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--required-runtime-classes=sandboxed=gvisor"

  # spec: §25.4 lines 1462-1470 / F-25.4.25 — the preflight Job feeds the
  # prometheus-reachability check ops.prometheus.url, global.deploymentTier,
  # and monitoring.acknowledgeNoPrometheus.
  - it: passes the §25.4 prometheus-reachability inputs
    set:
      ops.prometheus.url: "http://prom.monitoring.svc:9090"
      global.deploymentTier: "tier2"
      monitoring.acknowledgeNoPrometheus: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--prometheus-url=http://prom.monitoring.svc:9090"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--platform-tier=tier2"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--acknowledge-no-prometheus=true"

  # spec: §17.9.2 line 1372 / §17.9.11 — preflight.skipNetworkProbes is
  # false by default so the backend-reachability probes run. F-17.9.11.
  - it: passes --skip-network-probes=false by default
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--skip-network-probes=false"

  # The §17.9.2 airgap answer file sets skipNetworkProbes=true so the
  # preflight Job succeeds with no egress to the managed backends. F-17.9.11.
  - it: passes --skip-network-probes=true when preflight.skipNetworkProbes is set
    set:
      preflight.skipNetworkProbes: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--skip-network-probes=true"

  # spec: §10.3 lines 316, 334 (NET-064) — the preflight Job needs the
  # values at hand to feed CheckSPIFFETrustDomainUniqueness /
  # CheckSATokenAudienceUniqueness. F-10.3.5.
  - it: passes --spiffe-trust-domain and --sa-token-audience to the preflight binary
    set:
      global.saTokenAudience: lenny-gateway-acme
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--spiffe-trust-domain=cluster.local"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--sa-token-audience=lenny-gateway-acme"

  - it: still passes an empty --sa-token-audience when global.saTokenAudience is unset (chart default)
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--sa-token-audience="

  # spec: §10.3 line 304 / F-10.3.12 — the preflight Job carries the
  # certmanager.enabled value so the cert-manager version check knows
  # whether cert-manager >= v1.12.0 is a prerequisite.
  - it: passes --certmanager-enabled=true by default
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--certmanager-enabled=true"

  - it: passes --certmanager-enabled=false for a mesh-managed install
    set:
      certmanager.enabled: false
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--certmanager-enabled=false"

  - it: requires both gVisor and Kata when microvm is also enabled
    set:
      runtimeClasses.profiles.microvm.enabled: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--required-runtime-classes=microvm=kata,sandboxed=gvisor"

  - it: requires no RuntimeClass in dev mode (runc fallback per §5.3)
    set:
      global.devMode: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--required-runtime-classes=sandboxed=gvisor"

  - it: requires no RuntimeClass when the chart renders them itself
    set:
      runtimeClasses.create: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--required-runtime-classes=sandboxed=gvisor"

  - it: grants the preflight SA RuntimeClass and SandboxTemplate read
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["node.k8s.io"]
            resources: ["runtimeclasses"]
            verbs: ["get", "list"]
      - contains:
          path: rules
          content:
            apiGroups: ["lenny.dev"]
            resources: ["sandboxtemplates"]
            verbs: ["list"]

  # spec: §13.1 lines 23/25 — the host-sharing and credential-fsGroup
  # audits reach the agent namespaces, so the workload and pod list
  # permissions are cluster-wide on the ClusterRole. F-13.1.7 / F-13.1.4.
  - it: grants cluster-wide workload and pod read for the §13.1 agent-namespace audits
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments", "daemonsets"]
            verbs: ["list"]
      - contains:
          path: rules
          content:
            apiGroups: ["batch"]
            resources: ["jobs"]
            verbs: ["list"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["list"]

  # spec: §13.1 lines 23/25 — the Job tells the preflight binary which
  # agent namespaces to scan. F-13.1.7 / F-13.1.4.
  - it: passes the chart agent namespaces to the preflight binary
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--agent-namespaces=lenny-agents,lenny-agents-kata"

  # spec: §17.6 line 534 — the preflight Job ships with a hard runtime
  # cap so a slow control plane does not hang the install.
  - it: caps preflight runtime via activeDeadlineSeconds (default 120s)
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 120

  - it: honors preflight.timeoutSeconds override
    set:
      preflight.timeoutSeconds: 240
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 240

  # spec: §17.9.3 / §17.6 line 488 — preflight passes the connection-pooler
  # selection so the CloudPoolerSentinelDefense check fires only when
  # the deployer fronts Postgres with an external proxy.
  - it: defaults --connection-pooler to pgbouncer
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--connection-pooler=pgbouncer"

  - it: surfaces --connection-pooler=external for cloud-managed Postgres
    set:
      postgres.connectionPooler: external
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--connection-pooler=external"

  - it: rejects an unrecognized postgres.connectionPooler value
    set:
      postgres.connectionPooler: rdsproxy
    asserts:
      - failedTemplate:
          errorMessage: '§17.9.3: postgres.connectionPooler must be "pgbouncer" or "external", got "rdsproxy"'

  # spec: §27.2 lines 41–42 + §27.3 — the preflight Job renders the
  # playground.* chart values into --playground-* flags so the
  # CheckPlaygroundConfig install-time gate sees them.
  # F-27.2.2 / F-27.2.4 / F-27.2.5 / F-27.2.6 / F-27.9.3.
  - it: renders the playground-config preflight inputs from chart values
    set:
      playground.enabled: true
      playground.authMode: oidc
      playground.devTenantId: alice
      playground.acknowledgeApiKeyMode: true
      tenancy.mode: multi
      global.devMode: false
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-enabled=true"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-auth-mode=oidc"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-dev-tenant-id=alice"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-multi-tenant=true"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-global-dev-mode=false"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-acknowledge-api-key-mode=true"

  - it: renders the playground-config preflight inputs at chart defaults
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-enabled=false"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-multi-tenant=false"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--playground-acknowledge-api-key-mode=false"

  # spec: §17.2 line 56 — the fail-closed lenny-registry-digest webhook
  # must be tracked by the preflight inventory when digest pinning is on,
  # so an air-gap install cannot ship without it. F-17.2.13.
  - it: passes --feature-registry-digest=false at chart defaults
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--feature-registry-digest=false"

  - it: passes --feature-registry-digest=true when platform.registry.requireDigest is set
    set:
      platform.registry.requireDigest: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--feature-registry-digest=true"

  # §5.3 line 669 (F-5.3.5): the cosign-production advisory inputs reach
  # the preflight binary. At chart defaults the environment is dev and
  # cosign is disabled, so the advisory short-circuits to a pass.
  - it: passes --environment and --feature-cosign-verify at chart defaults
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--feature-cosign-verify=false"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--environment=dev"

  - it: surfaces --environment=prod and cosign enabled for a production install
    set:
      environment: prod
      imageVerification.cosign.enabled: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--environment=prod"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--feature-cosign-verify=true"

  # §12.4 (F-12.4.15): the BYO-Redis maxmemory-policy audit is opt-in.
  # At chart defaults no --redis-url flag is rendered.
  - it: omits --redis-url at chart defaults
    documentSelector:
      path: kind
      value: Job
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--redis-url=rediss://:pw@redis-master:6379"

  - it: renders --redis-url when checkRedisMaxmemoryPolicy is set
    set:
      preflight.checkRedisMaxmemoryPolicy: true
      redis.url: "rediss://:pw@redis-master:6379"
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--redis-url=rediss://:pw@redis-master:6379"

  # §13.2 NET-040 / NET-022 (F-13.2.13): the preflight Job passes the
  # cluster-CIDR values so CheckClusterCIDRDiscovery can validate the
  # apiserver ClusterIP and the node pod CIDRs against the discovered
  # addressing.
  - it: passes the §13.2 cluster-CIDR discovery values at chart defaults
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--kube-apiserver-cidr=10.96.0.0/12"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--exclude-cluster-service-cidr=10.96.0.0/12"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--exclude-cluster-pod-cidr=10.244.0.0/16"

  # §13.2 OTLP-068 (F-13.2.9): the preflight Job passes the OTLP TLS
  # posture so the otlp-tls check can reject an http:// scheme and probe
  # the collector TLS handshake.
  - it: passes the §13.2 OTLP TLS posture at chart defaults
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--otlp-tls-enabled=true"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--otlp-endpoint="

  - it: surfaces a configured OTLP endpoint to the otlp-tls check
    set:
      observability.otlpEndpoint: "https://otel-collector.lenny-system.svc:4317"
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--otlp-endpoint=https://otel-collector.lenny-system.svc:4317"

  # spec: §12.9 line 1050 — the preflight Job carries global.devMode and
  # preflight.attestVolumeEncryption so the volume-encryption check can
  # exempt dev installs and consume the operator attestation. F-12.9.12.
  - it: passes the §12.9 volume-encryption flags at their defaults
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--dev-mode=false"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--attest-volume-encryption=false"

  - it: surfaces the volume-encryption attestation when set
    set:
      preflight.attestVolumeEncryption: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--attest-volume-encryption=true"

  # spec: §17.6 line 532 — preflight.enabled: false skips the whole
  # admission-plane preflight Job (air-gapped / constrained installs).
  # The SA, RBAC, and Job all disappear. F-17.6.11.
  - it: renders nothing when preflight.enabled is false
    set:
      preflight.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # The Job renders by default (preflight.enabled defaults to true in
  # values.yaml), so the skip-knob is opt-in.
  - it: renders the Job by default
    documentSelector:
      path: kind
      value: Job
    asserts:
      - isKind:
          of: Job

# §10.3 (NET-064) F-10.3.4: global.spiffeTrustDomain is a required chart
# value with no default; a placeholder lets the gateway-deployment
# annotation `required` guard render in this suite.
set:
  global.spiffeTrustDomain: cluster.local
