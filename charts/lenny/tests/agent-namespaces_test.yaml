suite: agent namespaces
templates:
  - agent-namespaces.yaml
tests:
  - it: renders one Namespace per configured agent namespace
    set:
      agentNamespaces:
        - name: lenny-agents
        - name: lenny-agents-kata
    asserts:
      - hasDocuments:
          count: 2

  - it: names and labels the agent namespace
    set:
      agentNamespaces:
        - name: lenny-agents
    asserts:
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: lenny-agents
      - equal:
          path: metadata.labels["lenny.dev/agent-namespace"]
          value: "true"
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: carries the restricted-profile Pod Security Admission labels at warn and audit
    set:
      agentNamespaces:
        - name: lenny-agents
    asserts:
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/warn"]
          value: restricted
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/audit"]
          value: restricted
      - notExists:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]

  - it: renders nothing when no agent namespaces are configured
    set:
      agentNamespaces: []
    asserts:
      - hasDocuments:
          count: 0
