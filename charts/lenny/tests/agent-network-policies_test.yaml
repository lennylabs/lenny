suite: agent-namespace NetworkPolicies
release:
  name: lenny
  namespace: lenny-system
templates:
  - agent-network-policies.yaml
tests:
  - it: renders the baseline policy set per agent namespace without OTLP
    set:
      agentNamespaces:
        - name: lenny-agents
    asserts:
      # default-deny-all, allow-gateway-ingress, allow-pod-egress-base,
      # allow-pod-egress-llm-proxy, allow-pod-egress-provider-direct,
      # allow-pod-egress-internet — no OTLP, no kube-dns opt-out by default.
      - hasDocuments:
          count: 6

  # spec: §13.2 — allow-pod-egress-base must never carry a kube-system
  # CoreDNS peer. Its broad lenny.dev/managed selector would otherwise let
  # every agent pod bypass the dedicated instance's query logging, rate
  # limiting, and response filtering. The kube-system fallback is the
  # separate allow-pod-egress-kube-dns policy, scoped to the dns-policy
  # label. This holds even with coredns.deploy=false and devMode on, the
  # condition under which a prior dev-mode fallback rule was added in error.
  - it: allow-pod-egress-base never permits a kube-system DNS peer
    set:
      agentNamespaces:
        - name: lenny-agents
      coredns:
        deploy: false
      global:
        devMode: true
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.name
          value: allow-pod-egress-base
      # Exactly two egress rules: the gateway gRPC peer and the dedicated
      # CoreDNS peer. No third (kube-system) DNS peer is appended.
      - lengthEqual:
          path: spec.egress
          count: 2
      - equal:
          path: spec.egress[1].to[0].podSelector.matchLabels["lenny.dev/component"]
          value: coredns
      # The second (DNS) peer targets the dedicated CoreDNS in the release
      # namespace, never kube-system. With only two egress rules asserted
      # above, no kube-system DNS peer can exist on the base policy.
      - equal:
          path: spec.egress[1].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: lenny-system

  - it: does not render allow-pod-egress-otlp when otlpEndpoint is unset
    set:
      agentNamespaces:
        - name: lenny-agents
    documentIndex: 3
    asserts:
      # The baseline set ends at allow-pod-egress-llm-proxy (index 3);
      # no allow-pod-egress-otlp document follows it.
      - equal:
          path: metadata.name
          value: allow-pod-egress-llm-proxy
      - lengthEqual:
          path: spec.policyTypes
          count: 1

  - it: renders allow-pod-egress-otlp when otlpEndpoint is configured
    set:
      agentNamespaces:
        - name: lenny-agents
      observability:
        otlpEndpoint: https://otel-collector.lenny-system.svc:4317
    asserts:
      # baseline 6 + OTLP (index 4, ahead of provider-direct/internet) = 7.
      - hasDocuments:
          count: 7

  - it: scopes the OTLP egress policy to managed agent pods
    set:
      agentNamespaces:
        - name: lenny-agents
      observability:
        otlpEndpoint: https://otel-collector.lenny-system.svc:4317
    documentIndex: 4
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: allow-pod-egress-otlp
      - equal:
          path: spec.podSelector.matchLabels["lenny.dev/managed"]
          value: "true"
      - contains:
          path: spec.policyTypes
          content: Egress

  - it: targets the in-cluster OTLP collector by namespace and pod label
    set:
      agentNamespaces:
        - name: lenny-agents
      observability:
        otlpEndpoint: https://otel-collector.lenny-system.svc:4317
    documentIndex: 4
    asserts:
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: lenny-system
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels.app
          value: otel-collector
      - equal:
          path: spec.egress[0].ports[0].port
          value: 4317
      - equal:
          path: spec.egress[0].ports[0].protocol
          value: TCP

  - it: targets an external OTLP collector by ipBlock CIDR when otlpCIDR is set
    set:
      agentNamespaces:
        - name: lenny-agents
      observability:
        otlpEndpoint: https://otel.acme.com:4317
        otlpCIDR: 10.20.0.0/16
    documentIndex: 4
    asserts:
      - equal:
          path: spec.egress[0].to[0].ipBlock.cidr
          value: 10.20.0.0/16
      - notExists:
          path: spec.egress[0].to[0].namespaceSelector

  - it: honors a custom OTLP namespace, pod label, and port
    set:
      agentNamespaces:
        - name: lenny-agents
      observability:
        otlpEndpoint: https://otel.acme.com:4318
        otlpNamespace: observability
        otlpPodLabel: app.kubernetes.io/name
        otlpPodLabelValue: opentelemetry-collector
        otlpPort: 4318
    documentIndex: 4
    asserts:
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: observability
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: opentelemetry-collector
      - equal:
          path: spec.egress[0].ports[0].port
          value: 4318

  - it: renders the OTLP policy into every agent namespace
    set:
      agentNamespaces:
        - name: lenny-agents
        - name: lenny-agents-kata
      observability:
        otlpEndpoint: https://otel.acme.com:4317
    asserts:
      # 7 policies (baseline 6 + OTLP) per namespace, 2 namespaces.
      - hasDocuments:
          count: 14

  # spec: §13.2 lines 424-432 — the per-pool egress profiles. F-13.2.11.
  - it: renders the provider-direct egress profile policy scoped to the egress-profile label
    set:
      agentNamespaces:
        - name: lenny-agents
      egressCIDRs:
        providers:
          - 52.95.0.0/16
    documentIndex: 4
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: allow-pod-egress-provider-direct
      - equal:
          path: spec.podSelector.matchLabels["lenny.dev/egress-profile"]
          value: provider-direct
      - equal:
          path: spec.egress[0].to[0].ipBlock.cidr
          value: 52.95.0.0/16
      # IMDS endpoints are excepted unconditionally (NET-044).
      - contains:
          path: spec.egress[0].to[0].ipBlock.except
          content: 169.254.169.254/32
      - equal:
          path: spec.egress[0].ports[0].port
          value: 443

  - it: renders the provider-direct policy with no CIDR peer when providers is empty
    set:
      agentNamespaces:
        - name: lenny-agents
    documentIndex: 4
    asserts:
      - equal:
          path: metadata.name
          value: allow-pod-egress-provider-direct
      - notExists:
          path: spec.egress

  # spec: §13.2 line 432 (NET-002) — the internet profile with two parallel
  # ipBlock peers and family-partitioned except blocks. F-13.2.11.
  - it: renders the internet egress profile policy with family-partitioned except blocks
    set:
      agentNamespaces:
        - name: lenny-agents
    documentIndex: 5
    asserts:
      - equal:
          path: metadata.name
          value: allow-pod-egress-internet
      - equal:
          path: spec.podSelector.matchLabels["lenny.dev/egress-profile"]
          value: internet
      - equal:
          path: spec.egress[0].to[0].ipBlock.cidr
          value: 0.0.0.0/0
      - contains:
          path: spec.egress[0].to[0].ipBlock.except
          content: 10.96.0.0/12
      - contains:
          path: spec.egress[0].to[0].ipBlock.except
          content: 169.254.169.254/32
      - equal:
          path: spec.egress[1].to[0].ipBlock.cidr
          value: ::/0
      - contains:
          path: spec.egress[1].to[0].ipBlock.except
          content: fd00:ec2::254/128

  # spec: §13.2 line 488 — the kube-system DNS opt-out policy, scoped to
  # the dns-policy label, rendered only when allowClusterDefaultOptOut is
  # set. F-13.2.4.
  - it: adds the kube-dns opt-out policy only when allowClusterDefaultOptOut is set
    set:
      agentNamespaces:
        - name: lenny-agents
      coredns:
        allowClusterDefaultOptOut: true
    asserts:
      # baseline 6 + kube-dns opt-out (no OTLP) = 7.
      - hasDocuments:
          count: 7

  - it: scopes the kube-dns opt-out policy to the dns-policy label
    set:
      agentNamespaces:
        - name: lenny-agents
      coredns:
        allowClusterDefaultOptOut: true
    documentIndex: 6
    asserts:
      - equal:
          path: metadata.name
          value: allow-pod-egress-kube-dns
      - equal:
          path: spec.podSelector.matchLabels["lenny.dev/dns-policy"]
          value: cluster-default
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["k8s-app"]
          value: kube-dns

  # spec: §13.2 (NET-071) — allow-pod-egress-objectstore re-admits agent-pod
  # egress to object storage for checkpoint chunk PUT/GET against
  # gateway-minted presigned capabilities. A stock install resolves the
  # in-memory blob store (provider=minio, empty endpoint, minio.deploy
  # false), so no object-store egress policy renders and the baseline count
  # stays 6.
  - it: renders no object-store egress policy for the in-memory store
    set:
      agentNamespaces:
        - name: lenny-agents
    asserts:
      - hasDocuments:
          count: 6

  # spec: §13.2 (NET-071) — the in-cluster arm renders when the chart
  # deploys MinIO. The peer selects the MinIO pod by namespace and the
  # canonical lenny.dev/component: minio label on the MinIO TLS port. This
  # is the egress half paired with the allow-minio agent-namespace ingress
  # clause; neither renders without the other under minio.deploy.
  - it: renders the in-cluster arm when minio.deploy is true
    set:
      agentNamespaces:
        - name: lenny-agents
      minio:
        deploy: true
    asserts:
      - hasDocuments:
          count: 7
      - documentIndex: 6
        equal:
          path: metadata.name
          value: allow-pod-egress-objectstore
      - documentIndex: 6
        equal:
          path: spec.podSelector.matchLabels["lenny.dev/managed"]
          value: "true"
      - documentIndex: 6
        equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["lenny.dev/component"]
          value: minio
      - documentIndex: 6
        equal:
          path: spec.egress[0].ports[0].port
          value: 9443

  # spec: §13.2 (NET-071) — the out-of-band arm renders an ipBlock peer from
  # objectStorage.egressCIDRs on the MinIO TLS port for an external
  # self-managed MinIO (endpoint set, minio.deploy false).
  - it: renders the out-of-band arm as an ipBlock on the MinIO TLS port
    set:
      agentNamespaces:
        - name: lenny-agents
      minio:
        endpoint: "minio.acme.example:9443"
      objectStorage:
        egressCIDRs:
          - "10.20.0.0/24"
    documentIndex: 6
    asserts:
      - equal:
          path: metadata.name
          value: allow-pod-egress-objectstore
      - equal:
          path: spec.egress[0].to[0].ipBlock.cidr
          value: "10.20.0.0/24"
      - equal:
          path: spec.egress[0].ports[0].port
          value: 9443

  # spec: §13.2 (NET-071, NET-002) — the cloud-managed arm renders an
  # ipBlock peer from objectStorage.egressCIDRs on TCP 443 for an s3, gcs,
  # or azure provider. There is no ingress-side clause; the cloud path rests
  # entirely on this egress arm.
  - it: renders the cloud-managed arm as an ipBlock on TCP 443
    set:
      agentNamespaces:
        - name: lenny-agents
      objectStorage:
        provider: s3
        egressCIDRs:
          - "52.0.0.0/16"
          - "52.1.0.0/16"
    documentIndex: 6
    asserts:
      - equal:
          path: metadata.name
          value: allow-pod-egress-objectstore
      - equal:
          path: spec.egress[0].to[0].ipBlock.cidr
          value: "52.0.0.0/16"
      - equal:
          path: spec.egress[0].to[1].ipBlock.cidr
          value: "52.1.0.0/16"
      - equal:
          path: spec.egress[0].ports[0].port
          value: 443

  # spec: §13.2 (NET-071) — an egress rule with no peers admits every
  # destination, so a cloud-managed or out-of-band store with an empty
  # objectStorage.egressCIDRs renders no policy (and fails preflight, §17.6)
  # rather than a fail-open all-destinations rule.
  - it: renders no object-store policy for a cloud provider with no egress CIDRs
    set:
      agentNamespaces:
        - name: lenny-agents
      objectStorage:
        provider: s3
    asserts:
      - hasDocuments:
          count: 6
