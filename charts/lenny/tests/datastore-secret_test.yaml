suite: lenny-datastore-conn secret
templates:
  - datastore-secret.yaml
tests:
  - it: renders nothing with stock values (production unchanged)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Secret with the postgres DSN when postgres.dsn is set
    set:
      postgres.dsn: "postgres://lenny:lenny@db.svc:5432/lenny?sslmode=disable"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: lenny-datastore-conn
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData["postgres-dsn"]
          value: "postgres://lenny:lenny@db.svc:5432/lenny?sslmode=disable"
      - isNull:
          path: stringData["redis-url"]
      - isNull:
          path: stringData["minio-access-key"]

  # spec: §12.3 line 103 — the separate billing/audit instance DSN
  # renders its own Secret key when postgres.billingAuditDSN is set.
  # F-12.3.5.
  - it: renders the billing/audit DSN key when postgres.billingAuditDSN is set
    set:
      postgres.billingAuditDSN: "postgres://lenny:lenny@billing-db.svc:5432/lenny?sslmode=disable"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData["billing-audit-postgres-dsn"]
          value: "postgres://lenny:lenny@billing-db.svc:5432/lenny?sslmode=disable"
      - isNull:
          path: stringData["postgres-dsn"]

  - it: omits the billing/audit DSN key when only postgres.dsn is set
    set:
      postgres.dsn: "postgres://lenny:lenny@db.svc:5432/lenny?sslmode=disable"
    asserts:
      - isNull:
          path: stringData["billing-audit-postgres-dsn"]

  - it: renders the redis URL key when redis.url is set
    set:
      redis.url: "redis://redis.svc:6379"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData["redis-url"]
          value: "redis://redis.svc:6379"
      - isNull:
          path: stringData["postgres-dsn"]

  - it: renders the MinIO credential keys when minio.endpoint is set
    set:
      minio.endpoint: "minio.svc:9000"
      minio.accessKey: "ak"
      minio.secretKey: "sk"
      minio.bucket: "lenny-artifacts"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData["minio-access-key"]
          value: "ak"
      - equal:
          path: stringData["minio-secret-key"]
          value: "sk"
      - isNull:
          path: stringData["postgres-dsn"]

  - it: renders all keys when all three stores are configured
    set:
      postgres.dsn: "postgres://lenny:lenny@db.svc:5432/lenny?sslmode=disable"
      redis.url: "redis://redis.svc:6379"
      minio.endpoint: "minio.svc:9000"
      minio.accessKey: "ak"
      minio.secretKey: "sk"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData["postgres-dsn"]
          value: "postgres://lenny:lenny@db.svc:5432/lenny?sslmode=disable"
      - equal:
          path: stringData["redis-url"]
          value: "redis://redis.svc:6379"
      - equal:
          path: stringData["minio-access-key"]
          value: "ak"
      - equal:
          path: stringData["minio-secret-key"]
          value: "sk"

  # spec: §12.4 lines 237-245 — per-concern Redis URLs render their own
  # Secret keys when set; an unset concern writes no key. F-12.4.16.
  - it: renders per-concern Redis URL keys for the split concerns only
    set:
      redis.concerns.quotaUrl: "rediss://:pw@quota.svc:6380/0"
      redis.concerns.delegationUrl: "rediss://:pw@dlg.svc:6380/0"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData["redis-quota-url"]
          value: "rediss://:pw@quota.svc:6380/0"
      - equal:
          path: stringData["redis-delegation-url"]
          value: "rediss://:pw@dlg.svc:6380/0"
      - isNull:
          path: stringData["redis-coordination-url"]
      - isNull:
          path: stringData["redis-cache-pubsub-url"]
      - isNull:
          path: stringData["redis-session-data-url"]

  # A per-concern URL alone (no base redis.url) still renders the Secret.
  - it: renders the Secret for a per-concern URL with no base redis.url
    set:
      redis.concerns.cachePubSubUrl: "rediss://:pw@cache.svc:6380/0"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData["redis-cache-pubsub-url"]
          value: "rediss://:pw@cache.svc:6380/0"
      - isNull:
          path: stringData["redis-url"]

  # spec: §17.9.3 (F-17.9.4) — the Sentinel topology carries its AUTH
  # credentials in the Secret. The data password and the optional sentinel
  # password render under provider=sentinel.
  - it: renders the Sentinel AUTH credentials when redis.provider=sentinel
    set:
      redis.provider: sentinel
      redis.sentinels: ["s0:26379"]
      redis.sentinelMaster: lenny-master
      redis.password: data-pw
      redis.sentinelPassword: sentinel-pw
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData["redis-password"]
          value: data-pw
      - equal:
          path: stringData["redis-sentinel-password"]
          value: sentinel-pw

  # The data password is not rendered for the external/url topology
  # (credentials ride inline in the rediss:// URL there).
  - it: omits redis-password for the external url topology
    set:
      redis.url: "rediss://:pw@r.svc:6380/0"
      redis.password: stray
    asserts:
      - isNull:
          path: stringData["redis-password"]
      - equal:
          path: stringData["redis-url"]
          value: "rediss://:pw@r.svc:6380/0"
