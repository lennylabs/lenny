suite: in-cluster PgBouncer topology (§12.3)
templates:
  - pgbouncer-deployment.yaml
tests:
  # spec: §12.3 — cloud-managed deployments front Postgres with
  # the provider's proxy, so the in-cluster Deployment is opt-in and the
  # stock render emits nothing. F-12.3.10.
  - it: renders nothing when pgbouncer.deploy is false (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Deployment, Service, and PDB when pgbouncer.deploy is true
    set:
      pgbouncer.deploy: true
      postgres.deploy: true
    asserts:
      - hasDocuments:
          count: 3

  # spec: §12.3 — minimum 2 replicas; pod carries the
  # lenny.dev/component: pgbouncer label the §13.2 NetworkPolicies select.
  - it: Deployment has 2 replicas and the pgbouncer component label
    set:
      pgbouncer.deploy: true
      postgres.deploy: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.metadata.labels["lenny.dev/component"]
          value: pgbouncer
      - equal:
          path: spec.selector.matchLabels["lenny.dev/component"]
          value: pgbouncer

  # spec: §12.3 — transaction mode pooling for RLS via SET LOCAL.
  - it: pgbouncer container runs transaction pool mode and mounts the connect_query ConfigMap
    set:
      pgbouncer.deploy: true
      postgres.deploy: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POOL_MODE
            value: "transaction"
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pgbouncer-config
            configMap:
              name: lenny-pgbouncer-config

  # spec: §12.3 — readiness verifies backend Postgres
  # connectivity via SELECT 1 through the DATABASE_URL secret.
  - it: readiness probe runs SELECT 1 through DATABASE_URL from an operator-supplied secret
    set:
      pgbouncer.deploy: true
      pgbouncer.upstream.host: postgres.acme.internal
      pgbouncer.databaseURLSecret: lenny-pgbouncer-url
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          value: 'psql "$DATABASE_URL" -tAc "SELECT 1"'
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: lenny-pgbouncer-url
                key: url

  # spec: §12.3, §17.9.5 — with postgres.deploy and no operator secret,
  # PgBouncer and its exporter read the CloudNativePG app Secret, whose
  # credentials the entrypoint writes into the auth file. F-17.9.25.
  - it: DATABASE_URL defaults to the CloudNativePG app Secret under postgres.deploy
    set:
      pgbouncer.deploy: true
      postgres.deploy: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: lenny-postgres-app
                key: uri
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: lenny-postgres-app
                key: uri
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_TYPE
            value: scram-sha-256

  # F-17.9.25 — the container runs on a read-only root filesystem, so the
  # ConfigMap mounts beside an emptyDir at /etc/pgbouncer, where the
  # command copies pgbouncer.ini and the entrypoint writes the auth file.
  - it: copies the ConfigMap pgbouncer.ini into a writable emptyDir before the entrypoint runs
    set:
      pgbouncer.deploy: true
      postgres.deploy: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: pgbouncer-config
            mountPath: /etc/pgbouncer-config
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: pgbouncer-run
            mountPath: /etc/pgbouncer
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pgbouncer-run
            emptyDir: {}
      - equal:
          path: spec.template.spec.containers[0].command[2]
          value: cp /etc/pgbouncer-config/pgbouncer.ini /etc/pgbouncer/pgbouncer.ini && exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 5432

  # spec: §13.2, §12.3 — the render refuses a PgBouncer no client can
  # use. F-17.9.25.
  - it: refuses a listen port other than the TCP 5432 the §13.2 policies admit
    set:
      pgbouncer.deploy: true
      postgres.deploy: true
      pgbouncer.port: 6432
    asserts:
      - failedTemplate:
          errorPattern: "pgbouncer.port must be 5432"

  - it: refuses a deployed PgBouncer with no upstream Postgres
    set:
      pgbouncer.deploy: true
      pgbouncer.databaseURLSecret: lenny-pgbouncer-url
    asserts:
      - failedTemplate:
          errorPattern: "requires an upstream Postgres"

  - it: refuses a deployed PgBouncer with no DATABASE_URL
    set:
      pgbouncer.deploy: true
      pgbouncer.upstream.host: postgres.acme.internal
    asserts:
      - failedTemplate:
          errorPattern: "requires a DATABASE_URL"

  - it: refuses a deployed PgBouncer without the pgbouncer.ini ConfigMap
    set:
      pgbouncer.deploy: true
      postgres.deploy: true
      pgbouncer.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "requires pgbouncer.enabled"

  # spec: §12.3 — pgbouncer_exporter sidecar emits the metrics the
  # §16.5 PgBouncerPoolSaturated alert evaluates. F-12.3.11.
  - it: renders the pgbouncer_exporter sidecar with the metrics port and scrape annotations
    set:
      pgbouncer.deploy: true
      postgres.deploy: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers
          content:
            name: pgbouncer-exporter
          any: true
          count: 1
      - equal:
          path: spec.template.spec.containers[?(@.name == "pgbouncer-exporter")].ports[?(@.name == "metrics")].containerPort
          value: 9127
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9127"

  - it: omits the exporter sidecar when pgbouncer.exporter.enabled is false
    set:
      pgbouncer.deploy: true
      postgres.deploy: true
      pgbouncer.exporter.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      # Exactly one container: one container is named pgbouncer, and no
      # container carries another name.
      - contains:
          path: spec.template.spec.containers
          content:
            name: pgbouncer
          any: true
          count: 1
      - notExists:
          path: spec.template.spec.containers[?(@.name != "pgbouncer")]

  # spec: §12.3 — PDB uses minAvailable: 1 at 2 replicas and
  # maxUnavailable: 1 at 3+ replicas.
  - it: PDB uses minAvailable 1 at the default replica count
    set:
      pgbouncer.deploy: true
      postgres.deploy: true
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
      - isNull:
          path: spec.maxUnavailable

  - it: PDB switches to maxUnavailable 1 at 3 or more replicas
    set:
      pgbouncer.deploy: true
      postgres.deploy: true
      pgbouncer.replicas: 3
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - isNull:
          path: spec.minAvailable

  # spec: §12.3 — ClusterIP Service fronts the replicas for
  # transparent failover; §13.2 — clients connect on TCP 5432.
  - it: Service selects the pgbouncer pods and exposes the client and metrics ports
    set:
      pgbouncer.deploy: true
      postgres.deploy: true
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.selector["lenny.dev/component"]
          value: pgbouncer
      - contains:
          path: spec.ports
          content:
            name: pgbouncer
            port: 5432
            targetPort: pgbouncer
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9127
            targetPort: metrics
