suite: §17.8.4 capacity tier presets
release:
  name: lenny
  namespace: lenny-system
tests:
  # Tier 1 preset.
  - it: tier1 preset sizes the gateway Deployment to 2 replicas
    values:
      - ../presets/values-tier1.yaml
    template: gateway-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: tier1 preset sizes the token service to 2 replicas
    values:
      - ../presets/values-tier1.yaml
    template: token-service-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: tier1 preset applies the Tier 1 ResourceQuota row
    values:
      - ../presets/values-tier1.yaml
    set:
      agentNamespaces:
        - name: lenny-agents
    template: resourcequota.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.hard.pods
          value: "200"
      - equal:
          path: spec.hard["requests.memory"]
          value: "800Gi"

  - it: tier1 preset leaves the periodic test-restore CronJob disabled
    values:
      - ../presets/values-tier1.yaml
    template: restore-test-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 0

  # Tier 2 preset.
  - it: tier2 preset sizes the gateway Deployment to 3 replicas
    values:
      - ../presets/values-tier2.yaml
    template: gateway-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: tier2 preset applies the Tier 2 ResourceQuota row
    values:
      - ../presets/values-tier2.yaml
    set:
      agentNamespaces:
        - name: lenny-agents
    template: resourcequota.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.hard.pods
          value: "2500"
      - equal:
          path: spec.hard["requests.memory"]
          value: "10Ti"

  - it: tier2 preset enables the production posture on lenny-ops
    values:
      - ../presets/values-tier2.yaml
    template: ops-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --production=true

  # Tier 3 preset.
  - it: tier3 preset sizes the gateway Deployment to 5 replicas
    values:
      - ../presets/values-tier3.yaml
    template: gateway-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 5

  - it: tier3 preset sizes the token service to 4 replicas
    values:
      - ../presets/values-tier3.yaml
    template: token-service-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 4

  - it: tier3 preset sizes the controller to 3 replicas
    values:
      - ../presets/values-tier3.yaml
    template: controller-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: tier3 preset applies the Tier 3 ResourceQuota row
    values:
      - ../presets/values-tier3.yaml
    set:
      agentNamespaces:
        - name: lenny-agents
    template: resourcequota.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.hard.pods
          value: "15000"
      - equal:
          path: spec.hard["requests.cpu"]
          value: "30000"
      - equal:
          path: spec.hard["requests.memory"]
          value: "60Ti"

  - it: tier3 preset enables the periodic test-restore CronJob
    values:
      - ../presets/values-tier3.yaml
    template: restore-test-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 6
      - documentIndex: 5
        isKind:
          of: CronJob

  # spec: §4.1 / §17.1 — tier3 enables cross-zone topology spread on
  # the gateway Deployment so a zone failure does not collapse capacity
  # onto a single replica set.
  - it: tier3 preset enables cross-zone topology spread on the gateway
    values:
      - ../presets/values-tier3.yaml
    template: gateway-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.topologySpreadConstraints
          content:
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: lenny
                lenny.dev/component: gateway

  # spec: §17.8.2 — tier3 enables the preferred hostname-level
  # podAntiAffinity so kubectl drain of a node hosting more than one
  # gateway pod does not serialize evictions through the PDB.
  - it: tier3 preset enables soft hostname podAntiAffinity on the gateway
    values:
      - ../presets/values-tier3.yaml
    template: gateway-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
