suite: lenny-gateway deployment
templates:
  - gateway-deployment.yaml
tests:
  - it: renders the service account, cluster role, binding, deployment, and services
    asserts:
      - hasDocuments:
          count: 6

  - it: renders a Deployment named lenny-gateway
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: lenny-gateway
      - equal:
          path: metadata.labels["lenny.dev/component"]
          value: gateway

  - it: runs two replicas by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: runs under the lenny-gateway service account
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: lenny-gateway

  - it: defaults the image tag to the chart appVersion
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/lennylabs/lenny-gateway:0.1.0

  - it: exposes the HTTP and gRPC container ports
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8080
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: grpc
            containerPort: 50051

  - it: binds the REST and GatewayControl listeners via args
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --addr=:8080
      - contains:
          path: spec.template.spec.containers[0].args
          content: --grpc-addr=:50051

  - it: omits the LLM proxy listener when the feature flag is off
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --llm-proxy-addr=:8443

  - it: adds the LLM proxy listener and port when features.llmProxy is on
    set:
      features.llmProxy: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --llm-proxy-addr=:8443
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: llm-proxy
            containerPort: 8443

  - it: applies the restricted pod security posture
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: probes the gateway health endpoint
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz

  - it: grants SandboxClaim create and Sandbox status RBAC
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["lenny.dev"]
            resources: ["sandboxclaims"]
            verbs: ["get", "list", "watch", "create"]
      - contains:
          path: rules
          content:
            apiGroups: ["lenny.dev"]
            resources: ["sandboxes/status"]
            verbs: ["get", "update", "patch"]

  - it: renders the lenny-gateway ClusterIP Service with HTTP, gRPC, and metrics ports
    documentIndex: 4
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: lenny-gateway
      - contains:
          path: spec.ports
          content:
            name: http
            port: 8080
            targetPort: http
      - contains:
          path: spec.ports
          content:
            name: grpc
            port: 50051
            targetPort: grpc
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9090
            targetPort: http

  - it: renders the lenny-gateway-pods headless Service for per-replica DNS
    documentIndex: 5
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: lenny-gateway-pods
      - equal:
          path: spec.clusterIP
          value: None
