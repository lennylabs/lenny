  # values to the gateway binary. F-8.10.6 / F-8.10.9 / F-8.10.10.
  - it: wires LENNY_DELEGATION_MAX_LEVEL_RECOVERY_SECONDS from the chart default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_DELEGATION_MAX_LEVEL_RECOVERY_SECONDS
            value: "120"

  - it: wires LENNY_DELEGATION_MAX_TREE_RECOVERY_SECONDS from the chart default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_DELEGATION_MAX_TREE_RECOVERY_SECONDS
            value: "600"

  - it: wires LENNY_DELEGATION_CASCADE_TIMEOUT_SECONDS from the chart default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_DELEGATION_CASCADE_TIMEOUT_SECONDS
            value: "3600"

  - it: wires LENNY_DELEGATION_MAX_ORPHAN_TASKS_PER_TENANT from the chart default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_DELEGATION_MAX_ORPHAN_TASKS_PER_TENANT
            value: "100"

  - it: wires LENNY_DELEGATION_MAX_TREE_RECOVERY_SECONDS from a delegation.maxTreeRecoverySeconds override
    set:
      delegation.maxTreeRecoverySeconds: 1800
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_DELEGATION_MAX_TREE_RECOVERY_SECONDS
            value: "1800"

  - it: wires LENNY_DELEGATION_MAX_ORPHAN_TASKS_PER_TENANT from a delegation.maxOrphanTasksPerTenant override
    set:
      delegation.maxOrphanTasksPerTenant: 250
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_DELEGATION_MAX_ORPHAN_TASKS_PER_TENANT
            value: "250"

  # spec: §11.3 line 215 — credentials.expiryWarningLeadSeconds (default
  # 3600s) flows through to LENNY_CREDENTIALS_EXPIRY_WARNING_LEAD_SECONDS.
  # F-11.3.20.
  - it: wires LENNY_CREDENTIALS_EXPIRY_WARNING_LEAD_SECONDS from the chart default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_CREDENTIALS_EXPIRY_WARNING_LEAD_SECONDS
            value: "3600"

  # spec: §11.3 line 215 — operator override propagates to the binary.
  # F-11.3.20.
  - it: wires LENNY_CREDENTIALS_EXPIRY_WARNING_LEAD_SECONDS from a credentials.expiryWarningLeadSeconds override
    set:
      credentials.expiryWarningLeadSeconds: 7200
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_CREDENTIALS_EXPIRY_WARNING_LEAD_SECONDS
            value: "7200"

  # spec: §4.1 / §16.5 — when gateway.streamCeiling is set explicitly
  # it overrides the maxSessionsPerReplica fallback.
  - it: renders LENNY_STREAM_CEILING from gateway.streamCeiling when set
    set:
      gateway.streamCeiling: 300
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_STREAM_CEILING
            value: "300"

  - it: wires LENNY_POSTGRES_DSN from the datastore Secret when postgres.dsn is set
    set:
      postgres.dsn: "postgres://lenny:lenny@db.svc:5432/lenny?sslmode=disable"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_POSTGRES_DSN
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: postgres-dsn
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_URL
          any: true

  # spec: §12.3 line 103 — the gateway reads LENNY_PG_BILLING_AUDIT_DSN
  # from the datastore Secret when the separate billing/audit instance is
  # configured. F-12.3.5.
  - it: wires LENNY_PG_BILLING_AUDIT_DSN from the datastore Secret when postgres.billingAuditDSN is set
    set:
      postgres.billingAuditDSN: "postgres://lenny:lenny@billing-db.svc:5432/lenny?sslmode=disable"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_PG_BILLING_AUDIT_DSN
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: billing-audit-postgres-dsn

  - it: omits LENNY_PG_BILLING_AUDIT_DSN when only postgres.dsn is set
    set:
      postgres.dsn: "postgres://lenny:lenny@db.svc:5432/lenny?sslmode=disable"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_PG_BILLING_AUDIT_DSN
          any: true

  - it: wires LENNY_REDIS_URL from the datastore Secret when redis.url is set
    set:
      redis.url: "redis://redis.svc:6379"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_URL
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: redis-url

  - it: wires the MinIO env from values and Secret when minio.endpoint is set
    set:
      backends: "embedded"
      minio.endpoint: "minio.svc:9000"
      minio.accessKey: "ak"
      minio.secretKey: "sk"
      minio.bucket: "lenny-artifacts"
      minio.tls.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_ENDPOINT
            value: "minio.svc:9000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_BUCKET
            value: "lenny-artifacts"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_USE_SSL
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: minio-access-key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: minio-secret-key

  - it: omits the playground flags when the playground is disabled
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --playground-enabled

  - it: renders the playground flags when the playground is enabled
    set:
      playground.enabled: true
      playground.authMode: dev
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --playground-enabled
      - contains:
          path: spec.template.spec.containers[0].args
          content: --playground-auth-mode=dev
      - contains:
          path: spec.template.spec.containers[0].args
          content: --playground-bearer-ttl-seconds=900

  # spec: §27.2 line 41 — the chart's playground.sessionLabels map
  # renders as a comma-separated key=value flag value. F-27.2.1.
  - it: renders the playground.sessionLabels default {origin=playground}
    set:
      playground.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --playground-session-labels=origin=playground,

  - it: renders operator-supplied playground.sessionLabels entries
    set:
      playground.enabled: true
      playground.sessionLabels:
        origin: playground
        environment: stage
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --playground-session-labels=environment=stage,origin=playground,

  # spec: §9.4 line 202 — the chart's memory block renders the
  # --memory-max-per-user and --memory-record-count-interval flags on
  # the Deployment so deployers can tune both knobs without editing
  # the binary. F-9.4.5 / F-9.4.1.
  - it: renders memory store knobs from the memory block by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --memory-max-per-user=10000
      - contains:
          path: spec.template.spec.containers[0].args
          content: --memory-record-count-interval=60s
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --memory-enabled=false

  # spec: §9.4 / §12.8 line 746 — memory.enabled: false renders the
  # explicit --memory-enabled=false flag so the gateway skips the
  # MemoryStore wiring and the §12.8 preflight. F-9.4.7.
  - it: renders --memory-enabled=false when the memory store is disabled
    set:
      memory.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --memory-enabled=false

  # spec: §4.1 / §17.1 — a stock render carries no
  # topologySpreadConstraints and no podAntiAffinity so Tier 1
  # single-zone installs work without extra schedulable nodes.
  - it: omits topology spread and podAntiAffinity by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isNull:
          path: spec.template.spec.topologySpreadConstraints
      - isNull:
          path: spec.template.spec.affinity

  # spec: §4.1 / §17.1 — when gateway.topologySpread.enabled is true
  # the Deployment carries the operator-supplied constraints. The
  # default zone constraint uses ScheduleAnyway so a brief zone
  # capacity shortfall does not block scale-up.
  - it: renders topology spread constraints when gateway.topologySpread.enabled is true
    set:
      gateway.topologySpread.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.topologySpreadConstraints
          content:
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: lenny
                lenny.dev/component: gateway

  # spec: §17.8.2 — the preferred podAntiAffinity form is the Tier 3
  # default so it does not block scale-up when a zone temporarily
  # runs short of nodes.
  - it: renders preferred podAntiAffinity when gateway.podAntiAffinity.enabled is true
    set:
      gateway.podAntiAffinity.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchLabels["lenny.dev/component"]
          value: gateway

  # spec: §17.8.2 — operators with a guaranteed gateway node pool >=
  # maxReplicas may swap the preferred rule for required so the
  # scheduler refuses to co-locate pods on the same node.
  - it: renders required podAntiAffinity when schedulingRule is required
    set:
      gateway.podAntiAffinity.enabled: true
      gateway.podAntiAffinity.schedulingRule: required
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey
          value: kubernetes.io/hostname
      - isNull:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution

  # spec: §4.3 line 205 — when gateway.spiffe.enabled the chart mounts
  # a cert-manager-csi-driver-spiffe volume instead of the shared
  # lenny-gateway-tls Secret so each replica presents a per-replica
  # SPIFFE identity. Compromising one replica yields a per-pod key
  # whose SPIFFE URI is attributable independently.
  - it: mounts a per-replica SPIFFE CSI volume when gateway.spiffe.enabled
    set:
      gateway.spiffe.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: lenny-gateway-tls
            secret:
              secretName: lenny-gateway-tls
              defaultMode: 0400
      - contains:
          path: spec.template.spec.volumes
          content:
            name: lenny-gateway-tls
            csi:
              driver: csi.cert-manager.io
              readOnly: true
              volumeAttributes:
                spiffe.csi.cert-manager.io/trust-domain: cluster.local
                spiffe.csi.cert-manager.io/identity-template: "spiffe://cluster.local/gateway/{{ .PodName }}"

  # spec: §4.3 line 205 — the SPIFFE trust domain can be overridden
  # per-deployment so multi-tenant clusters can scope identities to a
  # known trust anchor (e.g. spiffe://acme.com/...).
  - it: honors gateway.spiffe.trustDomain override
    set:
      gateway.spiffe.enabled: true
      gateway.spiffe.trustDomain: lenny.acme.com
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: lenny-gateway-tls
            csi:
              driver: csi.cert-manager.io
              readOnly: true
              volumeAttributes:
                spiffe.csi.cert-manager.io/trust-domain: lenny.acme.com
                spiffe.csi.cert-manager.io/identity-template: "spiffe://lenny.acme.com/gateway/{{ .PodName }}"

  # spec: §4.4 line 256 — `periodicCheckpointIntervalSeconds` default
  # is 600 s (10 minutes). The chart renders the value as the
  # --checkpoint-interval flag so a tier preset can override it from
  # Helm without a binary change.
  - it: renders --checkpoint-interval from gateway.periodicCheckpointIntervalSeconds
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --checkpoint-interval=600s

  # spec: §4.4 line 258 — `periodicCheckpointJitterFraction` default is
  # 0.2. The chart renders the value as the --checkpoint-jitter-fraction
  # flag.
  - it: renders --checkpoint-jitter-fraction from gateway.periodicCheckpointJitterFraction
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --checkpoint-jitter-fraction=0.2

  # spec: §4.4 line 256 — operators may override the periodic checkpoint
  # cadence via Helm; the rendered flag matches the value.
  - it: honors gateway.periodicCheckpointIntervalSeconds override
    set:
      gateway.periodicCheckpointIntervalSeconds: 300
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --checkpoint-interval=300s

  # spec: §4.4 line 258 — operators may override the periodic checkpoint
  # jitter fraction via Helm; the rendered flag matches the value.
  - it: honors gateway.periodicCheckpointJitterFraction override
    set:
      gateway.periodicCheckpointJitterFraction: 0.5
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --checkpoint-jitter-fraction=0.5

  # spec: §15.5 item 1; docs/api/index.md line 124 — the default chart
  # ships with no deprecated REST versions, so the gateway container
  # does NOT carry --deprecated-api-versions and the middleware is
  # inert. F-15.5.11.
  - it: omits --deprecated-api-versions when gateway.deprecatedAPIVersions is empty
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --deprecated-api-versions=

  # spec: §15.5 item 1; docs/api/index.md line 124 — operators declare
  # the sunset list via gateway.deprecatedAPIVersions; the chart joins
  # the values with `,` and renders a single flag the gateway parses
  # into the in-memory deprecation set. F-15.5.11.
  - it: renders --deprecated-api-versions joined from the chart list
    set:
      gateway.deprecatedAPIVersions: [v1, v2]
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --deprecated-api-versions=v1,v2

# §10.3 (NET-064) F-10.3.4: global.spiffeTrustDomain is a required chart
# value with no default; a placeholder lets the gateway-deployment
# annotation `required` guard render in this suite.
set:
  global.spiffeTrustDomain: cluster.local
