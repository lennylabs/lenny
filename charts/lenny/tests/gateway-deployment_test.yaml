suite: lenny-gateway deployment
templates:
  - gateway-deployment.yaml
tests:
  # spec: §4.3 line 195 / §10.3 — when mtls.enabled the gateway mounts
  # the lenny-gateway-tls Secret and passes the --token-service-tls-*
  # flags so the gRPC dial to the Token Service presents a client cert
  # signed by the cluster-internal CA.
  - it: mounts the lenny-gateway-tls Secret when mtls.enabled (default)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: lenny-gateway-tls
            secret:
              secretName: lenny-gateway-tls
              defaultMode: 0400
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: lenny-gateway-tls
            mountPath: /etc/lenny/mtls
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --token-service-tls-cert=/etc/lenny/mtls/tls.crt
      - contains:
          path: spec.template.spec.containers[0].args
          content: --token-service-tls-key=/etc/lenny/mtls/tls.key
      - contains:
          path: spec.template.spec.containers[0].args
          content: --token-service-ca=/etc/lenny/mtls/ca.crt

  # spec: §4.3 line 195 / §10.3 — when mtls.enabled=false the chart
  # skips the volume mount and the --token-service-tls-* flags so the
  # gateway dials the Token Service in plaintext.
  - it: omits token-service mTLS volume mounts and flags when mtls.enabled=false
    set:
      mtls.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --token-service-tls-cert=/etc/lenny/mtls/tls.crt

  - it: renders the service account, cluster role, binding, deployment, services, and the §4.1 PodDisruptionBudget by default
    asserts:
      - hasDocuments:
          count: 7

  - it: renders the §4.1 PodDisruptionBudget with maxUnavailable 1 and the gateway selector
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    asserts:
      - equal:
          path: metadata.name
          value: lenny-gateway
      - equal:
          path: metadata.labels["lenny.dev/component"]
          value: gateway
      - equal:
          path: spec.maxUnavailable
          value: 1
      - equal:
          path: spec.selector.matchLabels["lenny.dev/component"]
          value: gateway
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: lenny

  - it: omits the PodDisruptionBudget when gateway.podDisruptionBudget.enabled is false
    set:
      gateway.podDisruptionBudget.enabled: false
    asserts:
      - hasDocuments:
          count: 6
      # The PDB document is the seventh document on the default render
      # (after SA, ClusterRole, ClusterRoleBinding, Deployment, Service,
      # headless Service). When the opt-out is set the document count
      # drops to six, so no PodDisruptionBudget is rendered.

  - it: renders a Deployment named lenny-gateway
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: lenny-gateway
      - equal:
          path: metadata.labels["lenny.dev/component"]
          value: gateway

  - it: renders the §4.1 / §17.1 RollingUpdate strategy with maxUnavailable 1 and maxSurge 25%
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 25%

  - it: honors a custom rollingUpdate override
    set:
      gateway.rollingUpdate.maxUnavailable: 2
      gateway.rollingUpdate.maxSurge: 50%
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 2
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 50%

  - it: runs two replicas by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: runs under the lenny-gateway service account
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: lenny-gateway

  - it: defaults the image tag to the chart appVersion
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/lennylabs/lenny-gateway:0.1.0

  - it: exposes the HTTP and gRPC container ports
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8080
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: grpc
            containerPort: 50051

  - it: binds the REST and GatewayControl listeners via args
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --addr=:8080
      - contains:
          path: spec.template.spec.containers[0].args
          content: --grpc-addr=:50051

  - it: wires the gateway to lenny-token-service over gRPC for §4.3 credential materialization
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --token-service-grpc-addr=lenny-token-service.NAMESPACE.svc:50052
    release:
      namespace: NAMESPACE

  # spec: F-4.3.12 / §4.3 line 193 — the gateway reverse-proxies
  # /v1/oauth/* to the Token Service HTTP listener so the §13.3
  # canonical endpoint is served by the actual minter.
  - it: wires the §4.3 canonical token endpoint to lenny-token-service over HTTP
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --token-service-http-url=http://lenny-token-service.NAMESPACE.svc:8081
    release:
      namespace: NAMESPACE

  # spec: F-4.3.11 — the gateway receives its KMS provider selector
  # from kms.provider so cloud installs can swap the in-process random
  # KEK for an AWS/GCP/Azure KEK behind the same kms.Provider seam.
  - it: renders the §4 / §17.5 KMS provider flags
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kms-provider=local
      - contains:
          path: spec.template.spec.containers[0].args
          content: --environment=dev

  - it: omits the LLM proxy listener when the feature flag is off
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --llm-proxy-addr=:8443

  - it: adds the LLM proxy listener and port when features.llmProxy is on
    set:
      features.llmProxy: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --llm-proxy-addr=:8443
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: llm-proxy
            containerPort: 8443

  - it: applies the restricted pod security posture
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: probes the gateway health endpoint
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz

  - it: grants SandboxClaim create+delete and Sandbox status RBAC
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["lenny.dev"]
            resources: ["sandboxclaims"]
            verbs: ["get", "list", "watch", "create", "delete"]
      - contains:
          path: rules
          content:
            apiGroups: ["lenny.dev"]
            resources: ["sandboxes/status"]
            verbs: ["get", "update", "patch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list", "watch", "patch"]

  - it: renders the lenny-gateway ClusterIP Service with HTTP, gRPC, and metrics ports
    documentIndex: 4
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: lenny-gateway
      - contains:
          path: spec.ports
          content:
            name: http
            port: 8080
            targetPort: http
      - contains:
          path: spec.ports
          content:
            name: grpc
            port: 50051
            targetPort: grpc
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9090
            targetPort: http

  - it: renders the lenny-gateway-pods headless Service for per-replica DNS
    documentIndex: 5
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: lenny-gateway-pods
      - equal:
          path: spec.clusterIP
          value: None

  - it: renders POD_NAME, LENNY_MAX_SESSIONS_PER_REPLICA, and §4.1 extraction-threshold env with stock values (no data-store env)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      # POD_NAME + LENNY_MAX_SESSIONS_PER_REPLICA + LENNY_MIN_REPLICAS
      # + LENNY_STREAM_CEILING + LENNY_TERMINATION_GRACE_SECONDS
      # + 8 extraction-threshold gauges + LENNY_POOLER_MODE
      # (§4.2 line 165) + POD_NAMESPACE (§10.4 PDB poller) = 15.
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 15
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: POD_NAME
      # §10.4 PDB poller — POD_NAMESPACE via downward API.
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: POD_NAMESPACE
      - equal:
          path: spec.template.spec.containers[0].env[2].name
          value: LENNY_MAX_SESSIONS_PER_REPLICA
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: "50"
      # §4.1 / §16.5 GatewayNoHealthyReplicas alert denominator gauge.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MIN_REPLICAS
            value: "2"
      # §4.1 / §16.5 GatewayActiveStreamsHigh alert denominator gauge.
      # Falls back to gateway.maxSessionsPerReplica when streamCeiling
      # is unset.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_STREAM_CEILING
            value: "50"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_EXTRACTION_THRESHOLD_STREAM_PROXY_QUEUE_DEPTH
            value: "500"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_EXTRACTION_THRESHOLD_UPLOAD_HANDLER_ACTIVE_CONCURRENT
            value: "200"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_EXTRACTION_THRESHOLD_MCP_FABRIC_ACTIVE_DELEGATIONS
            value: "1000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_EXTRACTION_THRESHOLD_LLM_PROXY_ACTIVE_CONNECTIONS
            value: "2000"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_POSTGRES_DSN
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_ENDPOINT
          any: true
      # §4.2 line 165 — LENNY_POOLER_MODE defaults to `transactional`.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_POOLER_MODE
            value: "transactional"

  # spec: §4.2 line 165 — pgbouncer.poolerMode = external propagates
  # to the gateway as LENNY_POOLER_MODE=external. The gateway logs
  # the value at startup; the load-bearing __all__-sentinel guard is
  # enforced by the migration 0057 trigger via the
  # lenny.allow_all_sentinel GUC.
  - it: renders LENNY_POOLER_MODE from pgbouncer.poolerMode override
    set:
      pgbouncer.poolerMode: "external"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_POOLER_MODE
            value: "external"

  - it: renders the §4.1 extractionThresholds from a Helm-value override
    set:
      gateway.extractionThresholds.streamProxy.queueDepth: 750
      gateway.extractionThresholds.uploadHandler.activeConcurrent: 350
      gateway.extractionThresholds.mcpFabric.activeDelegations: 2500
      gateway.extractionThresholds.llmProxy.activeConnections: 4000
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_EXTRACTION_THRESHOLD_STREAM_PROXY_QUEUE_DEPTH
            value: "750"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_EXTRACTION_THRESHOLD_UPLOAD_HANDLER_ACTIVE_CONCURRENT
            value: "350"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_EXTRACTION_THRESHOLD_MCP_FABRIC_ACTIVE_DELEGATIONS
            value: "2500"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_EXTRACTION_THRESHOLD_LLM_PROXY_ACTIVE_CONNECTIONS
            value: "4000"

  - it: renders the §4.1 maxSessionsPerReplica from the Helm value override
    set:
      gateway.maxSessionsPerReplica: 200
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MAX_SESSIONS_PER_REPLICA
            value: "200"

  # spec: §4.1 / §16.5 — the chart renders LENNY_MIN_REPLICAS from
  # autoscaling.minReplicas so a tier-preset override flows into the
  # GatewayNoHealthyReplicas alert.
  - it: renders LENNY_MIN_REPLICAS from autoscaling.minReplicas
    set:
      autoscaling.minReplicas: 7
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MIN_REPLICAS
            value: "7"

  # spec: §4.1 / §16.5 — when gateway.streamCeiling is set explicitly
  # it overrides the maxSessionsPerReplica fallback.
  - it: renders LENNY_STREAM_CEILING from gateway.streamCeiling when set
    set:
      gateway.streamCeiling: 300
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_STREAM_CEILING
            value: "300"

  - it: wires LENNY_POSTGRES_DSN from the datastore Secret when postgres.dsn is set
    set:
      postgres.dsn: "postgres://lenny:lenny@db.svc:5432/lenny?sslmode=disable"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_POSTGRES_DSN
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: postgres-dsn
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_URL
          any: true

  - it: wires LENNY_REDIS_URL from the datastore Secret when redis.url is set
    set:
      redis.url: "redis://redis.svc:6379"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_URL
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: redis-url

  - it: wires the MinIO env from values and Secret when minio.endpoint is set
    set:
      backends: "embedded"
      minio.endpoint: "minio.svc:9000"
      minio.accessKey: "ak"
      minio.secretKey: "sk"
      minio.bucket: "lenny-artifacts"
      minio.tls.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_ENDPOINT
            value: "minio.svc:9000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_BUCKET
            value: "lenny-artifacts"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_USE_SSL
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: minio-access-key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: minio-secret-key

  - it: omits the playground flags when the playground is disabled
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --playground-enabled

  - it: renders the playground flags when the playground is enabled
    set:
      playground.enabled: true
      playground.authMode: dev
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --playground-enabled
      - contains:
          path: spec.template.spec.containers[0].args
          content: --playground-auth-mode=dev
      - contains:
          path: spec.template.spec.containers[0].args
          content: --playground-bearer-ttl-seconds=900

  # spec: §4.1 / §17.1 — a stock render carries no
  # topologySpreadConstraints and no podAntiAffinity so Tier 1
  # single-zone installs work without extra schedulable nodes.
  - it: omits topology spread and podAntiAffinity by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isNull:
          path: spec.template.spec.topologySpreadConstraints
      - isNull:
          path: spec.template.spec.affinity

  # spec: §4.1 / §17.1 — when gateway.topologySpread.enabled is true
  # the Deployment carries the operator-supplied constraints. The
  # default zone constraint uses ScheduleAnyway so a brief zone
  # capacity shortfall does not block scale-up.
  - it: renders topology spread constraints when gateway.topologySpread.enabled is true
    set:
      gateway.topologySpread.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.topologySpreadConstraints
          content:
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: lenny
                lenny.dev/component: gateway

  # spec: §17.8.2 — the preferred podAntiAffinity form is the Tier 3
  # default so it does not block scale-up when a zone temporarily
  # runs short of nodes.
  - it: renders preferred podAntiAffinity when gateway.podAntiAffinity.enabled is true
    set:
      gateway.podAntiAffinity.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchLabels["lenny.dev/component"]
          value: gateway

  # spec: §17.8.2 — operators with a guaranteed gateway node pool >=
  # maxReplicas may swap the preferred rule for required so the
  # scheduler refuses to co-locate pods on the same node.
  - it: renders required podAntiAffinity when schedulingRule is required
    set:
      gateway.podAntiAffinity.enabled: true
      gateway.podAntiAffinity.schedulingRule: required
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey
          value: kubernetes.io/hostname
      - isNull:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution

  # spec: §4.3 line 205 — when gateway.spiffe.enabled the chart mounts
  # a cert-manager-csi-driver-spiffe volume instead of the shared
  # lenny-gateway-tls Secret so each replica presents a per-replica
  # SPIFFE identity. Compromising one replica yields a per-pod key
  # whose SPIFFE URI is attributable independently.
  - it: mounts a per-replica SPIFFE CSI volume when gateway.spiffe.enabled
    set:
      gateway.spiffe.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: lenny-gateway-tls
            secret:
              secretName: lenny-gateway-tls
              defaultMode: 0400
      - contains:
          path: spec.template.spec.volumes
          content:
            name: lenny-gateway-tls
            csi:
              driver: csi.cert-manager.io
              readOnly: true
              volumeAttributes:
                spiffe.csi.cert-manager.io/trust-domain: cluster.local
                spiffe.csi.cert-manager.io/identity-template: "spiffe://cluster.local/gateway/{{ .PodName }}"

  # spec: §4.3 line 205 — the SPIFFE trust domain can be overridden
  # per-deployment so multi-tenant clusters can scope identities to a
  # known trust anchor (e.g. spiffe://acme.com/...).
  - it: honors gateway.spiffe.trustDomain override
    set:
      gateway.spiffe.enabled: true
      gateway.spiffe.trustDomain: lenny.acme.com
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: lenny-gateway-tls
            csi:
              driver: csi.cert-manager.io
              readOnly: true
              volumeAttributes:
                spiffe.csi.cert-manager.io/trust-domain: lenny.acme.com
                spiffe.csi.cert-manager.io/identity-template: "spiffe://lenny.acme.com/gateway/{{ .PodName }}"

  # spec: §4.4 line 256 — `periodicCheckpointIntervalSeconds` default
  # is 600 s (10 minutes). The chart renders the value as the
  # --checkpoint-interval flag so a tier preset can override it from
  # Helm without a binary change.
  - it: renders --checkpoint-interval from gateway.periodicCheckpointIntervalSeconds
    documentSelector:
