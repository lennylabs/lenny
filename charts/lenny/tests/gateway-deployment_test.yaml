suite: lenny-gateway deployment
templates:
  - gateway-deployment.yaml
tests:
  # spec: §4.3 line 195 / §10.3 — when mtls.enabled the gateway mounts
  # the lenny-gateway-tls Secret and passes the --token-service-tls-*
  # flags so the gRPC dial to the Token Service presents a client cert
  # signed by the cluster-internal CA.
  - it: mounts the lenny-gateway-tls Secret when mtls.enabled (default)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: lenny-gateway-tls
            secret:
              secretName: lenny-gateway-tls
              defaultMode: 0400
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: lenny-gateway-tls
            mountPath: /etc/lenny/mtls
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --token-service-tls-cert=/etc/lenny/mtls/tls.crt
      - contains:
          path: spec.template.spec.containers[0].args
          content: --token-service-tls-key=/etc/lenny/mtls/tls.key
      - contains:
          path: spec.template.spec.containers[0].args
          content: --token-service-ca=/etc/lenny/mtls/ca.crt

  # spec: §4.3 line 195 / §10.3 — when mtls.enabled=false the chart
  # skips the volume mount and the --token-service-tls-* flags so the
  # gateway dials the Token Service in plaintext.
  - it: omits token-service mTLS volume mounts and flags when mtls.enabled=false
    set:
      mtls.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --token-service-tls-cert=/etc/lenny/mtls/tls.crt
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --adapter-tls-cert=/etc/lenny/mtls/tls.crt

  # spec: §4.7 / §10.3 line 320 (NET-060) — the same lenny-gateway-tls
  # Secret carries the client cert the gateway presents to each pod
  # adapter's gRPC listener; without these flags the gateway dials
  # adapters in plaintext. F-10.3.10.
  - it: passes --adapter-tls-* flags when mtls.enabled (default)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --adapter-tls-cert=/etc/lenny/mtls/tls.crt
      - contains:
          path: spec.template.spec.containers[0].args
          content: --adapter-tls-key=/etc/lenny/mtls/tls.key
      - contains:
          path: spec.template.spec.containers[0].args
          content: --adapter-ca=/etc/lenny/mtls/ca.crt

  # spec: §10.3 line 321 (NET-060) — the gateway validates each inbound
  # pod certificate's SPIFFE URI SAN against this trust domain at the
  # GatewayControl handshake; without the flag the listener falls back
  # to CA-only trust. F-10.3.1.
  - it: passes --spiffe-trust-domain when mtls.enabled (default)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --spiffe-trust-domain=cluster.local

  - it: renders --spiffe-trust-domain from a deployment-specific global.spiffeTrustDomain
    set:
      global.spiffeTrustDomain: lenny-acme-prod
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --spiffe-trust-domain=lenny-acme-prod

  - it: omits --spiffe-trust-domain when mtls.enabled=false
    set:
      mtls.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --spiffe-trust-domain=cluster.local

  # spec: §8.6 line 712 — the auto-mode lease-extension rate-limit
  # deployment default renders only when set; the spec default (no limit)
  # omits the flag. F-8.6.7.
  - it: renders --lease-extension-auto-max-per-min when gateway.leaseExtension.autoModeMaxPerMinute is set
    set:
      gateway.leaseExtension.autoModeMaxPerMinute: 30
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --lease-extension-auto-max-per-min=30

  - it: omits --lease-extension-auto-max-per-min by default (no limit)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --lease-extension-auto-max-per-min=0

  # spec: §11.1 line 8 / line 9 (F-11.1.3 / F-11.1.4) — the global,
  # per-user, per-runtime concurrent-session caps and the per-user
  # active-delegated-children cap render env vars only when configured > 0.
  - it: renders the §11.1 concurrent-session and delegated-children admission caps when set
    set:
      gateway.concurrentSessions.global: 500
      gateway.concurrentSessions.perUser: 20
      gateway.concurrentSessions.perRuntime: 100
      delegation.maxActiveChildrenPerUser: 15
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MAX_CONCURRENT_SESSIONS_GLOBAL
            value: "500"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MAX_CONCURRENT_SESSIONS_PER_USER
            value: "20"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MAX_CONCURRENT_SESSIONS_PER_RUNTIME
            value: "100"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_DELEGATION_MAX_ACTIVE_CHILDREN_PER_USER
            value: "15"

  - it: omits the §11.1 concurrent-session and delegated-children caps at the default zero
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MAX_CONCURRENT_SESSIONS_GLOBAL
            value: "0"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MAX_CONCURRENT_SESSIONS_PER_USER
            value: "0"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MAX_CONCURRENT_SESSIONS_PER_RUNTIME
            value: "0"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_DELEGATION_MAX_ACTIVE_CHILDREN_PER_USER
            value: "0"

  # spec: §10.3 lines 316, 334 (NET-064) — the lenny-preflight Job reads
  # these annotations to enforce uniqueness across Lenny Deployments in
  # the same cluster; without them the collision check is a no-op.
  # F-10.3.6.
  - it: stamps NET-064 identity annotations on the gateway Deployment metadata
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.annotations["lenny.dev/spiffe-trust-domain"]
          value: cluster.local

  - it: stamps the sa-token-audience annotation when global.saTokenAudience is set
    set:
      global.saTokenAudience: lenny-gateway-acme
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.annotations["lenny.dev/sa-token-audience"]
          value: lenny-gateway-acme

  - it: omits the sa-token-audience annotation when global.saTokenAudience is empty (chart default)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: metadata.annotations["lenny.dev/sa-token-audience"]

  - it: renders the service account, cluster role, binding, deployment, services, and the §4.1 PodDisruptionBudget by default
    asserts:
      - hasDocuments:
          count: 7

  - it: renders the §4.1 PodDisruptionBudget with maxUnavailable 1 and the gateway selector
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    asserts:
      - equal:
          path: metadata.name
          value: lenny-gateway
      - equal:
          path: metadata.labels["lenny.dev/component"]
          value: gateway
      - equal:
          path: spec.maxUnavailable
          value: 1
      - equal:
          path: spec.selector.matchLabels["lenny.dev/component"]
          value: gateway
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: lenny

  - it: omits the PodDisruptionBudget when gateway.podDisruptionBudget.enabled is false
    set:
      gateway.podDisruptionBudget.enabled: false
    asserts:
      - hasDocuments:
          count: 6
      # The PDB document is the seventh document on the default render
      # (after SA, ClusterRole, ClusterRoleBinding, Deployment, Service,
      # headless Service). When the opt-out is set the document count
      # drops to six, so no PodDisruptionBudget is rendered.

  - it: renders a Deployment named lenny-gateway
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: lenny-gateway
      - equal:
          path: metadata.labels["lenny.dev/component"]
          value: gateway

  - it: renders the §4.1 / §17.1 RollingUpdate strategy with maxUnavailable 1 and maxSurge 25%
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 25%

  - it: honors a custom rollingUpdate override
    set:
      gateway.rollingUpdate.maxUnavailable: 2
      gateway.rollingUpdate.maxSurge: 50%
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 2
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 50%

  - it: runs two replicas by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: runs under the lenny-gateway service account
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: lenny-gateway

  - it: defaults the image tag to the chart appVersion
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/lennylabs/lenny-gateway:0.1.0

  - it: exposes the HTTP and gRPC container ports
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8080
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: grpc
            containerPort: 50051

  # spec: §16.9 line 723 — F-16.9.10. The gateway pod exposes an
  # explicit metrics containerPort so PodMonitor `port: metrics`
  # discovery matches uniformly across control-plane components.
  - it: exposes a named metrics containerPort on the gateway pod
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 8080

  - it: binds the REST and GatewayControl listeners via args
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --addr=:8080
      - contains:
          path: spec.template.spec.containers[0].args
          content: --grpc-addr=:50051

  - it: wires the gateway to lenny-token-service over gRPC for §4.3 credential materialization
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --token-service-grpc-addr=lenny-token-service.NAMESPACE.svc:50052
    release:
      namespace: NAMESPACE

  # spec: F-4.3.12 / §4.3 line 193 — the gateway reverse-proxies
  # /v1/oauth/* to the Token Service HTTP listener so the §13.3
  # canonical endpoint is served by the actual minter.
  - it: wires the §4.3 canonical token endpoint to lenny-token-service over HTTP
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --token-service-http-url=http://lenny-token-service.NAMESPACE.svc:8081
    release:
      namespace: NAMESPACE

  # spec: F-4.3.11 — the gateway receives its KMS provider selector
  # from kms.provider so cloud installs can swap the in-process random
  # KEK for an AWS/GCP/Azure KEK behind the same kms.Provider seam.
  - it: renders the §4 / §17.5 KMS provider flags
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kms-provider=local
      - contains:
          path: spec.template.spec.containers[0].args
          content: --environment=dev

  - it: omits the LLM proxy listener when the feature flag is off
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --llm-proxy-addr=:8443

  - it: adds the LLM proxy listener and port when features.llmProxy is on
    set:
      features.llmProxy: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --llm-proxy-addr=:8443
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: llm-proxy
            containerPort: 8443

  - it: applies the restricted pod security posture
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: probes the gateway health endpoint
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      # §10.1 preStop Stage 1: readiness is a distinct /readyz probe so
      # the preStop hook can flip the pod to NotReady (removed from the
      # Service endpoints) without tripping the /healthz liveness probe.
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  - it: grants SandboxClaim create+delete and Sandbox status RBAC
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["lenny.dev"]
            resources: ["sandboxclaims"]
            verbs: ["get", "list", "watch", "create", "delete"]
      - contains:
          path: rules
          content:
            apiGroups: ["lenny.dev"]
            resources: ["sandboxes/status"]
            verbs: ["get", "update", "patch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list", "watch", "patch"]

  - it: renders the lenny-gateway ClusterIP Service with HTTP, gRPC, and metrics ports
    documentIndex: 4
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: lenny-gateway
      - contains:
          path: spec.ports
          content:
            name: http
            port: 8080
            targetPort: http
      - contains:
          path: spec.ports
          content:
            name: grpc
            port: 50051
            targetPort: grpc
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9090
            targetPort: http

  - it: renders the lenny-gateway-pods headless Service for per-replica DNS
    documentIndex: 5
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: lenny-gateway-pods
      - equal:
          path: spec.clusterIP
          value: None
      # spec: §25.4 line 1064 — F-25.4.10. Only ready replicas are
      # returned so the lenny-ops fan-out skips replicas that cannot serve.
      - equal:
          path: spec.publishNotReadyAddresses
          value: false

  - it: renders POD_NAME, LENNY_MAX_SESSIONS_PER_REPLICA, and §4.1 extraction-threshold env with stock values (no data-store env)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      # POD_NAME + LENNY_MAX_SESSIONS_PER_REPLICA + LENNY_MIN_REPLICAS
      # + LENNY_STREAM_CEILING + LENNY_TERMINATION_GRACE_SECONDS
      # + LENNY_CREDENTIALS_EXPIRY_WARNING_LEAD_SECONDS (§11.3 line 215,
      #   F-11.3.20)
      # + LENNY_RATE_LIMIT_FAILOPEN_MAX_SECONDS (§11.3 line 222,
      #   F-11.3.22)
      # + LENNY_DELEGATION_MAX_LEVEL_RECOVERY_SECONDS / _MAX_TREE_RECOVERY_SECONDS
      #   / _CASCADE_TIMEOUT_SECONDS / _MAX_ORPHAN_TASKS_PER_TENANT (§8.10,
      #   F-8.10.6 / F-8.10.9 / F-8.10.10)
      # + 8 extraction-threshold gauges + LENNY_POOLER_MODE
      # (§4.2 line 165) + POD_NAMESPACE (§10.4 PDB poller)
      # + LENNY_BILLING_CORRECTION_RATE_THRESHOLD (§11.2.1 line 187,
      #   F-11.2.23) + LENNY_SLO_VALIDATED (§16.5 line 623, F-16.5.5)
      # + LENNY_GC_CYCLE_INTERVAL_SECONDS / _TOMBSTONE_RETENTION_SECONDS
      #   (§12.5 lines 317, 341, F-12.5.19)
      # + LENNY_HEALTH_TRACKER_USE_COMPILED_RULES (§25.13 line 4798,
      #   F-25.13.4)
      # + LENNY_ALERTING_BUNDLE_FORMATS / LENNY_ALERTING_OVERRIDE_COUNT
      #   (§25.13 lines 4833-4834, F-25.13.3)
      # + LENNY_GATEWAY_QUEUE_DEPTH_THRESHOLD /
      #   LENNY_GATEWAY_LATENCY_THRESHOLD_SECONDS /
      #   LENNY_CREDENTIAL_POOL_LOW_THRESHOLD (§25.13 line 4737,
      #   F-25.13.2)
      # + LENNY_QUOTA_SYNC_INTERVAL_SECONDS (§11.2 line 44, F-11.2.16)
      # + LENNY_BILLING_RETENTION_DAYS (§11.2.1 line 151, F-11.2.15)
      # + LENNY_BILLING_FLUSH_INTERVAL_MS / _BATCH_SIZE / _MAX_PENDING
      #   (§12.3 line 76, F-12.3.13)
      # + LENNY_POSTGRES_WRITE_CEILING_IOPS (§12.3 line 123, F-12.3.8)
      # + LENNY_AUDIT_STARTUP_CHAIN_CHECK_ENTRIES (§12.3 line 101,
      #   F-12.3.9)
      # + LENNY_AUDIT_GDPR_RETENTION_DAYS (§12.8 line 839, F-12.8.16)
      # + LENNY_EVAL_RATE_LIMIT_PER_SESSION_PER_MIN / _PER_TENANT_PER_MIN
      #   (§10.7 line 938, F-10.7.4)
      # + LENNY_T4_KMS_PROBE_INTERVAL_SECONDS / _RATE_LIMIT (§12.5 line 307,
      #   STO-021, F-12.5.4)
      # + LENNY_AUDIT_GRANT_CHECK_INTERVAL_SECONDS /
      #   LENNY_AUDIT_HARD_FAIL_ON_DRIFT (§11.7 item 2, F-11.7.3)
      # + LENNY_DUAL_STORE_UNAVAILABLE_MAX_SECONDS (§10.1 item 4,
      #   F-10.1.3) = 46.
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 46
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: POD_NAME
      # §10.4 PDB poller — POD_NAMESPACE via downward API.
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: POD_NAMESPACE
      - equal:
          path: spec.template.spec.containers[0].env[2].name
          value: LENNY_MAX_SESSIONS_PER_REPLICA
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: "50"
      # §4.1 / §16.5 GatewayNoHealthyReplicas alert denominator gauge.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MIN_REPLICAS
            value: "2"
      # §4.1 / §16.5 GatewayActiveStreamsHigh alert denominator gauge.
      # Falls back to gateway.maxSessionsPerReplica when streamCeiling
      # is unset.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_STREAM_CEILING
            value: "50"
      # §10.1 item 4 / F-10.1.3 — dualStoreUnavailableMaxSeconds defaults
      # to 60s and renders into the gateway env for the dual-store monitor.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_DUAL_STORE_UNAVAILABLE_MAX_SECONDS
            value: "60"
      # §16.5 line 623 / F-16.5.5 — slo.validated defaults to false, so
      # the gateway emits the provisional-SLO startup warning.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_SLO_VALIDATED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_EXTRACTION_THRESHOLD_STREAM_PROXY_QUEUE_DEPTH
            value: "500"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_EXTRACTION_THRESHOLD_UPLOAD_HANDLER_ACTIVE_CONCURRENT
            value: "200"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_EXTRACTION_THRESHOLD_MCP_FABRIC_ACTIVE_DELEGATIONS
            value: "1000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_EXTRACTION_THRESHOLD_LLM_PROXY_ACTIVE_CONNECTIONS
            value: "2000"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_POSTGRES_DSN
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_ENDPOINT
          any: true
      # §4.2 line 165 — LENNY_POOLER_MODE defaults to `transactional`.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_POOLER_MODE
            value: "transactional"
      # §11.2.1 line 187 / §16.5 BillingCorrectionRateHigh — the
      # deployer-configurable threshold defaults to 0.05 (5%).
      # F-11.2.23.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_BILLING_CORRECTION_RATE_THRESHOLD
            value: "0.05"
      # §12.5 line 317 / F-12.5.19 — gc.cycleIntervalSeconds defaults to 900.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_GC_CYCLE_INTERVAL_SECONDS
            value: "900"
      # §12.5 line 341 / F-12.5.19 — gc.tombstoneRetentionSeconds defaults
      # to 86400 (24h), distinct from the §7.1 7-day artifact TTL.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_GC_TOMBSTONE_RETENTION_SECONDS
            value: "86400"
      # §25.13 line 4798 / F-25.13.4 — healthTracker.useCompiledRules
      # defaults to true so the gateway evaluates the §16.5 compiled-in
      # alert catalogue per replica.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_HEALTH_TRACKER_USE_COMPILED_RULES
            value: "true"
      # §25.13 line 4833 / F-25.13.3 — bundle-formats env mirrors
      # monitoring.format so lenny_alerting_rules_bundled{format}
      # stamps the rendered formats.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_ALERTING_BUNDLE_FORMATS
            value: "prometheusrule"
      # §25.13 line 4834 / F-25.13.3 — override-count env mirrors
      # len(monitoring.alertOverrides). Default 0 (chart bundles the
      # §16.5 catalogue verbatim).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_ALERTING_OVERRIDE_COUNT
            value: "0"
      # §25.13 line 4737 / F-25.13.2 — tier-dependent §16.5 thresholds.
      # Tier 1 base defaults: gateway queue depth 20, p95 latency 3s,
      # credential pool utilisation 0.80. Tier presets tighten these
      # (see presets/values-tier{2,3}.yaml).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_GATEWAY_QUEUE_DEPTH_THRESHOLD
            value: "20"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_GATEWAY_LATENCY_THRESHOLD_SECONDS
            value: "3"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_CREDENTIAL_POOL_LOW_THRESHOLD
            value: "0.8"

