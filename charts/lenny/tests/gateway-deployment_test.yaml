suite: lenny-gateway deployment
templates:
  - gateway-deployment.yaml
tests:
  - it: renders the service account, cluster role, binding, deployment, and services
    asserts:
      - hasDocuments:
          count: 6

  - it: renders a Deployment named lenny-gateway
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: lenny-gateway
      - equal:
          path: metadata.labels["lenny.dev/component"]
          value: gateway

  - it: runs two replicas by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: runs under the lenny-gateway service account
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: lenny-gateway

  - it: defaults the image tag to the chart appVersion
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/lennylabs/lenny-gateway:0.1.0

  - it: exposes the HTTP and gRPC container ports
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8080
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: grpc
            containerPort: 50051

  - it: binds the REST and GatewayControl listeners via args
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --addr=:8080
      - contains:
          path: spec.template.spec.containers[0].args
          content: --grpc-addr=:50051

  - it: omits the LLM proxy listener when the feature flag is off
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --llm-proxy-addr=:8443

  - it: adds the LLM proxy listener and port when features.llmProxy is on
    set:
      features.llmProxy: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --llm-proxy-addr=:8443
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: llm-proxy
            containerPort: 8443

  - it: applies the restricted pod security posture
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: probes the gateway health endpoint
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz

  - it: grants SandboxClaim create and Sandbox status RBAC
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["lenny.dev"]
            resources: ["sandboxclaims"]
            verbs: ["get", "list", "watch", "create"]
      - contains:
          path: rules
          content:
            apiGroups: ["lenny.dev"]
            resources: ["sandboxes/status"]
            verbs: ["get", "update", "patch"]

  - it: renders the lenny-gateway ClusterIP Service with HTTP, gRPC, and metrics ports
    documentIndex: 4
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: lenny-gateway
      - contains:
          path: spec.ports
          content:
            name: http
            port: 8080
            targetPort: http
      - contains:
          path: spec.ports
          content:
            name: grpc
            port: 50051
            targetPort: grpc
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9090
            targetPort: http

  - it: renders the lenny-gateway-pods headless Service for per-replica DNS
    documentIndex: 5
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: lenny-gateway-pods
      - equal:
          path: spec.clusterIP
          value: None

  - it: renders only POD_NAME env with stock values (no data-store env)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 1
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: POD_NAME
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_POSTGRES_DSN
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_ENDPOINT
          any: true

  - it: wires LENNY_POSTGRES_DSN from the datastore Secret when postgres.dsn is set
    set:
      postgres.dsn: "postgres://lenny:lenny@db.svc:5432/lenny?sslmode=disable"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_POSTGRES_DSN
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: postgres-dsn
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_URL
          any: true

  - it: wires LENNY_REDIS_URL from the datastore Secret when redis.url is set
    set:
      redis.url: "redis://redis.svc:6379"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_URL
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: redis-url

  - it: wires the MinIO env from values and Secret when minio.endpoint is set
    set:
      minio.endpoint: "minio.svc:9000"
      minio.accessKey: "ak"
      minio.secretKey: "sk"
      minio.bucket: "lenny-artifacts"
      minio.useSSL: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_ENDPOINT
            value: "minio.svc:9000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_BUCKET
            value: "lenny-artifacts"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_USE_SSL
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: minio-access-key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: minio-secret-key

  - it: omits the playground flags when the playground is disabled
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --playground-enabled

  - it: renders the playground flags when the playground is enabled
    set:
      playground.enabled: true
      playground.authMode: dev
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --playground-enabled
      - contains:
          path: spec.template.spec.containers[0].args
          content: --playground-auth-mode=dev
      - contains:
          path: spec.template.spec.containers[0].args
          content: --playground-bearer-ttl-seconds=900
