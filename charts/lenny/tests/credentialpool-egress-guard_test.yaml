suite: credentialpool egress guard (§13.2 NET-006)
release:
  name: lenny
  namespace: lenny-system
templates:
  - credentialpool-egress-guard.yaml
tests:
  # spec: §13.2 line 441 (NET-006 layer 3) — the render-time guard fails
  # the install/upgrade only for the illegal proxy + provider-direct
  # combination; every other seed (including the empty default) renders
  # no object and passes.
  - it: renders nothing for the default empty seed
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing for a coherent proxy + restricted seed
    set:
      bootstrap.credentialPools:
        - name: anthropic-shared
          deliveryMode: proxy
          egressProfile: restricted
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing for a coherent direct + provider-direct seed
    set:
      bootstrap.credentialPools:
        - name: bedrock-direct
          deliveryMode: direct
          egressProfile: provider-direct
    asserts:
      - hasDocuments:
          count: 0

  - it: fails the render for the NET-006 proxy + provider-direct combo
    set:
      bootstrap.credentialPools:
        - name: bad-pool
          deliveryMode: proxy
          egressProfile: provider-direct
    asserts:
      - failedTemplate:
          errorPattern: InvalidPoolEgressDeliveryCombo

  - it: catches the bad combo even when it is not the first seed entry
    set:
      bootstrap.credentialPools:
        - name: ok-pool
          deliveryMode: proxy
          egressProfile: restricted
        - name: bad-pool
          deliveryMode: proxy
          egressProfile: provider-direct
    asserts:
      - failedTemplate:
          errorPattern: InvalidPoolEgressDeliveryCombo

  - it: does not run the guard when bootstrap is disabled
    set:
      bootstrap.enabled: false
      bootstrap.credentialPools:
        - name: bad-pool
          deliveryMode: proxy
          egressProfile: provider-direct
    asserts:
      - hasDocuments:
          count: 0
