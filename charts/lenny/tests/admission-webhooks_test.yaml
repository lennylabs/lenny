suite: admission webhooks
release:
  name: lenny
  namespace: lenny-system
tests:
  - it: renders the workload + both webhook configs (label and tenant-label) for label-immutability
    template: admission-policies/label-immutability-webhook.yaml
    asserts:
      - hasDocuments:
          count: 6

  - it: runs the label-immutability webhook with two replicas
    template: admission-policies/label-immutability-webhook.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.metadata.labels["lenny.dev/component"]
          value: admission-webhook

  # spec §17.2: the webhook binary receives the gVisor and Kata
  # RuntimeClass names so the pod-security route applies the
  # split-enforcement relaxations (gVisor skips seccomp, Kata permits
  # privilege escalation) keyed off the deployer's runtimeClasses config.
  - it: passes the gVisor and Kata RuntimeClass names to the webhook binary
    template: admission-policies/label-immutability-webhook.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --gvisor-runtime-class=gvisor
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kata-runtime-class=kata

  - it: tracks a custom RuntimeClass name override into the webhook args
    template: admission-policies/label-immutability-webhook.yaml
    documentIndex: 0
    set:
      runtimeClasses.profiles.sandboxed.name: gvisor-prod
      runtimeClasses.profiles.microvm.name: kata-qemu
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --gvisor-runtime-class=gvisor-prod
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kata-runtime-class=kata-qemu

  - it: protects the label-immutability webhook with a PodDisruptionBudget
    template: admission-policies/label-immutability-webhook.yaml
    documentIndex: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  - it: issues a serving certificate for the label-immutability webhook
    template: admission-policies/label-immutability-webhook.yaml
    documentIndex: 3
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: spec.secretName
          value: lenny-label-immutability-tls

  - it: configures the label-immutability webhook fail-closed with CA injection
    template: admission-policies/label-immutability-webhook.yaml
    documentIndex: 4
    asserts:
      - isKind:
          of: ValidatingWebhookConfiguration
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail
      - equal:
          path: webhooks[0].clientConfig.service.path
          value: /label-immutability
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: lenny-system/lenny-label-immutability

  - it: targets pods from the label-immutability webhook
    template: admission-policies/label-immutability-webhook.yaml
    documentIndex: 4
    asserts:
      - equal:
          path: webhooks[0].rules[0].resources[0]
          value: pods

  # spec §5.2 line 392 — lenny-tenant-label-immutability is the
  # sibling ValidatingWebhookConfiguration that enforces the
  # tenant-id transition rules (gateway-only initial assignment,
  # WarmPoolController-only pool return). Same backing Service +
  # Deployment + PDB; distinct config object + clientConfig path.
  - it: configures the tenant-label-immutability webhook fail-closed on the dedicated path
    template: admission-policies/label-immutability-webhook.yaml
    documentIndex: 5
    asserts:
      - isKind:
          of: ValidatingWebhookConfiguration
      - equal:
          path: metadata.name
          value: lenny-tenant-label-immutability
      - equal:
          path: webhooks[0].name
          value: tenant-label-immutability.lenny.dev
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail
      - equal:
          path: webhooks[0].clientConfig.service.path
          value: /tenant-label-immutability
      - equal:
          path: webhooks[0].clientConfig.service.name
          value: lenny-label-immutability
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: lenny-system/lenny-label-immutability

  - it: targets pods from the tenant-label-immutability webhook
    template: admission-policies/label-immutability-webhook.yaml
    documentIndex: 5
    asserts:
      - equal:
          path: webhooks[0].rules[0].resources[0]
          value: pods
      - contains:
          path: webhooks[0].rules[0].operations
          content: CREATE
      - contains:
          path: webhooks[0].rules[0].operations
          content: UPDATE

  # spec §4.6.1: the sandboxclaim-guard webhook is deployed with
  # replicas: 2 and a PodDisruptionBudget (minAvailable: 1) matching the
  # §17.2 admission-controller HA requirements.
  - it: runs the sandboxclaim-guard webhook with two replicas
    template: admission-policies/sandboxclaim-guard-webhook.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 2

  - it: protects the sandboxclaim-guard webhook with a PodDisruptionBudget
    template: admission-policies/sandboxclaim-guard-webhook.yaml
    documentIndex: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  - it: targets sandboxclaims from the sandboxclaim-guard webhook
    template: admission-policies/sandboxclaim-guard-webhook.yaml
    documentIndex: 4
    asserts:
      - isKind:
          of: ValidatingWebhookConfiguration
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail
      - equal:
          path: webhooks[0].rules[0].apiGroups[0]
          value: lenny.dev
      - equal:
          path: webhooks[0].rules[0].resources[0]
          value: sandboxclaims
      - equal:
          path: webhooks[0].clientConfig.service.path
          value: /sandboxclaim-guard

  - it: configures the pod-security webhook fail-closed on pod CREATE and UPDATE
    template: admission-policies/pod-security-webhook.yaml
    documentIndex: 4
    asserts:
      - isKind:
          of: ValidatingWebhookConfiguration
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail
      - equal:
          path: webhooks[0].clientConfig.service.path
          value: /pod-security
      - equal:
          path: webhooks[0].rules[0].resources[0]
          value: pods
      # spec: §13.1 — CREATE+UPDATE matches the other webhook
      # configurations (label-immutability, pool-config-validator,
      # data-residency-validator) so spec-mutable fields are revalidated.
      - equal:
          path: webhooks[0].rules[0].operations[0]
          value: CREATE
      - equal:
          path: webhooks[0].rules[0].operations[1]
          value: UPDATE
      # spec: §13.1 line 27 — a second rule covers the
      # pods/ephemeralcontainers subresource so the per-container
      # baseline applies to ephemeral debug containers attached
      # post-hoc (F-13.1.8). Ephemeral containers are added only via
      # UPDATE on the subresource.
      - equal:
          path: webhooks[0].rules[1].resources[0]
          value: pods/ephemeralcontainers
      - equal:
          path: webhooks[0].rules[1].operations[0]
          value: UPDATE
      - lengthEqual:
          path: webhooks[0].rules[1].operations
          count: 1

  - it: renders the workload and webhook config for pool-config-validator
    template: admission-policies/pool-config-validator-webhook.yaml
    asserts:
      - hasDocuments:
          count: 5

  - it: configures the pool-config-validator webhook fail-closed with a 5s timeout
    template: admission-policies/pool-config-validator-webhook.yaml
    documentIndex: 4
    asserts:
      - isKind:
          of: ValidatingWebhookConfiguration
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail
      - equal:
          path: webhooks[0].timeoutSeconds
          value: 5
      - equal:
          path: webhooks[0].clientConfig.service.path
          value: /pool-config-validator
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: lenny-system/lenny-pool-config-validator

  - it: targets warm pools and templates from the pool-config-validator webhook
    template: admission-policies/pool-config-validator-webhook.yaml
    documentIndex: 4
    asserts:
      - equal:
          path: webhooks[0].rules[0].apiGroups[0]
          value: lenny.dev
      - contains:
          path: webhooks[0].rules[0].resources
          content: sandboxwarmpools
      - contains:
          path: webhooks[0].rules[0].resources
          content: sandboxtemplates
      - contains:
          path: webhooks[0].rules[0].operations
          content: CREATE
      - contains:
          path: webhooks[0].rules[0].operations
          content: UPDATE

  - it: renders a self-signed issuer for webhook certificates
    template: admission-policies/webhook-cert-issuer.yaml
    asserts:
      - isKind:
          of: Issuer
      - equal:
          path: metadata.name
          value: lenny-webhook-selfsign

  - it: grants the webhook service account read access to the pod-fabric CRDs
    template: admission-policies/webhook-rbac.yaml
    asserts:
      - hasDocuments:
          count: 3

  # spec: §13.2 NET-068 / §17.2 line 56 — only the drain-readiness
  # Deployment carries the additive lenny.dev/webhook-name label, so the
  # gateway-egress sub-rule narrows to that webhook alone. F-17.2.11.
  - it: stamps the additive webhook-name egress label on the drain-readiness pods
    template: admission-policies/drain-readiness-webhook.yaml
    set:
      features.drainReadiness: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.metadata.labels["lenny.dev/webhook-name"]
          value: drain-readiness
      - equal:
          path: spec.template.metadata.labels["lenny.dev/component"]
          value: admission-webhook

  - it: narrows the drain-readiness gateway-egress policy to the canonical + additive selector
    template: admission-policies/drain-readiness-webhook.yaml
    set:
      features.drainReadiness: true
    documentSelector:
      path: metadata.name
      value: allow-drain-readiness-gateway-egress
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["lenny.dev/component"]
          value: admission-webhook
      - equal:
          path: spec.podSelector.matchLabels["lenny.dev/webhook-name"]
          value: drain-readiness

  - it: does not stamp the webhook-name label on the other webhooks (least privilege)
    template: admission-policies/label-immutability-webhook.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.metadata.labels["lenny.dev/webhook-name"]
