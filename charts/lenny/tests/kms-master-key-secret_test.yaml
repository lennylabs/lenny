suite: local KMS master key Secret
release:
  name: lenny
  namespace: lenny-system
templates:
  - kms-master-key-secret.yaml
tests:
  # spec: §17.4 — under kms.provider=local with no kms.masterKeySecret the
  # chart renders one Secret holding a random master key that every process
  # mounts.
  - it: renders the generated master key Secret when kms.masterKeySecret is empty
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: lenny-kms-master-key
      - equal:
          path: metadata.namespace
          value: lenny-system
      # 64 random alphanumeric bytes base64-encode to 88 characters with two
      # pad characters; 64 bytes exceed the 32-byte local provider minimum.
      - matchRegex:
          path: data["master-key"]
          pattern: "^[A-Za-z0-9+/]{86}==$"

  # spec: §17.4 — the key is preserved across upgrades through lookup, so a
  # re-render never rotates the master key under existing ciphertexts.
  - it: preserves the live master key across a re-render
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: lenny-kms-master-key
            namespace: lenny-system
          data:
            master-key: cHJlc2VydmVkLW1hc3Rlci1rZXktcHJlc2VydmVkLW1hc3Rlci1rZXk=
    asserts:
      - equal:
          path: data["master-key"]
          value: cHJlc2VydmVkLW1hc3Rlci1rZXktcHJlc2VydmVkLW1hc3Rlci1rZXk=

  # spec: §17.4 — a named Secret is operator- or bring-up-managed, so the
  # chart renders no key material of its own.
  - it: renders no Secret when kms.masterKeySecret names one
    set:
      kms.masterKeySecret: acme-kms-master-key
    asserts:
      - hasDocuments:
          count: 0

  # spec: §10.2 "Signing key and algorithm" — a cloud provider holds the
  # keys, so no master key Secret renders.
  - it: renders no Secret under a cloud provider
    set:
      kms.provider: aws
      kms.signQuotaPerSecond: 50
    asserts:
      - hasDocuments:
          count: 0
