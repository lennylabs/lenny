suite: reference-runtime catalog
templates:
  - reference-runtimes.yaml
tests:
  - it: registers the §26 reference runtimes by default
    asserts:
      - hasDocuments:
          count: 9

  - it: renders each entry as a lenny.dev/v1 Runtime
    documentSelector:
      path: metadata.name
      value: claude-code
    asserts:
      - isKind:
          of: Runtime
      - equal:
          path: apiVersion
          value: lenny.dev/v1
      - equal:
          path: metadata.labels["lenny.dev/reference-runtime"]
          value: "true"

  - it: registers claude-code as a Full-level agent with its providers
    documentSelector:
      path: metadata.name
      value: claude-code
    asserts:
      - equal:
          path: spec.type
          value: agent
      - equal:
          path: spec.integrationLevel
          value: full
      - equal:
          path: spec.isolationProfile
          value: sandboxed
      - contains:
          path: spec.supportedProviders
          content: anthropic_direct

  # spec: §26.3 lines 159-162 — claude-code MUST advertise the three
  # anthropic-compatible providers (anthropic_direct, aws_bedrock,
  # gcp_vertex_anthropic). A regression that drops aws_bedrock or
  # gcp_vertex_anthropic must fail this test.
  - it: advertises aws_bedrock for claude-code per §26.3
    documentSelector:
      path: metadata.name
      value: claude-code
    asserts:
      - contains:
          path: spec.supportedProviders
          content: aws_bedrock

  - it: advertises gcp_vertex_anthropic for claude-code per §26.3
    documentSelector:
      path: metadata.name
      value: claude-code
    asserts:
      - contains:
          path: spec.supportedProviders
          content: gcp_vertex_anthropic

  # spec: §26.3 line 158 — claude-code MUST allow small/medium/large.
  - it: advertises small/medium/large resource classes for claude-code per §26.3
    documentSelector:
      path: metadata.name
      value: claude-code
    asserts:
      - contains:
          path: spec.allowedResourceClasses
          content: small
      - contains:
          path: spec.allowedResourceClasses
          content: medium
      - contains:
          path: spec.allowedResourceClasses
          content: large

  # spec: §26.3 lines 147 / 224 — claude-code image is
  # ghcr.io/lennylabs/runtime-claude-code (with a semver tag at release
  # time). The chart MUST emit the upstream repository so a regression
  # that retargets the image to another registry fails this check.
  - it: targets the canonical ghcr.io/lennylabs/runtime-claude-code image per §26.3
    documentSelector:
      path: metadata.name
      value: claude-code
    asserts:
      - matchRegex:
          path: spec.image
          pattern: "^ghcr\\.io/lennylabs/runtime-claude-code(@sha256:[A-Fa-f0-9]{64}|:[A-Za-z0-9._-]+)$"

  - it: pins every reference runtime image by digest per §5.3
    documentSelector:
      path: metadata.name
      value: claude-code
    asserts:
      - matchRegex:
          path: spec.image
          pattern: "@sha256:[A-Fa-f0-9]{64}$"

  - it: registers the chat runtime restricted to the small resource class
    documentSelector:
      path: metadata.name
      value: chat
    asserts:
      - contains:
          path: spec.allowedResourceClasses
          content: small

  # spec: §26.1 line 22 — F-26.1.1. The chat runtime is the §26.1
  # catalog's lone Standard-level entry ("the minimum useful runtime").
  # Every other reference runtime is Full; the chart MUST match the
  # spec table so the registered Runtime CRD advertises the §15.4.6
  # conformance battery the runtime actually implements.
  - it: registers chat at integrationLevel standard per §26.1 line 22
    documentSelector:
      path: metadata.name
      value: chat
    asserts:
      - equal:
          path: spec.integrationLevel
          value: standard

  - it: renders no runtimes when the catalog is disabled
    set:
      referenceRuntimes.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # spec: §26.3 lines 150-155 + §26.9 line 407 + §26.10 line 437 + §26.11
  # line 466 — every catalog entry MUST surface capabilities.interaction
  # and capabilities.injection so the registered Runtime advertises the
  # spec-anchored §15.4.6 conformance battery. F-26.3.1 / F-26.9.2 /
  # F-26.10.2 / F-26.11.2.
  - it: stamps capabilities.interaction = multi_turn on claude-code per §26.3 line 151
    documentSelector:
      path: metadata.name
      value: claude-code
    asserts:
      - equal:
          path: spec.capabilities.interaction
          value: multi_turn
      - equal:
          path: spec.capabilities.injection.supported
          value: true
      - contains:
          path: spec.capabilities.injection.modes
          content: immediate
      - contains:
          path: spec.capabilities.injection.modes
          content: queued

  - it: stamps capabilities + injection.modes = [immediate] on openai-assistants per §26.10 line 437
    documentSelector:
      path: metadata.name
      value: openai-assistants
    asserts:
      - equal:
          path: spec.capabilities.interaction
          value: multi_turn
      - contains:
          path: spec.capabilities.injection.modes
          content: immediate

  - it: stamps capabilities + injection.modes = [immediate, queued] on crewai per §26.11 line 466
    documentSelector:
      path: metadata.name
      value: crewai
    asserts:
      - equal:
          path: spec.capabilities.interaction
          value: multi_turn
      - contains:
          path: spec.capabilities.injection.modes
          content: immediate
      - contains:
          path: spec.capabilities.injection.modes
          content: queued

  # spec: §26.3 line 165 — claude-code proxyDialect: [anthropic].
  # F-26.3.3 / F-26.9.2 / F-26.10.2 / F-26.11.2.
  - it: stamps credentialCapabilities.proxyDialect on claude-code per §26.3 line 165
    documentSelector:
      path: metadata.name
      value: claude-code
    asserts:
      - equal:
          path: spec.credentialCapabilities.hotRotation
          value: true
      - contains:
          path: spec.credentialCapabilities.proxyDialect
          content: anthropic

  # spec: §26.6 line 297 — cursor-cli proxyDialect: [cursor]. F-26.6.2.
  - it: stamps cursor proxyDialect on cursor-cli per §26.6 line 297
    documentSelector:
      path: metadata.name
      value: cursor-cli
    asserts:
      - contains:
          path: spec.credentialCapabilities.proxyDialect
          content: cursor

  # spec: §26.9 line 410 — mastra proxyDialect: [anthropic, openai, google].
  - it: stamps anthropic/openai/google proxyDialect on mastra per §26.9 line 410
    documentSelector:
      path: metadata.name
      value: mastra
    asserts:
      - contains:
          path: spec.credentialCapabilities.proxyDialect
          content: anthropic
      - contains:
          path: spec.credentialCapabilities.proxyDialect
          content: openai
      - contains:
          path: spec.credentialCapabilities.proxyDialect
          content: google

  # spec: §26.9 line 408 / §26.10 line 438 / §26.11 line 467 — the v1
  # runtimeOptionsSchema URL is stamped on every reference runtime so the
  # gateway/controller can resolve the schema at session-creation time.
  # F-26.9.2 / F-26.10.2 / F-26.11.2.
  - it: stamps runtimeOptionsSchemaRef on mastra per §26.9 line 408
    documentSelector:
      path: metadata.name
      value: mastra
    asserts:
      - equal:
          path: spec.runtimeOptionsSchemaRef
          value: https://schemas.lenny.dev/runtime-options/mastra/v1.json

  - it: stamps runtimeOptionsSchemaRef on crewai per §26.11 line 467
    documentSelector:
      path: metadata.name
      value: crewai
    asserts:
      - equal:
          path: spec.runtimeOptionsSchemaRef
          value: https://schemas.lenny.dev/runtime-options/crewai/v1.json
      - equal:
          path: spec.delegationPolicyRef
          value: crewai-default

  # spec: §26.3 lines 166-169 — claude-code declares the §26.2 shared
  # limits (maxSessionAge 14400s, maxUploadSize 500MB, request-input wait
  # 1800s). The chart MUST render them so the §11.3 / §6.2 caps the
  # registered runtime advertises match the spec. F-26.2.1 / F-26.3.2.
  - it: stamps the §26.2 shared limits on claude-code per §26.3 lines 166-169
    documentSelector:
      path: metadata.name
      value: claude-code
    asserts:
      - equal:
          path: spec.limits.maxSessionAgeSeconds
          value: 14400
      - equal:
          path: spec.limits.maxUploadSizeBytes
          value: 524288000
      - equal:
          path: spec.limits.maxRequestInputWaitSeconds
          value: 1800

  # spec: §26.3 lines 170-176 — claude-code declares the §26.2 shared
  # setupCommandPolicy (allowlist mode, shell false, maxCommands 20) and
  # setupPolicy (600s, fail). F-26.2.1 / F-26.3.4.
  - it: stamps the §26.2 setupCommandPolicy + setupPolicy on claude-code per §26.3 lines 170-176
    documentSelector:
      path: metadata.name
      value: claude-code
    asserts:
      - equal:
          path: spec.setupCommandPolicy.mode
          value: allowlist
      - equal:
          path: spec.setupCommandPolicy.shell
          value: false
      - equal:
          path: spec.setupCommandPolicy.maxCommands
          value: 20
      - contains:
          path: spec.setupCommandPolicy.allowlist
          content: npm
      - equal:
          path: spec.setupPolicy.timeoutSeconds
          value: 600
      - equal:
          path: spec.setupPolicy.onTimeout
          value: fail

  # spec: §26.3 lines 181-184 — claude-code declares the §26.2 shared
  # defaultPoolConfig (warmCount 2, resourceClass medium, egressProfile
  # restricted). F-26.2.1 / F-26.3.5.
  - it: stamps the §26.2 defaultPoolConfig on claude-code per §26.3 lines 181-184
    documentSelector:
      path: metadata.name
      value: claude-code
    asserts:
      - equal:
          path: spec.defaultPoolConfig.warmCount
          value: 2
      - equal:
          path: spec.defaultPoolConfig.resourceClass
          value: medium
      - equal:
          path: spec.defaultPoolConfig.egressProfile
          value: restricted

  # spec: §26.3 lines 185-199 — claude-code declares the agentInterface
  # with its coding skills and media types. F-26.2.1 / F-26.3.5.
  - it: stamps the agentInterface skills on claude-code per §26.3 lines 185-199
    documentSelector:
      path: metadata.name
      value: claude-code
    asserts:
      - equal:
          path: spec.agentInterface.supportsWorkspaceFiles
          value: true
      - equal:
          path: spec.agentInterface.skills[0].id
          value: code
      - equal:
          path: spec.agentInterface.inputModes[0].type
          value: text/plain

  # spec: §26.3 lines 200-202 — the maintainer/upstream labels are stamped
  # onto the Runtime object's metadata.labels. F-26.3.5.
  - it: stamps the §26.3 maintainer/upstream labels on claude-code
    documentSelector:
      path: metadata.name
      value: claude-code
    asserts:
      - equal:
          path: metadata.labels.maintainer
          value: lennylabs
      - equal:
          path: metadata.labels["upstream"]
          value: anthropic/claude-code

  # spec: §26.2 lines 81-92 — the shared coding-agent blocks are inherited
  # by gemini-cli, codex, and cursor-cli. F-26.2.1 / F-26.2.3.
  - it: stamps the §26.2 shared coding-agent blocks on gemini-cli
    documentSelector:
      path: metadata.name
      value: gemini-cli
    asserts:
      - equal:
          path: spec.limits.maxSessionAgeSeconds
          value: 14400
      - equal:
          path: spec.setupCommandPolicy.mode
          value: allowlist
      - equal:
          path: spec.setupPolicy.onTimeout
          value: fail
      - equal:
          path: spec.defaultPoolConfig.egressProfile
          value: restricted

  # spec: §17.6 lines 688-689 — the install wizard's reference-runtime
  # multi-select narrows the catalog to a deployer-chosen subset, written
  # to referenceRuntimes.include. A non-empty list registers only the
  # named entries. F-17.6.10.
  - it: narrows the catalog to referenceRuntimes.include when set
    set:
      referenceRuntimes:
        include: [claude-code, chat]
    asserts:
      - hasDocuments:
          count: 2

  - it: registers exactly the included runtimes by name
    set:
      referenceRuntimes:
        include: [claude-code, chat]
    documentSelector:
      path: metadata.name
      value: chat
    asserts:
      - isKind:
          of: Runtime

  # An empty include list is the default and registers the whole catalog,
  # so the multi-select is opt-in narrowing rather than opt-in expansion.
  - it: registers the whole catalog when include is empty
    set:
      referenceRuntimes:
        include: []
    asserts:
      - hasDocuments:
          count: 9

  # An include entry that names no catalog runtime registers nothing for
  # that name; a list of only-unknown names yields an empty release.
  - it: registers nothing for an unknown include name
    set:
      referenceRuntimes:
        include: [does-not-exist]
    asserts:
      - hasDocuments:
          count: 0
