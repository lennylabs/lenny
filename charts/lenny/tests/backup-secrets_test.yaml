suite: lenny-backup credential Secrets (F-17.1.10, spec §17.1 row 21)
templates:
  - backup-secrets.yaml
tests:
  - it: renders nothing with stock values (credentials provisioned out of band)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders only the postgres Secret when backups.postgres.dsn is set
    set:
      backups.postgres.dsn: "postgres://lenny_backup:pw@db.svc:5432/lenny"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: lenny-backup-postgres
      - equal:
          path: stringData["postgres-dsn"]
          value: "postgres://lenny_backup:pw@db.svc:5432/lenny"

  - it: renders only the minio Secret when both backup minio keys are set
    set:
      backups.minio.accessKey: bkup-ak
      backups.minio.secretKey: bkup-sk
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: lenny-backup-minio
      - equal:
          path: stringData["minio-access-key"]
          value: bkup-ak
      - equal:
          path: stringData["minio-secret-key"]
          value: bkup-sk

  - it: renders nothing when only the minio accessKey is set (both keys required)
    set:
      backups.minio.accessKey: bkup-ak
    asserts:
      - hasDocuments:
          count: 0

  - it: renders both Secrets when postgres and minio credentials are set
    set:
      backups.postgres.dsn: "postgres://lenny_backup:pw@db.svc:5432/lenny"
      backups.minio.accessKey: bkup-ak
      backups.minio.secretKey: bkup-sk
    asserts:
      - hasDocuments:
          count: 2
