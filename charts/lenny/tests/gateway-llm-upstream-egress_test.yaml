suite: gateway LLM upstream egress NetworkPolicy (F-4.9.22)
release:
  name: lenny
  namespace: lenny-system
templates:
  - gateway-llm-upstream-egress.yaml
tests:
  # §4.9 Upstream egress / §13.2 NET-046: the gateway's external-HTTPS
  # egress policy is rendered by default.
  - it: renders allow-gateway-egress-llm-upstream selecting the gateway pod
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: allow-gateway-egress-llm-upstream
      - equal:
          path: spec.podSelector.matchLabels["lenny.dev/component"]
          value: gateway
      - equal:
          path: spec.policyTypes[0]
          value: Egress

  # NET-062: two parallel ipBlock peers, one per address family, both on
  # TCP 443.
  - it: emits two family-partitioned ipBlock peers on TCP 443
    asserts:
      - equal:
          path: spec.egress[0].to[0].ipBlock.cidr
          value: 0.0.0.0/0
      - equal:
          path: spec.egress[1].to[0].ipBlock.cidr
          value: ::/0
      - equal:
          path: spec.egress[0].ports[0].port
          value: 443
      - equal:
          path: spec.egress[1].ports[0].port
          value: 443

  # The IPv4 peer blocks the cluster CIDR, RFC1918, and IPv4 IMDS, and
  # carries no IPv6 except entry (NET-062 cross-family rejection).
  - it: the IPv4 peer blocks cluster/RFC1918/IMDS and no IPv6 entry
    asserts:
      - contains:
          path: spec.egress[0].to[0].ipBlock.except
          content: 10.244.0.0/16
      - contains:
          path: spec.egress[0].to[0].ipBlock.except
          content: 10.0.0.0/8
      - contains:
          path: spec.egress[0].to[0].ipBlock.except
          content: 169.254.169.254/32
      - contains:
          path: spec.egress[0].to[0].ipBlock.except
          content: 100.100.100.200/32
      - notContains:
          path: spec.egress[0].to[0].ipBlock.except
          content: fc00::/7
      - notContains:
          path: spec.egress[0].to[0].ipBlock.except
          content: fd00:ec2::254/128

  # The IPv6 peer blocks IPv6 ULA/link-local and the IPv6 IMDS address,
  # and carries no IPv4 except entry.
  - it: the IPv6 peer blocks ULA/link-local/IMDS and no IPv4 entry
    asserts:
      - contains:
          path: spec.egress[1].to[0].ipBlock.except
          content: fc00::/7
      - contains:
          path: spec.egress[1].to[0].ipBlock.except
          content: fe80::/10
      - contains:
          path: spec.egress[1].to[0].ipBlock.except
          content: fd00:ec2::254/128
      - notContains:
          path: spec.egress[1].to[0].ipBlock.except
          content: 10.0.0.0/8
      - notContains:
          path: spec.egress[1].to[0].ipBlock.except
          content: 169.254.169.254/32

  # §13.2 default-scope caveat: a non-empty llmProviders list replaces the
  # broad 0.0.0.0/0 default with exactly the pinned provider CIDRs.
  - it: a non-empty llmProviders list renders a narrow allowlist
    set:
      egressCIDRs.llmProviders:
        - 160.79.104.0/23
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 1
      - equal:
          path: spec.egress[0].to[0].ipBlock.cidr
          value: 160.79.104.0/23
      - isNull:
          path: spec.egress[0].to[0].ipBlock.except

  # Dual-stack clusters add the discovered IPv6 cluster CIDRs to the IPv6
  # peer; an IPv4-only cluster omits them (the default).
  - it: renders the IPv6 cluster CIDR only when set
    set:
      egressCIDRs.excludeClusterPodCIDRv6: "fd12:3456::/64"
    asserts:
      - contains:
          path: spec.egress[1].to[0].ipBlock.except
          content: fd12:3456::/64

  - it: renders nothing when llmUpstreamEgress is disabled
    set:
      gateway.llmUpstreamEgress.enabled: false
    asserts:
      - hasDocuments:
          count: 0
