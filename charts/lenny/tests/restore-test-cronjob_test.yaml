suite: lenny-restore-test cronjob
release:
  name: lenny
  namespace: lenny-system
templates:
  - restore-test-cronjob.yaml
tests:
  - it: renders nothing when the restore test is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the ServiceAccount, RBAC, and CronJob when enabled
    set:
      backups:
        restoreTest:
          enabled: true
    asserts:
      - hasDocuments:
          count: 6

  - it: renders a CronJob named lenny-restore-test
    set:
      backups:
        restoreTest:
          enabled: true
    documentIndex: 5
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: lenny-restore-test
      - equal:
          path: metadata.namespace
          value: lenny-system

  - it: schedules the test restore monthly by default
    set:
      backups:
        restoreTest:
          enabled: true
    documentIndex: 5
    asserts:
      - equal:
          path: spec.schedule
          value: "0 4 1 * *"

  - it: honours an operator-supplied schedule
    set:
      backups:
        restoreTest:
          enabled: true
          schedule: "0 6 * * 0"
    documentIndex: 5
    asserts:
      - equal:
          path: spec.schedule
          value: "0 6 * * 0"

  - it: forbids concurrent and overlapping test restores
    set:
      backups:
        restoreTest:
          enabled: true
    documentIndex: 5
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid

  - it: runs the lenny-backup image in restore-test mode
    set:
      backups:
        restoreTest:
          enabled: true
    documentIndex: 5
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: ghcr.io/lennylabs/lenny-backup:0.1.0
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: --mode=restore-test

  - it: passes the configured artifact sample size to the Job
    set:
      backups:
        restoreTest:
          enabled: true
        verification:
          artifactSampleSize: 250
    documentIndex: 5
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: --artifact-sample-size=250

  - it: runs the Job under the lenny-restore-test service account
    set:
      backups:
        restoreTest:
          enabled: true
    documentIndex: 5
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: lenny-restore-test

  # spec: §25.11 "Backup Job NetworkPolicy" — "A dedicated NetworkPolicy
  # `lenny-backup-job` is rendered for backup Job pods (selected by label
  # `app: lenny-backup`)". The monthly test-restore Job runs the
  # lenny-backup image (--mode=restore-test), so its pod template must
  # carry app: lenny-backup for the lenny-backup-job NetworkPolicy
  # podSelector to match it; without the label the Job pod gets no
  # egress under the chart's namespace-wide default-deny-all.
  - it: carries the app=lenny-backup label the lenny-backup-job NetworkPolicy selects on
    set:
      backups:
        restoreTest:
          enabled: true
    documentIndex: 5
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels.app
          value: lenny-backup

  - it: applies the restricted pod security posture
    set:
      backups:
        restoreTest:
          enabled: true
    documentIndex: 5
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: never restarts the test-restore pod and bounds its deadline
    set:
      backups:
        restoreTest:
          enabled: true
    documentIndex: 5
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
          value: 3600

  - it: stages the restored archive on a writable tmp emptyDir
    set:
      backups:
        restoreTest:
          enabled: true
    documentIndex: 5
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].name
          value: tmp
      - exists:
          path: spec.jobTemplate.spec.template.spec.volumes[0].emptyDir
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /tmp

  - it: retains a bounded history of finished test-restore Jobs
    set:
      backups:
        restoreTest:
          enabled: true
          successfulJobsHistoryLimit: 5
          failedJobsHistoryLimit: 2
    documentIndex: 5
    asserts:
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 5
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 2

  # spec: §25.11 lines 4128-4256 — the restore-test Job reaches the
  # ops_backups / ops_restore_test_results tables (report DSN) and the
  # backup bucket (MinIO), and restores into the scratch Postgres.
  # F-17.3.6.
  - it: wires the report DSN, MinIO credentials, and scratch DSN env
    set:
      backups:
        restoreTest:
          enabled: true
          scratchDSN: postgres://scratch:5432/restore
        onDemand:
          minioEndpoint: minio:9000
          minioBucket: lenny-backups
    documentIndex: 5
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: LENNY_OPS_POSTGRES_DSN
            valueFrom:
              secretKeyRef:
                name: lenny-backup-postgres
                key: postgres-dsn
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: LENNY_BACKUP_SCRATCH_DSN
            value: postgres://scratch:5432/restore
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: LENNY_BACKUP_MINIO_ENDPOINT
            value: minio:9000

  - it: grants the verification Job scratch-namespace and Job control
    set:
      backups:
        restoreTest:
          enabled: true
    documentIndex: 1
    asserts:
      - isKind:
          of: ClusterRole
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["namespaces"]
            verbs: ["get", "create", "delete"]
      - contains:
          path: rules
          content:
            apiGroups: ["batch"]
            resources: ["jobs"]
            verbs: ["get", "list", "watch", "create", "delete"]

  - it: grants the verification Job read-only ConfigMap access without Secrets
    set:
      backups:
        restoreTest:
          enabled: true
    documentIndex: 3
    asserts:
      - isKind:
          of: Role
      - equal:
          path: rules[0].resources[0]
          value: configmaps
      - notContains:
          path: rules[0].resources
          content: secrets
