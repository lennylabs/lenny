suite: §5.3 RuntimeClass Pod Overhead
templates:
  - runtimeclasses.yaml
tests:
  - it: renders no RuntimeClasses by default (managed out-of-band)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders only enabled profiles when create is true
    set:
      runtimeClasses.create: true
    asserts:
      # sandboxed is enabled by default; microvm and standard are not.
      - hasDocuments:
          count: 1

  - it: renders the gvisor RuntimeClass with the §5.3 reference overhead
    set:
      runtimeClasses.create: true
    documentSelector:
      path: metadata.name
      value: gvisor
    asserts:
      - isKind:
          of: RuntimeClass
      - equal:
          path: apiVersion
          value: node.k8s.io/v1
      - equal:
          path: handler
          value: runsc
      - equal:
          path: overhead.podFixed.cpu
          value: "200m"
      - equal:
          path: overhead.podFixed.memory
          value: "200Mi"
      - equal:
          path: metadata.labels["lenny.dev/isolation-profile"]
          value: sandboxed

  - it: renders kata with the §5.3 microvm overhead when enabled
    set:
      runtimeClasses.create: true
      runtimeClasses.profiles.microvm.enabled: true
    documentSelector:
      path: metadata.name
      value: kata
    asserts:
      - equal:
          path: handler
          value: kata
      - equal:
          path: overhead.podFixed.cpu
          value: "500m"
      - equal:
          path: overhead.podFixed.memory
          value: "500Mi"

  # spec: §17.2 line 99 (control 1) — the Kata RuntimeClass carries
  # scheduling.nodeSelector so every referencing pod is pinned to the
  # dedicated Kata node pool at admission, with no pod-level config.
  - it: renders the kata RuntimeClass scheduling.nodeSelector for the dedicated node pool
    set:
      runtimeClasses.create: true
      runtimeClasses.profiles.microvm.enabled: true
    documentSelector:
      path: metadata.name
      value: kata
    asserts:
      - equal:
          path: scheduling.nodeSelector["lenny.dev/node-pool"]
          value: kata

  # The gVisor RuntimeClass has no default nodeSelector: only Kata
  # mandates a dedicated node pool (§17.2 line 97).
  - it: leaves the gvisor RuntimeClass with no scheduling block by default
    set:
      runtimeClasses.create: true
    documentSelector:
      path: metadata.name
      value: gvisor
    asserts:
      - notExists:
          path: scheduling

  - it: renders runc with no overhead block (native runtime adds none)
    set:
      runtimeClasses.create: true
      runtimeClasses.profiles.standard.enabled: true
    documentSelector:
      path: metadata.name
      value: runc
    asserts:
      - equal:
          path: handler
          value: runc
      - notExists:
          path: overhead

  - it: renders all three profiles when each is enabled
    set:
      runtimeClasses.create: true
      runtimeClasses.profiles.microvm.enabled: true
      runtimeClasses.profiles.standard.enabled: true
    asserts:
      - hasDocuments:
          count: 3
