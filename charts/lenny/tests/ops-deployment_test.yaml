suite: lenny-ops deployment
templates:
  - ops-deployment.yaml
tests:
  - it: renders the service account, leader-election role, binding, deployment, and service
    asserts:
      - hasDocuments:
          count: 5

  - it: renders a Deployment named lenny-ops
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: lenny-ops

  - it: carries the app lenny-ops pod label per the §13.2 selector exception
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.selector.matchLabels.app
          value: lenny-ops
      - equal:
          path: spec.template.metadata.labels.app
          value: lenny-ops

  # spec: §25.16 line 5113 — "Deployment: lenny-ops (1 replica, leader-elected)".
  - it: defaults to one replica per §25.16 line 5113
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: runs under the lenny-ops-sa service account
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: lenny-ops-sa

  - it: defaults the image tag to the chart appVersion
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/lennylabs/lenny-ops:0.1.0

  - it: configures leader election against the release namespace
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-election-namespace=NAMESPACE
      - contains:
          path: spec.template.spec.containers[0].args
          content: --addr=:8090

  - it: grants Lease RBAC for §25.4 leader election
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.name
          value: lenny-ops-leader-election
      - contains:
          path: rules
          content:
            apiGroups: ["coordination.k8s.io"]
            resources: ["leases"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - it: applies the restricted pod security posture
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: probes the §25.4 health and readiness endpoints
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  # spec: §25.4 lines 1034-1039 — F-25.4.10. The startup probe uses the
  # permissive /healthz with a 30×2s budget covering Postgres connection.
  - it: renders the §25.4 startup probe on the permissive /healthz
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 2

  # spec: §25.4 line 1055 — F-25.4.10. In production the readiness probe
  # uses the strict gate so traffic is not routed to a replica that
  # cannot reach both Postgres and the Kubernetes API.
  - it: uses the strict readiness gate when ops.production is true
    set:
      ops:
        production: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz?strict=true
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3

  # spec: §25.4 line 1027 — F-25.4.10. A writable /tmp emptyDir backs the
  # read-only root filesystem posture.
  - it: mounts a writable /tmp emptyDir under the read-only root
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}

  # spec: §25.4 line 1028 — F-25.4.10. topologySpreadConstraints render
  # only when lenny-ops scales past one replica.
  - it: omits topologySpreadConstraints at the default single replica
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: spreads replicas across nodes when ops.replicas >= 2 per §25.4 line 1028
    set:
      ops:
        replicas: 2
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels.app
          value: lenny-ops

  - it: renders the lenny-ops Service keyed on the app label with HTTP and metrics ports
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: lenny-ops
      - equal:
          path: spec.selector.app
          value: lenny-ops
      - contains:
          path: spec.ports
          content:
            name: http
            port: 8090
            targetPort: http
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9090
            targetPort: http

  # spec: §16.9 line 723 — F-16.9.10. The lenny-ops PodMonitor selects
  # by container port name `metrics`; the deployment must expose the
  # named port even though /metrics lives on the same HTTP listener.
  - it: exposes a named metrics containerPort on the lenny-ops pod
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 8090
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8090

  # spec: §25.4 line 1063 — F-25.16.3. The lenny-ops Service MUST
  # pin SSE clients to the replica that buffered their events; the
  # session-affinity timeout matches the §25.16 Production block.
  - it: pins SSE clients with sessionAffinity ClientIP per §25.4 line 1063
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.sessionAffinity
          value: ClientIP
      - equal:
          path: spec.sessionAffinityConfig.clientIP.timeoutSeconds
          value: 10800

  # spec: §25.4 line 1063 — F-25.16.3. Operators can tune the affinity
  # timeout via ops.service.sessionAffinityTimeoutSeconds.
  - it: honors ops.service.sessionAffinityTimeoutSeconds override per §25.4 line 1063
    set:
      ops:
        service:
          sessionAffinityTimeoutSeconds: 7200
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.sessionAffinityConfig.clientIP.timeoutSeconds
          value: 7200

  # spec: §25.16 line 5124 — F-25.16.4. When ops.prometheus.url is
  # empty (the §25.16 Minimal default) lenny-ops runs without a BYO
  # Prometheus URL and falls back to per-replica fan-out.
  - it: omits --prometheus-url when ops.prometheus.url is empty per §25.16 line 5124
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-url=

  # spec: §25.16 line 5124 — F-25.16.4. Production Tier 2/3 sets
  # ops.prometheus.url to the deployment's BYO Prometheus HTTP API.
  - it: plumbs --prometheus-url when ops.prometheus.url is set per §25.16 line 5124
    set:
      ops:
        prometheus:
          url: http://prometheus.monitoring.svc:9090
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-url=http://prometheus.monitoring.svc:9090

  # spec: §25.10 line 3809 — F-25.10.9. ops.drift.snapshotStaleWarningDays
  # renders as --drift-snapshot-stale-warning-days. Default 7 days.
  - it: renders --drift-snapshot-stale-warning-days with the spec default per §25.10 line 3809
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --drift-snapshot-stale-warning-days=7

  # spec: §25.10 line 3809 — F-25.10.9. Operators can override per
  # deployment; the rendered flag reflects the override.
  - it: honors ops.drift.snapshotStaleWarningDays override per §25.10 line 3809
    set:
      ops:
        drift:
          snapshotStaleWarningDays: 14
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --drift-snapshot-stale-warning-days=14

  # spec: §25.10 line 3824 — F-25.10.7. ops.drift.runningStateCacheTTLSeconds
  # renders as --drift-running-state-cache-ttl-seconds. Default 60s.
  - it: renders --drift-running-state-cache-ttl-seconds with the spec default per §25.10 line 3824
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --drift-running-state-cache-ttl-seconds=60

  # spec: §25.10 line 3824 — F-25.10.7. A 0 override disables the cache
  # entirely (every report reads fresh from the gateway).
  - it: honors ops.drift.runningStateCacheTTLSeconds=0 disable per §25.10 line 3824
    set:
      ops:
        drift:
          runningStateCacheTTLSeconds: 0
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --drift-running-state-cache-ttl-seconds=0

  # spec: §17.8.5 line 1323 — F-17.8.12. The chart MUST reject any
  # attempt to disable lenny-ops via Helm values: the operability
  # surface is mandatory in every Lenny installation regardless of tier.
  - it: rejects ops.enabled=false at chart validation per §17.8.5
    set:
      ops:
        enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "§17.8.5 line 1323: lenny-ops is mandatory in every Lenny installation; ops.enabled: false is rejected. Remove the override or omit the ops.enabled key."

  # spec: §17.8.5 line 1323 — F-17.8.12. ops.enabled is not a supported
  # Helm value; even an explicit true is rejected so the chart stays
  # the single source of truth on the §17.8.5 mandatoriness.
  - it: rejects ops.enabled=true at chart validation per §17.8.5
    set:
      ops:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "§17.8.5 line 1323: ops.enabled is not a supported Helm value (lenny-ops is mandatory); remove the ops.enabled key from your values."
