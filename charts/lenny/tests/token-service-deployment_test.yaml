suite: lenny-token-service deployment
templates:
  - token-service-deployment.yaml
tests:
  - it: renders the deployment, service account, and service
    asserts:
      - hasDocuments:
          count: 3

  - it: renders a Deployment named lenny-token-service
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: lenny-token-service
      - equal:
          path: metadata.labels["lenny.dev/component"]
          value: token-service

  - it: runs two replicas by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: runs under the lenny-token-service service account
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: lenny-token-service

  - it: defaults the image tag to the chart appVersion
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/lennylabs/lenny-token-service:0.1.0

  - it: binds the listener on the token-service gRPC port
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --addr=:50052
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: grpc
            containerPort: 50052

  - it: applies the restricted pod security posture
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: probes the listener with a TCP socket check
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: grpc
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: grpc

  - it: renders the lenny-token-service Service with gRPC and metrics ports
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: lenny-token-service
      - contains:
          path: spec.ports
          content:
            name: grpc
            port: 50052
            targetPort: grpc
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9090
            targetPort: grpc
