suite: lenny-token-service deployment
templates:
  - token-service-deployment.yaml
tests:
  - it: renders the deployment, service account, service, and PDB
    asserts:
      - hasDocuments:
          count: 4

  - it: renders a Deployment named lenny-token-service
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: lenny-token-service
      - equal:
          path: metadata.labels["lenny.dev/component"]
          value: token-service

  - it: runs two replicas by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: runs under the lenny-token-service service account
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: lenny-token-service

  - it: defaults the image tag to the chart appVersion
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/lennylabs/lenny-token-service:0.1.0

  - it: binds the gRPC and HTTP token-exchange listeners on the configured ports
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --grpc-addr=:50052
      - contains:
          path: spec.template.spec.containers[0].args
          content: --addr=:8081
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: grpc
            containerPort: 50052
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http-token
            containerPort: 8081

  - it: applies the restricted pod security posture
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: probes the listener with a TCP socket check
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: grpc
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: grpc

  - it: renders the lenny-token-service Service with gRPC and metrics ports
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: lenny-token-service
      - contains:
          path: spec.ports
          content:
            name: grpc
            port: 50052
            targetPort: grpc
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9090
            targetPort: grpc

  - it: protects the token-service with a PodDisruptionBudget
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    asserts:
      - equal:
          path: metadata.name
          value: lenny-token-service
      - equal:
          path: spec.minAvailable
          value: 1
      - equal:
          path: spec.selector.matchLabels["lenny.dev/component"]
          value: token-service

  # spec: §4.3 line 195 / §10.3 — when mtls.enabled the chart mounts
  # the lenny-token-service-tls Secret and passes the --tls-* flags so
  # the gRPC listener requires and verifies gateway client certs.
  - it: mounts the lenny-token-service-tls Secret when mtls.enabled (default)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: lenny-token-service-tls
            secret:
              secretName: lenny-token-service-tls
              defaultMode: 0400
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: lenny-token-service-tls
            mountPath: /etc/lenny/mtls
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --tls-cert=/etc/lenny/mtls/tls.crt
      - contains:
          path: spec.template.spec.containers[0].args
          content: --tls-key=/etc/lenny/mtls/tls.key
      - contains:
          path: spec.template.spec.containers[0].args
          content: --tls-ca=/etc/lenny/mtls/ca.crt

  # spec: §4.3 line 195 / §10.3 — when mtls.enabled=false (mesh-managed
  # mTLS) the chart skips the volume mounts and the --tls-* flags so
  # the binary runs in dev mode.
  - it: omits mTLS volume mounts and flags when mtls.enabled=false
    set:
      mtls.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --tls-cert=/etc/lenny/mtls/tls.crt
      - isNull:
          path: spec.template.spec.volumes
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts
