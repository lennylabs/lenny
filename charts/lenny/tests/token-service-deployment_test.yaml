suite: lenny-token-service deployment
templates:
  - token-service-deployment.yaml
tests:
  - it: renders the deployment, service account, service, and PDB
    asserts:
      - hasDocuments:
          count: 4

  - it: renders a Deployment named lenny-token-service
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: lenny-token-service
      - equal:
          path: metadata.labels["lenny.dev/component"]
          value: token-service

  - it: runs two replicas by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: runs under the lenny-token-service service account
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: lenny-token-service

  - it: defaults the image tag to the chart appVersion
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/lennylabs/lenny-token-service:0.1.0

  - it: binds the gRPC and HTTP token-exchange listeners on the configured ports
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --grpc-addr=:50052
      - contains:
          path: spec.template.spec.containers[0].args
          content: --addr=:8081
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: grpc
            containerPort: 50052
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http-token
            containerPort: 8081

  - it: applies the restricted pod security posture
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: probes the listener with a TCP socket check
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: grpc
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: grpc

  - it: renders the lenny-token-service Service with gRPC, http-token, and metrics ports
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: lenny-token-service
      - contains:
          path: spec.ports
          content:
            name: grpc
            port: 50052
            targetPort: grpc
      - contains:
          path: spec.ports
          content:
            name: http-token
            port: 8081
            targetPort: http-token
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9090
            targetPort: metrics

  # spec: F-4.3.10 / §16.1 — the Token Service binds the Prometheus
  # metrics listener on the configured tokenService.metricsPort so the
  # §16.1 catalog (lenny_token_service_*, lenny_oauth_token_*) is
  # scrapable. Without --metrics-addr the binary serves no /metrics.
  - it: binds the §16.1 metrics listener on tokenService.metricsPort
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-addr=:9090
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9090

  # spec: §10.2 (Authentication) — the Token Service default lifetime for a
  # request without expires_in comes from auth.capabilityTokenTtlSeconds,
  # the same value the gateway's playground bearer lifetime reads.
  - it: renders --capability-token-ttl-seconds from the shared lifetime value
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --capability-token-ttl-seconds=900

  - it: renders an operator-set capability token lifetime
    set:
      auth.capabilityTokenTtlSeconds: 1800
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --capability-token-ttl-seconds=1800

  # spec: §10.2 (Authentication), §27 — the values schema bounds
  # auth.capabilityTokenTtlSeconds to 120..3600, so 119 fails the install
  # before either binary sees it, and the retired playground key is gone.
  - it: rejects auth.capabilityTokenTtlSeconds of 119 at schema validation
    set:
      auth.capabilityTokenTtlSeconds: 119
    asserts:
      - failedTemplate:
          errorPattern: "/auth/capabilityTokenTtlSeconds.: minimum: got 119, want 120"

  - it: accepts auth.capabilityTokenTtlSeconds at the 120 floor
    set:
      auth.capabilityTokenTtlSeconds: 120
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --capability-token-ttl-seconds=120

  - it: rejects the retired playground.bearerTtlSeconds key
    set:
      playground.bearerTtlSeconds: 900
    asserts:
      - failedTemplate:
          errorPattern: "bearerTtlSeconds"

  # spec: F-4.3.11 / F-17.5.2 — the Token Service receives its KMS
  # provider selector from kms.provider, defaulting to local for the
  # dev install. environment carries the production-rejection gate.
  - it: renders the §4 / §17.5 KMS provider flags
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kms-provider=local
      - contains:
          path: spec.template.spec.containers[0].args
          content: --environment=dev

  - it: surfaces cloud KMS configuration when kms.provider != local
    set:
      kms.provider: aws
      kms.awsRegion: us-east-1
      kms.signQuotaPerSecond: 50
      kms.aliases: "platform:jwt-signing=arn:aws:kms:us-east-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab"
      environment: prod
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kms-provider=aws
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kms-aws-region=us-east-1
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kms-alias=platform:jwt-signing=arn:aws:kms:us-east-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab
      - contains:
          path: spec.template.spec.containers[0].args
          content: --environment=prod

  # spec: §17.4, §10.2 "Signing key and algorithm" — under kms.provider=local
  # the Token Service mounts the shared master key Secret (never optional) and
  # passes --kms-master-key-file, so it derives the same signing key as the
  # Token Service and lenny-ops.
  - it: mounts the generated master key Secret and passes --kms-master-key-file under local
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kms-master-key-file=/etc/lenny/kms/master-key
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kms-master-key
            secret:
              secretName: lenny-kms-master-key
              items:
                - key: master-key
                  path: master-key
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: kms-master-key
            mountPath: /etc/lenny/kms
            readOnly: true

  - it: mounts the Secret kms.masterKeySecret names
    set:
      kms.masterKeySecret: acme-kms-master-key
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kms-master-key
            secret:
              secretName: acme-kms-master-key
              items:
                - key: master-key
                  path: master-key

  - it: renders no master key mount or flag under a cloud provider
    set:
      kms.provider: aws
      kms.signQuotaPerSecond: 50
      kms.aliases: "platform:jwt-signing=arn:aws:kms:us-east-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --kms-master-key-file=/etc/lenny/kms/master-key
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: kms-master-key
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: kms-master-key
          any: true

  # spec: §10.2 "Signing topology" — the ServiceAccount binds to the provider
  # identity holding the KMS Sign and GetPublicKey permissions.
  - it: renders tokenService.serviceAccount.annotations on lenny-token-service
    set:
      tokenService.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/lenny-token-service
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::111122223333:role/lenny-token-service

  - it: renders no annotations on lenny-token-service by default
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - notExists:
          path: metadata.annotations

  - it: protects the token-service with a PodDisruptionBudget
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    asserts:
      - equal:
          path: metadata.name
          value: lenny-token-service
      - equal:
          path: spec.minAvailable
          value: 1
      - equal:
          path: spec.selector.matchLabels["lenny.dev/component"]
          value: token-service

  # spec: §4.3 / §10.3 — when mtls.enabled the chart mounts
  # the lenny-token-service-tls Secret and passes the --tls-* flags so
  # the gRPC listener requires and verifies gateway client certs.
  - it: mounts the lenny-token-service-tls Secret when mtls.enabled (default)
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      # spec: §13.2 credential-delivery primitive. The cert mounts 0440
      # (group-readable) paired with the pod fsGroup 65532 so the non-root
      # distroless Token Service can read it; a root-owned 0400 cert would
      # be unreadable under runAsNonRoot and break the §10.3 mTLS listener.
      # This is the production mode (devMode unset).
      - contains:
          path: spec.template.spec.volumes
          content:
            name: lenny-token-service-tls
            secret:
              secretName: lenny-token-service-tls
              defaultMode: 0440
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 65532
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: lenny-token-service-tls
            mountPath: /etc/lenny/mtls
            readOnly: true

  # spec: §13.2 credential-delivery primitive. The cert mount mode (0440)
  # and the pod fsGroup (65532) are unconditional, so the non-root
  # distroless Token Service reads the cert in dev mode too — they are not
  # gated on global.devMode. A regression that re-gated them would mount a
  # root-owned 0400 cert in production and break the §10.3 mTLS listener.
  - it: mounts the mTLS cert 0440 with fsGroup in dev mode too
    set:
      global.devMode: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: lenny-token-service-tls
            secret:
              secretName: lenny-token-service-tls
              defaultMode: 0440
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 65532
      - contains:
          path: spec.template.spec.containers[0].args
          content: --tls-cert=/etc/lenny/mtls/tls.crt
      - contains:
          path: spec.template.spec.containers[0].args
          content: --tls-key=/etc/lenny/mtls/tls.key
      - contains:
          path: spec.template.spec.containers[0].args
          content: --tls-ca=/etc/lenny/mtls/ca.crt

  # spec: §4.3 / §10.3 — when mtls.enabled=false (mesh-managed
  # mTLS) the chart skips the volume mounts and the --tls-* flags so
  # the binary runs in dev mode.
  - it: omits mTLS volume mounts and flags when mtls.enabled=false
    set:
      mtls.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --tls-cert=/etc/lenny/mtls/tls.crt
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: lenny-token-service-tls
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: lenny-token-service-tls
          any: true

  # spec: §10.5 /
  # §17.1 — the Token Service declares an explicit RollingUpdate
  # strategy with maxUnavailable 0 so a rollout keeps full token-minting
  # capacity on the gateway auth path. F-10.5.9.
  - it: renders the §10.5 / §17.1 RollingUpdate strategy by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1

  - it: honors a tokenService.rollingUpdate override
    documentSelector:
      path: kind
      value: Deployment
    set:
      tokenService.rollingUpdate.maxUnavailable: 1
      tokenService.rollingUpdate.maxSurge: 50%
    asserts:
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 50%

  # spec: §13.3 (Credential Flow) "Write-before-issue ordering", §4.3 (Token
  # Service) — the Token Service reads the Postgres DSN from the shared
  # datastore Secret so it writes issued_tokens and token.exchanged rows.
  # F-4.3.21.
  - it: renders LENNY_POSTGRES_DSN from lenny-datastore-conn when postgres.dsn is set
    set:
      postgres.dsn: "postgres://lenny_app@lenny-pgbouncer:5432/lenny"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_POSTGRES_DSN
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: postgres-dsn

  - it: renders no datastore env when neither postgres.dsn nor a Redis connection is set
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  # spec: §13.3 (Credential Flow) "Token rotation and revocation", §17.9.3 —
  # the external Redis URL the gateway uses.
  - it: renders LENNY_REDIS_URL from lenny-datastore-conn on the external topology
    set:
      redis.provider: external
      redis.url: "rediss://:pw@redis-master:6380"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_URL
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: redis-url
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --redis-allow-insecure

  # spec: §12.4 (Redis HA and Failure Modes) "Logical separation of Redis
  # concerns", §13.3 — revocations go to the Cache/Pub-Sub concern the
  # gateway replicas and lenny-ops subscribe on.
  - it: renders LENNY_REDIS_CACHE_PUBSUB_URL when redis.concerns.cachePubSubUrl is set
    set:
      redis.provider: external
      redis.url: "rediss://:pw@redis-master:6380"
      redis.concerns.cachePubSubUrl: "rediss://:pw@redis-cache:6380"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_CACHE_PUBSUB_URL
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: redis-cache-pubsub-url

  # spec: §17.9.3 (Redis topology), §12.4 — the Sentinel topology with TLS
  # and the AUTH credentials from the datastore Secret.
  - it: renders the Sentinel connection on the sentinel topology
    set:
      redis.provider: sentinel
      redis.sentinels: ["s-0:26379", "s-1:26379"]
      redis.sentinelMaster: lenny-master
      redis.password: data-pw
      redis.sentinelPassword: sentinel-pw
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_SENTINEL_ADDRS
            value: "s-0:26379,s-1:26379"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_SENTINEL_MASTER
            value: lenny-master
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_TLS
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: redis-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_SENTINEL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: redis-sentinel-password
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_URL
          any: true

  # spec: §12.4 (Redis HA and Failure Modes) — the Cluster seed nodes.
  - it: renders LENNY_REDIS_CLUSTER_ADDRS on the cluster topology
    set:
      redis.provider: cluster
      redis.cluster.addrs: "c-0:6379,c-1:6379"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_CLUSTER_ADDRS
            value: "c-0:6379,c-1:6379"

  # spec: §12.4 (Redis HA and Failure Modes) "Security" (AUTH and TLS are
  # required on every Redis instance), §17.9.3 — the Cluster topology
  # requests TLS and reads the AUTH password from the datastore Secret, so
  # the binary passes the §12.4 startup invariant outside dev mode. F-12.4.37.
  - it: requests TLS and reads the AUTH password on the cluster topology
    set:
      redis.provider: cluster
      redis.cluster.addrs: "c-0:6379,c-1:6379"
      redis.password: cluster-pw
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_TLS
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: lenny-datastore-conn
                key: redis-password
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_SENTINEL_ADDRS
          any: true

  # spec: §12.4 (Redis HA and Failure Modes) "Security" — with no password
  # the Cluster topology still requests TLS and reads no Secret key, so the
  # binary refuses to start with the §12.4 AUTH error rather than a missing
  # Secret key. F-12.4.37.
  - it: requests TLS and reads no password key on the cluster topology without a password
    set:
      redis.provider: cluster
      redis.cluster.addrs: "c-0:6379,c-1:6379"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_TLS
            value: "true"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_PASSWORD
          any: true

  # spec: §12.4 (Redis HA and Failure Modes) "Security" — the external
  # topology carries AUTH and TLS in the rediss:// URL, so a stray password
  # renders neither env entry. F-12.4.37.
  - it: renders no Redis password or TLS env on the external topology
    set:
      redis.provider: external
      redis.url: "rediss://:pw@r.svc:6380/0"
      redis.password: stray
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_PASSWORD
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_REDIS_TLS
          any: true

  # spec: §12.4, §17.4 (Local Development Mode) "Dev mode guard rails" —
  # the AUTH-and-TLS opt-out renders only under global.devMode.
  - it: passes --redis-allow-insecure only under global.devMode with a Redis connection
    set:
      global.devMode: true
      redis.provider: external
      redis.url: "redis://redis:6379"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --redis-allow-insecure

  - it: passes no --redis-allow-insecure under global.devMode without a Redis connection
    set:
      global.devMode: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --redis-allow-insecure
