suite: lenny-pool-scaling-controller (§4.6.2)
templates:
  - pool-scaling-controller-rbac.yaml
  - pool-scaling-controller-deployment.yaml
tests:
  - it: renders the service account, cluster role, and bindings
    template: pool-scaling-controller-rbac.yaml
    asserts:
      - hasDocuments:
          count: 5

  - it: creates the dedicated lenny-pool-scaling-controller service account
    template: pool-scaling-controller-rbac.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: lenny-pool-scaling-controller

  - it: grants create/update/delete on the PSC-owned CRD pair
    template: pool-scaling-controller-rbac.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ClusterRole
      - contains:
          path: rules
          content:
            apiGroups: ["lenny.dev"]
            resources: ["sandboxtemplates", "sandboxwarmpools"]
            verbs: ["get", "list", "watch", "create", "update", "delete"]
      - contains:
          path: rules
          content:
            apiGroups: ["lenny.dev"]
            resources: ["sandboxwarmpools/status"]
            verbs: ["get", "update", "patch"]

  - it: does not render the Deployment without a Postgres DSN
    template: pool-scaling-controller-deployment.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Deployment under its own ServiceAccount when Postgres is set
    template: pool-scaling-controller-deployment.yaml
    set:
      postgres:
        dsn: postgres://lenny@db/lenny
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: lenny-pool-scaling-controller
      - equal:
          path: spec.template.spec.serviceAccountName
          value: lenny-pool-scaling-controller

  # spec: §16.5 lines 590-601 / F-16.5.6 — the PSC reads the
  # capacityPlanning.* workload-profile values at startup. The chart
  # renders the stock defaults and the tier as env vars.
  - it: renders the capacityPlanning workload-profile env with stock defaults
    template: pool-scaling-controller-deployment.yaml
    set:
      postgres:
        dsn: postgres://lenny@db/lenny
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_CAPACITY_TIER
            value: "tier1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_CAPACITY_AVG_SESSION_DURATION_SECONDS
            value: "333"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_CAPACITY_DELEGATION_PARTICIPATION_RATE
            value: "0.05"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_CAPACITY_SESSION_IDLE_FRACTION
            value: "0.3"

  # spec: §16.5 line 601 / F-16.5.6 — a Tier 3 deployment substituting
  # observed workload values renders them so the PSC's at-defaults
  # warning stays silent.
  - it: renders operator-substituted capacityPlanning values at Tier 3
    template: pool-scaling-controller-deployment.yaml
    set:
      postgres.dsn: postgres://lenny@db/lenny
      capacityPlanning.tier: tier3
      capacityPlanning.avgSessionDurationSeconds: 600
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_CAPACITY_TIER
            value: "tier3"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENNY_CAPACITY_AVG_SESSION_DURATION_SECONDS
            value: "600"
