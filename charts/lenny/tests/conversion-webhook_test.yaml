suite: lenny-crd-conversion conversion webhook (§17.2 item 12 / §15.5)
release:
  name: lenny
  namespace: lenny-system
templates:
  - admission-policies/conversion-webhook.yaml
tests:
  # spec: §17.2 lines 53/68/82 — lenny-crd-conversion is a Phase 3.5
  # baseline (always-rendered) webhook. It renders the shared workload
  # (Deployment, Service, PodDisruptionBudget, Certificate) with no
  # feature-flag gate. F-15.5.2 / F-17.2.4 / F-10.5.6.
  - it: renders the conversion webhook workload unconditionally (baseline)
    set:
      features.llmProxy: false
      features.drainReadiness: false
      features.compliance: false
    asserts:
      - hasDocuments:
          count: 4

  - it: still renders with all feature flags enabled
    set:
      features.llmProxy: true
      features.drainReadiness: true
      features.compliance: true
    asserts:
      - hasDocuments:
          count: 4

  # spec: §17.2 line 56 — every webhook (and the CRD conversion webhook)
  # runs replicas: 2 with the canonical admission-webhook pod label so the
  # §13.2 admission-webhook NetworkPolicy and the per-webhook unavailability
  # alert match it. The workload runs the same lenny-webhook image that
  # serves /crd-conversion.
  - it: runs the lenny-webhook image with replicas 2 and the canonical component label
    documentIndex: 0
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: lenny-crd-conversion
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: metadata.labels["lenny.dev/component"]
          value: admission-webhook
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: lenny-webhook

  - it: exposes a ClusterIP Service named lenny-crd-conversion on 443
    documentIndex: 1
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: lenny-crd-conversion
      - equal:
          path: spec.ports[0].port
          value: 443

  # spec: §17.2 line 56 — HA posture: PodDisruptionBudget minAvailable 1.
  - it: ships a PodDisruptionBudget with minAvailable 1
    documentIndex: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  # spec: §15.5 line 2436 — the webhook serving cert is issued by the
  # shared self-signed Issuer so cert-manager injects the CA.
  - it: provisions a cert-manager Certificate for the serving cert
    documentIndex: 3
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: spec.issuerRef.name
          value: lenny-webhook-selfsign
