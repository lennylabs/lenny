---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: runtimes.lenny.dev
spec:
  group: lenny.dev
  names:
    kind: Runtime
    listKind: RuntimeList
    plural: runtimes
    shortNames:
    - rt
    singular: runtime
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .spec.integrationLevel
      name: Level
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Runtime is the lenny.dev/v1 declaration of a registered agent
          runtime (§5.1). Runtimes are platform-global, so the resource is
          cluster-scoped.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RuntimeSpec is the desired state of a registered agent Runtime
              (§5.1). The gateway mirrors the registered runtimes into its
              runtime_definitions registry; the CRD is the declarative source.
            properties:
              allowedResourceClasses:
                description: |-
                  AllowedResourceClasses lists the §5 resource classes a session
                  of this runtime may request.
                items:
                  type: string
                type: array
              executionMode:
                description: |-
                  ExecutionMode is the §5.2 pod-reuse mode. Empty defaults to
                  `session` at registration time.
                enum:
                - session
                - task
                - concurrent
                type: string
              image:
                description: Image is the OCI image reference the warm pool launches.
                type: string
              integrationLevel:
                description: |-
                  IntegrationLevel is the §5.1 conformance level the runtime
                  implements.
                enum:
                - basic
                - standard
                - full
                type: string
              isolationProfile:
                description: IsolationProfile is the §5.3 default sandbox isolation
                  profile.
                enum:
                - standard
                - sandboxed
                - microvm
                type: string
              supportedProviders:
                description: |-
                  SupportedProviders lists the LLM providers the runtime accepts
                  leased credentials for.
                items:
                  type: string
                type: array
              type:
                description: |-
                  Type is the runtime kind: `agent` runs an interactive agent,
                  `mcp` exposes an MCP server.
                enum:
                - agent
                - mcp
                type: string
            required:
            - image
            - integrationLevel
            - type
            type: object
          status:
            description: RuntimeStatus is the observed state of a Runtime.
            properties:
              conditions:
                description: |-
                  Conditions is the standard Kubernetes condition list. The
                  controller sets a `Registered` condition once the runtime is
                  mirrored into the gateway.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation the controller
                  last reconciled into the gateway registry.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
