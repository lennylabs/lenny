metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: sandboxclaims.lenny.dev
spec:
  group: lenny.dev
  names:
    kind: SandboxClaim
    listKind: SandboxClaimList
    plural: sandboxclaims
    shortNames:
    - sbxc
    singular: sandboxclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sandboxRef
      name: Sandbox
      type: string
    - jsonPath: .spec.sessionId
      name: Session
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          SandboxClaim is the lenny.dev/v1 record binding a session to a
          claimed Sandbox pod (§4.6). Gateway replicas create it with
          optimistic locking so exactly one wins a contested pod.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SandboxClaimSpec is the desired state of a SandboxClaim — the §4.6
              binding of a session to a claimed Sandbox pod. A SandboxClaim
              deliberately carries no ownerReference so the session survives pod
              deletion and can be reassigned; the WarmPoolController garbage-
              collects orphaned claims instead.
            properties:
              sandboxRef:
                description: |-
                  SandboxRef names the Sandbox this claim binds. The
                  lenny-sandboxclaim-guard webhook resolves the referenced
                  Sandbox's status.phase to reject double-claims and stale writes.
                type: string
              sessionId:
                description: SessionID is the §15.1 session this claim serves.
                type: string
              tenantId:
                description: TenantID is the tenant that owns the session.
                type: string
            required:
            - sandboxRef
            - sessionId
            type: object
          status:
            description: |-
              SandboxClaimStatus is the observed state of a SandboxClaim. Per
              §4.6.3 status.phase is gateway-owned and tracks the session-to-pod
              binding — distinct from the Sandbox pod lifecycle state machine.
            properties:
              conditions:
                description: Conditions is the standard Kubernetes condition list.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is the §4.6.3 session-binding state: `bound` once the
                  claim is bound to a claimed Sandbox, `released` once the pod is
                  returned to the pool, `failed` on a binding failure.
                enum:
                - bound
                - released
                - failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
