{{- /*
NET-006 Helm chart guard (§13.2 lines 438-441, layer 3 of three).

A pool that pairs deliveryMode: proxy with egressProfile: provider-direct
is an incoherent security posture: proxy mode routes LLM traffic through
the gateway to keep API keys off the pod, while provider-direct egress
opens a direct CIDR path to the same provider endpoints. The two CRD
admission webhooks (lenny-pool-config-validator and
lenny-direct-mode-isolation) reject the combination at pool admission;
this render-time guard is the third layer the spec prescribes — it fails
the install/upgrade before any Day-1 bootstrap.credentialPools seed that
declares the illegal combination is ever applied.

The guard iterates the bootstrap.credentialPools seed and fails the
render when any entry sets both keys. An empty seed (the default) and any
seed entry that omits egressProfile pass. The template renders no Kubernetes
object; it exists solely to evaluate the guard at template time, which
Helm runs on both `install` and `upgrade`.
*/ -}}
{{- if .Values.bootstrap.enabled }}
{{- range $i, $pool := .Values.bootstrap.credentialPools }}
{{- if and (eq (toString $pool.deliveryMode) "proxy") (eq (toString $pool.egressProfile) "provider-direct") }}
{{- fail (printf "InvalidPoolEgressDeliveryCombo: bootstrap.credentialPools[%d] (%q) sets deliveryMode: proxy with egressProfile: provider-direct, which §13.2 (NET-006) makes mutually exclusive; provider-direct egress would give a proxy-mode pod a direct CIDR bypass to provider endpoints the proxy is meant to mediate. Use egressProfile: restricted with deliveryMode: proxy, or egressProfile: provider-direct with deliveryMode: direct." $i $pool.name) }}
{{- end }}
{{- end }}
{{- end }}
