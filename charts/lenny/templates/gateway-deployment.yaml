{{- /*
The lenny-gateway Deployment, its Services, and its RBAC (§4.1, §17.1).
The gateway is the §4.1 edge: it serves the §15.1 REST surface, the
§8.6 GatewayControl gRPC listener, and the §4.9 LLM reverse proxy. It
is stateless and horizontally scaled, so the Deployment carries a
replica count and the §13.1 Restricted-PSS posture (non-root, all
capabilities dropped, read-only root filesystem, RuntimeDefault
seccomp) shared with the controller.

The gateway claims §5 warm pods: it lists Sandbox and SandboxWarmPool
CRDs, creates the binding SandboxClaim CRD the §17.2
lenny-sandboxclaim-guard webhook checks, and writes Sandbox status. The
ClusterRole below grants exactly those verbs.

Two Services are rendered. lenny-gateway is the ClusterIP Service the
internal control plane reaches (the §17.2 lenny-drain-readiness webhook
and lenny-ops both resolve it by this name); its metrics port maps to
the gateway's HTTP listener because the binary serves /metrics on the
same mux as the REST API (§16.1), and the §13.2 ServiceMonitor scrapes
it. lenny-gateway-pods is the §17.1 headless Service that gives every
gateway replica per-replica DNS so lenny-ops can fan out §25.3 health
and event queries to each replica individually.

Postgres, Redis, and MinIO stay bring-your-own external services
(§17.9). The connection settings are wired from the corresponding
values via environment variables the binary reads (LENNY_POSTGRES_DSN,
LENNY_REDIS_URL, LENNY_MINIO_*); the chart leaves them unset by
default so a stock render produces the in-memory development backends.
When postgres.dsn, redis.url, or minio.endpoint is set, the env var
for that store is rendered: the credential-bearing values
(LENNY_POSTGRES_DSN, LENNY_MINIO_ACCESS_KEY, LENNY_MINIO_SECRET_KEY)
are read from the lenny-datastore-conn Secret with secretKeyRef, and
the non-secret values (endpoint, bucket, tls.enabled) are plain env. Each
env var is gated on its own value, so a partial configuration renders
only the env vars it can satisfy.
*/ -}}
{{- $pg := .Values.postgres -}}
{{- $redis := .Values.redis -}}
{{- $minio := .Values.minio -}}
{{- $hasPg := and $pg $pg.dsn (ne $pg.dsn "") -}}
{{- $hasRedis := and $redis $redis.url (ne $redis.url "") -}}
{{- $hasMinio := and $minio $minio.endpoint (ne $minio.endpoint "") -}}
{{- /* §12.5 line 279 — TLS-mandate posture. tls.enabled selects HTTPS
   to the MinIO endpoint. The spec requires `true` on every
   non-embedded deployment; the chart enforces the posture below.
   Default tls.enabled is true; an explicit `false` is honored. */ -}}
{{- $minioUseSSL := true -}}
{{- if and $minio (hasKey ($minio | default dict) "tls") -}}
{{- $minioTLS := $minio.tls -}}
{{- if hasKey ($minioTLS | default dict) "enabled" -}}
{{- $minioUseSSL = $minioTLS.enabled -}}
{{- end -}}
{{- end -}}
{{- $backends := .Values.backends | default "" -}}
{{- $complianceProfile := .Values.complianceProfile | default "" -}}
{{- /* Regulated profiles MUST run with TLS. Embedded mode is the only
   posture where TLS may be disabled (§12.5 line 279). */ -}}
{{- $regulated := or (eq $complianceProfile "soc2") (eq $complianceProfile "fedramp") (eq $complianceProfile "hipaa") -}}
{{- if and (not $minioUseSSL) $regulated -}}
{{- fail (printf "§12.5 line 279: minio.tls.enabled MUST be true when complianceProfile is %q (regulated)." $complianceProfile) -}}
{{- end -}}
{{- if and (not $minioUseSSL) (ne $backends "embedded") -}}
{{- fail "§12.5 line 279: minio.tls.enabled may default to false only when backends: embedded; set tls.enabled: true on any other backends value." -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lenny-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  {{- with .Values.gateway.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lenny-gateway
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
rules:
  # The gateway lists warm pools and Sandboxes to claim a §5 warm pod,
  # writes Sandbox status on a successful claim, and reads pods to
  # resolve the claimed pod's IP for the adapter dial.
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxwarmpools", "sandboxtemplates", "runtimes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxes"]
    # The §5.2 slot-claim path SSA-patches the Sandbox metadata to
    # stamp the tenant-pinning label (lenny.dev/tenant-id) on a
    # concurrent-mode Sandbox's first slot reservation. That patch
    # targets the main resource (not /status), so the gateway needs
    # the `patch` verb here in addition to the read verbs.
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxes/status"]
    verbs: ["get", "update", "patch"]
  # SandboxClaim: the gateway creates the binding claim CRD that the
  # §17.2 lenny-sandboxclaim-guard webhook validates on CREATE, and
  # deletes it on session terminate (session-mode Release path and
  # §5.2 concurrent-mode SlotClaimer.ReleaseSlot both do
  # Client.Delete on the SandboxClaim). Without `delete`, the
  # gateway returns terminate=200 but the claim deletion silently
  # 403s and Sandbox.status.activeSlots stays elevated indefinitely.
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Pods: read to resolve the claimed pod's IP for the adapter dial,
  # and patch for the §4.6.3 gateway-SA grant covering tenant-id and
  # state label mutations on agent pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lenny-gateway
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lenny-gateway
subjects:
  - kind: ServiceAccount
    name: lenny-gateway
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lenny-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: gateway
  # spec: §10.3 lines 316, 334 (NET-064). The lenny-preflight Job
  # enumerates these annotations across every lenny-gateway Deployment
  # in the cluster to enforce SPIFFE-trust-domain / SA-token-audience
  # uniqueness. Without them, the collision check sees existing
  # deployments as having empty annotations and never flags a clash.
  # F-10.3.6.
  annotations:
    lenny.dev/spiffe-trust-domain: {{ .Values.global.spiffeTrustDomain | quote }}
    {{- with .Values.global.saTokenAudience }}
    lenny.dev/sa-token-audience: {{ . | quote }}
    {{- end }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  # §4.1 / §17.1 rolling-update strategy. maxUnavailable: 1 caps the
  # number of replicas Kubernetes drains concurrently during a
  # Deployment-initiated rollout (image bump, spec change) at one — at
  # Tier 3 (~20 replicas) the Kubernetes default of 25% would let up to
  # 5 replicas drain at once, exceeding the §10.1 per-replica 400-pod
  # CheckpointBarrier fan-out budget. maxSurge: 25% allows the
  # replacement set to scale ahead of the drained set so a rollout is
  # not bottlenecked behind the drain pace. This strategy is on an
  # independent disruption axis from the PodDisruptionBudget below; the
  # PDB bounds every other voluntary disruption (kubectl drain,
  # autoscaler node consolidation, HPA scale-down).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.gateway.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.gateway.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      lenny.dev/component: gateway
  template:
    metadata:
      labels:
        {{- include "lenny.labels" . | nindent 8 }}
        lenny.dev/component: gateway
    spec:
      serviceAccountName: lenny-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- /*
          §4.3 / §10.3 mTLS material. The lenny-gateway-tls Secret is
          rendered by mtls-pki.yaml (cert-manager-managed). cert-manager
          stores tls.crt / tls.key (the gateway client cert) and ca.crt
          (the issuing CA cert) inside the same Secret; mounting it at
          /etc/lenny/mtls/ gives the binary all three files it needs to
          present the gateway client cert to the Token Service and to
          verify the Token Service server cert against the shared
          cluster-internal CA. The mount is gated on mtls.enabled so a
          no-mesh / external-mTLS deployment can opt out, but the chart
          default is mtls.enabled=true.
      */ -}}
      {{- if .Values.mtls.enabled }}
      volumes:
        {{- if .Values.gateway.spiffe.enabled }}
        # §4.3 line 205 per-replica mTLS identity. The
        # cert-manager-csi-driver-spiffe (or equivalent SPIFFE CSI
        # driver) injects a per-pod certificate whose SAN carries a
        # distinct spiffe:// URI for each replica. The Token Service's
        # gRPC interceptor extracts the SPIFFE ID and threads it
        # through to audit so per-replica attribution is possible.
        # The shared lenny-gateway-tls Secret is not mounted on this
        # path — every replica gets its own CSR-driven identity.
        - name: lenny-gateway-tls
          csi:
            driver: {{ .Values.gateway.spiffe.csiDriverName | quote }}
            readOnly: true
            volumeAttributes:
              spiffe.csi.cert-manager.io/trust-domain: {{ default .Values.global.spiffeTrustDomain .Values.gateway.spiffe.trustDomain | quote }}
              spiffe.csi.cert-manager.io/identity-template: "spiffe://{{ default .Values.global.spiffeTrustDomain .Values.gateway.spiffe.trustDomain }}/gateway/{{`{{ .PodName }}`}}"
        {{- else }}
        - name: lenny-gateway-tls
          secret:
            secretName: lenny-gateway-tls
            defaultMode: 0400
        {{- end }}
      {{- end }}
      {{- /*
          §4.1 / §17.1 cross-zone topology spread. The §17.1 narrative
          calls for gateway replicas to spread via topology spread
          constraints so a zone failure does not collapse capacity onto
          a single replica set. The block is opt-in via
          gateway.topologySpread so a stock single-zone install renders
          without it; the tier-3 preset enables it.
      */ -}}
      {{- with .Values.gateway.topologySpread }}
      {{- if .enabled }}
      topologySpreadConstraints:
        {{- range .constraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $.Chart.Name }}
              lenny.dev/component: gateway
        {{- end }}
      {{- end }}
      {{- end }}
      {{- /*
          §17.8.2 Tier 3 node-drain expectation: a soft podAntiAffinity
          rule on topologyKey: kubernetes.io/hostname so the scheduler
          prefers spreading gateway pods across distinct nodes. The
          block is opt-in via gateway.podAntiAffinity so it lights up
          only when an operator (or the tier-3 preset) enables it; Tier
          1/2 deployments MAY omit it per §17.8.2.
      */ -}}
      {{- with .Values.gateway.podAntiAffinity }}
      {{- if .enabled }}
      affinity:
        podAntiAffinity:
          {{- if eq .schedulingRule "preferred" }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .weight | default 100 }}
              podAffinityTerm:
                topologyKey: {{ .topologyKey | default "kubernetes.io/hostname" }}
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ $.Chart.Name }}
                    lenny.dev/component: gateway
          {{- else if eq .schedulingRule "required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: {{ .topologyKey | default "kubernetes.io/hostname" }}
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ $.Chart.Name }}
                  lenny.dev/component: gateway
          {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          args:
            - --addr=:{{ .Values.gateway.internalPort }}
            - --grpc-addr=:{{ .Values.gateway.grpcPort }}
            - --no-environment-policy={{ .Values.gateway.noEnvironmentPolicy }}
            # §10.2 line 212 — OIDC claim the gateway extracts the
            # tenant identifier from. Operator-configurable so an
            # upstream IdP that stamps tenant identity under a non-
            # canonical claim name still works without a code change.
            # F-10.2.9.
            - --tenant-id-claim={{ .Values.auth.tenantIdClaim }}
            # §4.3 trust boundary: the gateway materializes every §4.9
            # credential lease through lenny-token-service over mTLS;
            # the in-process MintLease path is reserved for dev mode.
            - --token-service-grpc-addr=lenny-token-service.{{ .Release.Namespace }}.svc:{{ .Values.tokenService.grpcPort }}
            # §4.3 canonical token endpoint (F-4.3.12). The gateway
            # reverse-proxies /v1/oauth/* to the Token Service's HTTP
            # listener so the Token Service is the sole minter.
            - --token-service-http-url=http://lenny-token-service.{{ .Release.Namespace }}.svc:{{ .Values.tokenService.httpPort }}
            # §4 KMS provider (F-4.3.11). The gateway wraps the §4.9
            # connector-credential DEKs through this provider.
            - --kms-provider={{ .Values.kms.provider }}
            - --environment={{ .Values.environment }}
            {{- with .Values.kms.aliases }}
            - --kms-alias={{ . }}
            {{- end }}
            {{- with .Values.kms.awsRegion }}
            - --kms-aws-region={{ . }}
            {{- end }}
            {{- with .Values.kms.azureVaultURL }}
            - --kms-azure-vault-url={{ . }}
            {{- end }}
            {{- if .Values.mtls.enabled }}
            # §4.3 line 195 / §10.3 mTLS client material. The gateway
            # presents the lenny-gateway-tls cert to the Token Service
            # gRPC listener and verifies the Token Service server cert
            # against the shared cluster-internal CA. cert-manager
            # stores tls.crt/tls.key/ca.crt under the same Secret.
            - --token-service-tls-cert=/etc/lenny/mtls/tls.crt
            - --token-service-tls-key=/etc/lenny/mtls/tls.key
            - --token-service-ca=/etc/lenny/mtls/ca.crt
            # §4.7 / §10.3 line 320 (NET-060) adapter mTLS client
            # material. The same lenny-gateway-tls Secret carries the
            # client cert the gateway presents to each pod adapter's
            # gRPC listener; ca.crt verifies the adapter's per-pod
            # serving cert. F-10.3.10.
            - --adapter-tls-cert=/etc/lenny/mtls/tls.crt
            - --adapter-tls-key=/etc/lenny/mtls/tls.key
            - --adapter-ca=/etc/lenny/mtls/ca.crt
            {{- end }}
            # §9.2 platform-wide elicitation content-integrity floor.
            # The admin API's GET endpoint reports the effective mode
            # as max(floor, tenantStored); a PUT below the floor is
            # rejected with ELICITATION_INTEGRITY_BELOW_PLATFORM_FLOOR.
            - --elicitation-content-integrity-floor={{ .Values.security.elicitationContentIntegrity.floor }}
            {{- /* §4.6 pod placement: pin the gateway at the first
                  agent namespace so SandboxClaims land against live
                  warm pods. Without --agent-namespace the gateway
                  runs in-memory and no Sandbox is claimed. */ -}}
            {{- with (first .Values.agentNamespaces) }}
            - --agent-namespace={{ .name }}
            {{- end }}
            {{/* §4.4 line 256 / line 258 — periodic-checkpoint
                  cadence and per-session first-checkpoint jitter
                  fraction. The gateway honors these flags only when
                  --agent-namespace is set. */}}
            - --checkpoint-interval={{ .Values.gateway.periodicCheckpointIntervalSeconds }}s
            - --checkpoint-jitter-fraction={{ .Values.gateway.periodicCheckpointJitterFraction }}
            # §10.4 line 389 — per-session SSE replay buffer depth.
            # F-10.4.5.
            - --session-event-replay-buffer-depth={{ .Values.gateway.sessionEventReplayBufferDepth }}
            # §10.4 line 385 / §16.5 PDBBlockedEvictions — name the
            # gateway PDB so the in-process poller can address it. The
            # namespace defaults to the gateway pod's own namespace via
            # POD_NAMESPACE (env var below). F-10.4.4.
            - --gateway-pdb-name=lenny-gateway
            {{- with .Values.sandbox.defaultIsolationProfile }}
            - --default-isolation-profile={{ . }}
            {{- end }}
            {{- if .Values.global.devMode }}
            - --dev-mode
            {{- end }}
            {{- if .Values.features.llmProxy }}
            - --llm-proxy-addr=:{{ .Values.gateway.llmProxyPort }}
            {{- end }}
            {{- if .Values.playground.enabled }}
            - --playground-enabled
            - --playground-auth-mode={{ .Values.playground.authMode }}
            - --playground-dev-tenant-id={{ .Values.playground.devTenantId }}
            - --playground-allowed-runtimes={{ .Values.playground.allowedRuntimes }}
            - --playground-max-session-minutes={{ .Values.playground.maxSessionMinutes }}
            - --playground-max-idle-time-seconds={{ .Values.playground.maxIdleTimeSeconds }}
            - --playground-oidc-session-ttl-seconds={{ .Values.playground.oidcSessionTtlSeconds }}
            - --playground-bearer-ttl-seconds={{ .Values.playground.bearerTtlSeconds }}
            {{- with .Values.playground.gatewayHost }}
            - --playground-gateway-host={{ . }}
            {{- end }}
            {{- end }}
            {{- if hasKey .Values "memory" }}
            {{- if not .Values.memory.enabled }}
            - --memory-enabled=false
            {{- end }}
            {{- with .Values.memory.maxMemoriesPerUser }}
            - --memory-max-per-user={{ . }}
            {{- end }}
            {{- if hasKey .Values.memory "recordCountIntervalSeconds" }}
            - --memory-record-count-interval={{ .Values.memory.recordCountIntervalSeconds }}s
            {{- end }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # §10.4 line 385 — the §10.4 PDB poller reads POD_NAMESPACE
            # as the default gateway-namespace so the chart does not
            # need to repeat the release namespace in the args list.
            # F-10.4.4.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # §4.1 gateway.maxSessionsPerReplica — per-replica capacity
            # ceiling used as the denominator of the §16.5
            # GatewaySessionBudgetNearExhaustion alert and the §17.8.2
            # SCL-036 burst-absorption minReplicas formula. Rendered
            # from the Helm value so a tier-preset override flows into
            # the gateway binary without a code change. The gateway
            # emits the configured value on the
            # lenny_gateway_max_sessions_per_replica gauge at startup.
            - name: LENNY_MAX_SESSIONS_PER_REPLICA
              value: {{ .Values.gateway.maxSessionsPerReplica | quote }}
            # §4.1 / §16.5 GatewayNoHealthyReplicas alert denominator.
            # Rendered from autoscaling.minReplicas so a tier-preset
            # override flows into the lenny_gateway_min_replicas gauge.
            - name: LENNY_MIN_REPLICAS
              value: {{ .Values.autoscaling.minReplicas | quote }}
            # §4.1 / §16.5 GatewayActiveStreamsHigh alert denominator.
            # Defaults to gateway.streamCeiling when set; otherwise uses
            # gateway.maxSessionsPerReplica so a stock render emits a
            # non-zero ceiling consistent with the per-replica session
            # capacity (each session may hold at most one active stream).
            - name: LENNY_STREAM_CEILING
              value: {{ .Values.gateway.streamCeiling | default .Values.gateway.maxSessionsPerReplica | quote }}
            # §4.4 line 263 / §10.1 — preStop hook reads this to bound
            # the staged drain budget. The chart-default 240s matches
            # the terminationGracePeriodSeconds set below so the
            # gateway honors the same deadline Kubernetes enforces.
            - name: LENNY_TERMINATION_GRACE_SECONDS
              value: {{ .Values.gateway.terminationGracePeriodSeconds | default 240 | quote }}
            {{- with .Values.gateway.extractionThresholds }}
            # §4.1 extractionThresholds — per-subsystem extraction
            # thresholds surfaced from Helm so operators can calibrate
            # them at deploy time. Each value is also emitted at startup
            # on the lenny_gateway_extraction_threshold{subsystem,metric}
            # gauge for auditability against /metrics.
            {{- with .streamProxy }}
            - name: LENNY_EXTRACTION_THRESHOLD_STREAM_PROXY_QUEUE_DEPTH
              value: {{ .queueDepth | quote }}
            - name: LENNY_EXTRACTION_THRESHOLD_STREAM_PROXY_P99_ATTACH_LATENCY_SECONDS
              value: {{ .p99AttachLatencySeconds | quote }}
            {{- end }}
            {{- with .uploadHandler }}
            - name: LENNY_EXTRACTION_THRESHOLD_UPLOAD_HANDLER_ACTIVE_CONCURRENT
              value: {{ .activeConcurrent | quote }}
            - name: LENNY_EXTRACTION_THRESHOLD_UPLOAD_HANDLER_P99_LATENCY_SECONDS
              value: {{ .p99LatencySeconds | quote }}
            {{- end }}
            {{- with .mcpFabric }}
            - name: LENNY_EXTRACTION_THRESHOLD_MCP_FABRIC_ACTIVE_DELEGATIONS
              value: {{ .activeDelegations | quote }}
            - name: LENNY_EXTRACTION_THRESHOLD_MCP_FABRIC_P99_ORCHESTRATION_LATENCY_SECONDS
              value: {{ .p99OrchestrationLatencySeconds | quote }}
            {{- end }}
            {{- with .llmProxy }}
            - name: LENNY_EXTRACTION_THRESHOLD_LLM_PROXY_ACTIVE_CONNECTIONS
              value: {{ .activeConnections | quote }}
            - name: LENNY_EXTRACTION_THRESHOLD_LLM_PROXY_P99_TTFB_SECONDS
              value: {{ .p99TTFBSeconds | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.observability.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.billing.sink }}
            - name: LENNY_BILLING_SINK
              value: {{ . | quote }}
            {{- end }}
            # §4.2 line 165 LENNY_POOLER_MODE: deployment-posture knob
            # for the Postgres pooler. The gateway logs it at startup
            # so operators can confirm the value the running binary
            # observed; the §4.2 __all__-sentinel guard is enforced
            # at the database trigger via the lenny.allow_all_sentinel
            # GUC, which pgtenant.InAllTenants sets via SET LOCAL.
            - name: LENNY_POOLER_MODE
              value: {{ .Values.pgbouncer.poolerMode | quote }}
            {{- if $hasPg }}
            - name: LENNY_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: postgres-dsn
            {{- end }}
            {{- if $hasRedis }}
            - name: LENNY_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: redis-url
            {{- end }}
            {{- if $hasMinio }}
            - name: LENNY_MINIO_ENDPOINT
              value: {{ $minio.endpoint | quote }}
            - name: LENNY_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: minio-access-key
            - name: LENNY_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: minio-secret-key
            - name: LENNY_MINIO_BUCKET
              value: {{ $minio.bucket | quote }}
            - name: LENNY_MINIO_USE_SSL
              value: {{ $minioUseSSL | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.internalPort }}
            - name: grpc
              containerPort: {{ .Values.gateway.grpcPort }}
            {{- if .Values.features.llmProxy }}
            - name: llm-proxy
              containerPort: {{ .Values.gateway.llmProxyPort }}
            {{- end }}
          {{- if .Values.mtls.enabled }}
          volumeMounts:
            - name: lenny-gateway-tls
              mountPath: /etc/lenny/mtls
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # §4.4 line 234, 263 / §10.1 preStop staged drain. Kubernetes
          # invokes the hook before SIGTERM; the gateway selects the
          # tiered checkpoint cap per session, triggers a synchronous
          # eviction checkpoint per session, and emits the
          # lenny_prestop_cap_selection_total counter for the §16.5
          # PreStopCapFallbackRateHigh alert.
          lifecycle:
            preStop:
              httpGet:
                path: /internal/prestop
                port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      # spec: §17.8.2 — Tier 1/2 terminationGracePeriodSeconds defaults
      # to 240s, which leaves a 30s safety margin above the 210s preStop
      # budget (90s tier cap + 90s BarrierAck + 30s stream drain). The
      # gateway binary reads the same value from
      # LENNY_TERMINATION_GRACE_SECONDS so the preStop hook honors the
      # chart-set deadline.
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds | default 240 }}
---
apiVersion: v1
kind: Service
metadata:
  name: lenny-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: gateway
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    lenny.dev/component: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.internalPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.gateway.grpcPort }}
      targetPort: grpc
    - name: metrics
      port: {{ .Values.gateway.metricsPort }}
      targetPort: http
    {{- if .Values.features.llmProxy }}
    - name: llm-proxy
      port: {{ .Values.gateway.llmProxyPort }}
      targetPort: llm-proxy
    {{- end }}
---
# lenny-gateway-pods headless Service (§17.1). clusterIP: None gives
# each gateway replica a per-replica DNS A record so lenny-ops can fan
# out §25.3 health, recommendation, and event queries to every replica.
apiVersion: v1
kind: Service
metadata:
  name: lenny-gateway-pods
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: gateway
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    lenny.dev/component: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.internalPort }}
      targetPort: http
{{- if .Values.gateway.podDisruptionBudget.enabled }}
---
# PodDisruptionBudget for the lenny-gateway Deployment (§4.1 line 61,
# §17.1). The gateway's §10.1 preStop hook fans out CheckpointBarrier to
# up to 400 pods per replica; a flat maxUnavailable: 1 caps voluntary
# disruptions (kubectl drain, cluster-autoscaler node consolidation,
# HPA scale-down) at one replica's quota across all tiers. The same
# integer at Tier 1 (minReplicas: 2) leaves one replica of disruption
# budget, while a percentage or formula at higher tiers would either be
# inexpressible in PDB syntax or exceed the §17.8.2 MinIO checkpoint
# fan-out budget. The rolling-update strategy bounds Deployment-initiated
# rollouts on an independent axis (see the Deployment.spec.strategy
# block above).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lenny-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: gateway
spec:
  maxUnavailable: {{ .Values.gateway.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      lenny.dev/component: gateway
{{- end }}
