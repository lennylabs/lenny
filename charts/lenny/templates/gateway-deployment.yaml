{{- /*
The lenny-gateway Deployment, its Services, and its RBAC (§4.1, §17.1).
The gateway is the §4.1 edge: it serves the §15.1 REST surface, the
§8.6 GatewayControl gRPC listener, and the §4.9 LLM reverse proxy. It
is stateless and horizontally scaled, so the Deployment carries a
replica count and the §13.1 Restricted-PSS posture (non-root, all
capabilities dropped, read-only root filesystem, RuntimeDefault
seccomp) shared with the controller.

The gateway claims §5 warm pods: it lists Sandbox and SandboxWarmPool
CRDs, creates the binding SandboxClaim CRD the §17.2
lenny-sandboxclaim-guard webhook checks, and writes Sandbox status. The
ClusterRole below grants exactly those verbs.

Two Services are rendered. lenny-gateway is the ClusterIP Service the
internal control plane reaches (the §17.2 lenny-drain-readiness webhook
and lenny-ops both resolve it by this name); its metrics port maps to
the gateway's HTTP listener because the binary serves /metrics on the
same mux as the REST API (§16.1), and the §13.2 ServiceMonitor scrapes
it. lenny-gateway-pods is the §17.1 headless Service that gives every
gateway replica per-replica DNS so lenny-ops can fan out §25.3 health
and event queries to each replica individually.

Postgres, Redis, and MinIO stay bring-your-own external services
(§17.9). The connection settings are wired from the corresponding
values via environment variables the binary reads (LENNY_POSTGRES_DSN,
LENNY_REDIS_URL, LENNY_MINIO_*); the chart leaves them unset by
default so a stock render produces the in-memory development backends.
When postgres.dsn, redis.url, or minio.endpoint is set, the env var
for that store is rendered: the credential-bearing values
(LENNY_POSTGRES_DSN, LENNY_MINIO_ACCESS_KEY, LENNY_MINIO_SECRET_KEY)
are read from the lenny-datastore-conn Secret with secretKeyRef, and
the non-secret values (endpoint, bucket, tls.enabled) are plain env. Each
env var is gated on its own value, so a partial configuration renders
only the env vars it can satisfy.
*/ -}}
{{- $pg := .Values.postgres -}}
{{- $redis := .Values.redis -}}
{{- $minio := .Values.minio -}}
{{- $hasPg := and $pg $pg.dsn (ne $pg.dsn "") -}}
{{- $hasRedis := and $redis $redis.url (ne $redis.url "") -}}
{{- $hasMinio := and $minio $minio.endpoint (ne $minio.endpoint "") -}}
{{- /* §12.5 line 279 — TLS-mandate posture. tls.enabled selects HTTPS
   to the MinIO endpoint. The spec requires `true` on every
   non-embedded deployment; the chart enforces the posture below.
   Default tls.enabled is true; an explicit `false` is honored. */ -}}
{{- $minioUseSSL := true -}}
{{- if and $minio (hasKey ($minio | default dict) "tls") -}}
{{- $minioTLS := $minio.tls -}}
{{- if hasKey ($minioTLS | default dict) "enabled" -}}
{{- $minioUseSSL = $minioTLS.enabled -}}
{{- end -}}
{{- end -}}
{{- $backends := .Values.backends | default "" -}}
{{- $complianceProfile := .Values.complianceProfile | default "" -}}
{{- /* Regulated profiles MUST run with TLS. Embedded mode is the only
   posture where TLS may be disabled (§12.5 line 279). */ -}}
{{- $regulated := or (eq $complianceProfile "soc2") (eq $complianceProfile "fedramp") (eq $complianceProfile "hipaa") -}}
{{- if and (not $minioUseSSL) $regulated -}}
{{- fail (printf "§12.5 line 279: minio.tls.enabled MUST be true when complianceProfile is %q (regulated)." $complianceProfile) -}}
{{- end -}}
{{- if and (not $minioUseSSL) (ne $backends "embedded") -}}
{{- fail "§12.5 line 279: minio.tls.enabled may default to false only when backends: embedded; set tls.enabled: true on any other backends value." -}}
{{- end -}}
{{- /* §12.5 line 307 — the continuous T4 KMS probe cadence is bounded
   below by 60s to prevent excessive KMS API spend. Enforce the floor at
   Helm-validate so a misconfigured value fails the install closed. */ -}}
{{- if and .Values.storage (hasKey .Values.storage "t4KmsProbeInterval") -}}
{{- if lt (int .Values.storage.t4KmsProbeInterval) 60 -}}
{{- fail (printf "§12.5 line 307: storage.t4KmsProbeInterval=%v is below the 60s minimum; raise it to at least 60." .Values.storage.t4KmsProbeInterval) -}}
{{- end -}}
{{- end -}}
{{- if and .Values.storage (hasKey .Values.storage "t4KmsProbeRateLimit") -}}
{{- if le (.Values.storage.t4KmsProbeRateLimit | float64) 0.0 -}}
{{- fail (printf "§12.5 line 307: storage.t4KmsProbeRateLimit=%v must be a positive probes/sec ceiling." .Values.storage.t4KmsProbeRateLimit) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lenny-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  {{- with .Values.gateway.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lenny-gateway
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
rules:
  # The gateway lists warm pools and Sandboxes to claim a §5 warm pod,
  # writes Sandbox status on a successful claim, and reads pods to
  # resolve the claimed pod's IP for the adapter dial.
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxwarmpools", "sandboxtemplates", "runtimes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxes"]
    # The §5.2 slot-claim path SSA-patches the Sandbox metadata to
    # stamp the tenant-pinning label (lenny.dev/tenant-id) on a
    # concurrent-mode Sandbox's first slot reservation. That patch
    # targets the main resource (not /status), so the gateway needs
    # the `patch` verb here in addition to the read verbs.
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxes/status"]
    verbs: ["get", "update", "patch"]
  # SandboxClaim: the gateway creates the binding claim CRD that the
  # §17.2 lenny-sandboxclaim-guard webhook validates on CREATE, and
  # deletes it on session terminate (session-mode Release path and
  # §5.2 concurrent-mode SlotClaimer.ReleaseSlot both do
  # Client.Delete on the SandboxClaim). Without `delete`, the
  # gateway returns terminate=200 but the claim deletion silently
  # 403s and Sandbox.status.activeSlots stays elevated indefinitely.
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Pods: read to resolve the claimed pod's IP for the adapter dial,
  # and patch for the §4.6.3 gateway-SA grant covering tenant-id and
  # state label mutations on agent pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lenny-gateway
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lenny-gateway
subjects:
  - kind: ServiceAccount
    name: lenny-gateway
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lenny-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: gateway
  # spec: §10.3 lines 316, 334 (NET-064). The lenny-preflight Job
  # enumerates these annotations across every lenny-gateway Deployment
  # in the cluster to enforce SPIFFE-trust-domain / SA-token-audience
  # uniqueness. Without them, the collision check sees existing
  # deployments as having empty annotations and never flags a clash.
  # F-10.3.6.
  annotations:
    # §10.3 line 316 (NET-064) — global.spiffeTrustDomain is a required
    # chart value with no default; `required` fails `helm install/upgrade`
    # templating with the spec-mandated error when it is unset so two
    # deployments cannot silently share a trust domain. This annotation is
    # always rendered, so it is the single enforcement point. F-10.3.4.
    lenny.dev/spiffe-trust-domain: {{ required "global.spiffeTrustDomain is required; set it to a deployment-specific value (e.g. 'lenny-<cluster-name>-<namespace>') — see Section 10.3 (NET-064). Two Lenny deployments that share a trust domain and CA have overlapping SPIFFE URIs and one deployment's pod certificate validates against the other's gateway, enabling cross-deployment pod impersonation and audit-log attribution forgery." .Values.global.spiffeTrustDomain | quote }}
    {{- with .Values.global.saTokenAudience }}
    lenny.dev/sa-token-audience: {{ . | quote }}
    {{- end }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  # §4.1 / §17.1 rolling-update strategy. maxUnavailable: 1 caps the
  # number of replicas Kubernetes drains concurrently during a
  # Deployment-initiated rollout (image bump, spec change) at one — at
  # Tier 3 (~20 replicas) the Kubernetes default of 25% would let up to
  # 5 replicas drain at once, exceeding the §10.1 per-replica 400-pod
  # CheckpointBarrier fan-out budget. maxSurge: 25% allows the
  # replacement set to scale ahead of the drained set so a rollout is
  # not bottlenecked behind the drain pace. This strategy is on an
  # independent disruption axis from the PodDisruptionBudget below; the
  # PDB bounds every other voluntary disruption (kubectl drain,
  # autoscaler node consolidation, HPA scale-down).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.gateway.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.gateway.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      lenny.dev/component: gateway
  template:
    metadata:
      labels:
        {{- include "lenny.labels" . | nindent 8 }}
        lenny.dev/component: gateway
    spec:
      serviceAccountName: lenny-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- /*
          §4.3 / §10.3 mTLS material. The lenny-gateway-tls Secret is
          rendered by mtls-pki.yaml (cert-manager-managed). cert-manager
          stores tls.crt / tls.key (the gateway client cert) and ca.crt
          (the issuing CA cert) inside the same Secret; mounting it at
          /etc/lenny/mtls/ gives the binary all three files it needs to
          present the gateway client cert to the Token Service and to
          verify the Token Service server cert against the shared
          cluster-internal CA. The mount is gated on mtls.enabled so a
          no-mesh / external-mTLS deployment can opt out, but the chart
          default is mtls.enabled=true.
      */ -}}
      {{- if .Values.mtls.enabled }}
      volumes:
        {{- if .Values.gateway.spiffe.enabled }}
        # §4.3 line 205 per-replica mTLS identity. The
        # cert-manager-csi-driver-spiffe (or equivalent SPIFFE CSI
        # driver) injects a per-pod certificate whose SAN carries a
        # distinct spiffe:// URI for each replica. The Token Service's
        # gRPC interceptor extracts the SPIFFE ID and threads it
        # through to audit so per-replica attribution is possible.
        # The shared lenny-gateway-tls Secret is not mounted on this
        # path — every replica gets its own CSR-driven identity.
        - name: lenny-gateway-tls
          csi:
            driver: {{ .Values.gateway.spiffe.csiDriverName | quote }}
            readOnly: true
            volumeAttributes:
              spiffe.csi.cert-manager.io/trust-domain: {{ default .Values.global.spiffeTrustDomain .Values.gateway.spiffe.trustDomain | quote }}
              spiffe.csi.cert-manager.io/identity-template: "spiffe://{{ default .Values.global.spiffeTrustDomain .Values.gateway.spiffe.trustDomain }}/gateway/{{`{{ .PodName }}`}}"
        {{- else }}
        - name: lenny-gateway-tls
          secret:
            secretName: lenny-gateway-tls
            defaultMode: 0400
        {{- end }}
      {{- end }}
      {{- /*
          §4.1 / §17.1 cross-zone topology spread. The §17.1 narrative
          calls for gateway replicas to spread via topology spread
          constraints so a zone failure does not collapse capacity onto
          a single replica set. The block is opt-in via
          gateway.topologySpread so a stock single-zone install renders
          without it; the tier-3 preset enables it.
      */ -}}
      {{- with .Values.gateway.topologySpread }}
      {{- if .enabled }}
      topologySpreadConstraints:
        {{- range .constraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $.Chart.Name }}
              lenny.dev/component: gateway
        {{- end }}
      {{- end }}
      {{- end }}
      {{- /*
          §17.8.2 Tier 3 node-drain expectation: a soft podAntiAffinity
          rule on topologyKey: kubernetes.io/hostname so the scheduler
          prefers spreading gateway pods across distinct nodes. The
          block is opt-in via gateway.podAntiAffinity so it lights up
          only when an operator (or the tier-3 preset) enables it; Tier
          1/2 deployments MAY omit it per §17.8.2.
      */ -}}
      {{- with .Values.gateway.podAntiAffinity }}
      {{- if .enabled }}
      affinity:
        podAntiAffinity:
          {{- if eq .schedulingRule "preferred" }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .weight | default 100 }}
              podAffinityTerm:
                topologyKey: {{ .topologyKey | default "kubernetes.io/hostname" }}
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ $.Chart.Name }}
                    lenny.dev/component: gateway
          {{- else if eq .schedulingRule "required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: {{ .topologyKey | default "kubernetes.io/hostname" }}
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ $.Chart.Name }}
                  lenny.dev/component: gateway
          {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          args:
            - --addr=:{{ .Values.gateway.internalPort }}
            - --grpc-addr=:{{ .Values.gateway.grpcPort }}
            # §8.6 line 712 — deployment-default auto-mode lease-extension
            # rate limit. Rendered only when set; 0/unset keeps the spec
            # default of no limit. F-8.6.7.
            {{- if gt (int .Values.gateway.leaseExtension.autoModeMaxPerMinute) 0 }}
            - --lease-extension-auto-max-per-min={{ .Values.gateway.leaseExtension.autoModeMaxPerMinute }}
            {{- end }}
            - --no-environment-policy={{ .Values.gateway.noEnvironmentPolicy }}
            # spec: §15.5 item 1; docs/api/index.md line 124 —
            # F-15.5.11. Empty omits the flag so the middleware stays
            # inert until the operator declares a sunset window.
            {{- with .Values.gateway.deprecatedAPIVersions }}
            - --deprecated-api-versions={{ join "," . }}
            {{- end }}
            # spec: §25.3 lines 596, 604, 625 — Capacity Recommendations
            # operator knobs. Rendered only when set so the gateway keeps
            # the spec defaults (all rules active, default windows, no
            # outage opt-out) when the operator leaves them empty.
            # F-25.3.12.
            {{- with .Values.gateway.recommendations.disabledRules }}
            - --recommendations-disabled-rules={{ join "," . }}
            {{- end }}
            {{- with .Values.gateway.recommendations.windowOverrides }}
            - --recommendations-window-overrides={{- $pairs := list }}{{- range $k, $v := . }}{{- $pairs = append $pairs (printf "%s=%s" $k $v) }}{{- end }}{{ join "," $pairs }}
            {{- end }}
            {{- if .Values.gateway.recommendations.disableOnPrometheusOutage }}
            - --recommendations-disable-on-prometheus-outage=true
            {{- end }}
            # §10.2 line 212 — OIDC claim the gateway extracts the
            # tenant identifier from. Operator-configurable so an
            # upstream IdP that stamps tenant identity under a non-
            # canonical claim name still works without a code change.
            # F-10.2.9.
            - --tenant-id-claim={{ .Values.auth.tenantIdClaim }}
            # §10.3 lines 365-366 — OIDC issuer + client registration the
            # gateway's token validation trusts. Required platform keys
            # outside global.devMode; the gateway fails closed at startup
            # (LENNY_CONFIG_MISSING) when unset on a non-dev install.
            # F-10.3.14.
            {{- with .Values.auth.oidc.issuerUrl }}
            - --oidc-issuer-url={{ . }}
            {{- end }}
            {{- with .Values.auth.oidc.clientId }}
            - --oidc-client-id={{ . }}
            {{- end }}
            # §4.3 trust boundary: the gateway materializes every §4.9
            # credential lease through lenny-token-service over mTLS;
            # the in-process MintLease path is reserved for dev mode.
            - --token-service-grpc-addr=lenny-token-service.{{ .Release.Namespace }}.svc:{{ .Values.tokenService.grpcPort }}
            # §4.3 canonical token endpoint (F-4.3.12). The gateway
            # reverse-proxies /v1/oauth/* to the Token Service's HTTP
            # listener so the Token Service is the sole minter.
            - --token-service-http-url=http://lenny-token-service.{{ .Release.Namespace }}.svc:{{ .Values.tokenService.httpPort }}
            # §4 KMS provider (F-4.3.11). The gateway wraps the §4.9
            # connector-credential DEKs through this provider.
            - --kms-provider={{ .Values.kms.provider }}
            - --environment={{ .Values.environment }}
            {{- with .Values.kms.aliases }}
            - --kms-alias={{ . }}
            {{- end }}
            {{- with .Values.kms.awsRegion }}
            - --kms-aws-region={{ . }}
            {{- end }}
            {{- with .Values.kms.azureVaultURL }}
            - --kms-azure-vault-url={{ . }}
            {{- end }}
            {{- if .Values.mtls.enabled }}
            # §4.3 line 195 / §10.3 mTLS client material. The gateway
            # presents the lenny-gateway-tls cert to the Token Service
            # gRPC listener and verifies the Token Service server cert
            # against the shared cluster-internal CA. cert-manager
            # stores tls.crt/tls.key/ca.crt under the same Secret.
            - --token-service-tls-cert=/etc/lenny/mtls/tls.crt
            - --token-service-tls-key=/etc/lenny/mtls/tls.key
            - --token-service-ca=/etc/lenny/mtls/ca.crt
            # §4.7 / §10.3 line 320 (NET-060) adapter mTLS client
            # material. The same lenny-gateway-tls Secret carries the
            # client cert the gateway presents to each pod adapter's
            # gRPC listener; ca.crt verifies the adapter's per-pod
            # serving cert. F-10.3.10.
            - --adapter-tls-cert=/etc/lenny/mtls/tls.crt
            - --adapter-tls-key=/etc/lenny/mtls/tls.key
            - --adapter-ca=/etc/lenny/mtls/ca.crt
            # §10.3 line 321 (NET-060): validate each inbound pod
            # certificate's spiffe://<trust-domain>/agent/{pool}/{pod}
            # URI SAN against this trust domain at the GatewayControl
            # handshake. Paired with --adapter-ca above so SPIFFE
            # validation layers on top of CA chain verification.
            # F-10.3.1.
            - --spiffe-trust-domain={{ .Values.global.spiffeTrustDomain }}
            {{- with .Values.global.saTokenAudience }}
            # §10.3 line 334: validate the projected SA token's
            # deployment-specific audience claim on every pod→gateway
            # GatewayControl request, the SA-token layer of the §10.3
            # defense-in-depth chain. F-10.3.20.
            - --sa-token-audience={{ . }}
            {{- end }}
            {{- end }}
            # §9.2 platform-wide elicitation content-integrity floor.
            # The admin API's GET endpoint reports the effective mode
            # as max(floor, tenantStored); a PUT below the floor is
            # rejected with ELICITATION_INTEGRITY_BELOW_PLATFORM_FLOOR.
            - --elicitation-content-integrity-floor={{ .Values.security.elicitationContentIntegrity.floor }}
            {{- /* §10.3 line 359 — gateway startup TLS probe. When
                  enabled the gateway verifies a TLS handshake to Redis
                  and PgBouncer succeeds and a plaintext connection is
                  refused before becoming ready. Off by default (dev /
                  in-memory installs). F-10.3.15. */ -}}
            {{- if .Values.gateway.startupTlsProbe.enabled }}
            {{- with .Values.gateway.startupTlsProbe.redisAddr }}
            - --startup-tls-probe-redis-addr={{ . }}
            {{- end }}
            {{- with .Values.gateway.startupTlsProbe.pgbouncerAddr }}
            - --startup-tls-probe-pgbouncer-addr={{ . }}
            {{- end }}
            {{- with .Values.gateway.startupTlsProbe.ca }}
            - --startup-tls-probe-ca={{ . }}
            {{- end }}
            {{- with .Values.gateway.startupTlsProbe.cert }}
            - --startup-tls-probe-cert={{ . }}
            {{- end }}
            {{- with .Values.gateway.startupTlsProbe.key }}
            - --startup-tls-probe-key={{ . }}
            {{- end }}
            {{- end }}
            {{- /* §4.6 pod placement: pin the gateway at the first
                  agent namespace so SandboxClaims land against live
                  warm pods. Without --agent-namespace the gateway
                  runs in-memory and no Sandbox is claimed. */ -}}
            {{- with (first .Values.agentNamespaces) }}
            - --agent-namespace={{ .name }}
            {{- end }}
            {{/* §4.4 line 256 / line 258 — periodic-checkpoint
                  cadence and per-session first-checkpoint jitter
                  fraction. The gateway honors these flags only when
                  --agent-namespace is set. */}}
            - --checkpoint-interval={{ .Values.gateway.periodicCheckpointIntervalSeconds }}s
            - --checkpoint-jitter-fraction={{ .Values.gateway.periodicCheckpointJitterFraction }}
            # §10.4 line 389 — per-session SSE replay buffer depth.
            # F-10.4.5.
            - --session-event-replay-buffer-depth={{ .Values.gateway.sessionEventReplayBufferDepth }}
            # §10.4 line 385 / §16.5 PDBBlockedEvictions — name the
            # gateway PDB so the in-process poller can address it. The
            # namespace defaults to the gateway pod's own namespace via
            # POD_NAMESPACE (env var below). F-10.4.4.
            - --gateway-pdb-name=lenny-gateway
            {{- with .Values.sandbox.defaultIsolationProfile }}
            - --default-isolation-profile={{ . }}
            {{- end }}
            {{- if .Values.global.devMode }}
            - --dev-mode
            {{- end }}
            {{- if .Values.features.llmProxy }}
            - --llm-proxy-addr=:{{ .Values.gateway.llmProxyPort }}
            {{- end }}
            {{- if .Values.playground.enabled }}
            - --playground-enabled
            - --playground-auth-mode={{ .Values.playground.authMode }}
            - --playground-dev-tenant-id={{ .Values.playground.devTenantId }}
            - --playground-allowed-runtimes={{ .Values.playground.allowedRuntimes }}
            - --playground-max-session-minutes={{ .Values.playground.maxSessionMinutes }}
            - --playground-max-idle-time-seconds={{ .Values.playground.maxIdleTimeSeconds }}
            - --playground-oidc-session-ttl-seconds={{ .Values.playground.oidcSessionTtlSeconds }}
            - --playground-bearer-ttl-seconds={{ .Values.playground.bearerTtlSeconds }}
            {{- with .Values.playground.gatewayHost }}
            - --playground-gateway-host={{ . }}
            {{- end }}
            {{/* §27.2 line 41 — sessionLabels is rendered as a
                  comma-separated key=value list so the gateway flag
                  reader can split it without a sub-language. The
                  load-bearing origin entry is re-stamped at startup
                  regardless of the chart-rendered value. */}}
            {{- with .Values.playground.sessionLabels }}
            - --playground-session-labels={{ range $k, $v := . }}{{ $k }}={{ $v }},{{ end }}
            {{- end }}
            {{- end }}
            {{- if hasKey .Values "memory" }}
            {{- if not .Values.memory.enabled }}
            - --memory-enabled=false
            {{- end }}
            {{- with .Values.memory.maxMemoriesPerUser }}
            - --memory-max-per-user={{ . }}
            {{- end }}
            {{- if hasKey .Values.memory "recordCountIntervalSeconds" }}
            - --memory-record-count-interval={{ .Values.memory.recordCountIntervalSeconds }}s
            {{- end }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # §10.4 line 385 — the §10.4 PDB poller reads POD_NAMESPACE
            # as the default gateway-namespace so the chart does not
            # need to repeat the release namespace in the args list.
            # F-10.4.4.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # §4.1 gateway.maxSessionsPerReplica — per-replica capacity
            # ceiling used as the denominator of the §16.5
            # GatewaySessionBudgetNearExhaustion alert and the §17.8.2
            # SCL-036 burst-absorption minReplicas formula. Rendered
            # from the Helm value so a tier-preset override flows into
            # the gateway binary without a code change. The gateway
            # emits the configured value on the
            # lenny_gateway_max_sessions_per_replica gauge at startup.
            - name: LENNY_MAX_SESSIONS_PER_REPLICA
              value: {{ .Values.gateway.maxSessionsPerReplica | quote }}
            # §16.5 line 623 — slo.validated gates the gateway's
            # provisional-SLO startup warning. False (the default) emits
            # the §16.5 warning at startup so an operator running
            # unvalidated SLO defaults is informed before relying on them
            # for customer SLA commitments. The Phase 14.5 benchmark
            # automation sets it true on the validated release. F-16.5.5.
            - name: LENNY_SLO_VALIDATED
              value: {{ .Values.slo.validated | default false | quote }}
            # §4.1 / §16.5 GatewayNoHealthyReplicas alert denominator.
            # Rendered from autoscaling.minReplicas so a tier-preset
            # override flows into the lenny_gateway_min_replicas gauge.
            - name: LENNY_MIN_REPLICAS
              value: {{ .Values.autoscaling.minReplicas | quote }}
            # §4.1 / §16.5 GatewayActiveStreamsHigh alert denominator.
            # Defaults to gateway.streamCeiling when set; otherwise uses
            # gateway.maxSessionsPerReplica so a stock render emits a
            # non-zero ceiling consistent with the per-replica session
            # capacity (each session may hold at most one active stream).
            - name: LENNY_STREAM_CEILING
              value: {{ .Values.gateway.streamCeiling | default .Values.gateway.maxSessionsPerReplica | quote }}
            # §4.4 line 263 / §10.1 — preStop hook reads this to bound
            # the staged drain budget. The chart-default 240s matches
            # the terminationGracePeriodSeconds set below so the
            # gateway honors the same deadline Kubernetes enforces.
            - name: LENNY_TERMINATION_GRACE_SECONDS
              value: {{ .Values.gateway.terminationGracePeriodSeconds | default 240 | quote }}
            # §11.3 line 215 — credentials.expiryWarningLeadSeconds. The
            # renewal worker emits a structured warning log when a tracked
            # lease enters this window of its ExpiresAt. 0 disables.
            # F-11.3.20.
            {{- with .Values.credentials }}
            {{- if hasKey . "expiryWarningLeadSeconds" }}
            - name: LENNY_CREDENTIALS_EXPIRY_WARNING_LEAD_SECONDS
              value: {{ .expiryWarningLeadSeconds | quote }}
            {{- end }}
            {{- end }}
            # §11.3 line 222 — rateLimitFailOpenMaxSeconds. The §11.1
            # admission middleware fails closed once a single fail-open
            # episode has run past this cap. Negative disables the cap.
            # F-11.3.22.
            {{- if hasKey .Values.gateway "rateLimitFailOpenMaxSeconds" }}
            - name: LENNY_RATE_LIMIT_FAILOPEN_MAX_SECONDS
              value: {{ .Values.gateway.rateLimitFailOpenMaxSeconds | quote }}
            {{- end }}
            # §11.2 line 44 — quotaSyncIntervalSeconds: cadence at which
            # Redis quota and delegation-budget counters checkpoint to
            # Postgres (default 30, minimum 10). Lower it for high-throughput
            # tenants to bound crash-recovery overshoot. F-11.2.16.
            {{- if hasKey .Values.gateway "quotaSyncIntervalSeconds" }}
            - name: LENNY_QUOTA_SYNC_INTERVAL_SECONDS
              value: {{ .Values.gateway.quotaSyncIntervalSeconds | quote }}
            {{- end }}
            # §10.7 line 938 — per-session and per-tenant eval-submission
            # rate limits on POST /v1/sessions/{id}/eval. Default 100 /
            # 10000 per minute; a negative value disables the scope.
            # F-10.7.4 / F-11.2.19.
            {{- with .Values.gateway.evalRateLimit }}
            {{- if hasKey . "perSessionPerMinute" }}
            - name: LENNY_EVAL_RATE_LIMIT_PER_SESSION_PER_MIN
              value: {{ .perSessionPerMinute | quote }}
            {{- end }}
            {{- if hasKey . "perTenantPerMinute" }}
            - name: LENNY_EVAL_RATE_LIMIT_PER_TENANT_PER_MIN
              value: {{ .perTenantPerMinute | quote }}
            {{- end }}
            {{- end }}
            # §11.1 lines 10-11 — concurrent-upload and per-session
            # upload-size admission caps, distinct from the §4.1 upload
            # handler back-pressure semaphore. Zero leaves each scope
            # unlimited. F-11.1.5, F-11.1.6.
            {{- with .Values.gateway.uploadLimits }}
            {{- if gt (int .maxConcurrentPerSession) 0 }}
            - name: LENNY_UPLOAD_MAX_CONCURRENT_PER_SESSION
              value: {{ .maxConcurrentPerSession | quote }}
            {{- end }}
            {{- if gt (int .maxConcurrentGlobal) 0 }}
            - name: LENNY_UPLOAD_MAX_CONCURRENT_GLOBAL
              value: {{ .maxConcurrentGlobal | quote }}
            {{- end }}
            {{- if gt (int .maxBytesPerSession) 0 }}
            - name: LENNY_UPLOAD_MAX_BYTES_PER_SESSION
              value: {{ .maxBytesPerSession | quote }}
            {{- end }}
            {{- end }}
            # §11.1 line 8 — global, per-user, and per-runtime
            # concurrent-session admission caps (live non-terminal session
            # counts). The per-tenant scope is enforced separately against
            # the tenant record. Zero leaves a scope unlimited. F-11.1.3.
            {{- with .Values.gateway.concurrentSessions }}
            {{- if gt (int .global) 0 }}
            - name: LENNY_MAX_CONCURRENT_SESSIONS_GLOBAL
              value: {{ .global | quote }}
            {{- end }}
            {{- if gt (int .perUser) 0 }}
            - name: LENNY_MAX_CONCURRENT_SESSIONS_PER_USER
              value: {{ .perUser | quote }}
            {{- end }}
            {{- if gt (int .perRuntime) 0 }}
            - name: LENNY_MAX_CONCURRENT_SESSIONS_PER_RUNTIME
              value: {{ .perRuntime | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.delegation }}
            # §8.10 lines 1022-1023 / 1042 — operator-tunable per-level and
            # whole-tree recovery deadlines feed recovery.Config. F-8.10.6.
            {{- if hasKey . "maxLevelRecoverySeconds" }}
            - name: LENNY_DELEGATION_MAX_LEVEL_RECOVERY_SECONDS
              value: {{ .maxLevelRecoverySeconds | quote }}
            {{- end }}
            {{- if hasKey . "maxTreeRecoverySeconds" }}
            - name: LENNY_DELEGATION_MAX_TREE_RECOVERY_SECONDS
              value: {{ .maxTreeRecoverySeconds | quote }}
            {{- end }}
            # §8.10 line 1078 — cascadeTimeoutSeconds. F-8.10.9.
            {{- if hasKey . "cascadeTimeoutSeconds" }}
            - name: LENNY_DELEGATION_CASCADE_TIMEOUT_SECONDS
              value: {{ .cascadeTimeoutSeconds | quote }}
            {{- end }}
            # §8.10 line 1103 — maxOrphanTasksPerTenant. Feeds both the
            # sessionserver detach-cascade fallback and the §16.5
            # OrphanTasksPerTenantHigh alert denominator. F-8.10.10.
            {{- if hasKey . "maxOrphanTasksPerTenant" }}
            - name: LENNY_DELEGATION_MAX_ORPHAN_TASKS_PER_TENANT
              value: {{ .maxOrphanTasksPerTenant | quote }}
            {{- end }}
            # §11.1 line 9 — per-user active-delegated-children admission
            # cap (live children across all of a user's sessions/trees).
            # Zero (or omitted) leaves the scope unlimited and renders no
            # env var. F-11.1.4.
            {{- if gt (int (dig "maxActiveChildrenPerUser" 0 .)) 0 }}
            - name: LENNY_DELEGATION_MAX_ACTIVE_CHILDREN_PER_USER
              value: {{ .maxActiveChildrenPerUser | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.gc }}
            # §12.5 line 317 — gc.cycleIntervalSeconds: the leader-elected
            # GC sweep cadence (default 900, minimum 60). Drives both the
            # §7.1 retention soft-delete sweep and the §12.5 line 341
            # tombstone hard-prune sweep. F-12.5.19.
            {{- if hasKey . "cycleIntervalSeconds" }}
            - name: LENNY_GC_CYCLE_INTERVAL_SECONDS
              value: {{ .cycleIntervalSeconds | quote }}
            {{- end }}
            # §12.5 line 341 — gc.tombstoneRetentionSeconds: how long a
            # soft-deleted artifact_store row is retained before the
            # hard-prune sweep removes it (default 86400 / 24h). F-12.5.19.
            {{- if hasKey . "tombstoneRetentionSeconds" }}
            - name: LENNY_GC_TOMBSTONE_RETENTION_SECONDS
              value: {{ .tombstoneRetentionSeconds | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.storage }}
            # §12.5 line 307 (STO-021) — the leader-elected continuous T4
            # KMS availability probe cadence (default 300, minimum 60) and
            # the token-bucket rate ceiling (default 10 probes/sec).
            # F-12.5.4.
            {{- if hasKey . "t4KmsProbeInterval" }}
            - name: LENNY_T4_KMS_PROBE_INTERVAL_SECONDS
              value: {{ .t4KmsProbeInterval | quote }}
            {{- end }}
            {{- if hasKey . "t4KmsProbeRateLimit" }}
            - name: LENNY_T4_KMS_PROBE_RATE_LIMIT
              value: {{ .t4KmsProbeRateLimit | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.gateway.extractionThresholds }}
            # §4.1 extractionThresholds — per-subsystem extraction
            # thresholds surfaced from Helm so operators can calibrate
            # them at deploy time. Each value is also emitted at startup
            # on the lenny_gateway_extraction_threshold{subsystem,metric}
            # gauge for auditability against /metrics.
            {{- with .streamProxy }}
            - name: LENNY_EXTRACTION_THRESHOLD_STREAM_PROXY_QUEUE_DEPTH
              value: {{ .queueDepth | quote }}
            - name: LENNY_EXTRACTION_THRESHOLD_STREAM_PROXY_P99_ATTACH_LATENCY_SECONDS
              value: {{ .p99AttachLatencySeconds | quote }}
            {{- end }}
            {{- with .uploadHandler }}
            - name: LENNY_EXTRACTION_THRESHOLD_UPLOAD_HANDLER_ACTIVE_CONCURRENT
              value: {{ .activeConcurrent | quote }}
            - name: LENNY_EXTRACTION_THRESHOLD_UPLOAD_HANDLER_P99_LATENCY_SECONDS
              value: {{ .p99LatencySeconds | quote }}
            {{- end }}
            {{- with .mcpFabric }}
            - name: LENNY_EXTRACTION_THRESHOLD_MCP_FABRIC_ACTIVE_DELEGATIONS
              value: {{ .activeDelegations | quote }}
            - name: LENNY_EXTRACTION_THRESHOLD_MCP_FABRIC_P99_ORCHESTRATION_LATENCY_SECONDS
              value: {{ .p99OrchestrationLatencySeconds | quote }}
            {{- end }}
            {{- with .llmProxy }}
            - name: LENNY_EXTRACTION_THRESHOLD_LLM_PROXY_ACTIVE_CONNECTIONS
              value: {{ .activeConnections | quote }}
            - name: LENNY_EXTRACTION_THRESHOLD_LLM_PROXY_P99_TTFB_SECONDS
              value: {{ .p99TTFBSeconds | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.observability.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
            {{- else if .Values.tracing.collector.enabled }}
            # §16.3 line 359 — with no explicit OTLP endpoint and the
            # bundled collector enabled, the gateway exports spans to the
            # in-cluster collector's OTLP/HTTP port. F-16.3.4.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ printf "http://lenny-otel-collector.%s.svc:4318" (.Values.observability.otlpNamespace | default "lenny-system") | quote }}
            {{- end }}
            {{- with .Values.billing.sink }}
            - name: LENNY_BILLING_SINK
              value: {{ . | quote }}
            {{- end }}
            # §11.2.1 line 187 / §16.5: BillingCorrectionRateHigh
            # alert threshold as a fraction. Gateway emits it on
            # lenny_billing_correction_rate_threshold at startup.
            - name: LENNY_BILLING_CORRECTION_RATE_THRESHOLD
              value: {{ .Values.billing.correctionRateThreshold | default 0.05 | quote }}
            # §11.2.1 line 151 billing.retentionDays: how long billing
            # events are retained before the retention pruner deletes
            # them (default 395). The gateway rejects a value below a
            # tenant's regulated complianceProfile floor at startup.
            # F-11.2.15.
            - name: LENNY_BILLING_RETENTION_DAYS
              value: {{ .Values.billing.retentionDays | default 395 | quote }}
            # §12.3 line 76 billing-event buffering tunables. The gateway
            # flushes the Tier 2 write-ahead buffer in flushBatchSize
            # batches every flushIntervalMs, and emits
            # billing_flush_pressure once the buffer exceeds
            # flushMaxPending. F-12.3.13.
            {{- if hasKey .Values.billing "flushIntervalMs" }}
            - name: LENNY_BILLING_FLUSH_INTERVAL_MS
              value: {{ .Values.billing.flushIntervalMs | quote }}
            {{- end }}
            {{- if hasKey .Values.billing "flushBatchSize" }}
            - name: LENNY_BILLING_FLUSH_BATCH_SIZE
              value: {{ .Values.billing.flushBatchSize | quote }}
            {{- end }}
            {{- if hasKey .Values.billing "flushMaxPending" }}
            - name: LENNY_BILLING_FLUSH_MAX_PENDING
              value: {{ .Values.billing.flushMaxPending | quote }}
            {{- end }}
            # §12.3 line 123 postgres.writeCeilingIops — emitted on
            # lenny_postgres_write_ceiling_iops for the §16.5
            # PostgresWriteSaturation alert. F-12.3.8.
            {{- if hasKey .Values.postgres "writeCeilingIops" }}
            - name: LENNY_POSTGRES_WRITE_CEILING_IOPS
              value: {{ .Values.postgres.writeCeilingIops | quote }}
            {{- end }}
            # §12.3 line 101 audit.startupChainCheckEntries — the
            # most-recent N audit rows per tenant re-verified by the
            # startup chain-continuity check. F-12.3.9.
            {{- if and .Values.audit (hasKey .Values.audit "startupChainCheckEntries") }}
            - name: LENNY_AUDIT_STARTUP_CHAIN_CHECK_ENTRIES
              value: {{ .Values.audit.startupChainCheckEntries | quote }}
            {{- end }}
            # §11.7 item 2 audit.grantCheckInterval / audit.hardFailOnDrift —
            # cadence and drift policy of the periodic background integrity
            # check. 0 selects the profile default (regulated 60s,
            # unregulated 300s); a value above the profile maximum is a
            # fatal startup error. F-11.7.3.
            {{- if and .Values.audit (hasKey .Values.audit "grantCheckIntervalSeconds") }}
            - name: LENNY_AUDIT_GRANT_CHECK_INTERVAL_SECONDS
              value: {{ .Values.audit.grantCheckIntervalSeconds | quote }}
            {{- end }}
            {{- if and .Values.audit (hasKey .Values.audit "hardFailOnDrift") }}
            - name: LENNY_AUDIT_HARD_FAIL_ON_DRIFT
              value: {{ .Values.audit.hardFailOnDrift | quote }}
            {{- end }}
            # §11.7 audit.siem.endpoint — when set, satisfies the
            # COMPLIANCE_SIEM_REQUIRED gate for regulated-profile tenants.
            # Rendered only when non-empty so an unconfigured platform
            # leaves siemConfigured=false. F-11.7.2.
            {{- if and .Values.audit .Values.audit.siem .Values.audit.siem.endpoint }}
            - name: LENNY_AUDIT_SIEM_ENDPOINT
              value: {{ .Values.audit.siem.endpoint | quote }}
            {{- end }}
            # §12.8 line 839 audit.gdprRetentionDays: retention window for
            # gdpr.* audit rows. The gateway rejects a value below 2190
            # under a regulated complianceProfile at startup. F-12.8.16.
            {{- if and .Values.audit (hasKey .Values.audit "gdprRetentionDays") }}
            - name: LENNY_AUDIT_GDPR_RETENTION_DAYS
              value: {{ .Values.audit.gdprRetentionDays | quote }}
            {{- end }}
            # §25.13 line 4798 healthTracker.useCompiledRules: gates the
            # gateway's in-process §16.5 alert evaluator. Set false to
            # suppress the per-replica tracker and let /v1/admin/health
            # report only dependency probes and circuit breaker state —
            # the escape valve for operators whose Prometheus rule
            # customisations diverge from the compiled-in defaults.
            - name: LENNY_HEALTH_TRACKER_USE_COMPILED_RULES
              value: {{ dig "healthTracker" "useCompiledRules" true .Values.gateway | quote }}
            # §25.13 line 4833 / F-25.13.3 — the gateway stamps
            # lenny_alerting_rules_bundled{format} so an operator can
            # verify the bundling configuration from /metrics. The
            # value mirrors monitoring.format (closed enum
            # "prometheusrule" | "configmap" | "both"; "both" expands
            # into both labels). LENNY_ALERTING_OVERRIDE_COUNT mirrors
            # len(monitoring.alertOverrides) so
            # lenny_alerting_rule_overrides reflects the rendered
            # override map.
            - name: LENNY_ALERTING_BUNDLE_FORMATS
              value: {{ if .Values.monitoring.bundleRules -}}
                {{- if eq .Values.monitoring.format "both" -}}
                "prometheusrule,configmap"
                {{- else -}}
                {{ .Values.monitoring.format | quote }}
                {{- end -}}
              {{- else -}}
                ""
              {{- end }}
            - name: LENNY_ALERTING_OVERRIDE_COUNT
              value: {{ len (.Values.monitoring.alertOverrides | default dict) | quote }}
            # §25.13 line 4737 / F-25.13.2 — tier-dependent §16.5
            # thresholds. The gateway emits each value on a startup-set
            # Prometheus gauge so the bundled alert expressions read
            # the configured number via scalar(...). Tier presets
            # override these to tighten the thresholds at higher tiers
            # (see presets/values-tier{2,3}.yaml).
            - name: LENNY_GATEWAY_QUEUE_DEPTH_THRESHOLD
              value: {{ dig "alertThresholds" "gatewayQueueDepthHigh" "value" 20 .Values.monitoring | quote }}
            - name: LENNY_GATEWAY_LATENCY_THRESHOLD_SECONDS
              value: {{ dig "alertThresholds" "gatewayLatencyHigh" "p99Seconds" 3.0 .Values.monitoring | quote }}
            - name: LENNY_CREDENTIAL_POOL_LOW_THRESHOLD
              value: {{ dig "alertThresholds" "credentialPoolLow" "utilizationThreshold" 0.80 .Values.monitoring | quote }}
            # §4.2 line 165 / §12.3 line 56 LENNY_POOLER_MODE: the
            # Postgres pooler posture, derived from
            # postgres.connectionPooler so the install-time preflight
            # check and the gateway startup refusal share one source of
            # truth. Under "external" the gateway refuses to start when
            # the lenny_tenant_guard trigger is absent from tenant-scoped
            # tables; under "transactional" the in-cluster pooler
            # enforces the connect_query __unset__ sentinel.
            - name: LENNY_POOLER_MODE
              value: {{ include "lenny.poolerMode" . | quote }}
            {{- if $hasPg }}
            - name: LENNY_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: postgres-dsn
            {{- end }}
            {{- if $hasRedis }}
            - name: LENNY_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: redis-url
            {{- end }}
            {{- if $hasMinio }}
            - name: LENNY_MINIO_ENDPOINT
              value: {{ $minio.endpoint | quote }}
            - name: LENNY_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: minio-access-key
            - name: LENNY_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: minio-secret-key
            - name: LENNY_MINIO_BUCKET
              value: {{ $minio.bucket | quote }}
            - name: LENNY_MINIO_USE_SSL
              value: {{ $minioUseSSL | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.internalPort }}
            # spec: §16.9 line 723 — named metrics containerPort so a
            # PodMonitor `port: metrics` discovery works uniformly across
            # control-plane components. /metrics is served on the same
            # HTTP listener as the REST API (internalPort); the named
            # entry is a labelling concern that surfaces the metrics
            # endpoint in the rendered pod spec. F-16.9.10.
            - name: metrics
              containerPort: {{ .Values.gateway.internalPort }}
            - name: grpc
              containerPort: {{ .Values.gateway.grpcPort }}
            {{- if .Values.features.llmProxy }}
            - name: llm-proxy
              containerPort: {{ .Values.gateway.llmProxyPort }}
            {{- end }}
          {{- if .Values.mtls.enabled }}
          volumeMounts:
            - name: lenny-gateway-tls
              mountPath: /etc/lenny/mtls
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # §4.4 line 234, 263 / §10.1 preStop staged drain. Kubernetes
          # invokes the hook before SIGTERM; the gateway selects the
          # tiered checkpoint cap per session, triggers a synchronous
          # eviction checkpoint per session, and emits the
          # lenny_prestop_cap_selection_total counter for the §16.5
          # PreStopCapFallbackRateHigh alert.
          lifecycle:
            preStop:
              httpGet:
                path: /internal/prestop
                port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      # spec: §17.8.2 — Tier 1/2 terminationGracePeriodSeconds defaults
      # to 240s, which leaves a 30s safety margin above the 210s preStop
      # budget (90s tier cap + 90s BarrierAck + 30s stream drain). The
      # gateway binary reads the same value from
      # LENNY_TERMINATION_GRACE_SECONDS so the preStop hook honors the
      # chart-set deadline.
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds | default 240 }}
---
apiVersion: v1
kind: Service
metadata:
  name: lenny-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: gateway
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    lenny.dev/component: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.internalPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.gateway.grpcPort }}
      targetPort: grpc
    - name: metrics
      port: {{ .Values.gateway.metricsPort }}
      targetPort: http
    {{- if .Values.features.llmProxy }}
    - name: llm-proxy
      port: {{ .Values.gateway.llmProxyPort }}
      targetPort: llm-proxy
    {{- end }}
---
# lenny-gateway-pods headless Service (§17.1). clusterIP: None gives
# each gateway replica a per-replica DNS A record so lenny-ops can fan
# out §25.3 health, recommendation, and event queries to every replica.
apiVersion: v1
kind: Service
metadata:
  name: lenny-gateway-pods
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: gateway
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    lenny.dev/component: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.internalPort }}
      targetPort: http
{{- if .Values.gateway.podDisruptionBudget.enabled }}
---
# PodDisruptionBudget for the lenny-gateway Deployment (§4.1 line 61,
# §17.1). The gateway's §10.1 preStop hook fans out CheckpointBarrier to
# up to 400 pods per replica; a flat maxUnavailable: 1 caps voluntary
# disruptions (kubectl drain, cluster-autoscaler node consolidation,
# HPA scale-down) at one replica's quota across all tiers. The same
# integer at Tier 1 (minReplicas: 2) leaves one replica of disruption
# budget, while a percentage or formula at higher tiers would either be
# inexpressible in PDB syntax or exceed the §17.8.2 MinIO checkpoint
# fan-out budget. The rolling-update strategy bounds Deployment-initiated
# rollouts on an independent axis (see the Deployment.spec.strategy
# block above).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lenny-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: gateway
spec:
  maxUnavailable: {{ .Values.gateway.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      lenny.dev/component: gateway
{{- end }}
