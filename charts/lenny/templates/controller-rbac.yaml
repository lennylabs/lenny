{{- /*
RBAC for the lenny-controller ServiceAccount (§4.6, §5.2). The
WarmPoolController watches SandboxWarmPool and SandboxTemplate
resources across agent namespaces and creates Sandbox pods, so the
cluster role grants cross-namespace read plus Sandbox create and the
status-subresource writes the §4.6.3 ownership table assigns to the
controller. The §13.2 NET-022 cluster-CIDR drift detector additionally
reads Nodes (for spec.podCIDR aggregation) and NetworkPolicies (for the
installed except blocks); both are read-only — §13.2 deliberately keeps
NetworkPolicy write RBAC off the controller. Leader election uses a
Lease in the release namespace, covered by the namespaced role. The
ServiceAccount name is fixed: §5.2 authorizes it by the literal
identity system:serviceaccount:lenny-system:lenny-controller.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lenny-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lenny-controller
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
rules:
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxtemplates", "sandboxwarmpools", "runtimes"]
    verbs: ["get", "list", "watch"]
  # Sandboxes: the WarmPoolController creates idle pods, drains and
  # recreates pods near cert expiry, and retires pod-failed Sandboxes;
  # the §4.6.1 cert-expiry replacement and pod-failed retire paths
  # require delete (§4.6.3 RBAC backstop grants create/update/delete).
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # SandboxClaims: the §4.6.1 orphaned-claim garbage-collection loop
  # lists all claims and deletes those that no live session references
  # (§4.6.3 RBAC backstop grants list/delete).
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxtemplates/status", "sandboxwarmpools/status", "sandboxes/status"]
    verbs: ["get", "update", "patch"]
  # PodDisruptionBudgets: the §4.6.1 per-SandboxTemplate warm-pod PDB
  # management owns one PDB per pool (maxUnavailable: 1) and tears it
  # down when the pool is deleted or scaled to zero.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Nodes: read-only, for the §13.2 NET-022 cluster-CIDR drift detector
  # aggregating spec.podCIDR, and for the §4.6.1 host-node
  # schedulability Node informer.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # NetworkPolicies: read-only, for the §13.2 NET-022 drift detector
  # reading installed except blocks. The controller never writes
  # NetworkPolicies — remediation is an operator-run helm upgrade.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lenny-controller
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lenny-controller
subjects:
  - kind: ServiceAccount
    name: lenny-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lenny-controller-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lenny-controller-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lenny-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: lenny-controller
    namespace: {{ .Release.Namespace }}
