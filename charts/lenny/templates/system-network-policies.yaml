{{- /*
lenny-system control-plane NetworkPolicy (§13.2). default-deny-all is
rendered into the release namespace, which houses the gateway, Token
Service, controllers, and dedicated CoreDNS, and denies all ingress
and egress for every pod. The §13.2 component-specific allow-lists are
rendered alongside it as the control-plane network surface is
completed; until then the namespace is network-isolated by default,
the fail-closed posture §13.2 requires, mirroring the agent-namespace
policy set.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
{{- /*
allow-admission-webhooks re-admits, for the admission webhook pods, the
two flows the §13.2 default-deny otherwise blocks: kube-apiserver
ingress so the API server can invoke the webhook callbacks, and
kube-system CoreDNS egress for name resolution. Without the ingress
rule every fail-closed webhook silently rejects all admissions. The
drain-readiness-only gateway-egress sub-rule is rendered with that
feature-gated webhook.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admission-webhooks
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      lenny.dev/component: admission-webhook
  ingress:
    # The kube-apiserver connects from a node or control-plane IP, so
    # the source CIDR is operator-tunable; the webhook pods listen on
    # 8443 (the Service maps :443 to this container port).
    - from:
        - ipBlock:
            cidr: {{ .Values.webhookIngressCIDR | quote }}
      ports:
        - port: 8443
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
  policyTypes: [Ingress, Egress]
