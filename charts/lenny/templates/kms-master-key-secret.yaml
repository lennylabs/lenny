{{- /*
lenny-kms-master-key Secret (§17.4, §10.2 "Signing key and algorithm").

Under kms.provider=local, lenny-gateway, lenny-token-service, and lenny-ops
each mount one master key Secret and pass --kms-master-key-file, so every
process derives the same KEKs and the same ES256 JWT signing key from it. A
token one process signs therefore verifies on every other process and
survives a restart of its signer.

kms.masterKeySecret names an operator-managed Secret (data key master-key,
at least 32 bytes). When it is empty, this template renders one Secret
holding a random master key. The chart is the sole writer: the key is
generated on first render and preserved verbatim across re-renders by
reading the live Secret through lookup, following etcd-encryption.yaml, so
`helm upgrade` does not rotate the key and orphan every ciphertext and token
written under the old one. `helm template` has no cluster to look up, so each
offline render draws a fresh key; the development profile therefore names a
fixed Secret that the embedded bring-up creates, and the pre-rendered
embedded manifests carry no key material.

Under a cloud provider the provider holds the keys, and neither this Secret
nor the --kms-master-key-file flag renders.
*/ -}}
{{- if and (include "lenny.kmsLocal" .) (not .Values.kms.masterKeySecret) }}
{{- $name := include "lenny.kmsMasterKeySecretName" . }}
{{- $key := "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data }}
{{-   $key = index $existing.data "master-key" | default "" }}
{{- end }}
{{- if eq $key "" }}
{{-   $key = randAlphaNum 64 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
type: Opaque
data:
  master-key: {{ $key }}
{{- end }}
