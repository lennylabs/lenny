{{/*
The §4.2 / §12.3 PgBouncer connect_query sentinel ConfigMap.

The chart does not deploy a PgBouncer Deployment or Service. Production
deployments either run PgBouncer as a sidecar of an operator-managed
workload outside this chart or rely on a managed pooler (AWS RDS Proxy,
Cloud SQL Auth Proxy with PgBouncer profile, Crunchy Postgres for
Kubernetes pgBouncer, etc.). What the chart owns is the connect_query
sentinel string the §4.2 line 163 spec requires on every fresh server
connection — operators mount the ConfigMap below on whatever PgBouncer
workload they run.

Rendering is gated on `pgbouncer.enabled` (default true). Operators who
manage their pooler's configuration entirely out-of-band can set
`pgbouncer.enabled: false` to suppress the ConfigMap; the SQL string
remains in values.yaml as the authoritative reference.

spec: §4.2 line 163 (PgBouncer connect_query sentinel)
spec: §12.3 (transaction-mode pooler leak prevention)
*/}}
{{- if .Values.pgbouncer.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.pgbouncer.configMapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: lenny
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: pgbouncer
    lenny.dev/component: pgbouncer
data:
  # pgbouncer.ini fragment carrying the §4.2 connect_query sentinel
  # and the §12.3 transaction-mode setting. Operators mount this at
  # the PgBouncer pod's /etc/pgbouncer/pgbouncer.ini path (or
  # equivalent) so every fresh server connection runs the
  # connect_query before being handed to a client transaction.
  pgbouncer.ini: |
    [pgbouncer]
    pool_mode = {{ .Values.pgbouncer.poolMode }}
    # spec: §4.2 line 163 — fresh server connections begin with the
    # SET sentinel so an unclaimed pooled connection is rejected by
    # the lenny_tenant_guard trigger and by RLS before tenant data
    # could leak. The pgbouncer.ini INI parser wraps the value in
    # single quotes and doubles any embedded single quote, so we
    # transform `'` -> `''` from the values.yaml literal here.
    connect_query = '{{ .Values.pgbouncer.connectQuery | replace "'" "''" }}'
{{- end }}
