{{- /*
lenny-datastore-conn Secret. Postgres, Redis, and MinIO may be external
services (cloud-managed, or an out-of-band self-managed install) or
rendered in-cluster by the chart (the §17.9.5 self-managed workloads,
gated on postgres.deploy / redis.deploy / minio.deploy). Either way the
connection credentials must not be baked into the Deployment env
literally. This template renders a Secret carrying exactly the
credentials that were supplied, and the gateway and controller
Deployments read them with valueFrom.secretKeyRef. The §17.9.5 in-cluster
Redis reads its AUTH credential from the same redis-password key, so the
deployed Redis and the gateway authenticate with one source of truth.

The Secret is rendered only when at least one connection value is set.
A stock render (all three empty) emits nothing, so production behavior
is unchanged: no Secret, no data-store env, and the gateway falls back
to its in-memory backends.

Only the keys whose source value is non-empty are written, so the
gateway and controller Deployments must gate each secretKeyRef on the
same value.
*/ -}}
{{- $pg := .Values.postgres -}}
{{- $redis := .Values.redis -}}
{{- $minio := .Values.minio -}}
{{- $hasPg := and $pg $pg.dsn (ne $pg.dsn "") -}}
{{- $hasBillingAuditPg := and $pg (hasKey $pg "billingAuditDSN") (ne $pg.billingAuditDSN "") -}}
{{- /* §12.3 line 146 — the read-replica reader endpoint, rendered into the
       Secret only when postgres.readDsn is set. The gateway reads it as
       LENNY_PG_READ_DSN. F-12.3.16 / F-17.9.13. */ -}}
{{- $hasReadPg := and $pg (hasKey $pg "readDsn") (ne ($pg.readDsn | toString) "") -}}
{{- $hasRedis := and $redis $redis.url (ne $redis.url "") -}}
{{- /* §17.9.3 — the Sentinel topology carries its AUTH credentials in
       the Secret (the external/url path embeds them in the rediss:// URL
       instead). Rendered only when provider=sentinel resolves and the
       respective password is set. */ -}}
{{- $useSentinel := eq (include "lenny.redisProvider" .) "sentinel" -}}
{{- /* §17.9.5 — the in-cluster Redis (redis.deploy, either sentinel or
       cluster provider) reads redis-password from this Secret, so render
       the key for any deploy path, not only the external sentinel one. */ -}}
{{- $wantsRedisPassword := or $useSentinel ($redis.deploy | default false) -}}
{{- $hasRedisPassword := and $wantsRedisPassword (ne ($redis.password | default "" | toString) "") -}}
{{- $hasSentinelPassword := and $wantsRedisPassword (ne ($redis.sentinelPassword | default "" | toString) "") -}}
{{- $concerns := (and $redis (hasKey $redis "concerns")) | ternary $redis.concerns dict -}}
{{- $hasCoordRedis := and $concerns (hasKey $concerns "coordinationUrl") (ne ($concerns.coordinationUrl | toString) "") -}}
{{- $hasQuotaRedis := and $concerns (hasKey $concerns "quotaUrl") (ne ($concerns.quotaUrl | toString) "") -}}
{{- $hasCacheRedis := and $concerns (hasKey $concerns "cachePubSubUrl") (ne ($concerns.cachePubSubUrl | toString) "") -}}
{{- $hasSessRedis := and $concerns (hasKey $concerns "sessionDataUrl") (ne ($concerns.sessionDataUrl | toString) "") -}}
{{- $hasDlgRedis := and $concerns (hasKey $concerns "delegationUrl") (ne ($concerns.delegationUrl | toString) "") -}}
{{- $hasConcernRedis := or $hasCoordRedis $hasQuotaRedis $hasCacheRedis $hasSessRedis $hasDlgRedis -}}
{{- $hasMinio := and $minio $minio.endpoint (ne $minio.endpoint "") -}}
{{- if or $hasPg $hasBillingAuditPg $hasReadPg $hasRedis $hasConcernRedis $hasRedisPassword $hasSentinelPassword $hasMinio }}
apiVersion: v1
kind: Secret
metadata:
  name: lenny-datastore-conn
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: datastore-conn
type: Opaque
stringData:
  {{- if $hasPg }}
  postgres-dsn: {{ $pg.dsn | quote }}
  {{- end }}
  {{- if $hasBillingAuditPg }}
  billing-audit-postgres-dsn: {{ $pg.billingAuditDSN | quote }}
  {{- end }}
  {{- if $hasReadPg }}
  read-postgres-dsn: {{ $pg.readDsn | quote }}
  {{- end }}
  {{- if $hasRedis }}
  redis-url: {{ $redis.url | quote }}
  {{- end }}
  {{- /* §17.9.3 — Sentinel AUTH credentials (data password + optional
         sentinel password). */}}
  {{- if $hasRedisPassword }}
  redis-password: {{ $redis.password | quote }}
  {{- end }}
  {{- if $hasSentinelPassword }}
  redis-sentinel-password: {{ $redis.sentinelPassword | quote }}
  {{- end }}
  {{- /* §12.4 per-concern Redis URLs (logical separation of concerns). */}}
  {{- if $hasCoordRedis }}
  redis-coordination-url: {{ $concerns.coordinationUrl | quote }}
  {{- end }}
  {{- if $hasQuotaRedis }}
  redis-quota-url: {{ $concerns.quotaUrl | quote }}
  {{- end }}
  {{- if $hasCacheRedis }}
  redis-cache-pubsub-url: {{ $concerns.cachePubSubUrl | quote }}
  {{- end }}
  {{- if $hasSessRedis }}
  redis-session-data-url: {{ $concerns.sessionDataUrl | quote }}
  {{- end }}
  {{- if $hasDlgRedis }}
  redis-delegation-url: {{ $concerns.delegationUrl | quote }}
  {{- end }}
  {{- if $hasMinio }}
  minio-access-key: {{ $minio.accessKey | quote }}
  minio-secret-key: {{ $minio.secretKey | quote }}
  {{- end }}
{{- end }}
