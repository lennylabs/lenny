{{- /*
lenny-datastore-conn Secret. Postgres, Redis, and MinIO stay
bring-your-own external services (§17.9); the chart does not deploy
them. When an operator points the platform at those services by
setting postgres.dsn, redis.url, or minio.endpoint, the connection
credentials must not be baked into the Deployment env literally. This
template renders a Secret carrying exactly the credentials that were
supplied, and the gateway and controller Deployments read them with
valueFrom.secretKeyRef.

The Secret is rendered only when at least one connection value is set.
A stock render (all three empty) emits nothing, so production behavior
is unchanged: no Secret, no data-store env, and the gateway falls back
to its in-memory backends.

Only the keys whose source value is non-empty are written, so the
gateway and controller Deployments must gate each secretKeyRef on the
same value.
*/ -}}
{{- $pg := .Values.postgres -}}
{{- $redis := .Values.redis -}}
{{- $minio := .Values.minio -}}
{{- $hasPg := and $pg $pg.dsn (ne $pg.dsn "") -}}
{{- $hasRedis := and $redis $redis.url (ne $redis.url "") -}}
{{- $hasMinio := and $minio $minio.endpoint (ne $minio.endpoint "") -}}
{{- if or $hasPg $hasRedis $hasMinio }}
apiVersion: v1
kind: Secret
metadata:
  name: lenny-datastore-conn
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: datastore-conn
type: Opaque
stringData:
  {{- if $hasPg }}
  postgres-dsn: {{ $pg.dsn | quote }}
  {{- end }}
  {{- if $hasRedis }}
  redis-url: {{ $redis.url | quote }}
  {{- end }}
  {{- if $hasMinio }}
  minio-access-key: {{ $minio.accessKey | quote }}
  minio-secret-key: {{ $minio.secretKey | quote }}
  {{- end }}
{{- end }}
