{{- /*
The lenny-ops Deployment, its Service, and its RBAC (§25.4, §17.8.5).
lenny-ops runs the §25 operability control plane: every replica serves
the §25 HTTP surface, and the replica that holds the lenny-ops-leader
Lease runs the §25.4 background loops (the cron evaluator, the webhook
delivery worker, the scheduled-backup runner). lenny-ops is mandatory
in every installation (§17.8.5); the chart provides no flag to disable
it.

Pod label exception (§13.2 line 201): lenny-ops pods carry app:
lenny-ops rather than the lenny.dev/component selector the rest of the
control plane uses, because lenny-ops is a separate operability plane.
The §13.2 NET-051 NetworkPolicies and podmonitor.yaml select it by this
label, so the Deployment, the selector, and the Service all key on it.

lenny-ops runs the §13.1 Restricted-PSS posture (non-root, all
capabilities dropped, read-only root filesystem, RuntimeDefault
seccomp) shared with the controller. Postgres and Redis stay
bring-your-own external services (§17.9); the lenny-ops binary reads
its connection settings from the LENNY_POSTGRES_DSN and LENNY_REDIS_URL
environment variables (cmd/lenny-ops/flags.go).

§25.5 read-side wiring: lenny-ops reads the platform-scoped
ops:events:stream Redis stream (§25.5 lines 2558, 2602; the StoreRouter
PlatformRedis() route at §25.4 line 1512) to serve the SSE, polling, and
webhook read surface, and falls back to the gateway event buffer over the
lenny-gateway-pods headless Service when Redis is unreachable (§25.5
gateway-buffer fallback). This Deployment therefore wires Redis from the
same redis.provider / redis.url values the gateway and controller consume
(the LENNY_REDIS_URL / Sentinel env block below, sourced from the
lenny-datastore-conn Secret). Without Redis configured the read side runs
on lenny-ops's own per-replica in-memory buffer (§25.5 cold-start), and
the Redis-down gateway-buffer fallback is unreachable, so a stock render
that leaves redis.url empty stays in that degraded single-process mode.
Postgres (postgres.dsn) is not wired here, so audit, backup, and upgrade
state degrade gracefully when Postgres is absent (§25.4).
*/ -}}
{{- /* §17.8.5 line 1323: "Attempts to disable lenny-ops via Helm values
   are rejected at chart validation." The chart has no ops.enabled key;
   an operator who supplies one (e.g., ops.enabled: false) gets a hard
   render failure rather than silent acceptance. The lenny-ops surface
   is mandatory in every Lenny installation regardless of tier. */ -}}
{{- if hasKey (.Values.ops | default dict) "enabled" -}}
{{- if not .Values.ops.enabled -}}
{{- fail "§17.8.5 line 1323: lenny-ops is mandatory in every Lenny installation; ops.enabled: false is rejected. Remove the override or omit the ops.enabled key." -}}
{{- else -}}
{{- fail "§17.8.5 line 1323: ops.enabled is not a supported Helm value (lenny-ops is mandatory); remove the ops.enabled key from your values." -}}
{{- end -}}
{{- end -}}
{{- /* §25.5 read-side Redis topology. lenny-ops consumes the same
   redis.provider / redis.url values the gateway and controller do, across
   every §17.9.3 topology: external (url), Sentinel, and Cluster. The
   lenny-ops binary reads --redis-url, --redis-sentinel-addrs, and
   --redis-cluster-addrs (cmd/lenny-ops/flags.go), so the §25.5
   ops:events:stream is the read source on each of them and no topology
   silently drops lenny-ops onto its in-memory buffer. The connection URL
   and the Sentinel AUTH credentials come from the lenny-datastore-conn
   Secret so no secret material lands in the pod spec; the cluster seed
   addresses are not secret and render as plain env. */ -}}
{{- $redis := .Values.redis -}}
{{- $redisProvider := include "lenny.redisProvider" . -}}
{{- $redisCluster := (and $redis (hasKey $redis "cluster")) | ternary $redis.cluster dict -}}
{{- $hasRedis := and (eq $redisProvider "external") $redis $redis.url (ne $redis.url "") -}}
{{- $hasRedisCluster := and (eq $redisProvider "cluster") $redisCluster (hasKey $redisCluster "addrs") (ne ($redisCluster.addrs | toString) "") -}}
{{- $useSentinel := eq $redisProvider "sentinel" -}}
{{- $hasRedisPassword := and $useSentinel (ne ($redis.password | default "" | toString) "") -}}
{{- $hasSentinelPassword := and $useSentinel (ne ($redis.sentinelPassword | default "" | toString) "") -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lenny-ops-sa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lenny-ops-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
rules:
  # §25.4 leader election: lenny-ops elects a leader through the
  # lenny-ops-leader Lease in the release namespace.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lenny-ops-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lenny-ops-leader-election
subjects:
  - kind: ServiceAccount
    name: lenny-ops-sa
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lenny-ops
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    app: lenny-ops
spec:
  replicas: {{ .Values.ops.replicas }}
  selector:
    matchLabels:
      app: lenny-ops
  template:
    metadata:
      labels:
        {{- include "lenny.labels" . | nindent 8 }}
        app: lenny-ops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.ops.metricsPort | quote }}
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: lenny-ops-sa
      {{- include "lenny.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ops
          image: {{ include "lenny.componentImage" (dict "root" $ "name" "lenny-ops" "image" .Values.ops.image) | quote }}
          imagePullPolicy: {{ .Values.ops.image.pullPolicy }}
          args:
            - --addr=:{{ .Values.ops.httpPort }}
            - --leader-election-namespace={{ .Release.Namespace }}
            # §25.4 NET-070: the admin-API link is TLS by default
            # (ops.tls.internalEnabled). When enabled, lenny-ops reaches
            # the gateway internal-TLS port (gateway.internalTLSPort);
            # otherwise the acknowledged-plaintext path uses the plaintext
            # internalPort. The ops-tls-guard refuses a non-acknowledged
            # plaintext render outside devMode. F-25.4.19.
            {{- if .Values.ops.tls.internalEnabled }}
            - --gateway-url=https://lenny-gateway.{{ .Release.Namespace }}.svc:{{ .Values.gateway.internalTLSPort }}
            - --gateway-internal-tls=true
            {{- else }}
            - --gateway-url=http://lenny-gateway.{{ .Release.Namespace }}.svc:{{ .Values.gateway.internalPort }}
            - --gateway-internal-tls=false
            {{- end }}
            # §25.4 lines 1740-1974 GatewayClient routing: the per-replica
            # fan-out resolves the headless Service; the breaker + timeout
            # bound the fallback path. F-25.4.8.
            - --gateway-headless-service={{ .Values.ops.gateway.headlessService }}
            - --gateway-internal-tls-port={{ .Values.gateway.internalTLSPort }}
            - --gateway-internal-port={{ .Values.gateway.internalPort }}
            - --gateway-fanout-timeout={{ .Values.ops.gateway.fanOutTimeoutSeconds }}s
            - --gateway-fanout-breaker-failure-threshold={{ .Values.ops.gateway.fanOutCircuitBreaker.failureThreshold }}
            - --gateway-fanout-breaker-reset-after={{ .Values.ops.gateway.fanOutCircuitBreaker.resetAfter }}s
            # §25.4 lines 1956-1971 service-account token lifecycle.
            - --gateway-sa-token-file=/var/run/secrets/lenny/gateway/token
            - --gateway-token-refresh-before-expiry={{ .Values.security.oidc.tokenRefreshBeforeExpirySeconds }}s
            - --gateway-token-min-ttl={{ .Values.security.oidc.minTokenTTLSeconds }}s
            {{- if .Values.ops.tls.caBundleConfigMap }}
            # §25.4 line 1743 ops.tls.caBundleConfigMap — augment the
            # system trust store for the admin-API TLS link. F-25.4.19.
            - --gateway-ca-bundle-file=/etc/lenny/gateway-ca/ca.crt
            {{- end }}
            - --production={{ .Values.ops.production }}
            {{- if .Values.global.devMode }}
            # §12.4 requires Redis AUTH and TLS; a dev install backed by a
            # plaintext no-password Redis would otherwise fail the lenny-ops
            # startup invariant (cmd/lenny-ops/deps_setup.go). Dev mode
            # acknowledges the insecure dev Redis, matching the gateway.
            - --redis-allow-insecure
            {{- end }}
            {{- if .Values.ops.prometheus.url }}
            # §25.16 line 5124: when ops.prometheus.url is set, lenny-ops
            # uses the supplied BYO Prometheus HTTP API for §25.4
            # cross-replica health aggregation and §25.13 alert
            # evaluation. Empty (the Tier 1 default) leaves lenny-ops in
            # per-replica fan-out fallback.
            - --prometheus-url={{ .Values.ops.prometheus.url }}
            {{- end }}
            # §25.10 line 3809 / line 3824 — drift detection knobs.
            # F-25.10.7, F-25.10.9.
            - --drift-snapshot-stale-warning-days={{ .Values.ops.drift.snapshotStaleWarningDays }}
            - --drift-running-state-cache-ttl-seconds={{ .Values.ops.drift.runningStateCacheTTLSeconds }}
            # §25.6 doctor `fix=true` auto-remediation guardrails:
            # admin.doctor.fixTimeoutSeconds bounds each fix,
            # admin.doctor.allowedFixes narrows the fixable set, and
            # global.maintenanceMode disables every fix. F-25.6.2.
            - --doctor-fix-timeout-seconds={{ .Values.admin.doctor.fixTimeoutSeconds }}
            {{- with .Values.admin.doctor.allowedFixes }}
            - --doctor-allowed-fixes={{ join "," . }}
            {{- end }}
            {{- if .Values.global.maintenanceMode }}
            - --maintenance-mode=true
            {{- end }}
            # §25.4 line 903 / §17.8.4 ops.selfHealth.checkIntervalSeconds —
            # self-monitor cadence (10s at Tier 2/3, 30s acceptable at
            # Tier 1). Tier-preset overridden. F-17.8.1.
            - --self-health-interval={{ .Values.ops.selfHealth.checkIntervalSeconds }}s
            # §25.5 line 2598 / §17.8.4 ops.events.streamMaxLen — MAXLEN of
            # the platform-scoped ops:events:stream (10k Tier 1, 50k Tier 2,
            # 100k Tier 3). Tier-preset overridden. F-17.8.1.
            - --events-stream-max-len={{ .Values.ops.events.streamMaxLen }}
            # §25.5 lines 2649-2663 ops.webhooks — webhook delivery-tracking
            # mode plus the retention windows the 03:45 UTC purge cron
            # enforces. F-25.5.15.
            - --webhook-tracking-mode={{ .Values.ops.webhooks.deliveryTrackingMode }}
            - --webhook-delivery-retention-days={{ .Values.ops.webhooks.deliveryRetentionDays }}
            - --webhook-failures-retention-days={{ .Values.ops.webhooks.failuresOnlyRetentionDays }}
            # §25.4 lines 2396, 2414 ops.escalation — the escalation
            # durability posture (reject vs buffer when no durable tier is
            # reachable) and the leader-only reconciliation flush rate. F-25.4.7.
            - --escalation-require-durable={{ .Values.ops.escalation.requireDurable }}
            - --escalation-reconciliation-writes-per-second={{ .Values.ops.escalation.reconciliationWritesPerSecond }}
            # §25.4 lines 1562-1564 / §17 security.oidc.issuerUrl — OIDC
            # authentication + role gate. F-25.4.1, F-25.4.20.
            {{- if .Values.security.oidc.issuerUrl }}
            - --oidc-issuer-url={{ .Values.security.oidc.issuerUrl }}
            {{- end }}
            {{- if .Values.security.oidc.bearerTrustKeySecret }}
            - --bearer-trust-hmac-key-file=/etc/lenny/oidc/key
            {{- end }}
            # §25.4 line 2001 per-service-account rate limiting. F-25.4.5.
            - --rate-limit-rps={{ .Values.ops.rateLimiting.requestsPerSecond }}
            - --rate-limit-burst={{ .Values.ops.rateLimiting.burst }}
            # §25.4 lines 2206-2212 in-memory (Tier-3) lock policy. The
            # single-replica-only default counts ready replicas via the
            # lenny-ops Service Endpoints to reject uncoordinated acquires in
            # multi-replica deployments. F-25.4.26.
            - --locks-memory-tier={{ .Values.ops.locks.memoryTier }}
            # §25.4 ops.locks.{minTTLSeconds,defaultTTLSeconds,maxTTLSeconds} —
            # the deployment-wide remediation-lock TTL policy applied across
            # every tier. F-25.4.9.
            - --locks-min-ttl-seconds={{ .Values.ops.locks.minTTLSeconds }}
            - --locks-default-ttl-seconds={{ .Values.ops.locks.defaultTTLSeconds }}
            - --locks-max-ttl-seconds={{ .Values.ops.locks.maxTTLSeconds }}
            # §25.4 ops.idempotency.{keyTTLSeconds,longRunningKeyTTLSeconds} —
            # idempotency-record lifetimes for the standard and long-running
            # endpoint classes. F-25.4.9.
            - --idempotency-key-ttl-seconds={{ .Values.ops.idempotency.keyTTLSeconds }}
            - --idempotency-long-running-key-ttl-seconds={{ .Values.ops.idempotency.longRunningKeyTTLSeconds }}
            # §25.4 ops.leaderElection.{leaseDurationSeconds,renewDeadlineSeconds,
            # retryPeriodSeconds} — client-go leader-election lease timings for
            # the lenny-ops-leader Lease. F-25.4.9.
            - --leader-lease-duration-seconds={{ .Values.ops.leaderElection.leaseDurationSeconds }}
            - --leader-renew-deadline-seconds={{ .Values.ops.leaderElection.renewDeadlineSeconds }}
            - --leader-retry-period-seconds={{ .Values.ops.leaderElection.retryPeriodSeconds }}
            # §25.9 ops.audit.diagnosticsRatePerMinute — per-service-account cap
            # on distinct diagnostic-audit events per minute. F-25.4.9.
            - --diagnostics-audit-rate-per-minute={{ .Values.ops.audit.diagnosticsRatePerMinute }}
            # §25.5 ops.webhooks SSRF policy applied at subscription create and
            # on every delivery attempt. F-25.4.9.
            - --webhook-allow-http={{ .Values.ops.webhooks.allowHTTP }}
            {{- with .Values.ops.webhooks.blockedCIDRs }}
            - --webhook-blocked-cidrs={{ join "," . }}
            {{- end }}
            {{- with .Values.ops.webhooks.domainAllowlist }}
            - --webhook-domain-allowlist={{ join "," . }}
            {{- end }}
            - --ops-service-name=lenny-ops
            # §25.4 line 1339 / §25.13 lines 4833-4834 — the leader-only
            # bundleRules reconciler re-stamps the bundled-rules observability
            # gauges (lenny_alerting_rules_bundled{format},
            # lenny_alerting_rule_overrides) on the lenny-ops /metrics surface
            # from the chart's monitoring.format and alertOverrides count.
            # F-25.4.17.
            - --alerting-bundle-formats={{ if eq .Values.monitoring.format "both" }}prometheusrule,configmap{{ else }}{{ .Values.monitoring.format | default "prometheusrule" }}{{ end }}
            - --alerting-override-count={{ len .Values.monitoring.alertOverrides }}
            # §25.8 platform.registry.* — the base image registry the runtime
            # registry API (GET/PUT /v1/admin/platform/registry) overlays and
            # the upgrade preflight resolves component images against.
            - --registry-url={{ .Values.platform.registry.url }}
            {{- with .Values.platform.registry.pullSecretName }}
            - --registry-pull-secret={{ . }}
            {{- end }}
            - --registry-require-digest={{ .Values.platform.registry.requireDigest }}
            {{- with .Values.platform.registry.overrides }}
            - --registry-overrides={{ toJson . | quote }}
            {{- end }}
            # §25.8 platform.upgrade.* — the OpsRoll watchdog roll timeouts.
            - --ops-roll-timeout-seconds={{ .Values.platform.upgrade.opsRollTimeoutSeconds }}
            - --gateway-roll-timeout-seconds={{ .Values.platform.upgrade.gatewayRollTimeoutSeconds }}
            - --controller-roll-timeout-seconds={{ .Values.platform.upgrade.controllerRollTimeoutSeconds }}
            # §25.8 Version Aggregation: the running Helm release name, so
            # the Helm-chart-version source reads the helm.sh/release.v1
            # Secret for this install rather than a hardcoded default.
            - --helm-release-name={{ .Release.Name }}
            {{- with .Values.platform.releaseChannel.url }}
            # §25.8 upgrade-check consumer: fetch the release manifest over
            # HTTP from the configured channel and verify its Ed25519
            # X-Lenny-Release-Signature before trusting it.
            - --release-channel-url={{ . }}
            {{- with $.Values.platform.releaseChannel.publicKeyPath }}
            - --release-channel-public-key-file={{ . }}
            - --release-channel-public-key-id={{ required "platform.releaseChannel.publicKeyID is required when publicKeyPath is set (§25.8 consumer looks the trusted key up by keyId)" $.Values.platform.releaseChannel.publicKeyID }}
            {{- end }}
            {{- end }}
            {{- if .Values.platform.releaseChannel.publisher.enabled }}
            # §25.8 release-channel manifest publisher.
            - --release-channel-key-file=/etc/lenny/release-channel/{{ .Values.platform.releaseChannel.publisher.signingKeyKey }}
            - --release-channel-key-id={{ required "platform.releaseChannel.publisher.signingKeyID is required when the publisher is enabled (§25.8)" .Values.platform.releaseChannel.publisher.signingKeyID }}
            - --release-channel-manifest-file=/etc/lenny/release-channel-manifest/{{ .Values.platform.releaseChannel.publisher.manifestKey }}
            {{- if .Values.platform.releaseChannel.publisher.previousKeySecret }}
            - --release-channel-previous-key-file=/etc/lenny/release-channel-previous/{{ .Values.platform.releaseChannel.publisher.previousKeyKey }}
            - --release-channel-previous-key-id={{ required "platform.releaseChannel.publisher.previousKeyID is required when previousKeySecret is set (§25.8)" .Values.platform.releaseChannel.publisher.previousKeyID }}
            {{- end }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # §25.4 line 2208: the single-replica-only lock policy reads the
            # lenny-ops Service Endpoints in this pod's own namespace to count
            # ready replicas.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- /* §25.5 lines 2558-2602 — the platform-scoped
                   ops:events:stream Redis connection the read side (SSE,
                   polling, webhook worker) consumes, and the durable tier
                   for §25.4 escalations and remediation locks. External
                   (url) mode reads the connection URL from the
                   lenny-datastore-conn Secret; the plaintext dev Redis is
                   acknowledged via --redis-allow-insecure above. */}}
            {{- if $hasRedis }}
            - name: LENNY_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: redis-url
            {{- end }}
            {{- /* §12.4 lines 260-264 — Redis Cluster seed nodes (plain
                   env; addresses are not secret). lenny-ops reaches the
                   §25.5 ops:events:stream through the cluster client on
                   this topology. */}}
            {{- if $hasRedisCluster }}
            - name: LENNY_REDIS_CLUSTER_ADDRS
              value: {{ $redisCluster.addrs | quote }}
            {{- end }}
            {{- /* §17.9.3 / §12.4 — Redis Sentinel topology. The sentinel
                   addresses and master name are not secret (plain env);
                   the data AUTH password and the optional sentinel AUTH
                   password come from the datastore Secret. TLS is requested
                   on the Sentinel path so §12.4 AUTH+TLS holds. */}}
            {{- if $useSentinel }}
            - name: LENNY_REDIS_SENTINEL_ADDRS
              value: {{ join "," $redis.sentinels | quote }}
            - name: LENNY_REDIS_SENTINEL_MASTER
              value: {{ $redis.sentinelMaster | quote }}
            - name: LENNY_REDIS_TLS
              value: "true"
            {{- if $hasRedisPassword }}
            - name: LENNY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: redis-password
            {{- end }}
            {{- if $hasSentinelPassword }}
            - name: LENNY_REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: redis-sentinel-password
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ops.httpPort }}
            # spec: §16.9 line 723 — named metrics containerPort so the
            # podmonitor.yaml `port: metrics` selector matches the
            # lenny-ops pod. lenny-ops serves /metrics on the same HTTP
            # listener as the §25 REST surface; the named entry surfaces
            # the metrics endpoint on the rendered pod spec. F-16.9.10.
            - name: metrics
              containerPort: {{ .Values.ops.httpPort }}
          # §25.4 lines 1033-1057 — the permissive /healthz covers
          # startup and liveness so a transient Postgres or Kubernetes
          # API blip does not restart an otherwise-healthy pod; the
          # startup probe's 30×2s budget covers Postgres connection
          # establishment.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          # §25.4 line 1055 — readiness uses the strict gate so traffic
          # is not routed to a replica that cannot reach both Postgres
          # and the Kubernetes API. Strict readiness is gated on
          # ops.production: the stock degraded single-process render
          # (LENNY_POSTGRES_DSN unset) would never reach Ready under the
          # strict gate, so it falls back to the graceful /readyz report.
          readinessProbe:
            httpGet:
              {{- if .Values.ops.production }}
              path: /healthz?strict=true
              {{- else }}
              path: /readyz
              {{- end }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # §25.4 line 1027 — writable scratch for the read-only root
            # filesystem posture. lenny-ops writes no temp files today,
            # but §25.4 calls the seam out explicitly so any future temp
            # write does not fail against the read-only root.
            - name: tmp
              mountPath: /tmp
            # §25.4 lines 1956-1971 — the projected ServiceAccount token
            # the GatewayClient presents to the gateway admin API. The
            # kubelet rotates it in place; FileTokenLoader re-reads it on
            # each pre-emptive refresh. F-25.4.8.
            - name: gateway-sa-token
              mountPath: /var/run/secrets/lenny/gateway
              readOnly: true
            {{- if .Values.ops.tls.caBundleConfigMap }}
            # §25.4 line 1743 ops.tls.caBundleConfigMap — operator CA for
            # the admin-API TLS link. F-25.4.19.
            - name: gateway-ca-bundle
              mountPath: /etc/lenny/gateway-ca
              readOnly: true
            {{- end }}
            {{- if .Values.security.oidc.bearerTrustKeySecret }}
            # §25.4 line 1562: the shared HMAC bearer-verify key. F-25.4.20.
            - name: oidc-bearer-trust-key
              mountPath: /etc/lenny/oidc
              readOnly: true
            {{- end }}
            {{- if .Values.platform.releaseChannel.publisher.enabled }}
            - name: release-channel-signing-key
              mountPath: /etc/lenny/release-channel
              readOnly: true
            - name: release-channel-manifest
              mountPath: /etc/lenny/release-channel-manifest
              readOnly: true
            {{- if .Values.platform.releaseChannel.publisher.previousKeySecret }}
            - name: release-channel-previous-key
              mountPath: /etc/lenny/release-channel-previous
              readOnly: true
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.ops.resources | nindent 12 }}
      {{- /* §25.4 line 1028 — spread replicas across nodes once
         lenny-ops scales past one replica, so a single node loss never
         takes the whole operability plane down. */ -}}
      {{- if ge (int .Values.ops.replicas) 2 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: lenny-ops
      {{- end }}
      volumes:
        # §25.4 line 1027 — writable /tmp scratch under read-only root.
        - name: tmp
          emptyDir: {}
        # §25.4 lines 1956-1971 — projected SA token for the GatewayClient.
        - name: gateway-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: lenny-gateway
                  expirationSeconds: 3600
        {{- if .Values.ops.tls.caBundleConfigMap }}
        - name: gateway-ca-bundle
          configMap:
            name: {{ .Values.ops.tls.caBundleConfigMap }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if .Values.security.oidc.bearerTrustKeySecret }}
        - name: oidc-bearer-trust-key
          secret:
            secretName: {{ .Values.security.oidc.bearerTrustKeySecret }}
            items:
              - key: key
                path: key
        {{- end }}
        {{- if .Values.platform.releaseChannel.publisher.enabled }}
        - name: release-channel-signing-key
          secret:
            secretName: {{ .Values.platform.releaseChannel.publisher.signingKeySecret }}
        - name: release-channel-manifest
          configMap:
            name: {{ .Values.platform.releaseChannel.publisher.manifestConfigMap }}
        {{- if .Values.platform.releaseChannel.publisher.previousKeySecret }}
        - name: release-channel-previous-key
          secret:
            secretName: {{ .Values.platform.releaseChannel.publisher.previousKeySecret }}
        {{- end }}
        {{- end }}
---
# lenny-ops Service. The metrics port maps to the HTTP listener because
# the binary serves /metrics on the same mux as the §25 HTTP surface;
# the §13.2 NET-045 monitoring-scrape NetworkPolicy and podmonitor.yaml
# scrape it.
#
# sessionAffinity: ClientIP with a 3h clientIP timeout pins each SSE
# client to the replica that buffered its events (§25.4 line 1063 / §25.16
# Production block). During a dual gateway+Redis outage the per-replica
# event buffer is the only durability layer; a reconnecting watchdog must
# return to the same lenny-ops replica or it silently misses the locally
# buffered events.
apiVersion: v1
kind: Service
metadata:
  name: lenny-ops
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    app: lenny-ops
spec:
  selector:
    app: lenny-ops
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ .Values.ops.service.sessionAffinityTimeoutSeconds }}
  ports:
    - name: http
      port: {{ .Values.ops.httpPort }}
      targetPort: http
    - name: metrics
      port: {{ .Values.ops.metricsPort }}
      targetPort: http
