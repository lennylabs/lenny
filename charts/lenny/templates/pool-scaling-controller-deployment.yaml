{{- /*
The lenny-pool-scaling-controller Deployment (§4.6.2). Runs the
PoolScalingController as its own workload with its own leader-election
lease, separate from the WarmPoolController, so the two elect leaders
independently and may run on different replicas. The pod follows the
§13.1 Restricted-PSS posture: non-root, all capabilities dropped,
read-only root filesystem, RuntimeDefault seccomp.

The PSC reconciles the admin API's Postgres pool definitions into CRDs,
so it requires a Postgres DSN. The chart wires LENNY_POSTGRES_DSN from
the lenny-datastore-conn Secret only when postgres.dsn is set; without
it the PSC has no source of truth and is not deployed.
*/ -}}
{{- $pg := .Values.postgres -}}
{{- $hasPg := and $pg $pg.dsn (ne $pg.dsn "") -}}
{{- if $hasPg }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lenny-pool-scaling-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: pool-scaling-controller
spec:
  replicas: {{ .Values.poolScalingController.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      lenny.dev/component: pool-scaling-controller
  template:
    metadata:
      labels:
        {{- include "lenny.labels" . | nindent 8 }}
        lenny.dev/component: pool-scaling-controller
    spec:
      serviceAccountName: lenny-pool-scaling-controller
      {{- include "lenny.imagePullSecrets" . | nindent 6 }}
      {{- /* spec: §4.6.2 / §17.8.2 controller-tuning table — schedule away
             from the WarmPoolController so a single node failure does not
             force both controllers to fail over at once. The shared
             controller.antiAffinity knob selects preferred (Tier 1) vs
             required (Tier 2/3). F-17.8.6. */}}
      {{- include "lenny.controllerAntiAffinity" (dict "root" . "peer" "controller") | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pool-scaling-controller
          image: {{ include "lenny.componentImage" (dict "root" $ "name" "lenny-pool-scaling-controller" "image" .Values.poolScalingController.image) | quote }}
          imagePullPolicy: {{ .Values.poolScalingController.image.pullPolicy }}
          args:
            - --leader-elect
            - --leader-election-namespace={{ .Release.Namespace }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --agent-namespace={{ .Values.poolScalingController.agentNamespace }}
          env:
            - name: LENNY_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: postgres-dsn
            # §16.5 lines 590-601 — the workload-profile assumptions the
            # tier sizing formulas depend on. The PSC reads them at
            # startup and warns when a Tier 2 / Tier 3 deployment runs the
            # defaults (§16.5 line 601). F-16.5.6.
            {{- with .Values.capacityPlanning }}
            - name: LENNY_CAPACITY_TIER
              value: {{ .tier | default "tier1" | quote }}
            - name: LENNY_CAPACITY_AVG_SESSION_DURATION_SECONDS
              value: {{ .avgSessionDurationSeconds | quote }}
            - name: LENNY_CAPACITY_DELEGATION_PARTICIPATION_RATE
              value: {{ .delegationParticipationRate | quote }}
            - name: LENNY_CAPACITY_AVG_DELEGATIONS_PER_DELEGATING_SESSION
              value: {{ .avgDelegationsPerDelegatingSession | quote }}
            - name: LENNY_CAPACITY_AVG_CHILD_SESSION_SECONDS
              value: {{ .avgChildSessionSeconds | quote }}
            - name: LENNY_CAPACITY_AVG_WORKSPACE_SIZE_MB
              value: {{ .avgWorkspaceSizeMB | quote }}
            - name: LENNY_CAPACITY_SESSION_IDLE_FRACTION
              value: {{ .sessionIdleFraction | quote }}
            {{- end }}
            # §17.8.2 line 1008 poolScaling.safetyFactor — the agent-type
            # safety_factor a pool inherits when it does not pin one. When
            # set to a positive value it pins the factor for every pool;
            # 0 (the default) lets the controller resolve the per-tier
            # default from LENNY_CAPACITY_TIER (1.2 at Tier 3, else 1.5),
            # so a Tier 3 install picks up the override automatically.
            # F-17.8.4.
            {{- if hasKey .Values.poolScalingController "safetyFactor" }}
            - name: LENNY_POOL_SCALING_SAFETY_FACTOR
              value: {{ .Values.poolScalingController.safetyFactor | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.poolScalingController.resources | nindent 12 }}
{{- end }}
