{{- /*
The lenny-backup-postgres and lenny-backup-minio Secrets (§17.1 row 21:
"Backup connection strings (narrowly-scoped DB role; bucket-scoped
access key)"). The lenny-backup Jobs (§25.11) authenticate to Postgres
and MinIO with credentials scoped tighter than the gateway/controller
read-write DSNs in lenny-datastore-conn: the DB role is restricted to
the backup operations, and the MinIO key is scoped to the backup
bucket.

Each Secret renders only when its credential value is supplied, so a
stock render emits nothing and an operator managing backup credentials
out of band leaves the values empty. This mirrors the conditional
rendering of lenny-datastore-conn (datastore-secret.yaml).
*/ -}}
{{- $bp := (.Values.backups.postgres | default dict) -}}
{{- $bm := (.Values.backups.minio | default dict) -}}
{{- $hasBackupPg := and $bp.dsn (ne $bp.dsn "") -}}
{{- $hasBackupMinio := and $bm.accessKey (ne $bm.accessKey "") $bm.secretKey (ne $bm.secretKey "") -}}
{{- if $hasBackupPg }}
apiVersion: v1
kind: Secret
metadata:
  name: lenny-backup-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: backup
type: Opaque
stringData:
  postgres-dsn: {{ $bp.dsn | quote }}
{{- end }}
{{- if $hasBackupMinio }}
{{- if $hasBackupPg }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: lenny-backup-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: backup
type: Opaque
stringData:
  minio-access-key: {{ $bm.accessKey | quote }}
  minio-secret-key: {{ $bm.secretKey | quote }}
{{- end }}
