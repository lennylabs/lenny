{{- /*
lenny-deployment-config-sync ConfigMap (§16.7 deployment-transition audit
emitter). Renders the deployment-scope Helm configuration this release
applies into a single deployment-config.json request body. The
lenny-deployment-config-sync Job mounts it at /etc/lenny/ and posts it to
POST /v1/admin/deployment/config-change so the gateway diffs it against the
persisted baseline and writes one §16.7 audit event per Helm-driven
transition (gateway.cycle_detection_mode_changed,
gateway.allow_self_recursion_changed, gateway.default_max_depth_changed,
platform.elicitation_content_integrity_floor_changed and its per-tenant
tenant.elicitation_content_integrity_floor_clamp fanout, and one
deployment.feature_flag_downgrade_acknowledged per acknowledged
(flag, webhook) pair).

releaseRevision is .Release.Revision so the endpoint can treat a retried
hook (same revision) as an idempotent replay. acknowledgedDowngrades is
derived from .Values.acceptFeatureFlagDowngrade: each truthy flag expands
to one entry per gated webhook (features.compliance gates two), carrying
the operator justification when the flag value is a map with a
justification key. The flag→webhook mapping matches the §16.7 line 682
per-(flag, webhook) decomposition.

The ConfigMap is a post-install/post-upgrade hook at weight 5, below the
lenny-deployment-config-sync Job at weight 11, so it exists before the Job
pod starts. spec: §16.7 lines 672, 676, 677, 682; §17.2 line 86.
F-8.2.5, F-9.2.10, F-17.2.8.
*/ -}}
{{- if .Values.deploymentAudit.enabled }}
{{- $da := .Values.deploymentAudit -}}
{{- $flagWebhooks := dict "llmProxy" (list "lenny-direct-mode-isolation") "drainReadiness" (list "lenny-drain-readiness") "compliance" (list "lenny-data-residency-validator" "lenny-t4-node-isolation") -}}
{{- $acks := list -}}
{{- range $flag, $val := (.Values.acceptFeatureFlagDowngrade | default dict) -}}
{{-   $truthy := $val -}}
{{-   $just := "" -}}
{{-   if kindIs "map" $val -}}
{{-     $truthy = true -}}
{{-     $just = ($val.justification | default "") -}}
{{-   end -}}
{{-   if $truthy -}}
{{-     $webhooks := index $flagWebhooks $flag -}}
{{-     if $webhooks -}}
{{-       range $wh := $webhooks -}}
{{-         $acks = append $acks (dict "flag" (printf "features.%s" $flag) "expectedWebhook" $wh "justification" $just) -}}
{{-       end -}}
{{-     end -}}
{{-   end -}}
{{- end -}}
{{- $req := dict
      "releaseRevision" (int .Release.Revision)
      "cycleDetection" (dict "mode" $da.cycleDetection.mode "justification" $da.cycleDetection.justification)
      "allowSelfRecursion" (dict "value" (toString $da.allowSelfRecursion.value) "justification" $da.allowSelfRecursion.justification)
      "defaultMaxDepth" (int $da.defaultMaxDepth)
      "elicitationFloor" .Values.security.elicitationContentIntegrity.floor
      "acknowledgedDowngrades" $acks -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: lenny-deployment-config-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: deployment-config-sync
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  deployment-config.json: |
    {{- $req | toJson | nindent 4 }}
{{- end }}
