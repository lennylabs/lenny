{{- /*
The §26 reference-runtime catalog. When referenceRuntimes.enabled is
true, helm install registers each catalog entry as a platform-global
(cluster-scoped) Runtime record, so the reference runtimes are
installable through lenny-ctl install.

Per §26.1 the records carry no default tenant access; an operator
grants access per tenant with
POST /v1/admin/runtimes/{name}/tenant-access after install. The runtime
images live in their own repositories (github.com/lennylabs/runtime-<name>)
and are pulled lazily on first session start.

The Runtime CRD carries the type, image, integration level, execution
mode, isolation profile, allowed resource classes, supported providers,
the §5.1 capabilities block (interaction + injection), the §5.1
runtimeOptionsSchema URL the §26 sections enumerate, the §4.9
credentialCapabilities.proxyDialect set, and the §8.3
delegationPolicyRef. F-26.9.2 / F-26.10.2 / F-26.11.2.
*/ -}}
{{- if .Values.referenceRuntimes.enabled }}
{{- range .Values.referenceRuntimes.catalog }}
---
apiVersion: lenny.dev/v1
kind: Runtime
metadata:
  name: {{ .name }}
  labels:
    {{- include "lenny.labels" $ | nindent 4 }}
    lenny.dev/reference-runtime: "true"
spec:
  type: agent
  image: {{ .image }}
  integrationLevel: {{ .integrationLevel }}
  executionMode: session
  isolationProfile: sandboxed
  {{- with .allowedResourceClasses }}
  allowedResourceClasses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  supportedProviders:
    {{- toYaml .supportedProviders | nindent 4 }}
  {{- with .capabilities }}
  capabilities:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .runtimeOptionsSchemaRef }}
  runtimeOptionsSchemaRef: {{ . | quote }}
  {{- end }}
  {{- with .credentialCapabilities }}
  credentialCapabilities:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .delegationPolicyRef }}
  delegationPolicyRef: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
