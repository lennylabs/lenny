{{- /*
The credentials namespace (§4.9 "Credentials namespace.", §17.2). Credential
Secrets live in the namespace credentials.namespace names, and it holds
credential Secrets only. Keeping other Secrets out of it is an operator
obligation.

The Namespace carries helm.sh/resource-policy: keep, so `helm uninstall`
leaves it and its Secrets in place (§18.38 lists it as a residual item). The
ResourceQuota refuses every pod, so no workload mounts a credential Secret,
including a pod the controller's cluster-wide pod grant could create. It is
outside resourceGovernance.resourceQuota.enabled because that gate covers
agent-namespace capacity, while this quota is a security control. Both
objects render in every profile.

The two Roles exist only with the Token Service: the Token Service is the
only reader, and the gateway is the only writer. The gateway holds no read
verb and reaches a stored value through the Token Service keyed read. Neither
Role names resourceNames, so a platform-admin registers a Secret with no RBAC
edit. No NetworkPolicy renders here because no pod runs in the namespace.

The guard refuses a namespace shared with the control plane or with agent
pods. In either one, the namespace-wide Token Service read would cover
Secrets that are not credentials, and the pods quota would refuse their pods.
*/ -}}
{{- $credentialsNamespace := include "lenny.credentialsNamespace" . -}}
{{- if eq $credentialsNamespace .Release.Namespace }}
{{- fail (printf "credentials.namespace is %q, which is the release namespace; set it to a dedicated namespace that holds credential Secrets only (§4.9)" $credentialsNamespace) }}
{{- end }}
{{- range $ns := .Values.agentNamespaces }}
{{- if eq $credentialsNamespace $ns.name }}
{{- fail (printf "credentials.namespace is %q, which is an agentNamespaces entry; set it to a dedicated namespace that holds credential Secrets only (§4.9)" $credentialsNamespace) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $credentialsNamespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: credentials
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lenny-credentials-no-pods
  namespace: {{ $credentialsNamespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: credentials
spec:
  hard:
    pods: "0"
{{- if .Values.tokenService.enabled }}
---
# spec: §4.9 "Credentials namespace." rule 3. One uncached get per read; an
# informer would serve stale values, so list and watch stay absent.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lenny-token-service-credentials
  namespace: {{ $credentialsNamespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: token-service
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lenny-token-service-credentials
  namespace: {{ $credentialsNamespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: token-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lenny-token-service-credentials
subjects:
  - kind: ServiceAccount
    name: lenny-token-service
    namespace: {{ .Release.Namespace }}
---
# spec: §4.9 "Credentials namespace." rule 4. The gateway writes Lenny-written
# Secrets without reading them, so get, list, watch, and patch stay absent.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lenny-gateway-credential-writer
  namespace: {{ $credentialsNamespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: gateway
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lenny-gateway-credential-writer
  namespace: {{ $credentialsNamespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lenny-gateway-credential-writer
subjects:
  - kind: ServiceAccount
    name: lenny-gateway
    namespace: {{ .Release.Namespace }}
{{- end }}
