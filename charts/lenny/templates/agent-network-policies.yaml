{{- /*
Agent-namespace NetworkPolicies (§13.2). Three policies are rendered
into every agent namespace declared in .Values.agentNamespaces:

  - default-deny-all: denies all ingress and egress for every pod.
  - allow-gateway-ingress: re-admits the gateway's gRPC control
    connection to each managed pod's adapter.
  - allow-pod-egress-base: re-admits each managed pod's egress to the
    gateway gRPC control channel and to cluster DNS.

The supplemental allow-pod-egress-llm-proxy policy applies only to
proxy-mode pools and is rendered with the LLM proxy.

The supplemental allow-pod-egress-otlp policy re-admits egress to the
OTLP trace collector and is rendered only when observability.otlpEndpoint
is set (§13.2 NET-046).
*/ -}}
{{- range $ns := .Values.agentNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ $ns.name }}
  labels:
    {{- include "lenny.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: {{ $ns.name }}
  labels:
    {{- include "lenny.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      lenny.dev/managed: "true"
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              lenny.dev/component: gateway
      ports:
        - port: {{ $.Values.adapter.grpcPort }}
          protocol: TCP
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pod-egress-base
  namespace: {{ $ns.name }}
  labels:
    {{- include "lenny.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      lenny.dev/managed: "true"
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              lenny.dev/component: gateway
      ports:
        - port: {{ $.Values.gateway.grpcPort }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              lenny.dev/component: coredns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pod-egress-llm-proxy
  namespace: {{ $ns.name }}
  labels:
    {{- include "lenny.labels" $ | nindent 4 }}
spec:
  # The lenny.dev/delivery-mode label is set only on pods in proxy-mode
  # pools, so this supplemental egress reaches the gateway LLM proxy
  # port for those pods alone; direct-mode pods cannot reach it (§13.2).
  podSelector:
    matchLabels:
      lenny.dev/managed: "true"
      lenny.dev/delivery-mode: proxy
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              lenny.dev/component: gateway
      ports:
        - port: {{ $.Values.gateway.llmProxyPort }}
          protocol: TCP
  policyTypes: [Egress]
{{- if $.Values.observability.otlpEndpoint }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pod-egress-otlp
  namespace: {{ $ns.name }}
  labels:
    {{- include "lenny.labels" $ | nindent 4 }}
spec:
  # Re-admits the §13.2 NET-046 agent-pod egress to the OTLP trace
  # collector. Rendered only when observability.otlpEndpoint is set.
  # When observability.otlpCIDR is set the collector runs outside the
  # cluster and the egress rule is an ipBlock CIDR; otherwise it
  # selects an in-cluster collector pod by namespace and pod label.
  podSelector:
    matchLabels:
      lenny.dev/managed: "true"
  egress:
    - to:
        {{- if $.Values.observability.otlpCIDR }}
        - ipBlock:
            cidr: {{ $.Values.observability.otlpCIDR | quote }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.observability.otlpNamespace | quote }}
          podSelector:
            matchLabels:
              {{ $.Values.observability.otlpPodLabel }}: {{ $.Values.observability.otlpPodLabelValue | quote }}
        {{- end }}
      ports:
        - port: {{ $.Values.observability.otlpPort }}
          protocol: TCP
  policyTypes: [Egress]
{{- end }}
{{- end }}
