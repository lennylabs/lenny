{{- /*
lenny-deployment-config-sync Job (§16.7 deployment-transition audit
emitter). After the gateway Deployment is Ready, the Job posts the
chart-rendered deployment-config.json to
POST /v1/admin/deployment/config-change so the gateway emits the §16.7
gateway.* / platform.* / deployment.* transition audit events. The
gateway sources `changed_by_sub` / `acknowledged_by_sub` from the
operator token this Job authenticates with — the operator-identity context
a gateway-runtime ConfigMap watch (F-17.2.9) could not supply, which is
why these events live on the install/upgrade write path.

Authentication reuses the bootstrap admin-API convention: when
bootstrap.auth.operatorTokenSecret.name is set the Job mounts that Secret
and passes the token as --bearer-file; otherwise, in dev mode, it uses the
dev-header path. The Job is a post-install/post-upgrade hook at weight 11,
after the lenny-bootstrap Job (weight 10), so the gateway is Ready and the
seed tenants exist before the floor-clamp fanout enumerates them.

The reconciliation is idempotent: the endpoint's release-revision replay
guard makes a retried hook a no-op, so the Job runs safely on every
install and upgrade. spec: §16.7 lines 672, 676, 677, 682; §17.2 line 86.
F-8.2.5, F-9.2.10, F-17.2.8.
*/ -}}
{{- if .Values.deploymentAudit.enabled }}
{{- $da := .Values.deploymentAudit -}}
{{- $b := .Values.bootstrap -}}
{{- $gateway := printf "http://lenny-gateway.%s.svc:%v" .Release.Namespace .Values.gateway.internalPort -}}
{{- $tokenSecret := $b.auth.operatorTokenSecret -}}
{{- $useBearer := and $tokenSecret $tokenSecret.name (ne $tokenSecret.name "") -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: lenny-deployment-config-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: deployment-config-sync
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "lenny.labels" . | nindent 8 }}
        lenny.dev/component: deployment-config-sync
    spec:
      {{- include "lenny.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: deployment-config-sync
          image: {{ include "lenny.componentImage" (dict "root" $ "name" "lenny-ctl" "image" $b.image) | quote }}
          imagePullPolicy: {{ $b.image.pullPolicy }}
          # The lenny-ctl image is distroless and has no shell, so the
          # container runs the binary directly. `--wait-timeout` polls the
          # gateway health endpoint before posting.
          args:
            - --api-url
            - "{{ $gateway }}"
            {{- if $useBearer }}
            - --bearer-file
            - /var/run/lenny/operator-token/{{ $tokenSecret.key }}
            {{- else }}
            - --dev-tenant
            - "{{ $b.auth.devTenant }}"
            - --dev-roles
            - "{{ $b.auth.devRoles }}"
            {{- end }}
            - admin
            - deployment
            - sync-config
            - --wait-timeout
            - "{{ int $da.waitTimeoutSeconds }}"
            - --from-file
            - /etc/lenny/deployment-config.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: deployment-config
              mountPath: /etc/lenny
              readOnly: true
            {{- if $useBearer }}
            - name: operator-token
              mountPath: /var/run/lenny/operator-token
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml $da.resources | nindent 12 }}
      volumes:
        - name: deployment-config
          configMap:
            name: lenny-deployment-config-sync
        {{- if $useBearer }}
        - name: operator-token
          secret:
            secretName: {{ $tokenSecret.name }}
        {{- end }}
{{- end }}
