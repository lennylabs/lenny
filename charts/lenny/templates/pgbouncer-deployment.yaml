{{- /*
The §12.3 in-cluster PgBouncer topology: a Deployment
(minimum 2 replicas) behind a ClusterIP Service, a PodDisruptionBudget,
a backend-connectivity readiness probe, and a pgbouncer_exporter
sidecar.

Rendering is gated on `pgbouncer.deploy` (default false), distinct from
`pgbouncer.enabled` (the connect_query ConfigMap). Cloud-managed
deployments leave `deploy` false and front Postgres with the provider's
proxy (§12.3); self-managed deployments set `deploy: true` to
have the chart run PgBouncer. The pod carries the
`lenny.dev/component: pgbouncer` label the §13.2 system NetworkPolicies
already select.

The container runs on a read-only root filesystem. It copies the
pgbouncer.ini from the ConfigMap (pgbouncer-config.yaml) into an emptyDir
at /etc/pgbouncer and then runs the image entrypoint, which writes the
DATABASE_URL user and password into the auth file there in the format
AUTH_TYPE names and leaves the copied pgbouncer.ini in place. Every fresh
server connection runs the §4.2 `__unset__` sentinel from the ini's
[databases] entry.

The render refuses a deployed PgBouncer that cannot serve a client: a
listen port other than the TCP 5432 the §13.2 policies admit, no upstream
Postgres for the [databases] entry, or no DATABASE_URL to authenticate
with. postgres.deploy supplies the last two from the CloudNativePG
lenny-postgres-rw Service and lenny-postgres-app Secret.

spec: §12.3 (PgBouncer Deployment topology, PDB, readiness
probe, pgbouncer_exporter sidecar); §13.2 (PgBouncer ingress on TCP
5432). F-12.3.10 / F-12.3.11 / F-17.9.25.
*/ -}}
{{- if .Values.pgbouncer.deploy }}
{{- $pb := .Values.pgbouncer }}
{{- if ne (int $pb.port) 5432 }}
{{- fail (printf "§13.2: pgbouncer.port must be 5432 when pgbouncer.deploy is true, because the PgBouncer and client NetworkPolicies admit TCP 5432; got %v" $pb.port) -}}
{{- end }}
{{- if not $pb.enabled }}
{{- fail "§12.3: pgbouncer.deploy requires pgbouncer.enabled, because the deployed PgBouncer runs on the pgbouncer.ini that pgbouncer.enabled renders" -}}
{{- end }}
{{- if not (include "lenny.pgbouncer.upstreamHost" .) }}
{{- fail "§12.3: pgbouncer.deploy requires an upstream Postgres; set pgbouncer.upstream.host, or postgres.deploy to route to the CloudNativePG lenny-postgres-rw Service" -}}
{{- end }}
{{- $dbURLRef := include "lenny.pgbouncer.databaseURLRef" . }}
{{- if not $dbURLRef }}
{{- fail "§12.3: pgbouncer.deploy requires a DATABASE_URL for PgBouncer's auth file; set pgbouncer.databaseURLSecret, or postgres.deploy to read the CloudNativePG lenny-postgres-app Secret" -}}
{{- end }}
{{- $dbURLSecret := index (splitList "/" $dbURLRef) 0 }}
{{- $dbURLKey := index (splitList "/" $dbURLRef) 1 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lenny-pgbouncer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: pgbouncer
spec:
  # §12.3 — minimum 2 replicas so a single pod loss does not
  # take the pooler down.
  replicas: {{ $pb.replicas }}
  selector:
    matchLabels:
      lenny.dev/component: pgbouncer
  template:
    metadata:
      labels:
        {{- include "lenny.labels" . | nindent 8 }}
        lenny.dev/component: pgbouncer
      annotations:
        {{- if $pb.exporter.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $pb.exporter.port | quote }}
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgbouncer
          image: "{{ $pb.image.repository }}:{{ $pb.image.tag }}"
          imagePullPolicy: {{ $pb.image.pullPolicy }}
          # The ConfigMap's pgbouncer.ini is copied into the writable
          # emptyDir, where the image entrypoint also writes the auth
          # file, before the entrypoint execs PgBouncer on it.
          #
          # spec: §12.3 "Connection pooling" Monitoring. The
          # pgbouncer_exporter sidecar runs SHOW commands on the admin
          # console, which PgBouncer opens only to a stats_users or
          # admin_users entry. The DATABASE_URL user is the one user the
          # auth file holds, so the command appends it to stats_users,
          # which grants the read-only SHOW commands and nothing else. The
          # user is parsed as the image entrypoint parses it for the auth
          # file: the text between the scheme and the last '@', up to the
          # first ':'. The append lands in [pgbouncer] because that section
          # ends the rendered pgbouncer.ini (pgbouncer-config.yaml).
          # The ConfigMap itself carries no stats_users entry, since the
          # user name lives only in the Secret. F-12.3.29.
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cp /etc/pgbouncer-config/pgbouncer.ini /etc/pgbouncer/pgbouncer.ini
              stats_user="$(printf '%s' "$DATABASE_URL" | sed -e 's#^[^:]*://##' -e 's#@[^@]*$##' -e 's#:.*##')"
              if [ -n "$stats_user" ]; then printf '\nstats_users = %s\n' "$stats_user" >> /etc/pgbouncer/pgbouncer.ini; fi
              exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
          ports:
            - name: pgbouncer
              containerPort: {{ $pb.port }}
          env:
            - name: POOL_MODE
              value: {{ $pb.poolMode | quote }}
            # The entrypoint writes the auth file in the format the
            # pgbouncer.ini auth_type reads.
            - name: AUTH_TYPE
              value: {{ $pb.authType | quote }}
            # §12.3 — DATABASE_URL carries the credentials the
            # entrypoint writes into the auth file, and the readiness
            # probe runs SELECT 1 through it to verify a backend
            # connection can be established.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $dbURLSecret }}
                  key: {{ $dbURLKey }}
          # §12.3 — readiness verifies backend Postgres
          # connectivity, not just process liveness.
          readinessProbe:
            exec:
              command:
                {{- toYaml $pb.readiness.command | nindent 16 }}
            periodSeconds: {{ $pb.readiness.periodSeconds }}
            failureThreshold: {{ $pb.readiness.failureThreshold }}
            timeoutSeconds: {{ $pb.readiness.timeoutSeconds }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # §4.2 / §12.3 — the pgbouncer.ini with the connect_query
            # __unset__ sentinel.
            - name: pgbouncer-config
              mountPath: /etc/pgbouncer-config
              readOnly: true
            # The writable config directory: the copied pgbouncer.ini
            # and the auth file the entrypoint writes.
            - name: pgbouncer-run
              mountPath: /etc/pgbouncer
          resources:
            {{- toYaml $pb.resources | nindent 12 }}
        {{- if $pb.exporter.enabled }}
        # §12.3 — pgbouncer_exporter sidecar. Exposes
        # pgbouncer_pools_client_maxwait_seconds (the §16.5
        # PgBouncerPoolSaturated alert numerator) and the pool-utilization
        # gauges. F-12.3.11.
        #
        # The exporter reads PgBouncer's admin console: the virtual
        # pgbouncer database on this pod's own listener, logged in as the
        # DATABASE_URL user the PgBouncer command adds to stats_users. The
        # command keeps DATABASE_URL's scheme and credentials, replaces
        # everything after the last '@' with 127.0.0.1, pgbouncer.port, and
        # the pgbouncer database, and disables TLS, because the console
        # connection never leaves the pod and PgBouncer serves no client
        # TLS. It passes the result through the exporter's
        # PGBOUNCER_EXPORTER_CONNECTION_STRING variable so the password
        # stays out of the process arguments. F-12.3.29.
        - name: pgbouncer-exporter
          image: "{{ $pb.exporter.image.repository }}:{{ $pb.exporter.image.tag }}"
          imagePullPolicy: {{ $pb.exporter.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              PGBOUNCER_EXPORTER_CONNECTION_STRING="$(printf '%s' "$DATABASE_URL" | sed -e 's#@[^@]*$#@127.0.0.1:{{ $pb.port }}/pgbouncer?sslmode=disable#')"
              export PGBOUNCER_EXPORTER_CONNECTION_STRING
              exec /bin/pgbouncer_exporter --web.listen-address=:{{ $pb.exporter.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $dbURLSecret }}
                  key: {{ $dbURLKey }}
          ports:
            - name: metrics
              containerPort: {{ $pb.exporter.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml $pb.exporterResources | nindent 12 }}
        {{- end }}
      {{- /* §12.3 — spread replicas across nodes so a single
         node loss never removes the whole pooler tier. */ -}}
      {{- if ge (int $pb.replicas) 2 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              lenny.dev/component: pgbouncer
      {{- end }}
      volumes:
        - name: pgbouncer-config
          configMap:
            name: {{ $pb.configMapName }}
        - name: pgbouncer-run
          emptyDir: {}
---
# §12.3 — ClusterIP Service. PgBouncer is stateless, so multiple
# replicas behind the Service provide transparent failover.
apiVersion: v1
kind: Service
metadata:
  name: lenny-pgbouncer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: pgbouncer
spec:
  selector:
    lenny.dev/component: pgbouncer
  ports:
    - name: pgbouncer
      port: {{ $pb.port }}
      targetPort: pgbouncer
    {{- if $pb.exporter.enabled }}
    - name: metrics
      port: {{ $pb.exporter.port }}
      targetPort: metrics
    {{- end }}
---
# §12.3 — PodDisruptionBudget. minAvailable: 1 at 2 replicas, or
# maxUnavailable: 1 at 3+ replicas, so a rolling update or node drain
# never terminates every PgBouncer replica at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lenny-pgbouncer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
    lenny.dev/component: pgbouncer
spec:
  {{- if ge (int $pb.replicas) 3 }}
  maxUnavailable: 1
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      lenny.dev/component: pgbouncer
{{- end }}
