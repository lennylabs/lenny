{{- /*
lenny-preflight pre-install/pre-upgrade Job (§17.9). Runs the
admission-plane checks — admission-webhook inventory and phase-stamp
consistency — before the install proceeds; a non-zero exit aborts the
install fail-closed.

The Job runs at hook-weight -10, after the phase-stamp ConfigMap (-20)
so the phase-stamp consistency check can read it, and before the
webhook Deployments. Its ServiceAccount and RBAC render at -15 so they
exist when the Job pod starts. The RBAC is read-only: list
ValidatingWebhookConfigurations cluster-wide and get ConfigMaps in the
release namespace.
*/ -}}
{{- /*
preflight.enabled: false (§17.6 line 532) skips the whole admission-plane
preflight Job for air-gapped or constrained installs. The skip is surfaced
in the install NOTES with the spec's verbatim warning. The post-upgrade
CRD-validate Job renders independently so the stale-CRD catch-net stays.
F-17.6.11.
*/ -}}
{{- if .Values.preflight.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lenny-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lenny-preflight
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "list"]
  # The §13.2 NetworkPolicy parity audits list NetworkPolicies and
  # read the gateway Deployment's SPIFFE / SA-token-audience
  # annotations cluster-wide.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["list"]
  # §13.1 line 23 host-sharing audit covers Lenny-managed Deployments,
  # DaemonSets, and Jobs across the release and agent namespaces, and the
  # §13.1 line 25 credential-fsGroup audit scans the agent Pods the
  # controller spawns in the agent namespaces — both list cluster-wide so
  # the scan is not pinned to the release namespace. F-13.1.7 / F-13.1.4.
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # §15.5 line 2438 / §17.9 conversion-webhook-availability check reads
  # the lenny-crd-conversion Service to confirm the CRD conversion webhook
  # is reachable; the matching Deployment is covered by the apps/list rule
  # above. F-15.5.3 / F-17.2.4.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list"]
  # §10 line 443 crd-schema-version check reads each installed Lenny CRD's
  # lenny.dev/schema-version annotation. F-15.5.12. The §10.3 line 304
  # cert-manager-version check reuses this grant to read the cluster-scoped
  # certificates.cert-manager.io CRD's version label. F-10.3.12.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  # §5.3 line 676 RuntimeClass presence check (cluster-scoped objects).
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list"]
  # §5.2 line 516 node-drain-timeout warning lists pools cluster-wide.
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxtemplates"]
    verbs: ["list"]
  # §17.6 lines 501-502 namespace-resourcequota / namespace-limitrange
  # checks read each agent namespace and its ResourceQuota / LimitRange
  # objects. The namespace `get` distinguishes a not-yet-created
  # namespace (fresh install) from an existing one missing governance.
  # F-17.6.1. The §13.2 NET-038 ingress-controller advisory reuses the
  # namespace `get` and the pods `list` above to confirm the Ingress
  # controller namespace exists and runs a labeled controller pod.
  # F-13.2.8.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["list"]
  # §17.6 line 519 lenny-ops-sa RBAC audit runs a SubjectAccessReview for
  # the lenny-ops SA against each canonical §25.4 rule. F-17.6.1.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  # §17.6 line 520 ops.ingress ClusterIssuer advisory reads the
  # cert-manager ClusterIssuer named by the ops.ingress annotation. The
  # rule is harmless when cert-manager is absent (the read 404s and the
  # advisory fires). F-17.6.1.
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lenny-preflight
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lenny-preflight
subjects:
  - kind: ServiceAccount
    name: lenny-preflight
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lenny-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  # Workload (Deployment/DaemonSet/Job) and Pod list permissions moved to
  # the ClusterRole above so the §13.1 host-sharing and credential-fsGroup
  # audits reach the agent namespaces. F-13.1.7 / F-13.1.4.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lenny-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lenny-preflight
subjects:
  - kind: ServiceAccount
    name: lenny-preflight
    namespace: {{ .Release.Namespace }}
---
{{ $accepted := list -}}
{{- range $flag, $on := .Values.acceptFeatureFlagDowngrade }}
{{-   if $on }}{{ $accepted = append $accepted $flag }}{{ end }}
{{- end }}
{{- /* §17.9.2 line 1372 — preflight.skipNetworkProbes drops the
   backend-reachability probes (MinIO SSE, BYO-Redis maxmemory, OTLP TLS,
   ops-admin internal-TLS, cloud-pooler sentinel) for air-gapped installs.
   The MinIO SSE probe is the only consumer of the lenny-datastore-conn
   MinIO credentials, so when probes are skipped the credential env below
   is unused. On a fresh install the lenny-datastore-conn Secret renders
   after this pre-install hook, so mounting a non-optional secretKeyRef for
   a probe that will not run would block the preflight pod with
   CreateContainerConfigError ("secret not found") and stall the Job until
   activeDeadlineSeconds. Gate the env mount on the probes actually running.
   F-17.9.11. */ -}}
{{- $skipNetworkProbes := .Values.preflight.skipNetworkProbes | default false -}}
{{- $minio := .Values.minio | default dict -}}
{{- $hasMinio := and $minio $minio.endpoint (ne $minio.endpoint "") (not $skipNetworkProbes) -}}
{{- $tls := $minio.tls | default dict -}}
{{- $useSSL := true -}}
{{- if hasKey ($tls | default dict) "enabled" -}}
{{- $useSSL = $tls.enabled -}}
{{- end -}}
{{- /* §17.9.3 Postgres "Cloud-Managed Backends" — postgres.connectionPooler
   selects how Lenny reaches Postgres. "pgbouncer" is the in-cluster
   default (sentinel via connect_query). "external" signals an RDS
   Proxy / Cloud SQL Auth Proxy / Azure PgBouncer in front of Postgres,
   which cannot enforce the connect_query sentinel — preflight then
   verifies the per-transaction lenny_tenant_guard trigger
   (CloudPoolerSentinelDefense check, §17.6 line 488). Surfaced here so
   the preflight binary gets the value via --connection-pooler. */ -}}
{{- $connectionPooler := include "lenny.connectionPooler" . -}}
{{- /*
§5.3 line 676 RuntimeClass requirements. The install requires the
RuntimeClasses backing the isolation profiles its pods will use. Source
them from the chart's enabled runtimeClasses.profiles entries, skipping:
  - dev mode, where §5.3 falls back to standard (runc) and no gVisor/Kata
    RuntimeClass is required (a stock kind/minikube cluster has neither);
  - the runtimeClasses.create case, where the chart renders the
    RuntimeClass objects itself during install, so they do not yet exist
    at this pre-install hook and must not be required here.
*/ -}}
{{- $rcReqs := list -}}
{{- $rc := .Values.runtimeClasses | default dict -}}
{{- $global := .Values.global | default dict -}}
{{- /* §12.4 BYO-Redis maxmemory-policy audit. Opt-in: the cloud
       Terraform sets noeviction natively, so only the self-managed
       profile that brings its own Redis needs the preflight probe.
       F-12.4.15. */ -}}
{{- $redis := .Values.redis | default dict -}}
{{- $checkRedis := and .Values.preflight $.Values.preflight.checkRedisMaxmemoryPolicy $redis.url (ne ($redis.url | toString) "") (not $skipNetworkProbes) -}}
{{- /* §17.6 line 488 — the cloud-pooler sentinel defense connects to
       Postgres to verify the lenny_tenant_guard trigger when the pooler
       is external. The DSN comes from the lenny-datastore-conn Secret,
       wired only when postgres.dsn is supplied. On a fresh install the
       Secret renders after this pre-install hook, so the env var carries
       optional:true and the binary defers an unwired probe to the
       gateway's runtime LENNY_POOLER_MODE defense. F-17.9.2. */ -}}
{{- $pgPooler := .Values.postgres | default dict -}}
{{- $checkPoolerSentinel := and (eq $connectionPooler "external") $pgPooler.dsn (ne ($pgPooler.dsn | toString) "") (not $skipNetworkProbes) -}}
{{- if and (not $rc.create) (not $global.devMode) -}}
{{-   range $profile, $cfg := ($rc.profiles | default dict) -}}
{{-     if and $cfg $cfg.enabled $cfg.name -}}
{{-       $rcReqs = append $rcReqs (printf "%s=%s" $profile $cfg.name) -}}
{{-     end -}}
{{-   end -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: lenny-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  # spec: §17.6 line 534 — the preflight Job runs to completion within
  # activeDeadlineSeconds; a slow API server is bounded so a hung check
  # does not block the install indefinitely. Deployers raise the bound
  # via preflight.timeoutSeconds.
  activeDeadlineSeconds: {{ int (.Values.preflight.timeoutSeconds | default 120) }}
  template:
    metadata:
      labels:
        {{- include "lenny.labels" . | nindent 8 }}
    spec:
      serviceAccountName: lenny-preflight
      {{- include "lenny.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preflight
          image: {{ include "lenny.componentImage" (dict "root" $ "name" "lenny-preflight" "image" .Values.preflight.image) | quote }}
          imagePullPolicy: {{ .Values.preflight.image.pullPolicy }}
          args:
            - --namespace={{ .Release.Namespace }}
            # §13.1 lines 23/25 — the host-sharing and credential-fsGroup
            # audits cover the agent namespaces in addition to the release
            # namespace. F-13.1.7 / F-13.1.4.
            {{- $agentNS := list }}
            {{- range .Values.agentNamespaces }}{{ $agentNS = append $agentNS .name }}{{ end }}
            - --agent-namespaces={{ join "," $agentNS }}
            {{- /* spec: §13.1 line 7 — keep the agent-pod fsGroup audit in
                   lock-step with the operator-tunable lenny-cred-readers
                   GID the controller stamps. F-13.1.16. */}}
            - --cred-readers-gid={{ ((.Values.security | default dict).podUIDs | default dict).credReadersGID | default 65534 }}
            - --feature-llm-proxy={{ .Values.features.llmProxy }}
            - --feature-drain-readiness={{ .Values.features.drainReadiness }}
            - --feature-compliance={{ .Values.features.compliance }}
            # §17.2 line 56 — lenny-registry-digest is fail-closed and
            # mandatory for air-gap installs (§25.8); track it in the
            # preflight expected set when digest pinning is required.
            - --feature-registry-digest={{ .Values.platform.registry.requireDigest }}
            # §5.3 line 669 — image provenance verification is a
            # prerequisite for production and staging deployments. A
            # production-or-staging install with cosign disabled gets a
            # non-blocking WARNING (F-5.3.5).
            - --feature-cosign-verify={{ .Values.imageVerification.cosign.enabled }}
            - --environment={{ .Values.environment | default "dev" }}
            # §16.9 R8 — feed monitoring.format so the preflight reports a
            # non-blocking advisory when the format selects the Prometheus
            # Operator CRDs but they are absent (chart falls back to a
            # ConfigMap). F-16.9.4.
            - --monitoring-format={{ .Values.monitoring.format | default "prometheusrule" }}
            # §25.4 lines 1462-1470 — the non-blocking prometheus-reachability
            # check probes ops.prometheus.url and emits a tier-specific
            # advisory (INFO at Tier 1, WARN at Tier 2/3). The Tier 2/3 WARN is
            # suppressed when monitoring.acknowledgeNoPrometheus is set.
            # F-25.4.25.
            - --prometheus-url={{ .Values.ops.prometheus.url | default "" }}
            - --platform-tier={{ .Values.global.deploymentTier | default "tier1" }}
            - --acknowledge-no-prometheus={{ .Values.monitoring.acknowledgeNoPrometheus | default false }}
            - --accept-downgrade={{ join "," $accepted }}
            - --compliance-profile={{ .Values.complianceProfile | default "" }}
            # §10.3 lines 316, 334 (NET-064) uniqueness inputs. The
            # collision check skips an empty value, so the unset
            # saTokenAudience case (chart default) passes preflight;
            # production deployments override both. F-10.3.5 / F-10.3.6.
            - --spiffe-trust-domain={{ .Values.global.spiffeTrustDomain | default "" }}
            - --sa-token-audience={{ .Values.global.saTokenAudience | default "" }}
            # spec: §17.9.3 / §17.6 line 488 — when "external" the
            # cloud-pooler sentinel defense check verifies the
            # lenny_tenant_guard per-transaction trigger over the
            # --postgres-dsn connection below.
            - --connection-pooler={{ $connectionPooler }}
            {{- if $checkPoolerSentinel }}
            # §17.6 line 488 — Kubernetes expands $(LENNY_POSTGRES_DSN) from
            # the env below. An undefined optional secret leaves the token
            # unexpanded; the binary treats a "$(" value as unwired and
            # defers to the gateway runtime defense. F-17.9.2.
            - --postgres-dsn=$(LENNY_POSTGRES_DSN)
            {{- end }}
            {{- if $rcReqs }}
            - --required-runtime-classes={{ join "," $rcReqs }}
            {{- end }}
            {{- if $hasMinio }}
            - --minio-endpoint={{ $minio.endpoint }}
            - --minio-bucket={{ $minio.bucket }}
            - --minio-use-ssl={{ $useSSL }}
            {{- end }}
            {{- /* §17.9.4 cloud object-storage lifecycle audit. Skipped
            for provider=minio (the post-install Job configures it); for
            s3/gcs/azure the preflight validates versioning + lifecycle
            rules via the provider SDK. F-17.9.3. */}}
            - --object-storage-provider={{ .Values.objectStorage.provider | default "minio" }}
            - --object-storage-bucket={{ .Values.objectStorage.bucket | default "" }}
            - --object-storage-region={{ .Values.objectStorage.region | default "" }}
            {{- /* §17.6 line 517 — a production install with no SIEM
            endpoint configured gets a non-blocking audit-integrity
            warning. F-17.6.1. */}}
            - --siem-endpoint={{ .Values.audit.siem.endpoint | default "" }}
            {{- /* §17.6 lines 519-521 — lenny-ops-sa RBAC audit, the
            ops.ingress ClusterIssuer advisory, and the monitoring-namespace
            advisory. The monitoring pod label reuses the existing
            ops.networkPolicy.prometheusPodLabel (key=value). F-17.6.1. */}}
            - --ops-service-account=system:serviceaccount:{{ .Release.Namespace }}:lenny-ops-sa
            - --ops-ingress-cluster-issuer={{ index (.Values.ops.ingress.annotations | default dict) "cert-manager.io/cluster-issuer" | default "" }}
            - --monitoring-namespace={{ .Values.monitoring.namespace | default "" }}
            - --monitoring-pod-label={{ .Values.ops.networkPolicy.prometheusPodLabel.key }}={{ .Values.ops.networkPolicy.prometheusPodLabel.value }}
            {{- /* §13.2 line 292 NET-038 — validate that the
            ingressControllerNamespace exists and runs a pod carrying the
            configured controllerPodLabel, so the allow-gateway-ingress
            NetworkPolicy actually admits external HTTPS to the gateway.
            Non-blocking advisory. F-13.2.8. */}}
            - --ingress-controller-namespace={{ .Values.ingressControllerNamespace | default "" }}
            - --ingress-controller-pod-label-key={{ .Values.ingress.controllerPodLabel.key }}
            - --ingress-controller-pod-label-value={{ .Values.ingress.controllerPodLabel.value }}
            {{- if $checkRedis }}
            # §12.4 — verify the BYO Redis enforces maxmemory-policy=noeviction
            # so the billing stream and per-tenant counters cannot evict.
            # The URL carries AUTH/TLS per §12.4. F-12.4.15.
            - --redis-url={{ $redis.url }}
            {{- end }}
            # §27.2 playground-config preflight inputs (F-27.2.2 /
            # F-27.2.4 / F-27.2.5 / F-27.2.6 / F-27.9.3). The
            # values flow through even when playground.enabled is
            # false; the check short-circuits to a pass in that case.
            - --playground-enabled={{ .Values.playground.enabled }}
            - --playground-auth-mode={{ .Values.playground.authMode }}
            - --playground-dev-tenant-id={{ .Values.playground.devTenantId }}
            - --playground-multi-tenant={{ eq .Values.tenancy.mode "multi" }}
            - --playground-global-dev-mode={{ .Values.global.devMode }}
            - --playground-acknowledge-api-key-mode={{ .Values.playground.acknowledgeApiKeyMode }}
            # §13.2 NET-040 / NET-022 — validate the kube-apiserver Service
            # ClusterIP falls within kubeApiServerCIDR and the cluster
            # service/pod CIDR exclusions match the discovered cluster
            # addressing. F-13.2.13.
            - --kube-apiserver-cidr={{ .Values.kubeApiServerCIDR }}
            - --exclude-cluster-service-cidr={{ .Values.egressCIDRs.excludeClusterServiceCIDR }}
            - --exclude-cluster-pod-cidr={{ .Values.egressCIDRs.excludeClusterPodCIDR }}
            # §13.2 OTLP-068 — when OTLP export runs over TLS, reject an
            # http:// scheme and probe the collector TLS handshake. The
            # probe validates the collector certificate against the
            # cluster-wide trust bundle (the spec's primary trust
            # mechanism). F-13.2.9.
            - --otlp-endpoint={{ .Values.observability.otlpEndpoint }}
            - --otlp-tls-enabled={{ .Values.observability.otlpTlsEnabled }}
            # §25.4 NET-070 — when the lenny-ops -> gateway admin-API link
            # runs over TLS (ops.tls.internalEnabled), probe the gateway
            # internal-TLS handshake and verify the certificate SAN covers
            # the lenny-gateway ClusterIP hostname. Skipped under the
            # acknowledged plaintext path. F-25.4.19.
            - --ops-admin-tls-internal-enabled={{ .Values.ops.tls.internalEnabled }}
            {{- if .Values.ops.tls.internalEnabled }}
            - --ops-admin-tls-endpoint=lenny-gateway.{{ .Release.Namespace }}.svc:{{ .Values.gateway.internalTLSPort }}
            - --ops-admin-tls-san-host=lenny-gateway.{{ .Release.Namespace }}.svc
            {{- end }}
            # §12.9 line 1050 — T2 storage-layer volume-encryption baseline.
            # global.devMode exempts the check; preflight.attestVolumeEncryption
            # carries the operator attestation for BYO Postgres/Redis volumes
            # the chart cannot probe in-cluster.
            - --dev-mode={{ .Values.global.devMode }}
            - --attest-volume-encryption={{ .Values.preflight.attestVolumeEncryption }}
            # §4.9 — the credential-delivery scan lists every SandboxTemplate
            # pool definition and fails the multi-tenant install when a pool
            # carries a forbidden deliveryMode combination (direct + standard,
            # proxy + spiffeBinding: disabled, or proxy + provider-direct). It
            # enforces only when tenancy.mode is multi.
            - --tenancy-mode={{ .Values.tenancy.mode }}
            # §10.3 line 304 / F-10.3.12: when the cert-manager-backed mTLS
            # PKI is enabled, the preflight requires cert-manager >= v1.12.0.
            # Set certmanager.enabled=false alongside mtls.enabled=false for
            # a mesh-managed install so the prerequisite is not enforced.
            - --certmanager-enabled={{ .Values.certmanager.enabled }}
            # §17.9.2 line 1372 — the airgap answer file sets
            # preflight.skipNetworkProbes so the backend-reachability probes
            # (MinIO SSE, BYO-Redis maxmemory, OTLP TLS handshake, ops-admin
            # internal-TLS handshake) are dropped while the cluster-API checks
            # still run. F-17.9.11.
            - --skip-network-probes={{ $skipNetworkProbes }}
          {{- if or $hasMinio $checkPoolerSentinel }}
          env:
            {{- if $hasMinio }}
            - name: MINIO_ACCESS_KEY_ENV
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: minio-access-key
            - name: MINIO_SECRET_KEY_ENV
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: minio-secret-key
            {{- end }}
            {{- if $checkPoolerSentinel }}
            # §17.6 line 488 cloud-pooler sentinel defense Postgres DSN.
            # optional:true so a fresh install (Secret not yet created at
            # this pre-install hook) still starts; the binary defers the
            # unwired probe to the gateway runtime defense. F-17.9.2.
            - name: LENNY_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: postgres-dsn
                  optional: true
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.preflight.resources | nindent 12 }}
{{- end }}
