{{- /*
lenny-preflight pre-install/pre-upgrade Job (§17.9). Runs the
admission-plane checks — admission-webhook inventory and phase-stamp
consistency — before the install proceeds; a non-zero exit aborts the
install fail-closed.

The Job runs at hook-weight -10, after the phase-stamp ConfigMap (-20)
so the phase-stamp consistency check can read it, and before the
webhook Deployments. Its ServiceAccount and RBAC render at -15 so they
exist when the Job pod starts. The RBAC is read-only: list
ValidatingWebhookConfigurations cluster-wide and get ConfigMaps in the
release namespace.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lenny-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lenny-preflight
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "list"]
  # The §13.2 NetworkPolicy parity audits list NetworkPolicies and
  # read the gateway Deployment's SPIFFE / SA-token-audience
  # annotations cluster-wide.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["list"]
  # §13.1 line 23 host-sharing audit covers Lenny-managed Deployments,
  # DaemonSets, and Jobs across the release and agent namespaces, and the
  # §13.1 line 25 credential-fsGroup audit scans the agent Pods the
  # controller spawns in the agent namespaces — both list cluster-wide so
  # the scan is not pinned to the release namespace. F-13.1.7 / F-13.1.4.
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # §15.5 line 2438 / §17.9 conversion-webhook-availability check reads
  # the lenny-crd-conversion Service to confirm the CRD conversion webhook
  # is reachable; the matching Deployment is covered by the apps/list rule
  # above. F-15.5.3 / F-17.2.4.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list"]
  # §10 line 443 crd-schema-version check reads each installed Lenny CRD's
  # lenny.dev/schema-version annotation. F-15.5.12. The §10.3 line 304
  # cert-manager-version check reuses this grant to read the cluster-scoped
  # certificates.cert-manager.io CRD's version label. F-10.3.12.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  # §5.3 line 676 RuntimeClass presence check (cluster-scoped objects).
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list"]
  # §5.2 line 516 node-drain-timeout warning lists pools cluster-wide.
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxtemplates"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lenny-preflight
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lenny-preflight
subjects:
  - kind: ServiceAccount
    name: lenny-preflight
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lenny-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  # Workload (Deployment/DaemonSet/Job) and Pod list permissions moved to
  # the ClusterRole above so the §13.1 host-sharing and credential-fsGroup
  # audits reach the agent namespaces. F-13.1.7 / F-13.1.4.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lenny-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lenny-preflight
subjects:
  - kind: ServiceAccount
    name: lenny-preflight
    namespace: {{ .Release.Namespace }}
---
{{- $accepted := list -}}
{{- range $flag, $on := .Values.acceptFeatureFlagDowngrade }}
{{-   if $on }}{{ $accepted = append $accepted $flag }}{{ end }}
{{- end }}
{{- $minio := .Values.minio | default dict -}}
{{- $hasMinio := and $minio $minio.endpoint (ne $minio.endpoint "") -}}
{{- $tls := $minio.tls | default dict -}}
{{- $useSSL := true -}}
{{- if hasKey ($tls | default dict) "enabled" -}}
{{- $useSSL = $tls.enabled -}}
{{- end -}}
{{- /* §17.9.3 Postgres "Cloud-Managed Backends" — postgres.connectionPooler
   selects how Lenny reaches Postgres. "pgbouncer" is the in-cluster
   default (sentinel via connect_query). "external" signals an RDS
   Proxy / Cloud SQL Auth Proxy / Azure PgBouncer in front of Postgres,
   which cannot enforce the connect_query sentinel — preflight then
   verifies the per-transaction lenny_tenant_guard trigger
   (CloudPoolerSentinelDefense check, §17.6 line 488). Surfaced here so
   the preflight binary gets the value via --connection-pooler. */ -}}
{{- $connectionPooler := include "lenny.connectionPooler" . -}}
{{- /*
§5.3 line 676 RuntimeClass requirements. The install requires the
RuntimeClasses backing the isolation profiles its pods will use. Source
them from the chart's enabled runtimeClasses.profiles entries, skipping:
  - dev mode, where §5.3 falls back to standard (runc) and no gVisor/Kata
    RuntimeClass is required (a stock kind/minikube cluster has neither);
  - the runtimeClasses.create case, where the chart renders the
    RuntimeClass objects itself during install, so they do not yet exist
    at this pre-install hook and must not be required here.
*/ -}}
{{- $rcReqs := list -}}
{{- $rc := .Values.runtimeClasses | default dict -}}
{{- $global := .Values.global | default dict -}}
{{- /* §12.4 BYO-Redis maxmemory-policy audit. Opt-in: the cloud
       Terraform sets noeviction natively, so only the self-managed
       profile that brings its own Redis needs the preflight probe.
       F-12.4.15. */ -}}
{{- $redis := .Values.redis | default dict -}}
{{- $checkRedis := and .Values.preflight $.Values.preflight.checkRedisMaxmemoryPolicy $redis.url (ne ($redis.url | toString) "") -}}
{{- if and (not $rc.create) (not $global.devMode) -}}
{{-   range $profile, $cfg := ($rc.profiles | default dict) -}}
{{-     if and $cfg $cfg.enabled $cfg.name -}}
{{-       $rcReqs = append $rcReqs (printf "%s=%s" $profile $cfg.name) -}}
{{-     end -}}
{{-   end -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: lenny-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  # spec: §17.6 line 534 — the preflight Job runs to completion within
  # activeDeadlineSeconds; a slow API server is bounded so a hung check
  # does not block the install indefinitely. Deployers raise the bound
  # via preflight.timeoutSeconds.
  activeDeadlineSeconds: {{ int (.Values.preflight.timeoutSeconds | default 120) }}
  template:
    metadata:
      labels:
        {{- include "lenny.labels" . | nindent 8 }}
    spec:
      serviceAccountName: lenny-preflight
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preflight
          image: "{{ .Values.preflight.image.repository }}:{{ .Values.preflight.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.preflight.image.pullPolicy }}
          args:
            - --namespace={{ .Release.Namespace }}
            # §13.1 lines 23/25 — the host-sharing and credential-fsGroup
            # audits cover the agent namespaces in addition to the release
            # namespace. F-13.1.7 / F-13.1.4.
            {{- $agentNS := list }}
            {{- range .Values.agentNamespaces }}{{ $agentNS = append $agentNS .name }}{{ end }}
            - --agent-namespaces={{ join "," $agentNS }}
            - --feature-llm-proxy={{ .Values.features.llmProxy }}
            - --feature-drain-readiness={{ .Values.features.drainReadiness }}
            - --feature-compliance={{ .Values.features.compliance }}
            # §17.2 line 56 — lenny-registry-digest is fail-closed and
            # mandatory for air-gap installs (§25.8); track it in the
            # preflight expected set when digest pinning is required.
            - --feature-registry-digest={{ .Values.platform.registry.requireDigest }}
            # §5.3 line 669 — image provenance verification is a
            # prerequisite for production and staging deployments. A
            # production-or-staging install with cosign disabled gets a
            # non-blocking WARNING (F-5.3.5).
            - --feature-cosign-verify={{ .Values.imageVerification.cosign.enabled }}
            - --environment={{ .Values.environment | default "dev" }}
            - --accept-downgrade={{ join "," $accepted }}
            - --compliance-profile={{ .Values.complianceProfile | default "" }}
            # §10.3 lines 316, 334 (NET-064) uniqueness inputs. The
            # collision check skips an empty value, so the unset
            # saTokenAudience case (chart default) passes preflight;
            # production deployments override both. F-10.3.5 / F-10.3.6.
            - --spiffe-trust-domain={{ .Values.global.spiffeTrustDomain | default "" }}
            - --sa-token-audience={{ .Values.global.saTokenAudience | default "" }}
            # spec: §17.9.3 / §17.6 line 488 — when "external" the
            # CloudPoolerSentinelDefense check verifies the
            # lenny_tenant_guard per-transaction trigger.
            - --connection-pooler={{ $connectionPooler }}
            {{- if $rcReqs }}
            - --required-runtime-classes={{ join "," $rcReqs }}
            {{- end }}
            {{- if $hasMinio }}
            - --minio-endpoint={{ $minio.endpoint }}
            - --minio-bucket={{ $minio.bucket }}
            - --minio-use-ssl={{ $useSSL }}
            {{- end }}
            {{- if $checkRedis }}
            # §12.4 — verify the BYO Redis enforces maxmemory-policy=noeviction
            # so the billing stream and per-tenant counters cannot evict.
            # The URL carries AUTH/TLS per §12.4. F-12.4.15.
            - --redis-url={{ $redis.url }}
            {{- end }}
            # §27.2 playground-config preflight inputs (F-27.2.2 /
            # F-27.2.4 / F-27.2.5 / F-27.2.6 / F-27.9.3). The
            # values flow through even when playground.enabled is
            # false; the check short-circuits to a pass in that case.
            - --playground-enabled={{ .Values.playground.enabled }}
            - --playground-auth-mode={{ .Values.playground.authMode }}
            - --playground-dev-tenant-id={{ .Values.playground.devTenantId }}
            - --playground-multi-tenant={{ eq .Values.tenancy.mode "multi" }}
            - --playground-global-dev-mode={{ .Values.global.devMode }}
            - --playground-acknowledge-api-key-mode={{ .Values.playground.acknowledgeApiKeyMode }}
            # §13.2 NET-040 / NET-022 — validate the kube-apiserver Service
            # ClusterIP falls within kubeApiServerCIDR and the cluster
            # service/pod CIDR exclusions match the discovered cluster
            # addressing. F-13.2.13.
            - --kube-apiserver-cidr={{ .Values.kubeApiServerCIDR }}
            - --exclude-cluster-service-cidr={{ .Values.egressCIDRs.excludeClusterServiceCIDR }}
            - --exclude-cluster-pod-cidr={{ .Values.egressCIDRs.excludeClusterPodCIDR }}
            # §13.2 OTLP-068 — when OTLP export runs over TLS, reject an
            # http:// scheme and probe the collector TLS handshake. The
            # probe validates the collector certificate against the
            # cluster-wide trust bundle (the spec's primary trust
            # mechanism). F-13.2.9.
            - --otlp-endpoint={{ .Values.observability.otlpEndpoint }}
            - --otlp-tls-enabled={{ .Values.observability.otlpTlsEnabled }}
            # §12.9 line 1050 — T2 storage-layer volume-encryption baseline.
            # global.devMode exempts the check; preflight.attestVolumeEncryption
            # carries the operator attestation for BYO Postgres/Redis volumes
            # the chart cannot probe in-cluster.
            - --dev-mode={{ .Values.global.devMode }}
            - --attest-volume-encryption={{ .Values.preflight.attestVolumeEncryption }}
            # §10.3 line 304 / F-10.3.12: when the cert-manager-backed mTLS
            # PKI is enabled, the preflight requires cert-manager >= v1.12.0.
            # Set certmanager.enabled=false alongside mtls.enabled=false for
            # a mesh-managed install so the prerequisite is not enforced.
            - --certmanager-enabled={{ .Values.certmanager.enabled }}
          {{- if $hasMinio }}
          env:
            - name: MINIO_ACCESS_KEY_ENV
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: minio-access-key
            - name: MINIO_SECRET_KEY_ENV
              valueFrom:
                secretKeyRef:
                  name: lenny-datastore-conn
                  key: minio-secret-key
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.preflight.resources | nindent 12 }}
