{{- /*
lenny-sandboxclaim-guard ValidatingAdmissionWebhook (§17.2 item 7,
§4.6.1 ADR-007). Enforces per-pod claim uniqueness on CREATE against
SandboxClaim resources: rejects a second non-terminal claim for the
same .spec.sandboxRef. PATCH and PUT are admitted without inspection
and are not registered here. Scoped to agent namespaces; fail-closed.
*/ -}}
{{- if .Values.admissionWebhooks.enabled }}
{{- include "lenny.admissionWebhookWorkload" (dict "root" $ "name" "lenny-sandboxclaim-guard") }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: lenny-sandboxclaim-guard
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/lenny-sandboxclaim-guard
webhooks:
  - name: sandboxclaim-guard.lenny.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: lenny.dev/agent-namespace
          operator: In
          values: ["true"]
    rules:
      - apiGroups: ["lenny.dev"]
        apiVersions: ["v1"]
        resources: ["sandboxclaims"]
        operations: ["CREATE"]
        scope: Namespaced
    clientConfig:
      service:
        name: lenny-sandboxclaim-guard
        namespace: {{ .Release.Namespace }}
        path: /sandboxclaim-guard
        port: 443
{{- end }}
