{{- /*
RBAC for the lenny-webhook ServiceAccount shared by every admission
webhook Deployment (§17.2). The lenny-podclaim-guard route reads
the referenced AgentPod phase and sibling PodClaims during
admission, so the ServiceAccount needs read access to those CRDs. The
lenny-podset-deletion-guard route lists the PodSets
that reference a PodSet on DELETE (§10.5), so it also
needs read access to podsets. The label-immutability route
reads only the AdmissionReview payload and needs no cluster access.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lenny-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lenny-webhook
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
rules:
  - apiGroups: ["lenny.dev"]
    resources: ["agentpods", "podclaims", "podsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lenny-webhook
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lenny-webhook
subjects:
  - kind: ServiceAccount
    name: lenny-webhook
    namespace: {{ .Release.Namespace }}
