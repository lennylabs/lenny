{{- /*
RBAC for the lenny-webhook ServiceAccount shared by every admission
webhook Deployment (§17.2). The lenny-podclaim-guard route lists the
sibling PodClaims of the claimed AgentPod during admission, so the
ServiceAccount needs read access to the pod-fabric CRDs. The
lenny-podset-deletion-guard route reads no cluster object: it asks the
gateway whether the deleted PodSet's pool has an active RuntimeUpgrade
(§10.5). The pool-config validator and the label-immutability route
read only the AdmissionReview payload and need no cluster access.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lenny-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lenny-webhook
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
rules:
  - apiGroups: ["lenny.dev"]
    resources: ["agentpods", "podclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lenny-webhook
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lenny-webhook
subjects:
  - kind: ServiceAccount
    name: lenny-webhook
    namespace: {{ .Release.Namespace }}
