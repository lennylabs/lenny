{{- /*
lenny-direct-mode-isolation ValidatingAdmissionWebhook (§4.9, §13.2).
Rejects SandboxTemplate resources whose credential-delivery
configuration exposes cross-tenant credential risk: deliveryMode direct
with isolationProfile standard, and deliveryMode proxy with spiffeBinding
disabled (both in multi-tenant mode), plus the §13.2 NET-006 deliveryMode
proxy / egressProfile provider-direct mutual exclusivity (every tenancy
mode). Scoped to agent namespaces and the sandboxtemplates resource;
fail-closed.

Rendered unconditionally (§13.2 line 440 step 2): the enforcement target
is the credential-delivery / egress configuration of a pool, which is
independent of whether the LLM proxy feature is enabled. A multi-tenant
install with features.llmProxy: false still admits direct + standard
SandboxTemplates without this webhook — the precise cross-tenant
credential exposure §4.9 names — so the webhook must not be gated on
features.llmProxy.
*/ -}}
{{- if .Values.admissionWebhooks.enabled }}
{{- include "lenny.admissionWebhookWorkload" (dict "root" $ "name" "lenny-direct-mode-isolation") }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: lenny-direct-mode-isolation
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/lenny-direct-mode-isolation
webhooks:
  - name: direct-mode-isolation.lenny.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: lenny.dev/agent-namespace
          operator: In
          values: ["true"]
    rules:
      - apiGroups: ["lenny.dev"]
        apiVersions: ["v1alpha1"]
        resources: ["sandboxtemplates"]
        operations: ["CREATE", "UPDATE"]
        scope: Namespaced
    clientConfig:
      service:
        name: lenny-direct-mode-isolation
        namespace: {{ .Release.Namespace }}
        path: /direct-mode-isolation
        port: 443
{{- end }}
