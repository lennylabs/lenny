{{- /*
lenny-drain-readiness ValidatingAdmissionWebhook (§12.5, §13.2 NET-037).
Intercepts CREATE on the pods/eviction subresource in agent namespaces
and blocks a planned node drain while the artifact store is degraded, so
a drain cannot evict agent pods into a MinIO outage and lose
un-checkpointed workspace state. The webhook queries the gateway
GET /internal/drain-readiness endpoint; an unhealthy or unreachable
result rejects the eviction. Fail-closed. Rendered only when
features.drainReadiness is enabled.
*/ -}}
{{- if and .Values.admissionWebhooks.enabled .Values.features.drainReadiness }}
{{- include "lenny.admissionWebhookWorkload" (dict "root" $ "name" "lenny-drain-readiness" "egressLabel" "drain-readiness") }}
---
{{/*
allow-drain-readiness-egress re-admits the §12.5 gateway-probe egress
the system-network-policies default-deny otherwise blocks. The drain-
readiness webhook calls GET /internal/drain-readiness on
lenny-gateway.<release>.svc:internalPort before admitting each
eviction; without this egress rule the call times out and the fail-
closed webhook rejects every eviction with MinIOUnreachable, blocking
node drain in any cluster that runs Lenny with default network
policies in place. The allow-gateway-ingress counterpart admits the
inbound side.

Per §13.2 NET-068 / §17.2 line 56 the podSelector uses the canonical
lenny.dev/component: admission-webhook key plus the additive
lenny.dev/webhook-name: drain-readiness key, so this gateway-egress
grant narrows to the drain-readiness pods only. The other eight
in-process webhooks do not inherit reachability to the gateway internal
port. F-17.2.11.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-drain-readiness-gateway-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      lenny.dev/component: admission-webhook
      lenny.dev/webhook-name: drain-readiness
  egress:
    - to:
        - podSelector:
            matchLabels:
              lenny.dev/component: gateway
      ports:
        - port: {{ .Values.gateway.internalPort }}
          protocol: TCP
  policyTypes: [Egress]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: lenny-drain-readiness
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/lenny-drain-readiness
webhooks:
  - name: drain-readiness.lenny.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: lenny.dev/agent-namespace
          operator: In
          values: ["true"]
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods/eviction"]
        operations: ["CREATE"]
        scope: Namespaced
    clientConfig:
      service:
        name: lenny-drain-readiness
        namespace: {{ .Release.Namespace }}
        path: /drain-readiness
        port: 443
{{- end }}
