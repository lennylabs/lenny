{{- /*
lenny-sandboxtemplate-deletion-guard ValidatingAdmissionWebhook
(§10.5 line 508, the "key safety invariant"). Blocks a SandboxTemplate
DELETE while a RuntimeUpgrade record that references the template's
SandboxWarmPool is still active. The decider lists the referencing
SandboxWarmPools through the API-server reader and probes the gateway
GET /internal/runtime-upgrade/active endpoint for each pool's upgrade
state. Scoped to the sandboxtemplates resource on DELETE; fail-closed
with a 5s timeout so an unreachable webhook denies the deletion rather
than admitting a delete it cannot verify against the safety invariant.
*/ -}}
{{- if .Values.admissionWebhooks.enabled }}
{{- include "lenny.admissionWebhookWorkload" (dict "root" $ "name" "lenny-sandboxtemplate-deletion-guard") }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: lenny-sandboxtemplate-deletion-guard
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/lenny-sandboxtemplate-deletion-guard
webhooks:
  - name: sandboxtemplate-deletion-guard.lenny.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: lenny.dev/agent-namespace
          operator: In
          values: ["true"]
    rules:
      - apiGroups: ["lenny.dev"]
        apiVersions: ["v1alpha1"]
        resources: ["sandboxtemplates"]
        operations: ["DELETE"]
        scope: Namespaced
    clientConfig:
      service:
        name: lenny-sandboxtemplate-deletion-guard
        namespace: {{ .Release.Namespace }}
        path: /sandboxtemplate-deletion-guard
        port: 443
{{- end }}
