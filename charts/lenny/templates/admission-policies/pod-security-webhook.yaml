{{- /*
lenny-pod-security ValidatingAdmissionWebhook (§13.1, §18.33). Wraps
the pkg/podsecurity §13.1 pod-spec validator: rejects any agent pod
whose spec breaches a §13.1 pod-security invariant — a host-sharing
flag (shareProcessNamespace, hostPID, hostNetwork, hostIPC), a missing
or wrong credential fsGroup, a root pod, a privileged or
privilege-escalating container, a writable root filesystem, an
undropped capability, or a seccomp profile other than RuntimeDefault.
Scoped to Pod CREATE/UPDATE and the pods/ephemeralcontainers
subresource (§13.1 line 27 — the per-container baseline applies to
ephemeral debug containers too) in agent namespaces; fail-closed so a
pod the webhook cannot validate is not admitted with an unverified
§13.1 posture.
*/ -}}
{{- if .Values.admissionWebhooks.enabled }}
{{- include "lenny.admissionWebhookWorkload" (dict "root" $ "name" "lenny-pod-security") }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: lenny-pod-security
  labels:
    {{- include "lenny.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/lenny-pod-security
webhooks:
  - name: pod-security.lenny.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: lenny.dev/agent-namespace
          operator: In
          values: ["true"]
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        # spec: §13.1 — register CREATE and UPDATE so the
        # securityContext invariants are re-validated on every spec
        # write. Most SecurityContext fields are kubelet-immutable
        # post-creation, but automountServiceAccountToken and other
        # spec-mutable fields can be toggled. Matches the §13.2 / §4.6.3
        # webhooks (label-immutability, pool-config-validator,
        # data-residency-validator) which all register CREATE+UPDATE.
        operations: ["CREATE", "UPDATE"]
        scope: Namespaced
      # spec: §13.1 line 27 — ephemeral debug containers attached
      # post-hoc via the pods/ephemeralcontainers subresource carry the
      # same per-container baseline (no privileged, drop ALL caps,
      # read-only root, RuntimeDefault seccomp). The dedicated
      # lenny-ephemeral-container-cred-guard covers the credential-read
      # boundary; this rule covers the general §13.1 baseline so an
      # actor with `update` on pods/ephemeralcontainers cannot attach a
      # privileged or capability-adding debug container. Ephemeral
      # containers are only ever added via UPDATE on the subresource.
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods/ephemeralcontainers"]
        operations: ["UPDATE"]
        scope: Namespaced
    clientConfig:
      service:
        name: lenny-pod-security
        namespace: {{ .Release.Namespace }}
        path: /pod-security
        port: 443
{{- end }}
