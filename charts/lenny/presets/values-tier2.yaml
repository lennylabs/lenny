# Capacity Tier 2 preset (§17.8.2, §17.8.4).
#
# Tier 2 is the mid-range capacity envelope. It targets multi-team
# production installs with steady traffic. Layer this file on top of
# the base values.yaml:
#
#   helm install lenny charts/lenny -f values.yaml -f presets/values-tier2.yaml
#
# Base values.yaml keys this preset overrides:
#   capacityPlanning.tier            — selects the Tier 2 ResourceQuota row
#   gateway.replicas                 — gateway Deployment replica count
#   gateway.maxSessionsPerReplica    — §4.1 per-replica session ceiling
#   autoscaling.*                    — §10.1 gateway horizontal scaler
#   controller.replicas              — warm-pool controller replica count
#   tokenService.replicas            — token service replica count
#   ops.replicas                     — lenny-ops replica count
#   ops.production                   — enables the §25.11 backup confirm guard
#   ops.selfHealth.checkIntervalSeconds — §17.8.4 self-monitor cadence
#   ops.events.streamMaxLen          — §17.8.4 ops:events:stream MAXLEN
#   backups.retention.*              — backup retention policy
#   backups.restoreTest.enabled      — periodic test-restore CronJob gate
#
# Every other base value is left at its default. The base values.yaml
# backup retention block already carries the Tier 2 defaults; this
# preset restates them so the layering is explicit.

capacityPlanning:
  tier: tier2

# §16.1.1 / §16.9 static metric tier label. Matches capacityPlanning.tier
# so the deployment_tier series carries the same tier the ResourceQuota
# selects. F-16.9.5.
global:
  deploymentTier: tier2

# §12.3 line 117 per-tier write ceiling: Tier 2 reference instance
# (4 vCPU / 16 GB) sustains ~600 write IOPS. Emitted on
# lenny_postgres_write_ceiling_iops for the PostgresWriteSaturation
# alert. F-12.3.8.
postgres:
  writeCeilingIops: 600

# Gateway replica floor of 3 (§17.8.2 gateway table: min 3, max 10).
# Three replicas keep the deployment above the Tier 2 minimum healthy
# count of 3 during a single voluntary disruption. maxSessionsPerReplica
# is the §4.1 Tier 2 provisional value.
gateway:
  replicas: 3
  maxSessionsPerReplica: 200

# Gateway autoscaling at Tier 2 (§10.1, §17.8.2 gateway table). Tier 2
# uses the KEDA path so the §10.1 custom-metric pipeline lag stays near
# 20s (pollingInterval 10s). SCL-036 minReplicas burst-absorption
# (KEDA-path formula, §17.8.2): minReplicas >= ceil(burst_arrival_rate
# * 20 / maxSessionsPerReplica) = ceil(30 * 20 / 200) = ceil(3) = 3.
autoscaling:
  enabled: true
  provider: keda
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercent: 65
  # §17.8.2 gateway table: Tier 2 queue-depth target averageValue 10.
  queueDepthTarget: 10
  keda:
    pollingInterval: 10
    cooldownPeriod: 300
    prometheusServerAddress: http://prometheus.monitoring.svc:9090

# Controllers run 2 replicas with leader election at every tier
# (§17.8.2 controller tuning table).
controller:
  replicas: 2

# Token service runs 2 replicas at Tier 2 (§17.8.2 operational defaults
# table).
tokenService:
  replicas: 2

# lenny-ops runs 2 replicas (§25.4 default).
ops:
  replicas: 2
  # Tier 2 is a production posture. Enabling ops.production turns on the
  # §25.11 confirm:true requirement for full backups.
  production: true
  # §25.4 line 903 / §17.8.4 — Tier 2/3 run the self-monitor every 10s to
  # catch fast failure-and-recovery cycles.
  selfHealth:
    checkIntervalSeconds: 10
  # §25.5 line 2598 / §17.8.4 — Tier 2 ops:events:stream MAXLEN of 50,000
  # (~25 MB Redis budget) for a longer catch-up window at moderate rates.
  events:
    streamMaxLen: 50000
  # §25.5 lines 2655-2659 — Tier 2 webhook delivery retention of 7 days
  # (standard incident-investigation window).
  webhooks:
    deliveryRetentionDays: 7

# Backup retention at Tier 2 (§25.11): 30-day age floor, 10 backups
# retained, 3 full backups kept.
backups:
  retention:
    retainDays: 30
    retainCount: 10
    retainMinFull: 3
    preRestoreRetainDays: 7
  # Tier 2 leaves the periodic test-restore CronJob disabled by default.
  # §25.11 recommends the scheduled test restore at Tier 3; a Tier 2
  # operator can enable it explicitly.
  restoreTest:
    enabled: false

# §25.13 line 4737 / §16.5 — tier-tightened alert thresholds. Tier 2
# applies the §25.13 example tier-2 row: queue depth 10/5m, p95 latency
# 2s/5m, credential pool utilisation 70 percent. F-25.13.2.
monitoring:
  # §17.8.4 — at Tier 2/3 a missing Prometheus is a blocking
  # configuration error: acknowledgeNoPrometheus stays false so the
  # §17.6 preflight Prometheus-reachability check is not silenced.
  acknowledgeNoPrometheus: false
  alertThresholds:
    gatewayQueueDepthHigh:
      value: 10
      duration: 5m
      severity: warning
    gatewayLatencyHigh:
      p99Seconds: 2.0
      duration: 5m
      severity: warning
    credentialPoolLow:
      utilizationThreshold: 0.70
      duration: 0s
      severity: warning
