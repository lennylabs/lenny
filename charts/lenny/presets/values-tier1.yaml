# Capacity Tier 1 preset (§17.8.2, §17.8.4).
#
# Tier 1 is the smallest published capacity envelope. It targets local
# clusters, development environments, and small single-team production
# installs. Layer this file on top of the base values.yaml:
#
#   helm install lenny charts/lenny -f values.yaml -f presets/values-tier1.yaml
#
# Base values.yaml keys this preset overrides:
#   capacityPlanning.tier            — selects the Tier 1 ResourceQuota row
#   gateway.replicas                 — gateway Deployment replica count
#   gateway.maxSessionsPerReplica    — §4.1 per-replica session ceiling
#   autoscaling.*                    — §10.1 gateway horizontal scaler
#   controller.replicas              — warm-pool controller replica count
#   tokenService.replicas            — token service replica count
#   ops.replicas                     — lenny-ops replica count
#   backups.retention.*              — backup retention policy
#   backups.restoreTest.enabled      — periodic test-restore CronJob gate
#
# Every other base value is left at its default.

capacityPlanning:
  tier: tier1

# Gateway replica floor of 2 (§17.8.2 gateway table: min 2, max 4). Two
# replicas survive a single pod failure without dropping below the
# minimum healthy count. maxSessionsPerReplica is the §4.1 Tier 1
# provisional value.
gateway:
  replicas: 2
  maxSessionsPerReplica: 50

# Gateway autoscaling at Tier 1 (§10.1, §17.8.2 gateway table). Tier 1
# may use either scaling path; the preset selects the standalone HPA so
# a Tier 1 install needs only the Prometheus Adapter, not a KEDA
# operator. SCL-036 minReplicas burst-absorption (KEDA-path formula,
# §17.8.2): minReplicas >= ceil(burst_arrival_rate * 20 /
# maxSessionsPerReplica) = ceil(5 * 20 / 50) = ceil(2) = 2.
autoscaling:
  enabled: true
  provider: hpa
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercent: 70
  # §17.8.2 gateway table: Tier 1 queue-depth target averageValue 15.
  queueDepthTarget: 15

# Controllers run 2 replicas with leader election at every tier
# (§17.8.2 controller tuning table).
controller:
  replicas: 2

# Token service runs 2 replicas at Tier 1 (§17.8.2 operational defaults
# table).
tokenService:
  replicas: 2

# lenny-ops runs 2 replicas (§25.4 default). One leader runs the
# background loops; both replicas serve the HTTP surface.
ops:
  replicas: 2

# Backup retention at Tier 1 is the shortest published window (§25.11):
# 7-day age floor, 3 backups retained, 2 full backups kept.
backups:
  retention:
    retainDays: 7
    retainCount: 3
    retainMinFull: 2
    preRestoreRetainDays: 7
  # Tier 1 leaves the periodic test-restore CronJob disabled. A small
  # install does not run scheduled restores without an explicit opt-in.
  restoreTest:
    enabled: false
