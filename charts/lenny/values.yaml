# Default values for the lenny chart.
#
# The control plane (gateway, token service, controllers, lenny-ops,
# stores) runs in the Helm release namespace, lenny-system by default.
# Agent pods run in the dedicated namespaces listed below.

# agentNamespaces declares the namespaces that hold agent pods (§17.2).
# Each entry is an object so per-namespace ResourceQuota and LimitRange
# overrides can be attached as the chart grows. Admission policies and
# NetworkPolicies scope themselves to the namespaces named here.
agentNamespaces:
  - name: lenny-agents
  - name: lenny-agents-kata

# controller configures the lenny-controller Deployment, which runs
# the §4.6.1 WarmPoolController. It runs with 2 replicas and leader
# election so exactly one replica reconciles at a time.
controller:
  replicas: 2
  # metricsPort is the port the controller serves Prometheus metrics
  # on (§13.2); the monitoring-scrape NetworkPolicy admits it.
  metricsPort: 9090
  # adapterImage is the lenny-adapter sidecar image the §4.7 Sandbox
  # reconciler stamps into every agent pod. Empty by default; operators
  # set it to the adapter image matching the release.
  adapterImage: ""
  image:
    repository: ghcr.io/lennylabs/lenny-controller
    # tag defaults to the chart appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# admissionWebhooks configures the ValidatingAdmissionWebhook
# Deployments under templates/admission-policies/ (§17.2). Each webhook
# is its own Deployment + Service + PodDisruptionBudget running the
# lenny-webhook image; cert-manager issues each serving certificate.
admissionWebhooks:
  replicas: 2
  image:
    repository: ghcr.io/lennylabs/lenny-webhook
    # tag defaults to the chart appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# webhookIngressCIDR is the source CIDR allowed to reach the admission
# webhook pods (§13.2). The kube-apiserver calls webhooks from a node
# or control-plane IP that is impractical to pin without cloud-specific
# knowledge; the default is safe because the lenny-system namespace is
# default-deny and the webhook pods authenticate callers via mTLS.
webhookIngressCIDR: "0.0.0.0/0"

# kubeApiServerCIDR is the destination CIDR the control-plane
# components are allowed to reach the kube-apiserver on (§13.2).
# Operators should tighten this to the cluster's apiserver endpoint;
# the broad default is bounded by the kubeApiServerPorts egress rule.
kubeApiServerCIDR: "0.0.0.0/0"

# kubeApiServerPorts lists the destination ports the control-plane
# components may reach the kube-apiserver on (§13.2). The in-cluster
# `kubernetes` Service is published on 443. On kubeadm-, k3s-, and
# kind-provisioned clusters that Service DNATs to the apiserver's real
# endpoint on 6443. Several CNIs, kindnet among them, evaluate egress
# NetworkPolicy after the DNAT rewrite, so the policy must admit the
# post-DNAT port. Both ports are allowed by default. Managed control
# planes (GKE, EKS, AKS) publish the endpoint on 443 and leave the
# 6443 rule inert.
kubeApiServerPorts:
  - 443
  - 6443

# ingressControllerNamespace is the namespace the Ingress controller
# runs in (§13.2). The allow-gateway-ingress NetworkPolicy admits
# external HTTPS to the gateway from pods in this namespace, matched
# by the immutable kubernetes.io/metadata.name namespace label.
ingressControllerNamespace: "ingress-nginx"

# tokenService configures the §4.3 Token Service. The lenny-token-
# service Deployment runs the §13.3 Token Service binary; it is
# stateless and runs with 2 replicas (§17.1).
tokenService:
  replicas: 2
  # grpcPort is the mTLS gRPC port the gateway reaches the Token
  # Service on (§13.2 / §4.3). The lenny-token-service Service exposes
  # the gRPC listener on this port; the binary's --grpc-addr flag
  # binds to it.
  grpcPort: 50052
  # httpPort is the HTTP token-exchange port the binary's --addr
  # flag binds to. The RFC 8693 POST /v1/oauth/token endpoint is
  # served on this port. Internal-only; not exposed by the
  # NetworkPolicy.
  httpPort: 8081
  # metricsPort is the port the Token Service serves Prometheus
  # metrics on (§13.2); the monitoring-scrape NetworkPolicy admits it.
  metricsPort: 9090
  # issuer is the iss claim stamped on tokens the Token Service mints
  # (the binary's --issuer flag).
  issuer: "https://lenny.dev.local/token"
  image:
    repository: ghcr.io/lennylabs/lenny-token-service
    # tag defaults to the chart appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# redis configures the Redis connection.
redis:
  # tlsPort is the TLS port for Redis (§13.2).
  tlsPort: 6380
  # url is the Redis connection URL (redis://host:port/db). Redis is a
  # bring-your-own external service: the chart leaves url empty by
  # default, and a stock render wires no LENNY_REDIS_URL so the gateway
  # uses its in-memory breaker store. Set url to point the gateway at
  # an external Redis. When set, the chart renders the value into the
  # lenny-datastore-conn Secret and the gateway env reads it from there.
  url: ""

# minio configures the MinIO object store (self-managed profile).
minio:
  # tlsPort is the TLS port the gateway reaches MinIO on (§13.2).
  tlsPort: 9443
  # endpoint is the MinIO API endpoint (host:port). MinIO is a
  # bring-your-own external service: the chart leaves endpoint empty by
  # default, and a stock render wires no LENNY_MINIO_* env so the
  # gateway uses its in-memory blob store. Set endpoint together with
  # accessKey, secretKey, and bucket to point the §4.5 artifact store at
  # an external MinIO. accessKey and secretKey are rendered into the
  # lenny-datastore-conn Secret; endpoint, bucket, and useSSL are wired
  # as plain env. useSSL selects HTTPS to the MinIO endpoint.
  endpoint: ""
  accessKey: ""
  secretKey: ""
  bucket: ""
  useSSL: false

# kms configures the external KMS endpoint the Token Service calls.
kms:
  # endpointCIDR is the destination CIDR for the KMS HTTPS endpoint
  # (§13.2). Operators should tighten this to the provider's range;
  # the broad default is bounded by the per-port (443) egress rule.
  endpointCIDR: "0.0.0.0/0"

# monitoring identifies the Prometheus monitoring namespace whose
# scrape requests the §13.2 metrics-scrape NetworkPolicies admit, and
# configures the §16.9 / §25.13 bundled §16.5 alerting rules.
monitoring:
  namespace: "monitoring"
  # bundleRules gates the §16.5 alert catalog manifests (§25.13). The
  # full catalog is generated from pkg/alerting/rules into
  # files/alerting-rules.yaml; the prometheusrule.yaml template renders
  # it. Default true so an out-of-the-box install has working alerts.
  bundleRules: true
  # format selects how the §16.5 rules are rendered (§25.13 Helm
  # Rendering): "prometheusrule" emits a PrometheusRule CRD for
  # deployers running the Prometheus Operator; "configmap" emits a
  # ConfigMap with rules.yaml for vanilla Prometheus; "both" emits both.
  format: "prometheusrule"
  # prometheusRule configures the rendered PrometheusRule CRD.
  prometheusRule:
    # namespace defaults to monitoring.namespace when empty.
    namespace: ""
    # additionalLabels are added to the PrometheusRule so the
    # Prometheus Operator's ruleSelector can discover it.
    additionalLabels: {}
  # configMap configures the rendered ConfigMap rule file.
  configMap:
    # namespace defaults to the release namespace (lenny-system) when
    # empty.
    namespace: ""
    name: "lenny-alerting-rules"
  # serviceMonitor gates the §16.9 Prometheus Operator scrape-target
  # CRDs. servicemonitor.yaml renders a ServiceMonitor for the gateway,
  # controller, and Token Service; podmonitor.yaml renders a PodMonitor
  # for lenny-ops, which requires Pod-level label selection. Both are
  # monitoring.coreos.com CRDs, so the chart leaves them off by default:
  # a cluster without the Prometheus Operator has no ServiceMonitor or
  # PodMonitor CRD and rendering them would fail kubectl apply. The
  # operator-discoverable labels are taken from prometheusRule.-
  # additionalLabels (§16.9), so one label set covers all three CRDs.
  serviceMonitor:
    # enabled gates servicemonitor.yaml and podmonitor.yaml. Set true on
    # a cluster running the Prometheus Operator (kube-prometheus-stack,
    # OpenShift Monitoring).
    enabled: false
    # namespace is where the ServiceMonitor and PodMonitor are created.
    # Defaults to monitoring.namespace when empty.
    namespace: ""
    # interval is the §16.9 scrape interval applied to every endpoint.
    interval: "30s"
    # scrapeTimeout bounds a single scrape; it must not exceed interval.
    scrapeTimeout: "10s"

# observability configures the §16 OpenTelemetry trace export. Agent
# runtimes that emit OTLP spans need egress to the OTLP collector; the
# agent-namespace allow-pod-egress-otlp NetworkPolicy (§13.2 NET-046)
# re-admits that egress and is rendered only when otlpEndpoint is set.
observability:
  # otlpEndpoint is the OTLP collector endpoint the runtime OTel SDK
  # exports to. Leaving it empty disables trace export and suppresses
  # the allow-pod-egress-otlp NetworkPolicy. Set it to the collector's
  # https:// URL to turn trace export on.
  otlpEndpoint: ""
  # otlpNamespace is the namespace the in-cluster OTLP collector runs
  # in. The allow-pod-egress-otlp policy admits egress to a collector
  # pod in this namespace (§13.2 NET-046).
  otlpNamespace: "lenny-system"
  # otlpPodLabel / otlpPodLabelValue select the OTLP collector pod the
  # allow-pod-egress-otlp policy admits egress to.
  otlpPodLabel: "app"
  otlpPodLabelValue: "otel-collector"
  # otlpPort is the collector port agent pods reach (§13.2 NET-046).
  # The default 4317 is gRPC OTLP; deployers on OTLP/HTTP set 4318.
  otlpPort: 4317
  # otlpCIDR optionally targets an OTLP collector that runs outside the
  # cluster (a cloud-managed tracing backend). When set, the
  # allow-pod-egress-otlp policy uses an ipBlock CIDR egress rule
  # instead of the in-cluster namespace/pod selector (§13.2 NET-046).
  otlpCIDR: ""

# postgres configures the Postgres connection.
postgres:
  # cidr is the destination CIDR PgBouncer is allowed to reach
  # Postgres on (§13.2). Operators should tighten this to the
  # database endpoint; the broad default is bounded by the per-port
  # (5432) egress rule.
  cidr: "0.0.0.0/0"
  # dsn is the Postgres connection string the gateway and controller
  # use to persist session, transcript, tenant, runtime, and §4.6.1
  # agent_pod_state records. Postgres is a bring-your-own external
  # service: the chart leaves dsn empty by default, and a stock render
  # wires no LENNY_POSTGRES_DSN so the gateway falls back to in-memory
  # stores (with global.devMode the gateway also starts without a DSN).
  # Set dsn to point both components at an external Postgres; the
  # migrations/ schema must already be applied. When set, the chart
  # renders the value into the lenny-datastore-conn Secret and both
  # Deployments read LENNY_POSTGRES_DSN from that Secret.
  dsn: ""

# billing configures the §11.2.1 billing-event publisher sink. The v1
# default writes events synchronously to Postgres with a Redis stream
# failover buffer ([§11.2.1 Postgres / Redis-stream failover path]).
# `sink` is an advisory selector the chart pipes into the gateway pod
# as LENNY_BILLING_SINK so the §16 observability dashboards can label
# emitted events by sink.
#
# Supported values:
#   "postgres" — v1 default (Postgres-backed billing_events table).
#   "<future>" — v2 external sinks (BigQuery / Athena / Data Lake) ride
#                in once the corresponding publisher lands.
#
# Empty string leaves the env unset and the gateway runs the v1 path
# unchanged. The tier-6 EKS overlay sets `sink: "postgres"` so the
# §11.2.1 TestCloudBillingExport sees the env var on the gateway pod.
billing:
  sink: ""

# features gates the optional admission webhooks (§17.2 feature-gated
# chart inventory). The Phase 3.5 baseline webhooks render
# unconditionally; these flags add the later-phase webhooks.
features:
  llmProxy: false
  drainReadiness: false
  compliance: false

# imageVerification configures the §5.2 cosign image-signing admission
# webhook (lenny-cosign-verify). When enabled the chart renders a
# fail-closed ValidatingWebhookConfiguration that rejects agent pods
# whose in-scope container images do not carry a valid cosign
# signature; an unavailable webhook blocks pod admission (§5.2, §18.5,
# CosignWebhookUnavailable alert in §16.5).
imageVerification:
  cosign:
    # enabled gates the lenny-cosign-verify webhook. Image provenance
    # verification is a prerequisite for production and staging
    # deployments (§5.2); enable it once the signing program is in
    # place. Default false so a stock dev install renders without the
    # signing material configured.
    enabled: false
    # verifiedRegistries is the list of image-registry prefixes whose
    # images must carry a valid cosign signature. An image whose
    # reference matches none of these prefixes is admitted unchecked.
    # The webhook refuses to start when enabled with an empty list.
    verifiedRegistries:
      - ghcr.io/lennylabs/
    # publicKeySecret is the name of a Secret in the release namespace
    # carrying the trusted cosign public key(s) under publicKeyKey.
    # Several PEM blocks are permitted to support key rotation with an
    # overlap window. The Secret is created by the deployer; the chart
    # mounts it into the webhook pod.
    publicKeySecret: lenny-cosign-public-key
    publicKeyKey: cosign.pub
    # policyConfigMap is the name of a ConfigMap in the release
    # namespace carrying the image-signature policy file under
    # policyKey. The release pipeline (§18.33) emits the policy file
    # mapping each Lenny-built image to its signed digest and detached
    # signature.
    policyConfigMap: lenny-cosign-policy
    policyKey: cosign-policy.json

# platform carries the §25.8 platform-lifecycle settings: image
# registry configuration, release-channel manifest publisher, and the
# upgrade orchestrator. Operators wire the registry, the channel
# endpoint, and the Ed25519 signing keys here; defaults serve a
# canonical install pointing at the public release channel.
platform:
  registry:
    # url is the base image registry plus optional path
    # (§25.8 ImageResolver). All Lenny component image references are
    # resolved relative to this.
    url: ghcr.io/lennylabs
    # overrides maps a component short name to a complete image
    # reference. Use this when a single component is mirrored to a
    # different registry path than the rest of the install (§25.8).
    overrides: {}
    # pullSecretName names a Kubernetes Secret of type
    # kubernetes.io/dockerconfigjson (§25.8). Empty for public
    # registries.
    pullSecretName: ""
    # requireDigest is the §13.1 admission-time enforcement: when true
    # the lenny-registry-digest ValidatingAdmissionWebhook rejects any
    # agent pod whose container image references are not @sha256:
    # digest-pinned. Air-gap installs are required to set this true
    # (§25.8 air-gap guidance). Production deployments should set it
    # true; the chart defaults to false so a stock dev install renders
    # tag-pinned references without the webhook blocking admission.
    requireDigest: false
  releaseChannel:
    # url is the §25.8 release-channel endpoint lenny-ops queries via
    # GET /v1/admin/platform/upgrade-check. Empty disables the check.
    url: https://releases.lenny.dev/v1/latest
    # publicKeyPath is the file path inside the lenny-ops container of
    # the operator-held Ed25519 public key that signs release-channel
    # responses (§25.8 "operators running a mirror that re-signs with
    # their own key can override via platform.releaseChannel.public-
    # KeyPath"). Empty means the canonical Lenny release-channel public
    # key compiled into lenny-ops is used; set to mount an internal
    # mirror's verifying key into the pod.
    publicKeyPath: ""
    # publisher configures the §25.8 release-channel manifest publisher
    # this lenny-ops install runs. Most installs are channel consumers
    # rather than publishers; set publisher.enabled to true to make
    # this lenny-ops serve GET /v1/latest with an Ed25519-signed
    # manifest.
    publisher:
      enabled: false
      # signingKeySecret is the Secret holding the active Ed25519
      # signing key (PEM-encoded PKCS8 private key under
      # signingKeyKey). The lenny-ops binary loads it at startup and
      # signs every response with it.
      signingKeySecret: lenny-release-channel-signing-key
      signingKeyKey: signing-key.pem
      # signingKeyID is the operator-assigned identifier embedded in
      # the X-Lenny-Release-Signature envelope so a verifier can look
      # the trusted public key up during a rotation overlap.
      signingKeyID: ""
      # previousKeySecret is the optional Secret holding the rotated-
      # out public key (PEM-encoded PKIX, under previousKeyKey).
      # Set during a §25.8 key-rotation overlap window so signatures
      # emitted by the previous key remain verifiable until consumers
      # have refreshed their trust bundle. Leave empty outside a
      # rotation. The default is intentionally permissive: a publisher
      # can run with only the active key in normal operation.
      previousKeySecret: ""
      previousKeyKey: previous-key.pem
      previousKeyID: ""
      # manifestConfigMap is the ConfigMap holding the JSON manifest
      # body the publisher serves (under manifestKey). Operators
      # update this when cutting a new release; lenny-ops reads it on
      # startup and serves the same bytes on every request until the
      # binary restarts.
      manifestConfigMap: lenny-release-channel-manifest
      manifestKey: latest.json

# tenancy configures the platform multi-tenancy posture (§4.9, §13).
tenancy:
  # mode is "single" or "multi". In multi-tenant mode the
  # lenny-direct-mode-isolation webhook rejects the §4.9
  # credential-delivery configurations that expose cross-tenant
  # credential risk: deliveryMode direct with isolationProfile standard,
  # and deliveryMode proxy with spiffeBinding disabled.
  mode: single

# global holds chart-wide settings shared across components.
global:
  # devMode relaxes the multi-tenant admission controls for local
  # development (§4.9). It must never be enabled on a real multi-tenant
  # cluster.
  devMode: false
  # spiffeTrustDomain is the SPIFFE trust domain anchoring agent-pod
  # and in-cluster-interceptor identities (§10.3). It is the host
  # component of every spiffe:// URI Lenny issues. Defaults to the
  # cluster DNS domain so a stock install has a stable anchor.
  spiffeTrustDomain: cluster.local

# mtls configures the §10.3 gateway-to-agent-pod mTLS PKI: a
# cluster-internal certificate authority managed by cert-manager and
# the per-component serving certificates for the internal control-plane
# mTLS identities (gateway, controller, token service). Agent-pod
# certificates are issued per pod at pod-creation time with a
# pod-specific SPIFFE SAN and a 4h TTL; they are not static chart
# resources and are therefore not rendered here. The per-component
# certificates issued here all chain to the CA below, so the gateway,
# controller, and token service validate each other against one trust
# anchor (§10.3 mutual SAN validation).
mtls:
  # enabled gates the §10.3 internal mTLS PKI templates. Leave true for
  # any cluster that runs gateway-to-pod mTLS through cert-manager. Set
  # false when a service mesh (Istio, Linkerd) supplies mTLS instead,
  # in which case the mesh issues the identities (§10.3).
  enabled: true
  # caDurationHours is the lifetime of the cluster-internal CA
  # certificate. The CA outlives the leaf certificates by a wide margin
  # so leaf renewal never races CA expiry.
  caDurationHours: 8760
  # caRenewBeforeHours is how long before CA expiry cert-manager
  # renews the CA certificate.
  caRenewBeforeHours: 720
  # leafDurationHours is the lifetime of the per-component leaf
  # certificates (gateway, controller, token service). §10.3 sets the
  # control-plane component TTL at 24h.
  leafDurationHours: 24
  # leafRenewBeforeHours is how long before leaf expiry cert-manager
  # renews a component certificate. §10.3 renews at 2/3 of lifetime, so
  # the default 8h on a 24h certificate matches that ratio.
  leafRenewBeforeHours: 8

# adapter configures the §4.7 runtime adapter sidecar that runs in
# every agent pod.
adapter:
  # grpcPort is the adapter's gRPC listen port (§13.2). The gateway
  # reaches each pod's adapter on this port; the agent-namespace
  # allow-gateway-ingress NetworkPolicy admits it.
  grpcPort: 50051

# gateway configures the §4.1 edge gateway. The lenny-gateway
# Deployment runs the gateway binary; it is stateless and horizontally
# scaled (§17.1), so the chart sizes it with a replica count and an
# HPA-compatible posture.
gateway:
  replicas: 2
  # noEnvironmentPolicy is the §10.6 platform default applied when a
  # session names no environment. It MUST be "deny-all" or "allow-all";
  # the gateway refuses to start when it is unset (LENNY_CONFIG_MISSING).
  noEnvironmentPolicy: deny-all
  # grpcPort is the pod-to-gateway gRPC control-channel port (§13.2),
  # admitted by the agent-namespace allow-pod-egress-base NetworkPolicy.
  # The gateway serves the §8.6 GatewayControl listener on this port.
  grpcPort: 50051
  # metricsPort is the port the gateway serves Prometheus metrics on
  # (§13.2); the monitoring-scrape NetworkPolicy admits it. The gateway
  # binary serves /metrics on the same listener as the REST API
  # (internalPort), so the lenny-gateway Service maps the metrics port
  # to that listener.
  metricsPort: 9090
  # llmProxyPort is the gateway's LLM reverse-proxy port (§13.2). Only
  # proxy-mode agent pods are admitted to it, by the supplemental
  # allow-pod-egress-llm-proxy NetworkPolicy.
  llmProxyPort: 8443
  # internalPort is the gateway's internal HTTP port (§13.2). It serves
  # the REST API, /metrics, GET /healthz, and the §12.5
  # GET /internal/drain-readiness endpoint the lenny-drain-readiness
  # webhook probes.
  internalPort: 8080
  # internalTLSPort is the gateway's admin-API-over-TLS port (§13.2
  # NET-070). lenny-ops reaches the gateway admin API on this port.
  internalTLSPort: 8443
  # httpsPort is the gateway's external TLS listener (§13.2 NET-038).
  # The Ingress controller forwards external HTTPS traffic to it.
  httpsPort: 443
  image:
    repository: ghcr.io/lennylabs/lenny-gateway
    # tag defaults to the chart appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # maxSessionsPerReplica is the §4.1 per-replica session capacity
  # ceiling. It is the divisor in the §17.8.2 SCL-036 minReplicas
  # burst-absorption formula and the denominator of the
  # GatewaySessionBudgetNearExhaustion capacity-ceiling alert. The §4.1
  # provisional values are 50 (Tier 1), 200 (Tier 2), and 400 (Tier 3);
  # the tier presets override this value.
  maxSessionsPerReplica: 50
  # serviceAccount.annotations are stamped onto the lenny-gateway
  # ServiceAccount. The §13 IRSA-on-EKS install sets
  # eks.amazonaws.com/role-arn here to bind the SA to the IAM role
  # the Terraform module provisions. Empty by default; provider-
  # specific overlays (scripts/cloud/aws/render-values.sh, etc.)
  # populate it.
  serviceAccount:
    annotations: {}

# autoscaling configures the §10.1 gateway horizontal scaler. The chart
# renders exactly one scaler resource, selected by autoscaling.provider:
#
#   provider: hpa  — render a standalone HorizontalPodAutoscaler that
#     scales on the §4.1 SCL-026 metrics (request queue depth as the
#     primary trigger, plus CPU) and render no KEDA ScaledObject.
#   provider: keda — render a KEDA ScaledObject with a Prometheus scaler
#     trigger on lenny_gateway_request_queue_depth and render no
#     standalone HorizontalPodAutoscaler.
#
# KEDA and a standalone HPA targeting the same Deployment conflict:
# both controllers write spec.replicas and oscillate (§10.1 SCL-024).
# The chart enforces the mutual exclusion — autoscaling-gateway.yaml
# renders one or the other, never both. KEDA is mandatory at Tier 3
# (§10.1) because it cuts the custom-metric pipeline lag from ~60s to
# ~20s; Tier 1/2 may use either path.
autoscaling:
  # enabled gates autoscaling-gateway.yaml. When false the gateway
  # Deployment runs at the static gateway.replicas count with no
  # autoscaler. The base default is false so a stock render needs no
  # KEDA or Prometheus Adapter install; the tier presets enable it.
  enabled: false
  # provider selects the scaler. It MUST be "hpa" or "keda". Any other
  # value fails the render with a descriptive error (§10.1 SCL-024).
  provider: hpa
  # minReplicas is the §17.8.2 SCL-036 burst-absorption floor: idle
  # replicas must absorb the session burst that arrives during the HPA
  # pipeline-lag window before scale-out completes. The formula is
  # ceil(burst_arrival_rate * pipeline_lag_seconds / maxSessionsPerReplica),
  # with pipeline_lag_seconds 20 for the KEDA path and 60 for the
  # Prometheus Adapter path. The tier presets carry the computed value.
  minReplicas: 2
  # maxReplicas is the §17.8.2 gateway-table scale-out ceiling.
  maxReplicas: 4
  # targetCPUUtilizationPercent is the §17.8.2 HPA CPU target. It is the
  # CPU-utilization metric on the standalone-HPA path; on the KEDA path
  # CPU is left to the Deployment's own resource sizing and the queue-
  # depth trigger drives scale-out.
  targetCPUUtilizationPercent: 70
  # queueDepthTarget is the §4.1 SCL-026 primary scale-out trigger
  # target: the per-replica averageValue of lenny_gateway_request_queue_depth
  # above which the scaler adds replicas. §17.8.2 gateway table: 15
  # (Tier 1), 10 (Tier 2), 5 (Tier 3).
  queueDepthTarget: 15
  # activeStreamsTarget is the §4.1 SCL-026 secondary HPA metric target:
  # the per-replica averageValue of lenny_gateway_active_streams. It is
  # surfaced alongside the queue-depth trigger on the standalone-HPA
  # path. Leave at 0 to omit the secondary metric.
  activeStreamsTarget: 0
  # scaleUp is the §10.1 aggressive scale-up behavior. Gateway load is
  # bursty, so scale-up reacts immediately (zero stabilization window)
  # and adds the larger of double the replicas or a fixed pod count per
  # 15s period.
  scaleUp:
    # stabilizationWindowSeconds is 0 so scale-up reacts on the first
    # observation (§10.1).
    stabilizationWindowSeconds: 0
    # percentValue / percentPeriodSeconds is the §10.1 percentage
    # scale-up policy: add 100% of current replicas every 15s.
    percentValue: 100
    percentPeriodSeconds: 15
    # podValue / podPeriodSeconds is the §10.1 fixed-count scale-up
    # policy: add at least this many pods every 15s. §17.8.2 gateway
    # table: 4 pods (Tier 1/2), 8 pods (Tier 3).
    podValue: 4
    podPeriodSeconds: 15
  # scaleDown is the §10.1 scale-down protection. The §17.1 flat
  # maxUnavailable:1 PDB is the binding constraint, so scale-down is
  # pinned to one pod per 60s at every tier with a 300s stabilization
  # window to prevent mass eviction during a traffic dip.
  scaleDown:
    # stabilizationWindowSeconds is 300 so a brief traffic trough does
    # not trigger scale-down (§10.1).
    stabilizationWindowSeconds: 300
    # podValue / podPeriodSeconds is the §10.1 scale-down policy: remove
    # one pod per 60s. Pinned at every tier (§17.8.2 "Scale-down rate is
    # PDB-bound").
    podValue: 1
    podPeriodSeconds: 60
  # keda configures the §10.1 KEDA ScaledObject rendered when provider
  # is "keda". The behavior block above (scaleUp / scaleDown) is emitted
  # into the ScaledObject's advanced.horizontalPodAutoscalerConfig field
  # (§10.1 SCL-024) rather than a separate HPA manifest.
  keda:
    # pollingInterval is how often KEDA polls Prometheus, in seconds.
    # §10.1 recommends 10s for Tier 2/3 to hold the pipeline lag near
    # 20s; the KEDA default is 30s.
    pollingInterval: 10
    # cooldownPeriod is the §10.1 KEDA cooldown before scaling the
    # Deployment back toward minReplicas after the trigger clears.
    cooldownPeriod: 300
    # prometheusServerAddress is the in-cluster Prometheus query URL the
    # ScaledObject's Prometheus scaler trigger reads. Set this to the
    # Prometheus Service reachable from the KEDA operator.
    prometheusServerAddress: http://prometheus.monitoring.svc:9090

# playground configures the §27 web playground the gateway serves at
# /playground. The gateway reads these values as its --playground-*
# flags. When enabled is false the gateway mounts no /playground routes
# and /playground/* returns 404.
playground:
  # enabled turns the §27 playground on. It is off by default: the
  # playground is an evaluation and development surface.
  enabled: false
  # authMode is the §27.3 playground authentication mode. It is one of
  # oidc, apiKey, or dev. dev mode mints session-capability tokens with
  # no admission material and is only safe on a trusted local install.
  authMode: oidc
  # devTenantId is the tenant bound to every dev-mode playground token.
  # It applies only when authMode is dev.
  devTenantId: default
  # allowedRuntimes is a comma-separated glob list of runtime IDs the
  # playground runtime picker offers. The default "*" offers every
  # runtime visible to the caller.
  allowedRuntimes: "*"
  # maxSessionMinutes is the §27.6 hard cap on the duration of a
  # playground-initiated session.
  maxSessionMinutes: 30
  # maxIdleTimeSeconds is the §27.6 hard idle-timeout override for a
  # playground-initiated session.
  maxIdleTimeSeconds: 300
  # oidcSessionTtlSeconds is the lifetime of the §27.3.1 server-side
  # playground session record and its cookie.
  oidcSessionTtlSeconds: 3600
  # bearerTtlSeconds is the TTL of an MCP bearer token minted by
  # POST /v1/playground/token. The gateway bounds it to 60..3600.
  bearerTtlSeconds: 900
  # gatewayHost is the public gateway host the playground UI connects
  # to over the MCP WebSocket. It is interpolated into the §27.7
  # connect-src CSP directive. Leave empty to omit the directive host.
  gatewayHost: ""

# referenceRuntimes is the §26 reference-runtime catalog. When enabled,
# helm install registers each entry as a platform-global Runtime
# record. Per §26.1 the records carry no default tenant access; an
# operator grants access per tenant with
# POST /v1/admin/runtimes/{name}/tenant-access after install. The
# runtime images live in their own repositories and are pulled lazily
# on first session start.
referenceRuntimes:
  enabled: true
  # catalog is the §26 runtime set. Trim it to the runtimes a
  # deployment uses; an operator may also register more runtimes
  # through the admin API after install.
  catalog:
    - name: claude-code
      image: ghcr.io/lennylabs/runtime-claude-code:1.0.0
      integrationLevel: full
      allowedResourceClasses: [small, medium, large]
      supportedProviders: [anthropic_direct, aws_bedrock, gcp_vertex_anthropic]
    - name: gemini-cli
      image: ghcr.io/lennylabs/runtime-gemini-cli:1.0.0
      integrationLevel: full
      allowedResourceClasses: [small, medium, large]
      supportedProviders: [gcp_vertex_gemini, google_ai_studio]
    - name: codex
      image: ghcr.io/lennylabs/runtime-codex:1.0.0
      integrationLevel: full
      allowedResourceClasses: [small, medium, large]
      supportedProviders: [openai_direct, azure_openai]
    - name: cursor-cli
      image: ghcr.io/lennylabs/runtime-cursor-cli:1.0.0
      integrationLevel: full
      allowedResourceClasses: [small, medium, large]
      supportedProviders: [cursor_direct]
    - name: chat
      image: ghcr.io/lennylabs/runtime-chat:1.0.0
      integrationLevel: full
      allowedResourceClasses: [small]
      supportedProviders: [anthropic_direct, openai_direct, gcp_vertex_gemini]
    - name: langgraph
      image: ghcr.io/lennylabs/runtime-langgraph:1.0.0
      integrationLevel: full
      supportedProviders: [anthropic_direct, openai_direct, gcp_vertex_gemini, azure_openai]
    - name: mastra
      image: ghcr.io/lennylabs/runtime-mastra:1.0.0
      integrationLevel: full
      supportedProviders: [anthropic_direct, openai_direct, gcp_vertex_gemini]
    - name: openai-assistants
      image: ghcr.io/lennylabs/runtime-openai-assistants:1.0.0
      integrationLevel: full
      supportedProviders: [openai_direct, azure_openai]
    - name: crewai
      image: ghcr.io/lennylabs/runtime-crewai:1.0.0
      integrationLevel: full
      supportedProviders: [anthropic_direct, openai_direct]

# ops configures the §25.4 lenny-ops operability service. lenny-ops is
# mandatory in every Lenny installation (§17.8.5); the chart provides no
# flag to disable it. It runs as a Deployment with K8s Lease leader
# election (lenny-ops-leader); the leader runs the §25.4 background
# loops and every replica serves the §25 HTTP surface.
ops:
  replicas: 2
  # httpPort is the port the lenny-ops HTTP surface binds (the binary's
  # --addr flag). The lenny-ops Service exposes it; the Ingress and the
  # §13.2 NET-051 ingress NetworkPolicy reference it.
  httpPort: 8090
  # metricsPort is the port lenny-ops serves Prometheus metrics on; the
  # §13.2 NET-045 monitoring-scrape NetworkPolicy and podmonitor.yaml
  # admit and scrape it. The binary serves /metrics on the same
  # listener as the HTTP surface (httpPort), so the Service maps the
  # metrics port to that listener.
  metricsPort: 9090
  # production gates the §25.11 confirm:true requirement on full
  # backups. Set true on staging and production installs.
  production: false
  image:
    repository: ghcr.io/lennylabs/lenny-ops
    # tag defaults to the chart appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# security carries platform-wide security posture settings.
security:
  elicitationContentIntegrity:
    # floor is the deployment-wide minimum elicitation content
    # integrity enforcement mode (§9.2): off, detect-only, or enforce.
    # It is the lower bound of every tenant's effective mode and is
    # recorded on the phase-stamp ConfigMap.
    floor: "off"

# acceptFeatureFlagDowngrade explicitly acknowledges an admission-plane
# feature-flag downgrade (§17.2). Set acceptFeatureFlagDowngrade.<flag>
# to true to allow rendering a previously-enabled flag as false.
acceptFeatureFlagDowngrade: {}

# capacityPlanning selects the §17.8.2 capacity tier. The chart renders
# the tier-matched ResourceQuota defaults (resourcequota.yaml) for every
# agent namespace from this value; §17.8.2 requires operators selecting
# a capacity tier to set tier to the matching value.
capacityPlanning:
  # tier is "tier1", "tier2", or "tier3" (§17.8.2 capacity-tier
  # reference). The default tier1 matches the smallest published
  # envelope; a deployment sized for a larger tier MUST set this so the
  # rendered ResourceQuota accommodates the tier's warm-pool and
  # active-session pod demand.
  tier: tier1

# resourceGovernance configures the per-agent-namespace ResourceQuota
# and LimitRange the chart deploys (§17.2). The ResourceQuota caps total
# pods and aggregate CPU, memory, and ephemeral-storage requests so a
# controller bug or a misconfigured minWarm cannot exhaust the cluster.
# The LimitRange sets default container requests and limits so no agent
# pod is scheduled as BestEffort QoS. Both are rendered into every
# namespace listed in agentNamespaces; the lenny-preflight Job fails the
# install when either is missing.
#
# resourceQuota.tiers carries the §17.8.2 ResourceQuota tier defaults.
# The chart selects the row matching capacityPlanning.tier. A per-
# namespace override at agentNamespaces[].resourceQuota replaces the
# tier-selected values for that namespace.
resourceGovernance:
  resourceQuota:
    # enabled gates resourcequota.yaml. §17.2 requires the ResourceQuota
    # in every agent namespace, so the default is true; set false only
    # when the cluster governs agent-namespace capacity by another
    # mechanism.
    enabled: true
    tiers:
      tier1:
        pods: 200
        requestsCPU: "400"
        requestsMemory: "800Gi"
        requestsEphemeralStorage: "2Ti"
      tier2:
        pods: 2500
        requestsCPU: "5000"
        requestsMemory: "10Ti"
        requestsEphemeralStorage: "25Ti"
      tier3:
        pods: 15000
        requestsCPU: "30000"
        requestsMemory: "60Ti"
        requestsEphemeralStorage: "150Ti"
  # limitRange carries the §17.2 default container requests and limits.
  # These values are not tier-scaled; they apply to any container that
  # omits its own resource requirements. A per-namespace override at
  # agentNamespaces[].limitRange replaces them for that namespace.
  limitRange:
    # enabled gates limitrange.yaml. §17.2 requires the LimitRange in
    # every agent namespace to keep agent pods off the BestEffort QoS
    # class, so the default is true.
    enabled: true
    defaultRequest:
      cpu: "250m"
      memory: "256Mi"
    default:
      cpu: "2"
      memory: "2Gi"

# etcdEncryption controls the §13.1 etcd encryption-at-rest posture.
# When enabled (the default), the chart renders the lenny-etcd-encryption
# ConfigMap carrying an apiserver.config.k8s.io/v1 EncryptionConfiguration
# that encrypts Kubernetes Secrets at rest with an aescbc provider.
# Kubernetes does not encrypt Secrets in etcd by default, and Lenny
# stores credential-pool API keys in Secrets, so the default is on.
#
# A Helm chart cannot reconfigure the kube-apiserver: the rendered
# ConfigMap is the document the operator wires into every control-plane
# apiserver via --encryption-provider-config. See the template comment
# in templates/etcd-encryption.yaml and the key-rotation runbook at
# docs/runbooks/etcd-key-rotation.md.
etcdEncryption:
  # enabled gates the lenny-etcd-encryption ConfigMap. Leave true for
  # any cluster that stores real credentials; set false only for a
  # cloud-managed cluster where provider envelope encryption (AWS KMS,
  # GCP Cloud KMS, Azure Key Vault) covers the secrets resource instead.
  enabled: true
  # aescbcKeys optionally pins the aescbc key list. Each entry is an
  # object {name, secret} where secret is 32 random bytes base64-encoded.
  # When left empty the chart generates one key on first render and
  # preserves it verbatim across re-renders, so helm upgrade does not
  # silently rotate the key. Supply this list to manage keys out of
  # band or to stage a rotation per docs/runbooks/etcd-key-rotation.md.
  aescbcKeys: []

# preflight configures the lenny-preflight pre-install/pre-upgrade Job
# (§17.9), which runs the admission-plane checks before the install
# proceeds.
preflight:
  image:
    repository: ghcr.io/lennylabs/lenny-preflight
    # tag defaults to the chart appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# backups configures the §25.11 backup-and-restore subsystem. lenny-ops
# orchestrates backup, verify, and restore Kubernetes Jobs that run the
# lenny-backup image; the values here cover the shared image, the
# retention policy, and the periodic test-restore CronJob.
backups:
  image:
    repository: ghcr.io/lennylabs/lenny-backup
    # tag defaults to the chart appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  # retention is the §25.11 retention policy. The base values are the
  # Tier-2 defaults; values-tier1.yaml and values-tier3.yaml override
  # them. The chart refuses to render retainMinFull or retainCount
  # below 1 (no zero-retention configs).
  retention:
    retainDays: 30
    retainCount: 10
    retainMinFull: 3
    # preRestoreRetainDays is the §25.11 shorter retention window for
    # the pre-restore safety backups restore/execute creates.
    preRestoreRetainDays: 7
  # verification configures the §25.11 backup verification path.
  verification:
    # artifactSampleSize is the §25.11 backups.verification.-
    # artifactSampleSize: the number of ArtifactStore object keys the
    # test-restore Job samples with a HEAD against the replication
    # target.
    artifactSampleSize: 100
  # restoreTest configures the §25.11 lenny-restore-test CronJob: the
  # periodic Job that restores a backup into a scratch namespace, runs
  # smoke tests against the temporary Postgres, samples the ArtifactStore
  # replication target, and tears the namespace down. §25.11 recommends
  # a monthly test restore for Tier 3.
  restoreTest:
    # enabled gates the CronJob. Tier 3 sets it true; the Tier-2 base
    # leaves it false so a staging install does not run test restores
    # without an explicit opt-in.
    enabled: false
    # schedule is the cron expression for the test restore. The default
    # is the first day of each month at 04:00 UTC, matching the §25.11
    # monthly-test-restore recommendation.
    schedule: "0 4 1 * *"
    # backupSelector picks which backup the test restores. "latest-full"
    # restores the most recent successful full backup; a literal backup
    # id pins a specific backup.
    backupSelector: "latest-full"
    # historyLimits bound how many finished test-restore Jobs the
    # CronJob retains for post-mortem inspection.
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    # activeDeadlineSeconds is the hard deadline for one test-restore
    # Job; a run exceeding it is killed.
    activeDeadlineSeconds: 3600
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# bootstrap configures the §17.6 Day-1 seed mechanism. The chart renders
# the values below into the lenny-bootstrap-values ConfigMap, and the
# lenny-bootstrap post-install/post-upgrade Job runs
# `lenny-ctl bootstrap --from-values /etc/lenny/bootstrap-values.yaml`
# against the admin API. The Job is idempotent (upsert by name), so it
# runs safely on every `helm install` and `helm upgrade`.
bootstrap:
  # enabled gates the bootstrap-values ConfigMap and the lenny-bootstrap
  # Job. Leave it true to seed Day-1 configuration; set it false to skip
  # the post-install hook entirely.
  enabled: true
  image:
    repository: ghcr.io/lennylabs/lenny-ctl
    # tag defaults to the chart appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # waitTimeoutSeconds bounds how long the Job polls the gateway
  # GET /healthz endpoint for readiness before it gives up.
  waitTimeoutSeconds: 120
  # auth selects how the Job authenticates to the admin API. When
  # operatorTokenSecret.name is set, the Job mounts that Secret and
  # passes the token as `--bearer`. Otherwise, when global.devMode is
  # true, the Job falls back to the dev-header path (--dev-tenant /
  # --dev-roles); the gateway honors X-Lenny-Roles only when dev mode
  # is on. A non-dev install with no operatorTokenSecret renders the
  # Job with the dev-header fallback, which the gateway rejects — set
  # operatorTokenSecret for any clustered deployment.
  auth:
    # operatorTokenSecret references an existing Secret holding a
    # platform-admin bearer token. The Job reads the token from the
    # named key and sends it as `Authorization: Bearer <token>`.
    operatorTokenSecret:
      name: ""
      key: token
    # devTenant and devRoles drive the dev-header fallback used when no
    # operatorTokenSecret is set and global.devMode is true.
    devTenant: platform
    devRoles: platform-admin
  # tenants, runtimes, and users are the seed resources. Each list
  # matches the POST /v1/admin/bootstrap BootstrapRequest schema. All
  # three are optional and idempotent (upsert by name).
  #
  # Example seed (uncomment and adapt for a Day-1 install):
  #
  # tenants:
  #   - id: acme
  #     displayName: Acme Corp
  #     workspaceTier: standard
  # runtimes:
  #   - name: echo
  #     type: agent
  #     image: ghcr.io/lennylabs/echo:latest
  #     executionMode: direct
  # users:
  #   - subject: alice@acme.com
  #     tenantId: acme
  #     email: alice@acme.com
  #     roles:
  #       - user
  tenants: []
  runtimes: []
  users: []
