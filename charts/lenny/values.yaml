# Default values for the lenny chart.
#
# The control plane (gateway, token service, controllers, lenny-ops,
# stores) runs in the Helm release namespace, lenny-system by default.
# Agent pods run in the dedicated namespaces listed below.

# agentNamespaces declares the namespaces that hold agent pods (§17.2).
# Each entry is an object so per-namespace ResourceQuota and LimitRange
# overrides can be attached as the chart grows. Admission policies and
# NetworkPolicies scope themselves to the namespaces named here.
agentNamespaces:
  - name: lenny-agents
  - name: lenny-agents-kata

# controller configures the lenny-controller Deployment, which runs
# the §4.6.1 WarmPoolController. It runs with 2 replicas and leader
# election so exactly one replica reconciles at a time.
controller:
  replicas: 2
  image:
    repository: ghcr.io/lennylabs/lenny-controller
    # tag defaults to the chart appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
