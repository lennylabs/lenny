# Default values for the lenny chart.
#
# The control plane (gateway, token service, controllers, lenny-ops,
# stores) runs in the Helm release namespace, lenny-system by default.
# Agent pods run in the dedicated namespaces listed below.

# agentNamespaces declares the namespaces that hold agent pods (§17.2).
# Each entry is an object so per-namespace ResourceQuota and LimitRange
# overrides can be attached as the chart grows. Admission policies and
# NetworkPolicies scope themselves to the namespaces named here.
agentNamespaces:
  - name: lenny-agents
  - name: lenny-agents-kata

# controller configures the lenny-controller Deployment, which runs
# the §4.6.1 WarmPoolController. It runs with 2 replicas and leader
# election so exactly one replica reconciles at a time.
controller:
  replicas: 2
  # metricsPort is the port the controller serves Prometheus metrics
  # on (§13.2); the monitoring-scrape NetworkPolicy admits it.
  metricsPort: 9090
  image:
    repository: ghcr.io/lennylabs/lenny-controller
    # tag defaults to the chart appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# admissionWebhooks configures the ValidatingAdmissionWebhook
# Deployments under templates/admission-policies/ (§17.2). Each webhook
# is its own Deployment + Service + PodDisruptionBudget running the
# lenny-webhook image; cert-manager issues each serving certificate.
admissionWebhooks:
  replicas: 2
  image:
    repository: ghcr.io/lennylabs/lenny-webhook
    # tag defaults to the chart appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# webhookIngressCIDR is the source CIDR allowed to reach the admission
# webhook pods (§13.2). The kube-apiserver calls webhooks from a node
# or control-plane IP that is impractical to pin without cloud-specific
# knowledge; the default is safe because the lenny-system namespace is
# default-deny and the webhook pods authenticate callers via mTLS.
webhookIngressCIDR: "0.0.0.0/0"

# kubeApiServerCIDR is the destination CIDR the control-plane
# components are allowed to reach the kube-apiserver on (§13.2).
# Operators should tighten this to the cluster's apiserver endpoint;
# the broad default is bounded by the per-port (443) egress rule.
kubeApiServerCIDR: "0.0.0.0/0"

# tokenService configures the §4.3 Token Service.
tokenService:
  # grpcPort is the mTLS gRPC port the gateway reaches the Token
  # Service on (§13.2).
  grpcPort: 50052
  # metricsPort is the port the Token Service serves Prometheus
  # metrics on (§13.2); the monitoring-scrape NetworkPolicy admits it.
  metricsPort: 9090

# redis configures the Redis connection.
redis:
  # tlsPort is the TLS port for Redis (§13.2).
  tlsPort: 6380

# minio configures the MinIO object store (self-managed profile).
minio:
  # tlsPort is the TLS port the gateway reaches MinIO on (§13.2).
  tlsPort: 9443

# kms configures the external KMS endpoint the Token Service calls.
kms:
  # endpointCIDR is the destination CIDR for the KMS HTTPS endpoint
  # (§13.2). Operators should tighten this to the provider's range;
  # the broad default is bounded by the per-port (443) egress rule.
  endpointCIDR: "0.0.0.0/0"

# monitoring identifies the Prometheus monitoring namespace whose
# scrape requests the §13.2 metrics-scrape NetworkPolicies admit, and
# configures the §16.9 / §25.13 bundled §16.5 alerting rules.
monitoring:
  namespace: "monitoring"
  # bundleRules gates the §16.5 alert catalog manifests (§25.13). The
  # full catalog is generated from pkg/alerting/rules into
  # files/alerting-rules.yaml; the prometheusrule.yaml template renders
  # it. Default true so an out-of-the-box install has working alerts.
  bundleRules: true
  # format selects how the §16.5 rules are rendered (§25.13 Helm
  # Rendering): "prometheusrule" emits a PrometheusRule CRD for
  # deployers running the Prometheus Operator; "configmap" emits a
  # ConfigMap with rules.yaml for vanilla Prometheus; "both" emits both.
  format: "prometheusrule"
  # prometheusRule configures the rendered PrometheusRule CRD.
  prometheusRule:
    # namespace defaults to monitoring.namespace when empty.
    namespace: ""
    # additionalLabels are added to the PrometheusRule so the
    # Prometheus Operator's ruleSelector can discover it.
    additionalLabels: {}
  # configMap configures the rendered ConfigMap rule file.
  configMap:
    # namespace defaults to the release namespace (lenny-system) when
    # empty.
    namespace: ""
    name: "lenny-alerting-rules"

# postgres configures the Postgres connection.
postgres:
  # cidr is the destination CIDR PgBouncer is allowed to reach
  # Postgres on (§13.2). Operators should tighten this to the
  # database endpoint; the broad default is bounded by the per-port
  # (5432) egress rule.
  cidr: "0.0.0.0/0"

# features gates the optional admission webhooks (§17.2 feature-gated
# chart inventory). The Phase 3.5 baseline webhooks render
# unconditionally; these flags add the later-phase webhooks.
features:
  llmProxy: false
  drainReadiness: false
  compliance: false

# tenancy configures the platform multi-tenancy posture (§4.9, §13).
tenancy:
  # mode is "single" or "multi". In multi-tenant mode the
  # lenny-direct-mode-isolation webhook rejects the §4.9
  # credential-delivery configurations that expose cross-tenant
  # credential risk: deliveryMode direct with isolationProfile standard,
  # and deliveryMode proxy with spiffeBinding disabled.
  mode: single

# global holds chart-wide settings shared across components.
global:
  # devMode relaxes the multi-tenant admission controls for local
  # development (§4.9). It must never be enabled on a real multi-tenant
  # cluster.
  devMode: false
  # spiffeTrustDomain is the SPIFFE trust domain anchoring agent-pod
  # and in-cluster-interceptor identities (§10.3). It is the host
  # component of every spiffe:// URI Lenny issues. Defaults to the
  # cluster DNS domain so a stock install has a stable anchor.
  spiffeTrustDomain: cluster.local

# mtls configures the §10.3 gateway-to-agent-pod mTLS PKI: a
# cluster-internal certificate authority managed by cert-manager and
# the per-component serving certificates for the internal control-plane
# mTLS identities (gateway, controller, token service). Agent-pod
# certificates are issued per pod at pod-creation time with a
# pod-specific SPIFFE SAN and a 4h TTL; they are not static chart
# resources and are therefore not rendered here. The per-component
# certificates issued here all chain to the CA below, so the gateway,
# controller, and token service validate each other against one trust
# anchor (§10.3 mutual SAN validation).
mtls:
  # enabled gates the §10.3 internal mTLS PKI templates. Leave true for
  # any cluster that runs gateway-to-pod mTLS through cert-manager. Set
  # false when a service mesh (Istio, Linkerd) supplies mTLS instead,
  # in which case the mesh issues the identities (§10.3).
  enabled: true
  # caDurationHours is the lifetime of the cluster-internal CA
  # certificate. The CA outlives the leaf certificates by a wide margin
  # so leaf renewal never races CA expiry.
  caDurationHours: 8760
  # caRenewBeforeHours is how long before CA expiry cert-manager
  # renews the CA certificate.
  caRenewBeforeHours: 720
  # leafDurationHours is the lifetime of the per-component leaf
  # certificates (gateway, controller, token service). §10.3 sets the
  # control-plane component TTL at 24h.
  leafDurationHours: 24
  # leafRenewBeforeHours is how long before leaf expiry cert-manager
  # renews a component certificate. §10.3 renews at 2/3 of lifetime, so
  # the default 8h on a 24h certificate matches that ratio.
  leafRenewBeforeHours: 8

# adapter configures the §4.7 runtime adapter sidecar that runs in
# every agent pod.
adapter:
  # grpcPort is the adapter's gRPC listen port (§13.2). The gateway
  # reaches each pod's adapter on this port; the agent-namespace
  # allow-gateway-ingress NetworkPolicy admits it.
  grpcPort: 50051

# gateway configures the §4.1 edge gateway.
gateway:
  # grpcPort is the pod-to-gateway gRPC control-channel port (§13.2),
  # admitted by the agent-namespace allow-pod-egress-base NetworkPolicy.
  grpcPort: 50051
  # metricsPort is the port the gateway serves Prometheus metrics on
  # (§13.2); the monitoring-scrape NetworkPolicy admits it.
  metricsPort: 9090
  # llmProxyPort is the gateway's LLM reverse-proxy port (§13.2). Only
  # proxy-mode agent pods are admitted to it, by the supplemental
  # allow-pod-egress-llm-proxy NetworkPolicy.
  llmProxyPort: 8443
  # internalPort is the gateway's internal HTTP port (§13.2). The
  # lenny-drain-readiness webhook reaches GET /internal/drain-readiness
  # on this port for its §12.5 pre-drain MinIO health check.
  internalPort: 8080

# security carries platform-wide security posture settings.
security:
  elicitationContentIntegrity:
    # floor is the deployment-wide minimum elicitation content
    # integrity enforcement mode (§9.2): off, detect-only, or enforce.
    # It is the lower bound of every tenant's effective mode and is
    # recorded on the phase-stamp ConfigMap.
    floor: "off"

# acceptFeatureFlagDowngrade explicitly acknowledges an admission-plane
# feature-flag downgrade (§17.2). Set acceptFeatureFlagDowngrade.<flag>
# to true to allow rendering a previously-enabled flag as false.
acceptFeatureFlagDowngrade: {}

# etcdEncryption controls the §13.1 etcd encryption-at-rest posture.
# When enabled (the default), the chart renders the lenny-etcd-encryption
# ConfigMap carrying an apiserver.config.k8s.io/v1 EncryptionConfiguration
# that encrypts Kubernetes Secrets at rest with an aescbc provider.
# Kubernetes does not encrypt Secrets in etcd by default, and Lenny
# stores credential-pool API keys in Secrets, so the default is on.
#
# A Helm chart cannot reconfigure the kube-apiserver: the rendered
# ConfigMap is the document the operator wires into every control-plane
# apiserver via --encryption-provider-config. See the template comment
# in templates/etcd-encryption.yaml and the key-rotation runbook at
# docs/runbooks/etcd-key-rotation.md.
etcdEncryption:
  # enabled gates the lenny-etcd-encryption ConfigMap. Leave true for
  # any cluster that stores real credentials; set false only for a
  # cloud-managed cluster where provider envelope encryption (AWS KMS,
  # GCP Cloud KMS, Azure Key Vault) covers the secrets resource instead.
  enabled: true
  # aescbcKeys optionally pins the aescbc key list. Each entry is an
  # object {name, secret} where secret is 32 random bytes base64-encoded.
  # When left empty the chart generates one key on first render and
  # preserves it verbatim across re-renders, so helm upgrade does not
  # silently rotate the key. Supply this list to manage keys out of
  # band or to stage a rotation per docs/runbooks/etcd-key-rotation.md.
  aescbcKeys: []

# preflight configures the lenny-preflight pre-install/pre-upgrade Job
# (§17.9), which runs the admission-plane checks before the install
# proceeds.
preflight:
  image:
    repository: ghcr.io/lennylabs/lenny-preflight
    # tag defaults to the chart appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# backups configures the §25.11 backup-and-restore subsystem. lenny-ops
# orchestrates backup, verify, and restore Kubernetes Jobs that run the
# lenny-backup image; the values here cover the shared image, the
# retention policy, and the periodic test-restore CronJob.
backups:
  image:
    repository: ghcr.io/lennylabs/lenny-backup
    # tag defaults to the chart appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  # retention is the §25.11 retention policy. The base values are the
  # Tier-2 defaults; values-tier1.yaml and values-tier3.yaml override
  # them. The chart refuses to render retainMinFull or retainCount
  # below 1 (no zero-retention configs).
  retention:
    retainDays: 30
    retainCount: 10
    retainMinFull: 3
    # preRestoreRetainDays is the §25.11 shorter retention window for
    # the pre-restore safety backups restore/execute creates.
    preRestoreRetainDays: 7
  # verification configures the §25.11 backup verification path.
  verification:
    # artifactSampleSize is the §25.11 backups.verification.-
    # artifactSampleSize: the number of ArtifactStore object keys the
    # test-restore Job samples with a HEAD against the replication
    # target.
    artifactSampleSize: 100
  # restoreTest configures the §25.11 lenny-restore-test CronJob: the
  # periodic Job that restores a backup into a scratch namespace, runs
  # smoke tests against the temporary Postgres, samples the ArtifactStore
  # replication target, and tears the namespace down. §25.11 recommends
  # a monthly test restore for Tier 3.
  restoreTest:
    # enabled gates the CronJob. Tier 3 sets it true; the Tier-2 base
    # leaves it false so a staging install does not run test restores
    # without an explicit opt-in.
    enabled: false
    # schedule is the cron expression for the test restore. The default
    # is the first day of each month at 04:00 UTC, matching the §25.11
    # monthly-test-restore recommendation.
    schedule: "0 4 1 * *"
    # backupSelector picks which backup the test restores. "latest-full"
    # restores the most recent successful full backup; a literal backup
    # id pins a specific backup.
    backupSelector: "latest-full"
    # historyLimits bound how many finished test-restore Jobs the
    # CronJob retains for post-mortem inspection.
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    # activeDeadlineSeconds is the hard deadline for one test-restore
    # Job; a run exceeding it is killed.
    activeDeadlineSeconds: 3600
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
