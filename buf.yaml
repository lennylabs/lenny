version: v2

# Workspace config. The actual module config (lint rules, breaking-change
# rules) lives in schemas/buf.yaml. Listing the module here lets `buf lint`
# and `buf build` work from the repo root, which is what CI invokes.

modules:
  - path: schemas
    lint:
      use:
        - STANDARD
      except:
        - FILE_LOWER_SNAKE_CASE
        - PACKAGE_DIRECTORY_MATCH
        - DIRECTORY_SAME_PACKAGE
        - SERVICE_SUFFIX
      enum_zero_value_suffix: _UNSPECIFIED
      rpc_allow_google_protobuf_empty_requests: false
      rpc_allow_google_protobuf_empty_responses: false
    breaking:
      use:
        - FILE
      ignore_unstable_packages: true
