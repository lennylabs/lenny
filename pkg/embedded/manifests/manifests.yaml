            # false to disable provisioning entirely. F-17.6.3.
            - name: LENNY_ADMIN_TOKEN_SECRET_NAME
              value: "lenny-admin-token"
            - name: LENNY_ADMIN_TOKEN_TENANT
              value: "default"
            # §16.5 line 623 — slo.validated gates the gateway's
            # provisional-SLO startup warning. False (the default) emits
            # the §16.5 warning at startup so an operator running
