# Source: lenny/templates/controller-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lenny-controller
  namespace: default
  labels:
    helm.sh/chart: lenny-0.1.0
    app.kubernetes.io/name: lenny
    app.kubernetes.io/instance: lenny
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    lenny.dev/component: controller
spec:
  replicas: 1
  # spec: §10.5 line 403 ("Rolling Deployment updates") / §17.1. The
  # strategy block is declared explicitly so the rolling posture is
  # auditable and survives chart customization rather than relying on
  # the Kubernetes 25% default. The controller is leader-elected, so a
  # rollout that drains one replica at a time keeps a standby ready to
  # take the lease while the replacement comes up.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lenny
      lenny.dev/component: controller
  template:
    metadata:
      labels:
        helm.sh/chart: lenny-0.1.0
        app.kubernetes.io/name: lenny
        app.kubernetes.io/instance: lenny
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.1.0"
        lenny.dev/component: controller
    spec:
      serviceAccountName: lenny-controller
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    lenny.dev/component: pool-scaling-controller
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "ghcr.io/lennylabs/lenny-controller:0.1.0"
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --leader-election-namespace=default
            - --metrics-bind-address=:9090
            - --health-probe-bind-address=:8081
            - --adapter-image=ghcr.io/lennylabs/lenny-adapter:0.1.0
            - --gateway-grpc-addr=lenny-gateway.default.svc:50051
            - --dev-mode
            - --adapter-uid=65532
            - --agent-uid=65533
            - --cred-readers-gid=65534
          ports:
            # spec: §16.9 — named metrics containerPort on
            # controller.metricsPort so the lenny-controller Service and
            # the ServiceMonitor `port: metrics` selector resolve to the
            # controller's metrics listener. F-16.9.2.
            - name: metrics
              containerPort: 9090
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
