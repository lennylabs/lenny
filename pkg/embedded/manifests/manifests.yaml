            # Rendered from autoscaling.minReplicas so a tier-preset
            # override flows into the lenny_gateway_min_replicas gauge.
            - name: LENNY_MIN_REPLICAS
              value: "2"
            # §4.1 / §16.5 GatewayActiveStreamsHigh alert denominator.
            # Defaults to gateway.streamCeiling when set; otherwise uses
            # gateway.maxSessionsPerReplica so a stock render emits a
            # non-zero ceiling consistent with the per-replica session
            # capacity (each session may hold at most one active stream).
            - name: LENNY_STREAM_CEILING
              value: "50"
            # §4.4 line 263 / §10.1 — preStop hook reads this to bound
            # the staged drain budget. The chart-default 240s matches
            # the terminationGracePeriodSeconds set below so the
            # gateway honors the same deadline Kubernetes enforces.
            - name: LENNY_TERMINATION_GRACE_SECONDS
              value: "240"
            # §10.1 line 167 / §11.3 line 210 — checkpointBarrierAckTimeoutSeconds:
            # the single wall-clock deadline the preStop CheckpointBarrier
            # fan-out runs under across all coordinated pods. The 90s default
            # matches the §11.3 line 210 value and fits inside the grace period.
            - name: LENNY_CHECKPOINT_BARRIER_ACK_TIMEOUT_SECONDS
              value: "90"
            # §10.1 line 131 / §17.8.1 — checkpointGrantWindow: the number of
            # chunk-upload capabilities the gateway keeps outstanding at once
            # while draining a session's workspace checkpoint. It bounds the
            # pipelining depth and the worst-case unreconciled overage against
            # a backend that ignores the signed Content-Length. Default 4; a
            # pool config value overrides this deployment-wide default.
            - name: LENNY_CHECKPOINT_GRANT_WINDOW
              value: "4"
            # §13.2 / §17.8.1 — checkpointCapabilityTTLSeconds: the expiry of
            # each gateway-minted presigned checkpoint upload or restore
            # capability. Default 30.
            - name: LENNY_CHECKPOINT_CAPABILITY_TTL_SECONDS
              value: "30"
            # §10.1 item 4 — dualStoreUnavailableMaxSeconds: the
            # per-replica window after which sessions with no successful
            # store interaction become eligible for graceful termination
            # once a store recovers. The dual-store monitor is active only
            # when both Postgres and Redis are wired.
            - name: LENNY_DUAL_STORE_UNAVAILABLE_MAX_SECONDS
              value: "60"
            # §4.6.1 reserved hold — gateway.claimHoldTTLSeconds is the
            # deployment-level TTL of the `reserved` claim window. When a
            # recycling pod's occupancy reaches zero the gateway patches
            # the per-pod SandboxClaim to `reserved` and holds it for this
            # many seconds so a back-to-back same-tenant session rebinds
            # (reserved → bound) with no acquisition round trip; on expiry
            # the holder deletes the claim and the pod returns to idle. A
            # reserved pod is counted as occupied for inventory and scaling
            # (§4.6.2), so a high value depresses apparent idle inventory;
            # the gateway warns at startup when it is set high.
            - name: LENNY_CLAIM_HOLD_TTL_SECONDS
              value: "10"
            # §12.4 / §6.57 slotCounterPostgresFallbackMaxSeconds — the
            # bounded window during a Redis outage in which the §5.2 slot
            # counter gates intra-pod capacity on the Postgres fallback under
            # a per-pod advisory lock. After this window with Redis still
            # unreachable, slot admission fails closed so a sustained Redis
            # outage cannot keep the gateway gating capacity on the
            # higher-latency Postgres path indefinitely.
            - name: LENNY_SLOT_COUNTER_POSTGRES_FALLBACK_MAX_SECONDS
              value: "60"
            # §11.3 line 215 — credentials.expiryWarningLeadSeconds. The
            # renewal worker emits a structured warning log when a tracked
            # lease enters this window of its ExpiresAt. 0 disables.
            # F-11.3.20.
            - name: LENNY_CREDENTIALS_EXPIRY_WARNING_LEAD_SECONDS
              value: "3600"
            # §11.3 line 222 — rateLimitFailOpenMaxSeconds. The §11.1
            # admission middleware fails closed once a single fail-open
            # episode has run past this cap. Negative disables the cap.
            # F-11.3.22.
            - name: LENNY_RATE_LIMIT_FAILOPEN_MAX_SECONDS
              value: "60"
            # §12.4 lines 222-224 — per-replica fail-open emergency controls.
            # quotaUserFailOpenFraction bounds a single user; the hard cap
            # bounds the per-replica tenant ceiling; the cumulative max is the
            # financial-security control that transitions the replica to
            # fail-closed for quota. F-12.4.9.
            - name: LENNY_QUOTA_USER_FAILOPEN_FRACTION
              value: "0.25"
            - name: LENNY_QUOTA_PER_REPLICA_HARD_CAP
              value: "0"
            - name: LENNY_QUOTA_FAILOPEN_CUMULATIVE_MAX_SECONDS
              value: "300"
            # §11.2 line 44 — quotaSyncIntervalSeconds: cadence at which
            # Redis quota and delegation-budget counters checkpoint to
            # Postgres (default 30, minimum 10). Lower it for high-throughput
            # tenants to bound crash-recovery overshoot. F-11.2.16.
            - name: LENNY_QUOTA_SYNC_INTERVAL_SECONDS
              value: "30"
            # §12.4 line 268 — quotaEnforcementMode: `redis` (default) reads
            # the Redis token counters on the admission path;
            # `in_memory_reconciled` draws a per-replica budget slice from
            # Postgres and reconciles it every quotaSyncIntervalSeconds (or at
            # 80% slice consumption), tolerating full Redis unavailability for
            # quota enforcement with bounded overshoot. The in-memory mode
            # requires Postgres. F-12.4.14.
            - name: LENNY_QUOTA_ENFORCEMENT_MODE
              value: "redis"
            # §11.2 line 48 — delegationNodeMemoryFootprintBytes: per-node
            # footprint the delegation-budget reconstruction multiplies by
            # the live descendant count to derive liveMemoryBytes on Redis
            # recovery (default 12288 / 12 KB). F-11.2.5.
            - name: LENNY_DELEGATION_NODE_MEMORY_FOOTPRINT_BYTES
              value: "12288"
            # §10.7 line 938 — per-session and per-tenant eval-submission
            # rate limits on POST /v1/sessions/{id}/eval. Default 100 /
            # 10000 per minute; a negative value disables the scope.
            # F-10.7.4 / F-11.2.19.
            - name: LENNY_EVAL_RATE_LIMIT_PER_SESSION_PER_MIN
              value: "100"
            - name: LENNY_EVAL_RATE_LIMIT_PER_TENANT_PER_MIN
              value: "10000"
            # §10.7 line 1088 — lenny_eval_aggregates materialized-view
            # refresh interval. 0 keeps on-read aggregation; positive
            # enables the matview read + periodic REFRESH. F-10.7.12.
            - name: LENNY_EVAL_AGGREGATION_REFRESH_SECONDS
              value: "0"
            # §11.1 lines 10-11 — concurrent-upload and per-session
            # upload-size admission caps, distinct from the §4.1 upload
            # handler back-pressure semaphore. Zero leaves each scope
            # unlimited. F-11.1.5, F-11.1.6.
            # §11.1 line 8 — global, per-user, and per-runtime
            # concurrent-session admission caps (live non-terminal session
            # counts). The per-tenant scope is enforced separately against
            # the tenant record. Zero leaves a scope unlimited. F-11.1.3.
            # §8.10 lines 1022-1023 / 1042 — operator-tunable per-level and
            # whole-tree recovery deadlines feed recovery.Config. F-8.10.6.
            - name: LENNY_DELEGATION_MAX_LEVEL_RECOVERY_SECONDS
              value: "120"
            - name: LENNY_DELEGATION_MAX_TREE_RECOVERY_SECONDS
              value: "600"
            # §8.10 line 1078 — cascadeTimeoutSeconds. F-8.10.9.
            - name: LENNY_DELEGATION_CASCADE_TIMEOUT_SECONDS
              value: "3600"
            # §8.10 line 1103 — maxOrphanTasksPerTenant. Feeds both the
            # sessionserver detach-cascade fallback and the §16.5
            # OrphanTasksPerTenantHigh alert denominator. F-8.10.10.
            - name: LENNY_DELEGATION_MAX_ORPHAN_TASKS_PER_TENANT
              value: "100"
            # §11.1 line 9 — per-user active-delegated-children admission
            # cap (live children across all of a user's sessions/trees).
            # Zero (or omitted) leaves the scope unlimited and renders no
            # env var. F-11.1.4.
            # §12.5 line 317 — gc.cycleIntervalSeconds: the leader-elected
            # GC sweep cadence (default 900, minimum 60). Drives both the
            # §7.1 retention soft-delete sweep and the §12.5 line 341
            # tombstone hard-prune sweep. F-12.5.19.
            - name: LENNY_GC_CYCLE_INTERVAL_SECONDS
              value: "900"
            # §12.5 line 341 — gc.tombstoneRetentionSeconds: how long a
            # soft-deleted artifact_store row is retained before the
            # hard-prune sweep removes it (default 86400 / 24h). F-12.5.19.
            - name: LENNY_GC_TOMBSTONE_RETENTION_SECONDS
              value: "86400"
            # §12.5 lines 317, 332 — gc.leaderElection: gate the
            # gateway-singleton sweeps under the lenny-gateway-leader Lease
            # so exactly one replica is the GC writer. Defaults to true in
            # the binary; set false to run un-elected (single-replica
            # deployments). F-12.5.10.
            - name: LENNY_GATEWAY_LEADER_ELECTION
              value: "true"
            # §12.5 line 307 (STO-021) — the leader-elected continuous T4
            # KMS availability probe cadence (default 300, minimum 60) and
            # the token-bucket rate ceiling (default 10 probes/sec).
            # F-12.5.4.
            - name: LENNY_T4_KMS_PROBE_INTERVAL_SECONDS
              value: "300"
            - name: LENNY_T4_KMS_PROBE_RATE_LIMIT
              value: "10"
            # §4.1 extractionThresholds — per-subsystem extraction
            # thresholds surfaced from Helm so operators can calibrate
            # them at deploy time. Each value is also emitted at startup
            # on the lenny_gateway_extraction_threshold{subsystem,metric}
            # gauge for auditability against /metrics.
            - name: LENNY_EXTRACTION_THRESHOLD_STREAM_PROXY_QUEUE_DEPTH
              value: "500"
            - name: LENNY_EXTRACTION_THRESHOLD_STREAM_PROXY_P99_ATTACH_LATENCY_SECONDS
              value: "0.8"
            - name: LENNY_EXTRACTION_THRESHOLD_UPLOAD_HANDLER_ACTIVE_CONCURRENT
              value: "200"
            - name: LENNY_EXTRACTION_THRESHOLD_UPLOAD_HANDLER_P99_LATENCY_SECONDS
              value: "2"
            - name: LENNY_EXTRACTION_THRESHOLD_MCP_FABRIC_ACTIVE_DELEGATIONS
              value: "1000"
            - name: LENNY_EXTRACTION_THRESHOLD_MCP_FABRIC_P99_ORCHESTRATION_LATENCY_SECONDS
              value: "2"
            - name: LENNY_EXTRACTION_THRESHOLD_LLM_PROXY_ACTIVE_CONNECTIONS
              value: "2000"
            - name: LENNY_EXTRACTION_THRESHOLD_LLM_PROXY_P99_TTFB_SECONDS
              value: "1"
            # §11.2.1 line 187 / §16.5: BillingCorrectionRateHigh
            # alert threshold as a fraction. Gateway emits it on
            # lenny_billing_correction_rate_threshold at startup.
            - name: LENNY_BILLING_CORRECTION_RATE_THRESHOLD
              value: "0.05"
            # §11.2.1 line 151 billing.retentionDays: how long billing
            # events are retained before the retention pruner deletes
            # them (default 395). The gateway rejects a value below a
            # tenant's regulated complianceProfile floor at startup.
            # F-11.2.15.
            - name: LENNY_BILLING_RETENTION_DAYS
              value: "395"
            # §12.3 line 76 billing-event buffering tunables. The gateway
            # flushes the Tier 2 write-ahead buffer in flushBatchSize
            # batches every flushIntervalMs, and emits
            # billing_flush_pressure once the buffer exceeds
            # flushMaxPending. F-12.3.13.
            - name: LENNY_BILLING_FLUSH_INTERVAL_MS
              value: "500"
            - name: LENNY_BILLING_FLUSH_BATCH_SIZE
              value: "50"
            - name: LENNY_BILLING_FLUSH_MAX_PENDING
              value: "500"
            # §17.8.2 line 1203 billingRedisStreamMaxLen — per-tenant
            # MAXLEN of the §11.2.1 billing failover Redis stream. 0 lets
            # the gateway resolve the per-tier default from
            # LENNY_CAPACITY_TIER (72,000 at Tier 3, else 50,000); a
            # positive value pins it. F-17.8.5.
            - name: LENNY_BILLING_REDIS_STREAM_MAX_LEN
              value: "0"
            # §11.2.1 lines 132-138 billing-event delivery sinks: the
            # webhook sink URL and (via secretKeyRef) its HMAC signing
            # secret, plus the §11.2.1 line 175 dual-control approver
            # notification webhook. Each is rendered only when configured.
            # F-11.2.14.
            # §17.8.2 capacityPlanning.tier — drives the
            # billingRedisStreamMaxLen default and the §17.8.2 line 1164
            # RedisClusterRecommended startup warning. F-17.8.5, F-17.8.7.
            - name: LENNY_CAPACITY_TIER
              value: "tier1"
            # §17.8.2 line 1164 capacityPlanning.singleTenantRedisTopology —
            # set "sentinel" to suppress the Tier 3 RedisClusterRecommended
            # startup warning. F-17.8.7.
            # §12.3 line 123 postgres.writeCeilingIops — emitted on
            # lenny_postgres_write_ceiling_iops for the §16.5
            # PostgresWriteSaturation alert. F-12.3.8.
            - name: LENNY_POSTGRES_WRITE_CEILING_IOPS
              value: "200"
            # §12.6 lines 556-558 storeRouter.* — scatter-gather execution
            # bounds. v1 is single-shard so these are inert; surfaced so a
            # multi-shard deployment tunes them and the §16
            # ScatterGatherSlowQuery alert has a series. F-12.6.18.
            - name: LENNY_SCATTER_MAX_CONCURRENCY
              value: "16"
            - name: LENNY_SCATTER_PER_SHARD_TIMEOUT_SECONDS
              value: "10"
            - name: LENNY_SCATTER_AGGREGATE_TIMEOUT_SECONDS
              value: "120"
            # §12.6 lines 683-699 eventBus.* — the EventBus retranscribe
            # worker cadence/ceiling, the EventBusPublishDropped alert
            # threshold gauge, and the test-only duplicate-injection factor.
            # F-12.6.22 / F-12.6.23.
            - name: LENNY_EVENTBUS_RETRY_INTERVAL_SECONDS
              value: "60"
            - name: LENNY_EVENTBUS_MAX_RETRY_ATTEMPTS
              value: "5"
            - name: LENNY_EVENTBUS_DROP_ALERT_THRESHOLD
              value: "10"
            - name: LENNY_EVENTBUS_DUPLICATE_INJECTION_FACTOR
              value: "1"
            # §12.3 line 101 audit.startupChainCheckEntries — the
            # most-recent N audit rows per tenant re-verified by the
            # startup chain-continuity check. F-12.3.9.
            - name: LENNY_AUDIT_STARTUP_CHAIN_CHECK_ENTRIES
              value: "1000"
            # §11.7 item 2 audit.grantCheckInterval / audit.hardFailOnDrift —
            # cadence and drift policy of the periodic background integrity
            # check. 0 selects the profile default (regulated 60s,
            # unregulated 300s); a value above the profile maximum is a
            # fatal startup error. F-11.7.3.
            - name: LENNY_AUDIT_GRANT_CHECK_INTERVAL_SECONDS
              value: "0"
            - name: LENNY_AUDIT_HARD_FAIL_ON_DRIFT
              value: "false"
            # §12.3 lines 79-81 audit sync write pool + T2 batching
            # opt-in. syncWritePoolSize sizes the dedicated audit write
            # pool; batchingEnabled + flushIntervalMs + flushBatchSize
            # drive the opt-in T2 batch buffer. F-12.3.14 / F-12.3.15.
            - name: LENNY_AUDIT_SYNC_WRITE_POOL_SIZE
              value: "4"
            - name: LENNY_AUDIT_BATCHING_ENABLED
              value: "false"
            - name: LENNY_AUDIT_FLUSH_INTERVAL_MS
              value: "250"
            - name: LENNY_AUDIT_FLUSH_BATCH_SIZE
              value: "100"
            # §25.9 line 3709 ops.audit.scatterGatherCacheEnabled — opt-out
            # of the platform-admin cross-tenant audit scatter-gather
            # result cache (in-process, 5-minute TTL). F-25.9.11.
            - name: LENNY_AUDIT_SCATTER_GATHER_CACHE_ENABLED
              value: "true"
            # §11.7 audit.siem.endpoint — when set, satisfies the
            # COMPLIANCE_SIEM_REQUIRED gate for regulated-profile tenants.
            # Rendered only when non-empty so an unconfigured platform
            # leaves siemConfigured=false. F-11.7.2.
            # §11.7 SIEM HMAC secret + delivery health threshold. The
            # secret signs each OCSF batch; the threshold drives the §25.3
            # `siem` component degraded verdict. F-11.7.1 / F-11.7.16.
            - name: LENNY_AUDIT_SIEM_FAILURE_THRESHOLD_PERCENT
              value: "5"
            # §12.3 line 97 audit.siem.maxDeliveryLagSeconds — the
            # AuditSIEMDeliveryLag threshold the §12.3 outbox forwarder
            # emits on lenny_audit_siem_max_delivery_lag_seconds.
            # F-12.3.17.
            - name: LENNY_AUDIT_SIEM_MAX_DELIVERY_LAG_SECONDS
              value: "30"
            # §11.7 item 5 audit.pgaudit — DDL/ROLE capture config. When
            # enabled, the gateway runs the pgaudit extension/log-class
            # startup preflight; with a sinkEndpoint set it satisfies the
            # COMPLIANCE_PGAUDIT_REQUIRED gate for regulated-profile
            # tenants. F-11.7.10.
            # §11.7 OCSF translator retry cadence / attempt budget / batch
            # size. The translator advances ocsf_translation_state and
            # multicasts each row to the SIEM forwarder. F-11.7.1 / F-11.7.11.
            - name: LENNY_AUDIT_OCSF_RETRY_INTERVAL_SECONDS
              value: "30"
            - name: LENNY_AUDIT_OCSF_MAX_ATTEMPTS
              value: "10"
            - name: LENNY_AUDIT_OCSF_BATCH_SIZE
              value: "256"
            # §12.8 line 839 audit.gdprRetentionDays: retention window for
            # gdpr.* audit rows. The gateway rejects a value below 2190
            # under a regulated complianceProfile at startup. F-12.8.16.
            - name: LENNY_AUDIT_GDPR_RETENTION_DAYS
              value: "2555"
            # §16.4 audit.retentionPreset / audit.retentionDays: the
            # compliance-aware retention bundle and explicit window for
            # non-gdpr audit rows. The resolved window is emitted on the
            # lenny_audit_retention_days gauge that drives the §16.5
            # AuditRetentionLow alert. F-16.4.9 / F-16.4.10.
            - name: LENNY_AUDIT_RETENTION_PRESET
              value: "soc2"
            - name: LENNY_AUDIT_RETENTION_DAYS
              value: "365"
            # §25.13 line 4798 healthTracker.useCompiledRules: gates the
            # gateway's in-process §16.5 alert evaluator. Set false to
            # suppress the per-replica tracker and let /v1/admin/health
            # report only dependency probes and circuit breaker state —
            # the escape valve for operators whose Prometheus rule
            # customisations diverge from the compiled-in defaults.
            - name: LENNY_HEALTH_TRACKER_USE_COMPILED_RULES
              value: "true"
            # §25.13 line 4833 / F-25.13.3 — the gateway stamps
            # lenny_alerting_rules_bundled{format} so an operator can
            # verify the bundling configuration from /metrics. The
            # value mirrors monitoring.format (closed enum
            # "prometheusrule" | "configmap" | "both"; "both" expands
            # into both labels). LENNY_ALERTING_OVERRIDE_COUNT mirrors
            # len(monitoring.alertOverrides) so
            # lenny_alerting_rule_overrides reflects the rendered
            # override map.
            - name: LENNY_ALERTING_BUNDLE_FORMATS
              value: "prometheusrule"
            - name: LENNY_ALERTING_OVERRIDE_COUNT
              value: "0"
            # §25.13 line 4737 / F-25.13.2 — tier-dependent §16.5
            # thresholds. The gateway emits each value on a startup-set
            # Prometheus gauge so the bundled alert expressions read
            # the configured number via scalar(...). Tier presets
            # override these to tighten the thresholds at higher tiers
            # (see presets/values-tier{2,3}.yaml).
            - name: LENNY_GATEWAY_QUEUE_DEPTH_THRESHOLD
              value: "20"
            - name: LENNY_GATEWAY_LATENCY_THRESHOLD_SECONDS
              value: "3"
            - name: LENNY_CREDENTIAL_POOL_LOW_THRESHOLD
              value: "0.8"
            # §4.2 line 165 / §12.3 line 56 LENNY_POOLER_MODE: the
            # Postgres pooler posture, derived from
            # postgres.connectionPooler so the install-time preflight
            # check and the gateway startup refusal share one source of
            # truth. Under "external" the gateway refuses to start when
            # the lenny_tenant_guard trigger is absent from tenant-scoped
            # tables; under "transactional" the in-cluster pooler
            # enforces the connect_query __unset__ sentinel.
            - name: LENNY_POOLER_MODE
              value: "transactional"
            - name: LENNY_LOG_LEVEL
              value: "debug"
          ports:
            - name: http
              containerPort: 8080
            # spec: §16.9 line 723 — named metrics containerPort so a
            # PodMonitor `port: metrics` discovery works uniformly across
            # control-plane components. /metrics is served on the same
            # HTTP listener as the REST API (internalPort); the named
            # entry is a labelling concern that surfaces the metrics
            # endpoint in the rendered pod spec. F-16.9.10.
            - name: metrics
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          volumeMounts:
            # spec: §10.2 / §17.4 — the dev HMAC bearer-trust key (Secret
            # key "key"); the gateway loads it via --bearer-trust-hmac-key-file
            # above. Mirrors the lenny-ops mount of the same Secret.
            - name: oidc-bearer-trust-key
              mountPath: /etc/lenny/oidc
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          # §10.1 preStop staged drain Stage 1: readiness is a distinct
          # probe (/readyz) so the preStop hook can flip the pod to
          # NotReady — removing it from the Service endpoints before the
          # eviction-checkpoint drain begins — without also tripping the
          # liveness probe (/healthz) and being killed mid-drain. /readyz
          # also reports NotReady on NTP drift and on §10.4 line 386 hard
          # backend (Postgres session-truth) unreachability, so a replica
          # whose store connection is broken leaves traffic. The handler
          # runs a cached (5s) backend probe with a 2s budget, so
          # timeoutSeconds is 3 to leave headroom over the probe. F-10.4.6.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          # §4.4 line 234, 263 / §10.1 preStop staged drain. Kubernetes
          # invokes the hook before SIGTERM; the gateway selects the
          # tiered checkpoint cap per session, triggers a synchronous
          # eviction checkpoint per session, and emits the
          # lenny_prestop_cap_selection_total counter for the §16.5
          # PreStopCapFallbackRateHigh alert.
          lifecycle:
            preStop:
              httpGet:
                path: /internal/prestop
                port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      # spec: §17.8.2 — Tier 1/2 terminationGracePeriodSeconds defaults
      # to 240s, which leaves a 30s safety margin above the 210s preStop
      # budget (90s tier cap + 90s BarrierAck + 30s stream drain). The
      # gateway binary reads the same value from
      # LENNY_TERMINATION_GRACE_SECONDS so the preStop hook honors the
      # chart-set deadline.
      terminationGracePeriodSeconds: 240
---
# Source: lenny/templates/ops-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lenny-ops
  namespace: default
  labels:
    helm.sh/chart: lenny-0.1.0
    app.kubernetes.io/name: lenny
    app.kubernetes.io/instance: lenny
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    app: lenny-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lenny-ops
  template:
    metadata:
      labels:
        helm.sh/chart: lenny-0.1.0
        app.kubernetes.io/name: lenny
        app.kubernetes.io/instance: lenny
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.1.0"
        app: lenny-ops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: lenny-ops-sa
      
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ops
          image: "ghcr.io/lennylabs/lenny-ops:0.1.0"
          imagePullPolicy: IfNotPresent
          args:
            - --addr=:8090
            - --leader-election-namespace=default
            # §25.4 NET-070: the admin-API link is TLS by default
            # (ops.tls.internalEnabled). When enabled, lenny-ops reaches
            # the gateway internal-TLS port (gateway.internalTLSPort);
            # otherwise the acknowledged-plaintext path uses the plaintext
            # internalPort. The ops-tls-guard refuses a non-acknowledged
            # plaintext render outside devMode. F-25.4.19.
            - --gateway-url=https://lenny-gateway.default.svc:8443
            - --gateway-internal-tls=true
            # §25.4 lines 1740-1974 GatewayClient routing: the per-replica
            # fan-out resolves the headless Service; the breaker + timeout
            # bound the fallback path. F-25.4.8.
            - --gateway-headless-service=lenny-gateway-pods
            - --gateway-internal-tls-port=8443
            - --gateway-internal-port=8080
            - --gateway-fanout-timeout=2s
            - --gateway-fanout-breaker-failure-threshold=3
            - --gateway-fanout-breaker-reset-after=60s
            # §25.4 lines 1956-1971 service-account token lifecycle.
            - --gateway-sa-token-file=/var/run/secrets/lenny/gateway/token
            - --gateway-token-refresh-before-expiry=300s
            - --gateway-token-min-ttl=600s
            - --production=false
            # §25.10 line 3809 / line 3824 — drift detection knobs.
            # F-25.10.7, F-25.10.9.
            - --drift-snapshot-stale-warning-days=7
            - --drift-running-state-cache-ttl-seconds=60
            # §25.6 doctor `fix=true` auto-remediation guardrails:
            # admin.doctor.fixTimeoutSeconds bounds each fix,
            # admin.doctor.allowedFixes narrows the fixable set, and
            # global.maintenanceMode disables every fix. F-25.6.2.
            - --doctor-fix-timeout-seconds=120
            # §25.4 line 903 / §17.8.4 ops.selfHealth.checkIntervalSeconds —
            # self-monitor cadence (10s at Tier 2/3, 30s acceptable at
            # Tier 1). Tier-preset overridden. F-17.8.1.
            - --self-health-interval=10s
            # §25.5 line 2598 / §17.8.4 ops.events.streamMaxLen — MAXLEN of
            # the platform-scoped ops:events:stream (10k Tier 1, 50k Tier 2,
            # 100k Tier 3). Tier-preset overridden. F-17.8.1.
            - --events-stream-max-len=10000
            # §25.5 lines 2649-2663 ops.webhooks — webhook delivery-tracking
            # mode plus the retention windows the 03:45 UTC purge cron
            # enforces. F-25.5.15.
            - --webhook-tracking-mode=full
            - --webhook-delivery-retention-days=7
            - --webhook-failures-retention-days=0
            # §25.4 lines 2396, 2414 ops.escalation — the escalation
            # durability posture (reject vs buffer when no durable tier is
            # reachable) and the leader-only reconciliation flush rate. F-25.4.7.
            - --escalation-require-durable=false
            - --escalation-reconciliation-writes-per-second=20
            # §25.4 lines 1562-1564 / §17 security.oidc.issuerUrl — OIDC
            # authentication + role gate. F-25.4.1, F-25.4.20.
            - --bearer-trust-hmac-key-file=/etc/lenny/oidc/key
            # §25.4 line 2001 per-service-account rate limiting. F-25.4.5.
            - --rate-limit-rps=20
            - --rate-limit-burst=50
            # §25.4 lines 2206-2212 in-memory (Tier-3) lock policy. The
            # single-replica-only default counts ready replicas via the
            # lenny-ops Service Endpoints to reject uncoordinated acquires in
            # multi-replica deployments. F-25.4.26.
            - --locks-memory-tier=single-replica-only
            # §25.4 ops.locks.{minTTLSeconds,defaultTTLSeconds,maxTTLSeconds} —
            # the deployment-wide remediation-lock TTL policy applied across
            # every tier. F-25.4.9.
            - --locks-min-ttl-seconds=0
            - --locks-default-ttl-seconds=300
            - --locks-max-ttl-seconds=3600
            # §25.4 ops.idempotency.{keyTTLSeconds,longRunningKeyTTLSeconds} —
            # idempotency-record lifetimes for the standard and long-running
            # endpoint classes. F-25.4.9.
            - --idempotency-key-ttl-seconds=86400
            - --idempotency-long-running-key-ttl-seconds=604800
            # §25.4 ops.leaderElection.{leaseDurationSeconds,renewDeadlineSeconds,
            # retryPeriodSeconds} — client-go leader-election lease timings for
            # the lenny-ops-leader Lease. F-25.4.9.
            - --leader-lease-duration-seconds=15
            - --leader-renew-deadline-seconds=10
            - --leader-retry-period-seconds=2
            # §25.9 ops.audit.diagnosticsRatePerMinute — per-service-account cap
            # on distinct diagnostic-audit events per minute. F-25.4.9.
            - --diagnostics-audit-rate-per-minute=60
            # §25.5 ops.webhooks SSRF policy applied at subscription create and
            # on every delivery attempt. F-25.4.9.
            - --webhook-allow-http=false
            - --ops-service-name=lenny-ops
            # §25.4 line 1339 / §25.13 lines 4833-4834 — the leader-only
            # bundleRules reconciler re-stamps the bundled-rules observability
            # gauges (lenny_alerting_rules_bundled{format},
            # lenny_alerting_rule_overrides) on the lenny-ops /metrics surface
            # from the chart's monitoring.format and alertOverrides count.
            # F-25.4.17.
            - --alerting-bundle-formats=prometheusrule
            - --alerting-override-count=0
            # §25.8 platform.registry.* — the base image registry the runtime
            # registry API (GET/PUT /v1/admin/platform/registry) overlays and
            # the upgrade preflight resolves component images against.
            - --registry-url=ghcr.io/lennylabs
            - --registry-require-digest=false
            # §25.8 platform.upgrade.* — the OpsRoll watchdog roll timeouts.
            - --ops-roll-timeout-seconds=600
            - --gateway-roll-timeout-seconds=1200
            - --controller-roll-timeout-seconds=600
            # §25.8 Version Aggregation: the running Helm release name, so
            # the Helm-chart-version source reads the helm.sh/release.v1
            # Secret for this install rather than a hardcoded default.
            - --helm-release-name=lenny
            # §25.8 upgrade-check consumer: fetch the release manifest over
            # HTTP from the configured channel and verify its Ed25519
            # X-Lenny-Release-Signature before trusting it.
            - --release-channel-url=https://releases.lenny.dev/v1/latest
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # §25.4 line 2208: the single-replica-only lock policy reads the
            # lenny-ops Service Endpoints in this pod's own namespace to count
            # ready replicas.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8090
            # spec: §16.9 line 723 — named metrics containerPort so the
            # podmonitor.yaml `port: metrics` selector matches the
            # lenny-ops pod. lenny-ops serves /metrics on the same HTTP
            # listener as the §25 REST surface; the named entry surfaces
            # the metrics endpoint on the rendered pod spec. F-16.9.10.
            - name: metrics
              containerPort: 8090
          # §25.4 lines 1033-1057 — the permissive /healthz covers
          # startup and liveness so a transient Postgres or Kubernetes
          # API blip does not restart an otherwise-healthy pod; the
          # startup probe's 30×2s budget covers Postgres connection
          # establishment.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          # §25.4 line 1055 — readiness uses the strict gate so traffic
          # is not routed to a replica that cannot reach both Postgres
          # and the Kubernetes API. Strict readiness is gated on
          # ops.production: the stock degraded single-process render
          # (LENNY_POSTGRES_DSN unset) would never reach Ready under the
          # strict gate, so it falls back to the graceful /readyz report.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # §25.4 line 1027 — writable scratch for the read-only root
            # filesystem posture. lenny-ops writes no temp files today,
            # but §25.4 calls the seam out explicitly so any future temp
            # write does not fail against the read-only root.
            - name: tmp
              mountPath: /tmp
            # §25.4 lines 1956-1971 — the projected ServiceAccount token
            # the GatewayClient presents to the gateway admin API. The
            # kubelet rotates it in place; FileTokenLoader re-reads it on
            # each pre-emptive refresh. F-25.4.8.
            - name: gateway-sa-token
              mountPath: /var/run/secrets/lenny/gateway
              readOnly: true
            # §25.4 line 1562: the shared HMAC bearer-verify key. F-25.4.20.
            - name: oidc-bearer-trust-key
              mountPath: /etc/lenny/oidc
              readOnly: true
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        # §25.4 line 1027 — writable /tmp scratch under read-only root.
        - name: tmp
          emptyDir: {}
        # §25.4 lines 1956-1971 — projected SA token for the GatewayClient.
        - name: gateway-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: lenny-gateway
                  expirationSeconds: 3600
        - name: oidc-bearer-trust-key
          secret:
            secretName: lenny-embedded-dev-bearer-key
            items:
              - key: key
                path: key
