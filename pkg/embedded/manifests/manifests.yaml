# Source: lenny/templates/gateway-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lenny-gateway
  namespace: default
  labels:
    helm.sh/chart: lenny-0.1.0
    app.kubernetes.io/name: lenny
    app.kubernetes.io/instance: lenny
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    lenny.dev/component: gateway
  # spec: §10.3 lines 316, 334 (NET-064). The lenny-preflight Job
  # enumerates these annotations across every lenny-gateway Deployment
  # in the cluster to enforce SPIFFE-trust-domain / SA-token-audience
  # uniqueness. Without them, the collision check sees existing
  # deployments as having empty annotations and never flags a clash.
  # F-10.3.6.
  annotations:
    # §10.3 line 316 (NET-064) — global.spiffeTrustDomain is a required
    # chart value with no default; `required` fails `helm install/upgrade`
    # templating with the spec-mandated error when it is unset so two
    # deployments cannot silently share a trust domain. This annotation is
    # always rendered, so it is the single enforcement point. F-10.3.4.
    lenny.dev/spiffe-trust-domain: "lenny-embedded-dev"
spec:
  replicas: 1
  # §4.1 / §17.1 rolling-update strategy. maxUnavailable: 1 caps the
  # number of replicas Kubernetes drains concurrently during a
  # Deployment-initiated rollout (image bump, spec change) at one — at
  # Tier 3 (~20 replicas) the Kubernetes default of 25% would let up to
  # 5 replicas drain at once, exceeding the §10.1 per-replica 400-pod
  # CheckpointBarrier fan-out budget. maxSurge: 25% allows the
  # replacement set to scale ahead of the drained set so a rollout is
  # not bottlenecked behind the drain pace. This strategy is on an
  # independent disruption axis from the PodDisruptionBudget below; the
  # PDB bounds every other voluntary disruption (kubectl drain,
  # autoscaler node consolidation, HPA scale-down).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: lenny
      lenny.dev/component: gateway
  template:
    metadata:
      labels:
        helm.sh/chart: lenny-0.1.0
        app.kubernetes.io/name: lenny
        app.kubernetes.io/instance: lenny
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.1.0"
        lenny.dev/component: gateway
    spec:
      serviceAccountName: lenny-gateway
      
      securityContext:
        runAsNonRoot: true
        # spec: §13.2 credential-delivery primitive. fsGroup makes the
        # mounted mTLS Secret group-owned by this GID and adds it as a
        # supplemental group on the process, so the non-root distroless
        # image (gcr.io/distroless/static:nonroot, UID 65532) can read the
        # cert-manager-issued cert/key mounted group-readable at defaultMode
        # 0440 below. Without it a root-owned 0400 cert is unreadable under
        # runAsNonRoot and the §10.3 gateway↔Token-Service mTLS dial fails to
        # load /etc/lenny/mtls/tls.crt with "permission denied". The
        # fsGroup + 0440 pair is the read primitive every mode needs, so it
        # is unconditional rather than gated on devMode.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # spec: §10.2 / §17.4 dev-bearer-trust — the dev HMAC key Secret the
        # `lenny` CLI mints its bearer from. lenny up creates it under the
        # fixed name the dev profile sets, holding the key under data key
        # "key". Mirrors the lenny-ops mount of the same Secret.
        - name: oidc-bearer-trust-key
          secret:
            secretName: lenny-embedded-dev-bearer-key
            items:
              - key: key
                path: key
      containers:
        - name: gateway
          image: "ghcr.io/lennylabs/lenny-gateway:0.1.0"
          imagePullPolicy: IfNotPresent
          args:
            - --addr=:8080
            - --grpc-addr=:50051
            # §8.6 line 712 — deployment-default auto-mode lease-extension
            # rate limit. Rendered only when set; 0/unset keeps the spec
            # default of no limit. F-8.6.7.
            # §8.6 line 629 — in-path deadline the LLM Proxy waits for a
            # budget-exhaustion lease extension before falling through to a
            # recover-on-next-request BUDGET_EXHAUSTED. Operator-tunable
            # (§8.6 does not fix it); default 5s. Proposal 0023.
            - --proxy-extension-wait-timeout=5s
            - --no-environment-policy=deny-all
            # §4.9 — the platform tenancy.mode the gateway enforces the two
            # cross-tenant credential-delivery rejections against. The same
            # value drives the lenny-webhook binary and the lenny-preflight
            # Job, so every enforcement point keys off one tenancy signal.
            - --tenancy-mode=single
            # spec: §15.5 item 1; docs/api/index.md line 124 —
            # F-15.5.11. Empty omits the flag so the middleware stays
            # inert until the operator declares a sunset window.
            # §7.1 line 112 — the seal-and-export retry window. Rendered
            # only when set; 0/unset keeps the gateway binary's compiled-in
            # 300s default.
            # spec: §25.3 lines 596, 604, 625 — Capacity Recommendations
            # operator knobs. Rendered only when set so the gateway keeps
            # the spec defaults (all rules active, default windows, no
            # outage opt-out) when the operator leaves them empty.
            # F-25.3.12.
            # §10.2 line 212 — OIDC claim the gateway extracts the
            # tenant identifier from. Operator-configurable so an
            # upstream IdP that stamps tenant identity under a non-
            # canonical claim name still works without a code change.
            # F-10.2.9.
            - --tenant-id-claim=tenant_id
            # §10.3 lines 365-366 — OIDC issuer + client registration the
            # gateway's token validation trusts. Required platform keys
            # outside global.devMode; the gateway fails closed at startup
            # (LENNY_CONFIG_MISSING) when unset on a non-dev install.
            # F-10.3.14.
            # spec: §10.2 / §17.4 dev-bearer-trust — the §17.4 development
            # profile mints its CLI bearer from a persisted dev HMAC key and
            # the in-cluster gateway trusts it through this second §10.2
            # verifier, wrapped in the dev.local audience pin (a foreign-
            # audience token signed by the same key is still rejected). The
            # binary refuses this flag unless --dev-mode is set, so the dev
            # profile's global.devMode=true is a precondition. Production
            # leaves security.oidc.bearerTrustKeySecret empty and renders no
            # flag, so the gateway trusts only its standard §10.2 verifiers.
            - --bearer-trust-hmac-key-file=/etc/lenny/oidc/key
            # spec: §17.4 dev profile — tokenService.enabled is false, so the
            # gateway dials no Token Service. With no --token-service-grpc-addr
            # / --token-service-http-url the gateway uses its in-process
            # MintLease / credassign path (cmd/lenny-gateway/main.go reserves
            # this fallback for dev mode) for §4.9 leases and the §4.3
            # /v1/oauth/* proxy, so the absent Service is never dialed.
            # §4 KMS provider (F-4.3.11). The gateway wraps the §4.9
            # connector-credential DEKs through this provider.
            - --kms-provider=local
            - --environment=dev
            # §17.9.3 object-storage backend selector (F-17.5.1). The
            # gateway resolves the matching blobstore.Store adapter
            # (minio | s3 | gcs | azure) from these flags. The shared
            # objectStorage.{bucket,region,accountUrl} values feed the
            # cloud adapters; provider=minio uses the minio.* block.
            - --object-storage-provider=minio
            # §9.2 platform-wide elicitation content-integrity floor.
            # The admin API's GET endpoint reports the effective mode
            # as max(floor, tenantStored); a PUT below the floor is
            # rejected with ELICITATION_INTEGRITY_BELOW_PLATFORM_FLOOR.
            - --elicitation-content-integrity-floor=off
            - --agent-namespace=lenny-agents
            
            - --checkpoint-interval=600s
            - --checkpoint-jitter-fraction=0.2
            # §10.4 line 389 — per-session SSE replay buffer depth.
            # F-10.4.5.
            - --session-event-replay-buffer-depth=512
            # §10.4 line 385 / §16.5 PDBBlockedEvictions — name the
            # gateway PDB so the in-process poller can address it. The
            # namespace defaults to the gateway pod's own namespace via
            # POD_NAMESPACE (env var below). F-10.4.4.
            - --gateway-pdb-name=lenny-gateway
            - --dev-mode
            # §12.4 requires Redis AUTH; a dev install backed by a plaintext
            # no-password Redis would otherwise fail the gateway startup
            # invariant. Dev mode acknowledges the insecure dev Redis.
            - --redis-allow-insecure
            - --memory-max-per-user=10000
            - --memory-record-count-interval=60s
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # §10.4 line 385 — the §10.4 PDB poller reads POD_NAMESPACE
            # as the default gateway-namespace so the chart does not
            # need to repeat the release namespace in the args list.
            # F-10.4.4.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # §4.1 gateway.maxSessionsPerReplica — per-replica capacity
            # ceiling used as the denominator of the §16.5
            # GatewaySessionBudgetNearExhaustion alert and the §17.8.2
            # SCL-036 burst-absorption minReplicas formula. Rendered
            # from the Helm value so a tier-preset override flows into
            # the gateway binary without a code change. The gateway
            # emits the configured value on the
            # lenny_gateway_max_sessions_per_replica gauge at startup.
            - name: LENNY_MAX_SESSIONS_PER_REPLICA
              value: "50"
            # §17.6 lines 455-474 — the initial admin credential. On
            # bootstrap the gateway provisions the lenny-admin user and
            # writes its token to the lenny-admin-token Secret in this
            # namespace (the admin-token Role grants the gateway SA
