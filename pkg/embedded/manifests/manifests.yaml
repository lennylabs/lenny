# Source: lenny/templates/admission-policies/webhook-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lenny-webhook
  labels:
    helm.sh/chart: lenny-0.1.0
    app.kubernetes.io/name: lenny
    app.kubernetes.io/instance: lenny
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
rules:
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxes", "sandboxclaims", "sandboxwarmpools"]
    verbs: ["get", "list", "watch"]
