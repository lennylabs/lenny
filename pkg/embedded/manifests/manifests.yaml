# Source: lenny/templates/gateway-deployment.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lenny-gateway
  labels:
    helm.sh/chart: lenny-0.1.0
    app.kubernetes.io/name: lenny
    app.kubernetes.io/instance: lenny
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
rules:
  # The gateway reads warm pools and Sandboxes to select a §5 warm pod
  # for a claim and reads pods to resolve the claimed pod's IP for the
  # adapter dial. It does not write Sandbox.status: under the §4.6.3
  # pod-status ownership decomposition the WarmPoolController is the
  # sole writer of Sandbox.status and projects occupancy from claim
  # existence, so the gateway holds only read access on Sandbox.
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxwarmpools", "sandboxtemplates", "runtimes"]
    verbs: ["get", "list", "watch"]
  # Sandboxes: read-only for pod selection during claim (§4.6.3). The
  # gateway holds no `patch` or `watch` verb on the main resource and
  # no `sandboxes/status` grant — the tenant pin lives on the agent
  # Pod's lenny.dev/tenant-id label (granted via the Pods rule below),
  # and the lenny.dev/state label is a WarmPoolController projection of
  # the coarse occupancy phase rather than a gateway write.
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxes"]
    verbs: ["get", "list"]
  # SandboxClaim: the gateway creates the per-pod binding claim CRD that
  # the §17.2 lenny-sandboxclaim-guard webhook validates on CREATE, gets
  # it to read the binding state and the resourceVersion guarding a
  # hold-expiry DELETE precondition, and deletes it on the claim-lifecycle
  # edges (hold expiry, session-mode Release, and §5.2
  # SlotClaimer.ReleaseSlot all do Client.Delete on the SandboxClaim).
  # Intra-pod capacity is gated by the §5.2 atomic Redis slot counter with
  # a §12.4 Postgres SessionStore.GetActiveSlotsByPod fallback under a
  # per-pod advisory lock during a Redis outage, so the gateway does not
  # list or watch claims to gate capacity. The §4.6.3 grant is
  # create/get/delete.
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxclaims"]
    verbs: ["get", "create", "delete"]
  # SandboxClaim status: the gateway is the sole writer of the §4.6.3
  # claim binding state. It patches the binding-state phase, the
  # transition time, rewarmStartedAt (preConnect re-warm anchor), and
  # holdExpiresAt (reserved-hold window) on the sandboxclaims/status
  # subresource.
  - apiGroups: ["lenny.dev"]
    resources: ["sandboxclaims/status"]
    verbs: ["get", "patch"]
  # Pods: read to resolve the claimed pod's IP for the adapter dial and
  # the WarmPoolController-projected lenny.dev/host-schedulable label,
  # and patch for the §4.6.3 gateway-SA grant covering the
  # lenny.dev/tenant-id pin on first assignment and the
  # lenny.dev/drain-request annotation on agent pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  # §10.2 line 227 — "The gateway validates the signature on every
  # pod→gateway request." The GatewayControl listener submits a
  # TokenReview for each pod-presented projected SA token on the
  # §9.1/§9.3 tool-bridge and §5.2 scrub-report RPCs; the
  # kube-apiserver verifies the SA-issuer signature, expiry, and the
  # deployment-specific audience. Equivalent to binding the
  # system:auth-delegator ClusterRole.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
