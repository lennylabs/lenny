---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
    lenny.dev/schema-version: "1"
  name: podsets.lenny.dev
spec:
  group: lenny.dev
  names:
    kind: PodSet
    listKind: PodSetList
    plural: podsets
    shortNames:
    - pset
    singular: podset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.runtimeRef
      name: Runtime
      type: string
    - jsonPath: .spec.isolationProfile
      name: Isolation
      type: string
    - jsonPath: .spec.minWarm
      name: MinWarm
      type: integer
    - jsonPath: .spec.maxWarm
      name: MaxWarm
      type: integer
    - jsonPath: .status.warmCount
      name: Warm
      type: integer
    - jsonPath: .status.readyCount
      name: Ready
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PodSet is the lenny.dev/v1alpha1 record of one pod set of a pool (§5.2):
          the pool settings, the warm targets, and the observed counts and
          conditions. A pool has one PodSet, named after the pool. The
          PoolScalingController reconciles it from the Postgres pool definitions;
          the WarmPoolController warms pods against it and is the controller owner
          of each of its AgentPods.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PodSetSpec is the desired state of a PodSet: the §5.2 pool settings the
              controllers and the webhooks read, and the §4.6.2 warm targets. Per
              §4.6.3 the PoolScalingController owns spec.*, reconciling it in one
              apply from the Postgres pool definitions that the admin API treats as
              the source of truth.
            properties:
              acknowledgeNonceOnlyAuth:
                description: |-
                  AcknowledgeNonceOnlyAuth is the §5.3 deployer opt-in that admits a
                  pool whose runtime sets requireSoPeercred: false into §4.7 nonce-only
                  mode. The PoolScalingController mirrors it from the Postgres pool
                  definition (the §4.6.3 channel for pool configuration to reach the
                  controllers), and the WarmPoolController's render gate requires it
                  before rendering --require-so-peercred=false, so a Runtime CR applied
                  directly cannot put an unacknowledged pool into nonce-only mode.
                  spec: §4.7, §5.3.
                type: boolean
              checkpointBarrierAckTimeoutSeconds:
                description: |-
                  CheckpointBarrierAckTimeoutSeconds is the §10.1 wall-clock deadline
                  the gateway waits for `CheckpointBarrierAck` from every coordinated
                  pod during a rolling drain. It sizes the gateway pod's grace period
                  rather than the agent-pod TerminationGracePeriodSeconds floor, which
                  the agent pod's own preStop drain does not incur. The pool-config
                  webhook enforces the independent §10.1 BarrierAck-floor rule
                  (`checkpointBarrierAckTimeoutSeconds ≥ max_tiered_checkpoint_cap`)
                  on this field. Unset defaults to the §10.1 90s. spec: §10.1.
                format: int64
                type: integer
              checkpointCadenceSeconds:
                description: |-
                  CheckpointCadenceSeconds is the interval between periodic
                  workspace checkpoints for sessions in this pool.
                format: int64
                type: integer
              checkpointGrantWindow:
                description: |-
                  CheckpointGrantWindow is the per-pool override for the number of
                  chunk-upload capabilities the gateway keeps outstanding at once
                  while draining this pool's workspace checkpoints. When unset the
                  gateway falls back to its deployment-wide checkpointGrantWindow
                  default. spec: §10.1.7 chunk-grant window; §17.8.1
                  checkpointGrantWindow default 4.
                format: int32
                minimum: 1
                type: integer
              deliveryMode:
                description: DeliveryMode is the §4.9 credential delivery mode for
                  the pool.
                enum:
                - proxy
                - direct
                type: string
              dnsPolicy:
                description: |-
                  DNSPolicy opts the pool out of the dedicated lenny-system CoreDNS
                  instance. The only accepted value is `cluster-default`: pods in the
                  pool revert to the Kubernetes default ClusterFirst behavior and
                  resolve through kube-system CoreDNS. Empty (the default) routes DNS
                  through the dedicated instance, where the WarmPoolController sets
                  `dnsPolicy: None` plus a `dnsConfig` targeting the dedicated Service.
                  Opting out is permitted only for `standard` (runc) pools and removes
                  the dedicated instance's query logging, rate limiting, and response
                  filtering for that pool. spec: §13.2.
                enum:
                - cluster-default
                type: string
              egressProfile:
                description: |-
                  EgressProfile is the §13.2 egress profile the WarmPoolController
                  stamps onto the pool's pods so the matching pre-created
                  NetworkPolicy takes effect. Empty inherits the §13.2 default
                  (`restricted`). The `internet` profile is rejected on a `standard`
                  (runc) pool at admission per the §13.2 cross-control.
                enum:
                - restricted
                - provider-direct
                - internet
                type: string
              executionMode:
                description: |-
                  ExecutionMode is the §5.2 pod-reuse mode: `session` (a pod
                  parameterized by SessionPolicy) or `service` (a claimless,
                  request-routed pod). Empty is treated as `session`.
                enum:
                - session
                - service
                type: string
              isolationProfile:
                description: |-
                  IsolationProfile is the §5.3 isolation profile every pod in the
                  pool is warmed under.
                enum:
                - standard
                - sandboxed
                - microvm
                type: string
              maxConcurrent:
                description: MaxConcurrent is the per-pod slot count for service mode.
                format: int32
                minimum: 1
                type: integer
              maxSessionAgeSeconds:
                description: |-
                  MaxSessionAgeSeconds caps the lifetime of a session served by a
                  pod in this pool.
                format: int64
                type: integer
              maxTerminationGracePeriodSeconds:
                description: |-
                  MaxTerminationGracePeriodSeconds is a hard ceiling on the
                  terminationGracePeriodSeconds the pool-config webhook computes
                  from the per-slot checkpoint budget. When set, a pool whose
                  computed grace-period floor exceeds this value is rejected
                  rather than warned.
                format: int64
                type: integer
              maxWarm:
                description: |-
                  MaxWarm is the ceiling on idle pods the pool warms ahead of
                  demand.
                format: int32
                minimum: 0
                type: integer
              minWarm:
                description: |-
                  MinWarm is the floor on idle ready pods the WarmPoolController
                  maintains. A value of 0 lets the pool scale to zero with a
                  documented cold-start penalty.
                format: int32
                minimum: 0
                type: integer
              resourceClass:
                description: ResourceClass is the §5.2 pod resource class.
                enum:
                - small
                - medium
                - large
                type: string
              runtimeRef:
                description: RuntimeRef names the lenny.dev/v1alpha1 Runtime this
                  pool warms.
                type: string
              scalePolicy:
                description: |-
                  ScalePolicy carries the scaling-formula tuning inputs and the
                  time-of-day schedule overrides.
                properties:
                  bootstrapMinWarm:
                    description: |-
                      BootstrapMinWarm is the static warm-count target the pool uses
                      while in bootstrap mode, before the scaling formula has enough
                      observed demand to converge.
                    format: int32
                    minimum: 0
                    type: integer
                  podWarmupSecondsBaseline:
                    description: |-
                      PodWarmupSecondsBaseline is the pod creation-to-ready time the
                      §4.6.2 scaling formula uses. It is roughly 30 seconds for
                      SDK-warm pools and roughly 10 seconds for pod-warm pools.
                    format: int64
                    type: integer
                  scaleToZero:
                    description: |-
                      ScaleToZero drives the pool to `minWarm: 0` during a recurring
                      off-hours window (§4.6.1). The PoolScalingController evaluates the
                      cron window on every pass and overrides the demand-derived warm
                      floor to zero while the window is open. Sessions arriving in a
                      zero-warm period incur cold-start latency. When unset the pool
                      never scales to zero on a schedule.
                    properties:
                      resumeAt:
                        description: |-
                          ResumeAt is the standard five-field cron expression whose firing
                          closes the zero-warm window and restores the demand-derived warm
                          floor (for example `0 6 * * *` for 06:00).
                        minLength: 1
                        type: string
                      schedule:
                        description: |-
                          Schedule is the standard five-field cron expression whose firing
                          opens the zero-warm window (for example `0 22 * * *` for 22:00).
                        minLength: 1
                        type: string
                      timezone:
                        description: |-
                          Timezone is an optional IANA timezone string (for example
                          `America/New_York`) the two cron expressions are interpreted in.
                          Both Schedule and ResumeAt are interpreted as UTC when it is unset.
                        type: string
                    required:
                    - resumeAt
                    - schedule
                    type: object
                  schedules:
                    description: |-
                      Schedules are time-of-day windows that override the
                      demand-derived warm count.
                    items:
                      description: |-
                        ScheduleWindow is a time-of-day override of the pool's warm count
                        (§4.6.1). Within the window the pool targets MinWarm idle pods
                        instead of the demand-derived target.
                      properties:
                        end:
                          description: End is the window close time as a 24-hour `HH:MM`
                            clock value.
                          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                          type: string
                        minWarm:
                          description: MinWarm is the warm-count target enforced inside
                            the window.
                          format: int32
                          minimum: 0
                          type: integer
                        start:
                          description: Start is the window open time as a 24-hour
                            `HH:MM` clock value.
                          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                          type: string
                      required:
                      - end
                      - minWarm
                      - start
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  sdkConnectTimeoutSeconds:
                    description: |-
                      SDKConnectTimeoutSeconds is the §6.1 per-pod watchdog
                      budget for the sdk_connecting phase: a pod that has not completed
                      its SDK pre-connection and reached idle within this window is
                      retired to failed and the WarmPoolController increments
                      lenny_warmpool_sdk_connect_timeout_total. It applies only to
                      preConnect pools and defaults to 60 seconds when unset.
                    format: int64
                    minimum: 0
                    type: integer
                  sdkWarmCircuitBreakerMinOpenSeconds:
                    description: |-
                      SDKWarmCircuitBreakerMinOpenSeconds is how long the SDK-warm
                      circuit breaker stays open once tripped before the
                      PoolScalingController re-evaluates the demotion rate. It defaults
                      to 1800 seconds when unset; 0 disables the grace window.
                    format: int64
                    type: integer
                type: object
              sdkWarmDisabled:
                description: |-
                  SDKWarmDisabled is the SDK-warm circuit-breaker flag. The
                  PoolScalingController sets it true to stop warming pods to
                  SDK-warm state when the demotion rate stays too high.
                type: boolean
              sessionPolicy:
                description: |-
                  SessionPolicy parameterizes session-mode pod reuse: simultaneous
                  sessions per pod and the nested recycle block. It is nil on pools
                  that take the default one-session-per-pod configuration.
                properties:
                  recycle:
                    description: |-
                      Recycle configures sequential pod reuse with a whole-pod scrub at
                      the occupancy-zero recycle boundary. It is nil on pools that do not
                      recycle (`recycle.enabled: false`, the default).
                    properties:
                      acknowledgeMicrovmResidualState:
                        description: |-
                          AcknowledgeMicrovmResidualState records the deployer's
                          acknowledgment that guest-kernel residual state (DNS cache, TCP
                          TIME_WAIT, page cache, inotify/fanotify registrations) persists
                          across the pinned tenant's sessions in the continuing `in-place`
                          guest. No recycled pod is reused across tenants, so the state never
                          reaches another tenant. The pool controller requires it when
                          ScrubProfile is `in-place` and rejects the pool otherwise. spec: §5.2
                          (Kata/microvm scrub variant).
                        type: boolean
                      runtimeProcess:
                        description: |-
                          RuntimeProcess is the runtime-process lifetime of the pods the pool
                          creates: a `keep` pod keeps its runtime process across the recycle
                          boundary, and a `restart` pod ends it in each whole-pod scrub and
                          launches a new process for the next session. The WarmPoolController
                          reads it when it creates a pod and records it in the immutable pod
                          label `lenny.dev/runtime-process`; an absent value creates a `keep`
                          pod. Gateway pool admission requires it on a reusing recycling pool
                          and rejects it on every other pool. spec: §5.2 (Runtime-process
                          lifetime).
                        enum:
                        - keep
                        - restart
                        type: string
                      scrubProfile:
                        description: |-
                          ScrubProfile selects the whole-pod scrub variant: `standard` (the
                          default) runs the in-guest scrub steps; `vm-restart` retires the pod
                          at every recycle boundary and reprovisions a fresh guest VM;
                          `in-place` keeps the running guest across the pinned tenant's later
                          sessions and leaves guest-kernel residual state. No recycled pod is
                          reused across tenants under any profile. The pool controller rejects
                          `standard` on a pool with `recycle.allowCrossTenantReuse: true`.
                          spec: §5.2 (Kata/microvm scrub variant).
                        enum:
                        - standard
                        - vm-restart
                        - in-place
                        type: string
                    type: object
                type: object
              spiffeBinding:
                description: |-
                  SpiffeBinding is the §4.9 proxy-mode lease-token SPIFFE binding.
                  `enabled` (the default for proxy-mode pools) binds each lease
                  token to the issuing pod's SPIFFE identity; `disabled` is
                  permitted only in single-tenant or development deployments and is
                  rejected by the lenny-direct-mode-isolation webhook in
                  multi-tenant mode.
                enum:
                - enabled
                - disabled
                type: string
              terminationGracePeriodSeconds:
                description: |-
                  TerminationGracePeriodSeconds is the §5.2 deployer-set
                  terminationGracePeriodSeconds for this pool's agent pods. The
                  pool-config webhook vets it against the agent-pod grace floor
                  `maxConcurrent × max_tiered_checkpoint_cap + 30`: the per-slot
                  checkpoint cap summed across all slots plus the minimum
                  stream-drain budget, where a session-mode pool uses a multiplier
                  of 1. The floor omits checkpointBarrierAckTimeoutSeconds, which is
                  the gateway's wall-clock wait for CheckpointBarrierAck and belongs
                  to the gateway pod's grace period rather than the agent-pod floor.
                  The webhook evaluates the floor against the effective grace
                  period: this declared value when set, otherwise the §4.6.1 120s
                  agent default. §6.4 additionally requires at least
                  `LENNY_DEMOTE_TIMEOUT_SECONDS + 5s`. When set, it replaces the
                  §4.6.1 120s default base; MaxTerminationGracePeriodSeconds still
                  clamps it down. spec: §5.2, §4.6.1.
                format: int64
                type: integer
              topologySpreadConstraints:
                description: |-
                  TopologySpreadConstraints distribute the pool's pods across zones
                  and nodes. The PoolScalingController writes soft per-zone and
                  per-node defaults here; deployers may override them per pool.
                items:
                  description: TopologySpreadConstraint specifies how to spread matching
                    pods among the given topology.
                  properties:
                    labelSelector:
                      description: |-
                        LabelSelector is used to find matching pods.
                        Pods that match this label selector are counted to determine the number of pods
                        in their corresponding topology domain.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                    matchLabelKeys:
                      description: |-
                        MatchLabelKeys is a set of pod label keys to select the pods over which
                        spreading will be calculated. The keys are used to lookup values from the
                        incoming pod labels, those key-value labels are ANDed with labelSelector
                        to select the group of existing pods over which spreading will be calculated
                        for the incoming pod. The same key is forbidden to exist in both MatchLabelKeys and LabelSelector.
                        MatchLabelKeys cannot be set when LabelSelector isn't set.
                        Keys that don't exist in the incoming pod labels will
                        be ignored. A null or empty list means only match against labelSelector.

                        This is a beta field and requires the MatchLabelKeysInPodTopologySpread feature gate to be enabled (enabled by default).
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    maxSkew:
                      description: |-
                        MaxSkew describes the degree to which pods may be unevenly distributed.
                        When `whenUnsatisfiable=DoNotSchedule`, it is the maximum permitted difference
                        between the number of matching pods in the target topology and the global minimum.
                        The global minimum is the minimum number of matching pods in an eligible domain
                        or zero if the number of eligible domains is less than MinDomains.
                        For example, in a 3-zone cluster, MaxSkew is set to 1, and pods with the same
                        labelSelector spread as 2/2/1:
                        In this case, the global minimum is 1.
                        | zone1 | zone2 | zone3 |
                        |  P P  |  P P  |   P   |
                        - if MaxSkew is 1, incoming pod can only be scheduled to zone3 to become 2/2/2;
                        scheduling it onto zone1(zone2) would make the ActualSkew(3-1) on zone1(zone2)
                        violate MaxSkew(1).
                        - if MaxSkew is 2, incoming pod can be scheduled onto any zone.
                        When `whenUnsatisfiable=ScheduleAnyway`, it is used to give higher precedence
                        to topologies that satisfy it.
                        It's a required field. Default value is 1 and 0 is not allowed.
                      format: int32
                      type: integer
                    minDomains:
                      description: |-
                        MinDomains indicates a minimum number of eligible domains.
                        When the number of eligible domains with matching topology keys is less than minDomains,
                        Pod Topology Spread treats "global minimum" as 0, and then the calculation of Skew is performed.
                        And when the number of eligible domains with matching topology keys equals or greater than minDomains,
                        this value has no effect on scheduling.
                        As a result, when the number of eligible domains is less than minDomains,
                        scheduler won't schedule more than maxSkew Pods to those domains.
                        If value is nil, the constraint behaves as if MinDomains is equal to 1.
                        Valid values are integers greater than 0.
                        When value is not nil, WhenUnsatisfiable must be DoNotSchedule.

                        For example, in a 3-zone cluster, MaxSkew is set to 2, MinDomains is set to 5 and pods with the same
                        labelSelector spread as 2/2/2:
                        | zone1 | zone2 | zone3 |
                        |  P P  |  P P  |  P P  |
                        The number of domains is less than 5(MinDomains), so "global minimum" is treated as 0.
                        In this situation, new pod with the same labelSelector cannot be scheduled,
                        because computed skew will be 3(3 - 0) if new Pod is scheduled to any of the three zones,
                        it will violate MaxSkew.
                      format: int32
                      type: integer
                    nodeAffinityPolicy:
                      description: |-
                        NodeAffinityPolicy indicates how we will treat Pod's nodeAffinity/nodeSelector
                        when calculating pod topology spread skew. Options are:
                        - Honor: only nodes matching nodeAffinity/nodeSelector are included in the calculations.
                        - Ignore: nodeAffinity/nodeSelector are ignored. All nodes are included in the calculations.

                        If this value is nil, the behavior is equivalent to the Honor policy.
                        This is a beta-level feature default enabled by the NodeInclusionPolicyInPodTopologySpread feature flag.
                      type: string
                    nodeTaintsPolicy:
                      description: |-
                        NodeTaintsPolicy indicates how we will treat node taints when calculating
                        pod topology spread skew. Options are:
                        - Honor: nodes without taints, along with tainted nodes for which the incoming pod
                        has a toleration, are included.
                        - Ignore: node taints are ignored. All nodes are included.

                        If this value is nil, the behavior is equivalent to the Ignore policy.
                        This is a beta-level feature default enabled by the NodeInclusionPolicyInPodTopologySpread feature flag.
                      type: string
                    topologyKey:
                      description: |-
                        TopologyKey is the key of node labels. Nodes that have a label with this key
                        and identical values are considered to be in the same topology.
                        We consider each <key, value> as a "bucket", and try to put balanced number
                        of pods into each bucket.
                        We define a domain as a particular instance of a topology.
                        Also, we define an eligible domain as a domain whose nodes meet the requirements of
                        nodeAffinityPolicy and nodeTaintsPolicy.
                        e.g. If TopologyKey is "kubernetes.io/hostname", each Node is a domain of that topology.
                        And, if TopologyKey is "topology.kubernetes.io/zone", each zone is a domain of that topology.
                        It's a required field.
                      type: string
                    whenUnsatisfiable:
                      description: |-
                        WhenUnsatisfiable indicates how to deal with a pod if it doesn't satisfy
                        the spread constraint.
                        - DoNotSchedule (default) tells the scheduler not to schedule it.
                        - ScheduleAnyway tells the scheduler to schedule the pod in any location,
                          but giving higher precedence to topologies that would help reduce the
                          skew.
                        A constraint is considered "Unsatisfiable" for an incoming pod
                        if and only if every possible node assignment for that pod would violate
                        "MaxSkew" on some topology.
                        For example, in a 3-zone cluster, MaxSkew is set to 1, and pods with the same
                        labelSelector spread as 3/1/1:
                        | zone1 | zone2 | zone3 |
                        | P P P |   P   |   P   |
                        If WhenUnsatisfiable is set to DoNotSchedule, incoming pod can only be scheduled
                        to zone2(zone3) to become 3/2/1(3/1/2) as ActualSkew(2-1) on zone2(zone3) satisfies
                        MaxSkew(1). In other words, the cluster can still be imbalanced, but scheduler
                        won't make it *more* imbalanced.
                        It's a required field.
                      type: string
                  required:
                  - maxSkew
                  - topologyKey
                  - whenUnsatisfiable
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              workspaceSizeLimitBytes:
                description: |-
                  WorkspaceSizeLimitBytes is the §4.4 / §10.1 per-pod
                  workspace-size hard limit. The pool-config webhook resolves it to the
                  matching §10.1 tiered-checkpoint-cap (30s for ≤100 MB, 60s for
                  ≤300 MB, 90s for ≤512 MB) when computing the
                  `terminationGracePeriodSeconds` floor; a service-mode pool fans this
                  cap across maxConcurrent slots while a session-mode pool uses a
                  multiplier of 1 (spec/05_runtime-registry-and-pool-model.md §5.2). Unset defaults to the 90s conservative tier per §10.1.
                format: int64
                type: integer
              workspaceTier:
                description: |-
                  WorkspaceTier is the §12.9 data-classification tier of the runtime
                  this pool serves. The pool-config webhook reads it to enforce the
                  §12.9 cross-tenant-reuse prohibition: a `T4` (Restricted)
                  pool may not set `sessionPolicy.recycle.allowCrossTenantReuse: true`, because
                  T4 workspace state must never be reused across tenants regardless of
                  isolation profile. Empty leaves the tier unclassified at the pool
                  level (the cross-tenant rule does not fire). spec: §12.9.
                enum:
                - T1
                - T2
                - T3
                - T4
                type: string
            required:
            - maxWarm
            - minWarm
            - runtimeRef
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            description: |-
              PodSetStatus is the observed state of a PodSet. Per §4.6.3 the
              WarmPoolController owns status.*: it records the warm and ready counts,
              the pool health conditions, including the §5.2 PoolWarmingUp bootstrap
              condition, and the observed generation. The PoolScalingController owns
              the SDKWarmCircuitBreaker carve-out and writes ScalingMode and
              BootstrapHoursOfData.
            properties:
              bootstrapHoursOfData:
                description: |-
                  BootstrapHoursOfData is the whole hours of accumulated traffic
                  data the PoolScalingController has observed for the pool while it
                  operates under a §17.8.2 bootstrapMinWarm override. The admin pool
                  GET surfaces it as bootstrapStatus.hoursOfData and projects
                  estimatedConvergenceAt against the 48-hour window. It is only
                  written while an override is in force; whole-hour granularity
                  keeps the status subresource from churning. spec: §17.8.2 step 3.
                format: int32
                minimum: 0
                type: integer
              conditions:
                description: |-
                  Conditions is the standard Kubernetes condition list. The
                  WarmPoolController sets `PoolWarmingUp` during the §5.2 bootstrap
                  window and may set `SecurityDegradedMode` and `Degraded`.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
