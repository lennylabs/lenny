# Pre-release gate. Everything, including all three providers in both shapes.
# Target wall-clock: < 8 hours.
#
# Architecture and tier definitions: TESTING.md §20.10.

name: pre-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag being validated (e.g., v0.1.0-rc.1)'
        required: true
        type: string
      compare_against:
        description: 'Prior release tag to diff load baselines against'
        required: false
        type: string

concurrency:
  group: pre-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:

  weekly-suite:
    name: Weekly suite (re-run)
    uses: ./.github/workflows/weekly.yml
    secrets: inherit

  e2e-cloud-full-sandbox:
    name: tier 6 — e2e cloud (all providers × both shapes)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [weekly-suite]
    strategy:
      fail-fast: false
      matrix:
        provider: [gke, eks, aks]
        shape:    [cloud-small, cloud-sandbox]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run e2e cloud tier
        env:
          LENNY_CLOUD_PROVIDER: ${{ matrix.provider }}
          LENNY_CLOUD_SHAPE: ${{ matrix.shape }}
        run: ./bin/lenny-test --tier e2e_cloud
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verdict-prerelease-${{ matrix.provider }}-${{ matrix.shape }}
          path: tests/results/latest.json
          retention-days: 90

  chaos-full:
    name: tier 8 — chaos (full)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [weekly-suite]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run chaos tier
        run: ./bin/lenny-test --tier chaos
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verdict-prerelease-chaos
          path: tests/results/latest.json
          retention-days: 90

  security-pentest:
    name: tier 9 — security (full + pentest driver)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [weekly-suite]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run security tier
        run: ./bin/lenny-test --tier security
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verdict-prerelease-security
          path: tests/results/latest.json
          retention-days: 90

  slo-baseline-diff:
    name: SLO regression diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [weekly-suite]
    steps:
      - run: |
          echo "Phase 0 placeholder."
          echo "Compares Phase 14.5 baseline against ${{ inputs.compare_against }}."
          echo "Threshold: 15% per percentile (TESTING.md §22.5)."

  prerelease-rollup:
    name: pre-release roll-up summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Wait for every pre-release tier that uploads a verdict, then
    # aggregate. slo-baseline-diff is a placeholder today; once it
    # uploads a verdict it joins this list.
    needs: [e2e-cloud-full-sandbox, chaos-full, security-pentest, slo-baseline-diff]
    if: always()
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Download every verdict
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: tests/results/
          pattern: verdict-*
          merge-multiple: false
      - name: Aggregate into workflow summary
        run: |
          set -euo pipefail
          find tests/results -name 'latest.json' -print0 \
            | while IFS= read -r -d '' f; do
                cp "$f" "tests/results/$(basename "$(dirname "$f")").json"
              done
          {
            echo "## Pre-release verdict for ${{ inputs.tag }}"
            echo
            ./bin/lenny-test report --dir tests/results --output markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when the aggregated verdict is not PASS
        run: ./bin/lenny-test report --dir tests/results --output json | python3 -c 'import json,sys; v=json.load(sys.stdin); sys.exit(0 if v["verdict"]=="PASS" else 1)'
