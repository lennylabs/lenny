# Pre-release gate. Everything, including all three providers in both shapes.
# Target wall-clock: < 8 hours.
#
# Architecture and tier definitions: TESTING.md §20.10.

name: pre-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag being validated (e.g., v0.1.0-rc.1)'
        required: true
        type: string
      compare_against:
        description: 'Prior release tag to diff load baselines against'
        required: false
        type: string

concurrency:
  group: pre-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:

  weekly-suite:
    name: Weekly suite (re-run)
    uses: ./.github/workflows/weekly.yml
    secrets: inherit

  e2e-cloud-full-sandbox:
    name: tier 6 — e2e cloud (all providers × both shapes)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [weekly-suite]
    strategy:
      fail-fast: false
      matrix:
        provider: [gke, eks, aks]
        shape:    [cloud-small, cloud-sandbox]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run e2e cloud tier
        env:
          LENNY_CLOUD_PROVIDER: ${{ matrix.provider }}
          LENNY_CLOUD_SHAPE: ${{ matrix.shape }}
        run: ./bin/lenny-test --tier e2e_cloud
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verdict-prerelease-${{ matrix.provider }}-${{ matrix.shape }}
          path: tests/results/latest.json
          retention-days: 90

  chaos-full:
    name: tier 8 — chaos (full)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [weekly-suite]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run chaos tier
        run: ./bin/lenny-test --tier chaos
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verdict-prerelease-chaos
          path: tests/results/latest.json
          retention-days: 90

  security-pentest:
    name: tier 9 — security (full + pentest driver)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [weekly-suite]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      # The §18.33 external pen-test partner bundle is delivered via the
      # org-level secret two-person-approval process TESTING.md §20.13
      # documents, not committed to the repository. When the secret is
      # configured, write it to a runner-local file and point
      # LENNY_PENTEST_BUNDLE at it. LENNY_RELEASE_GATE marks this run as
      # the "per release" pen-test cadence, so TestPentestReplay fails
      # instead of silently falling back to the internal baseline bundle
      # when the secret is missing.
      - name: Write partner pen-test bundle
        if: ${{ secrets.PENTEST_BUNDLE_JSON != '' }}
        env:
          PENTEST_BUNDLE_JSON: ${{ secrets.PENTEST_BUNDLE_JSON }}
        run: |
          mkdir -p "${RUNNER_TEMP}/pentest"
          printf '%s' "${PENTEST_BUNDLE_JSON}" > "${RUNNER_TEMP}/pentest/partner-bundle.json"
          echo "LENNY_PENTEST_BUNDLE=${RUNNER_TEMP}/pentest/partner-bundle.json" >> "${GITHUB_ENV}"
      - name: Run security tier
        env:
          LENNY_RELEASE_GATE: "1"
        run: ./bin/lenny-test --tier security
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verdict-prerelease-security
          path: tests/results/latest.json
          retention-days: 90

  slo-baseline-diff:
    name: SLO regression diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [weekly-suite]
    steps:
      - run: |
          echo "Phase 0 placeholder."
          echo "Compares Phase 14.5 baseline against ${{ inputs.compare_against }}."
          echo "Threshold: 15% per percentile (TESTING.md §22.5)."

  prerelease-rollup:
    name: pre-release roll-up summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Wait for every pre-release tier that uploads a verdict, then
    # aggregate. slo-baseline-diff is a placeholder today; once it
    # uploads a verdict it joins this list.
    needs: [e2e-cloud-full-sandbox, chaos-full, security-pentest, slo-baseline-diff]
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Download every verdict
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: tests/results/
          pattern: verdict-*
          merge-multiple: false
      - name: Aggregate into workflow summary
        run: |
          set -euo pipefail
          find tests/results -name 'latest.json' -print0 \
            | while IFS= read -r -d '' f; do
                cp "$f" "tests/results/$(basename "$(dirname "$f")").json"
              done
          {
            echo "## Pre-release verdict for ${{ inputs.tag }}"
            echo
            ./bin/lenny-test report --dir tests/results --output markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when the aggregated verdict is not PASS
        run: ./bin/lenny-test report --dir tests/results --output json | python3 -c 'import json,sys; v=json.load(sys.stdin); sys.exit(0 if v["verdict"]=="PASS" else 1)'
