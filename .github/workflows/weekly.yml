# Weekly gate. Full e2e on all three cloud providers in cloud-small shape.
# Target wall-clock: < 4 hours.
#
# Architecture and tier definitions: TESTING.md §20.10.

name: weekly

# CI is paused (owner decision 2026-10-30): this workflow runs only when triggered
# by hand. Restore its original triggers when CI resumes.
on:
  workflow_dispatch:

concurrency:
  group: weekly
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:

  nightly-suite:
    name: Nightly suite (re-run)
    uses: ./.github/workflows/nightly.yml
    secrets: inherit

  e2e-cloud-full:
    name: tier 6 — e2e cloud (all providers, cloud-small)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [nightly-suite]
    strategy:
      fail-fast: false
      matrix:
        provider: [gke, eks, aks]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run e2e cloud tier
        env:
          LENNY_CLOUD_PROVIDER: ${{ matrix.provider }}
        run: ./bin/lenny-test --tier e2e_cloud --output github-annotations
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verdict-weekly-${{ matrix.provider }}
          path: tests/results/latest.json
          retention-days: 90

  weekly-rollup:
    name: weekly roll-up summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # load-full-system also uploads a verdict; include it so the
    # rollup never fires before its sibling completes.
    needs: [e2e-cloud-full, load-full-system]
    if: always()
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Download every verdict
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: tests/results/
          pattern: verdict-*
          merge-multiple: false
      - name: Aggregate into workflow summary
        run: |
          set -euo pipefail
          find tests/results -name 'latest.json' -print0 \
            | while IFS= read -r -d '' f; do
                cp "$f" "tests/results/$(basename "$(dirname "$f")").json"
              done
          ./bin/lenny-test report --dir tests/results --output markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when any verdict failed
        run: ./bin/lenny-test report --dir tests/results --output json | python3 -c 'import json,sys; v=json.load(sys.stdin); sys.exit(0 if v["verdict"]=="PASS" else 1)'

  load-full-system:
    name: tier 7 — load (full-system)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [nightly-suite]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      # The group's plan opens with the static tier, whose proto
      # no-drift check needs the generator's binaries. Restore-only:
      # the static job in pr.yml is the sole writer of this key.
      - name: Restore tool cache (~/go/bin)
        id: tools-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/go/bin
          key: lenny-go-bin-v3-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            lenny-go-bin-v3-${{ runner.os }}-
      - name: Install proto producer tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.69.0
          go install golang.org/x/tools/cmd/goimports@v0.45.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Add tool bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run full-system load tier
        run: ./bin/lenny-test --group phase-13.5-gate
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verdict-load-full-system
          path: tests/results/latest.json
          retention-days: 90
