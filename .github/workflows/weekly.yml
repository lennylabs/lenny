# Weekly gate. Full e2e on all three cloud providers in cloud-small shape.
# Target wall-clock: < 4 hours.
#
# Architecture and tier definitions: TESTING.md §20.10.

name: weekly

on:
  schedule:
    - cron: '0 6 * * 0'    # 06:00 UTC every Sunday
  workflow_dispatch:

concurrency:
  group: weekly
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:

  nightly-suite:
    name: Nightly suite (re-run)
    uses: ./.github/workflows/nightly.yml
    secrets: inherit

  e2e-cloud-full:
    name: tier 6 — e2e cloud (all providers, cloud-small)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [nightly-suite]
    strategy:
      fail-fast: false
      matrix:
        provider: [gke, eks, aks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run e2e cloud tier
        env:
          LENNY_CLOUD_PROVIDER: ${{ matrix.provider }}
        run: ./bin/lenny-test --tier e2e_cloud
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdict-weekly-${{ matrix.provider }}
          path: tests/results/latest.json
          retention-days: 60

  load-full-system:
    name: tier 7 — load (full-system)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [nightly-suite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run full-system load tier
        run: ./bin/lenny-test --group phase-13.5-gate
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdict-load-full-system
          path: tests/results/latest.json
          retention-days: 60
