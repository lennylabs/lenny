# Nightly gate. Full e2e on Kind, cloud-subset rotated across providers,
# full security minus pentest, path-specific load baselines.
# Target wall-clock: < 2 hours.
#
# Architecture and tier definitions: TESTING.md §20.9.

name: nightly

on:
  schedule:
    - cron: '0 5 * * *'    # 05:00 UTC daily
  workflow_dispatch:        # manual trigger

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:

  # Phase 0: nightly delegates entirely to the PR pipeline plus a TODO list
  # for the tiers that have not landed yet. Each tier becomes a real job as
  # it ships per TESTING.md §13.

  pr-suite:
    name: PR suite (re-run)
    uses: ./.github/workflows/pr.yml
    secrets: inherit

  e2e-kind-full:
    name: tier 5 — e2e Kind (full)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [pr-suite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run e2e Kind tier
        run: ./bin/lenny-test --tier e2e_kind
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdict-e2e-kind-full
          path: tests/results/latest.json
          retention-days: 30

  e2e-cloud-rotated:
    name: tier 6 — e2e cloud (rotated across providers)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [pr-suite]
    strategy:
      fail-fast: false
      matrix:
        provider: [gke, eks, aks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run e2e cloud tier
        env:
          LENNY_CLOUD_PROVIDER: ${{ matrix.provider }}
        run: ./bin/lenny-test --tier e2e_cloud
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdict-e2e-cloud-${{ matrix.provider }}
          path: tests/results/latest.json
          retention-days: 30

  chaos:
    name: tier 8 — chaos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [pr-suite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run chaos tier
        run: ./bin/lenny-test --tier chaos
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdict-chaos
          path: tests/results/latest.json
          retention-days: 30

  security-full:
    name: tier 9 — security (full minus pentest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pr-suite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run security tier
        run: ./bin/lenny-test --tier security
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdict-security
          path: tests/results/latest.json
          retention-days: 30

  load-baseline:
    name: tier 7 — load (per-phase baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pr-suite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run load tier
        run: ./bin/lenny-test --tier load
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdict-load
          path: tests/results/latest.json
          retention-days: 30

  dep-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pr-suite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod verify
        run: go mod verify
      - name: go list updates
        run: go list -m -u all
        continue-on-error: true
