# Nightly gate. Full e2e on Kind, cloud-subset rotated across providers,
# full security minus pentest, path-specific load baselines.
# Target wall-clock: < 2 hours.
#
# Architecture and tier definitions: TESTING.md §20.9.

name: nightly

on:
  schedule:
    - cron: '0 5 * * *'    # 05:00 UTC daily
  workflow_dispatch:        # manual trigger

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:

  # Phase 0: nightly delegates entirely to the PR pipeline plus a TODO list
  # for the tiers that have not landed yet. Each tier becomes a real job as
  # it ships per TESTING.md §13.

  pr-suite:
    name: PR suite (re-run)
    uses: ./.github/workflows/pr.yml
    secrets: inherit

  e2e-kind-full:
    name: tier 5 — e2e Kind (full)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [pr-suite]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run e2e Kind tier
        run: ./bin/lenny-test --tier e2e_kind --output github-annotations
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verdict-e2e-kind-full
          path: tests/results/latest.json
          retention-days: 90

  e2e-cloud-rotated:
    name: tier 6 — e2e cloud (rotated across providers)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [pr-suite]
    strategy:
      fail-fast: false
      matrix:
        provider: [gke, eks, aks]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run e2e cloud tier
        env:
          LENNY_CLOUD_PROVIDER: ${{ matrix.provider }}
        run: ./bin/lenny-test --tier e2e_cloud --subset critical-path-rotated --output github-annotations
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verdict-e2e-cloud-${{ matrix.provider }}
          path: tests/results/latest.json
          retention-days: 90

  chaos:
    name: tier 8 — chaos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [pr-suite]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run chaos tier
        run: ./bin/lenny-test --tier chaos --subset core --output github-annotations
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verdict-chaos
          path: tests/results/latest.json
          retention-days: 90

  security-full:
    name: tier 9 — security (full minus pentest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pr-suite]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run security tier
        run: ./bin/lenny-test --tier security --subset full --output github-annotations
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verdict-security
          path: tests/results/latest.json
          retention-days: 90

  load-baseline:
    name: tier 7 — load (per-phase baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pr-suite]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run load tier
        run: ./bin/lenny-test --tier load --subset per-phase-baseline --output github-annotations
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verdict-load
          path: tests/results/latest.json
          retention-days: 90

  dep-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pr-suite]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod
      - name: go mod verify
        run: go mod verify
      - name: go list updates
        run: go list -m -u all
        continue-on-error: true

  mutation:
    name: tier 1 — mutation testing (§19.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pr-suite]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore tool cache (~/go/bin)
        id: tools-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/go/bin
          key: lenny-go-bin-v1-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            lenny-go-bin-v1-${{ runner.os }}-
      - name: Install go-mutesting
        if: steps.tools-cache.outputs.cache-hit != 'true'
        # Commit pin: go-mutesting predates the /v2 module-path
        # convention and has no resolvable @vX tag.
        run: go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@48d0401f00fbfb9502adc2c5138497ad8ccfafb9
        continue-on-error: true
      - name: Add tool bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Mutate critical packages
        # Critical packages per §19.3: audit, circuitbreaker,
        # idempotency, quota, tokenexchange, auth/jwt. The mutation
        # subcommand internally applies the 0.85 threshold to these
        # packages.
        run: |
          for pkg in pkg/audit pkg/circuitbreaker pkg/idempotency pkg/quota pkg/tokenexchange pkg/auth/jwt; do
            echo "=== ${pkg} ==="
            ./bin/lenny-test mutation --pkg "${pkg}" || echo "mutation regression in ${pkg}"
          done | tee mutation.log
          cat mutation.log >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true   # informational today; gate flips on once go-mutesting ships in the repo

  spec-coverage:
    name: spec coverage (§22.2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pr-suite]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Report spec coverage
        run: |
          ./bin/lenny-test coverage --spec | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Enforce minimum spec coverage
        # Today's leaf-section coverage sits at ~45%; the threshold
        # ratchets up as phases ship. Set to 0.40 today so a
        # regression of more than 5 percentage points fires.
        run: ./bin/lenny-test coverage --spec --threshold 0.40

  nightly-rollup:
    name: nightly roll-up summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e-kind-full, e2e-cloud-rotated, chaos, security-full, load-baseline]
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Download every verdict
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: tests/results/
          pattern: verdict-*
          merge-multiple: false
      - name: Aggregate into workflow summary
        run: |
          set -euo pipefail
          find tests/results -name 'latest.json' -print0 \
            | while IFS= read -r -d '' f; do
                cp "$f" "tests/results/$(basename "$(dirname "$f")").json"
              done
          ./bin/lenny-test report --dir tests/results --output markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when any verdict failed
        run: ./bin/lenny-test report --dir tests/results --output json | python3 -c 'import json,sys; v=json.load(sys.stdin); sys.exit(0 if v["verdict"]=="PASS" else 1)'
