# Per-phase gate. Run manually or via branch trigger to confirm a phase is
# complete. Each phase's gate group is defined in tests/groups.yaml.
#
# Architecture: TESTING.md §13 (per-phase deliverables) and §20.11.

name: phase-gate

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase identifier (e.g., 3.5, 5.8, 13.5, 17a)'
        required: true
        type: string

concurrency:
  group: phase-gate-${{ inputs.phase }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:

  gate:
    name: phase-${{ inputs.phase }}-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run phase gate
        run: ./bin/lenny-test --group phase-${{ inputs.phase }}-gate
      - name: Upload phase-completion artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: phase-${{ inputs.phase }}-completion
          path: tests/results/latest.json
          retention-days: 36500   # phase-gate artifacts are gate inputs; retain effectively forever
