# Per-phase gate. Run manually or via branch trigger to confirm a phase is
# complete. Each phase's gate group is defined in tests/groups.yaml.
#
# Architecture: TESTING.md §13 (per-phase deliverables) and §20.11.

name: phase-gate

# CI is paused (owner decision 2026-10-30): this workflow runs only when triggered
# by hand. Restore its original triggers when CI resumes.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase identifier (e.g., 3.5, 5.8, 13.5, 17a)'
        required: true
        type: string

concurrency:
  group: phase-gate-${{ inputs.phase }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:

  gate:
    name: phase-${{ inputs.phase }}-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      # Every phase plan opens with the static tier, whose proto
      # no-drift check needs the generator's binaries. Restore-only:
      # the static job in pr.yml is the sole writer of this key.
      - name: Restore tool cache (~/go/bin)
        id: tools-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/go/bin
          key: lenny-go-bin-v3-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            lenny-go-bin-v3-${{ runner.os }}-
      - name: Install proto producer tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.69.0
          go install golang.org/x/tools/cmd/goimports@v0.45.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Add tool bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run phase gate
        run: ./bin/lenny-test --group phase-${{ inputs.phase }}-gate
      - name: Upload phase-completion artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: phase-${{ inputs.phase }}-completion
          path: tests/results/latest.json
          retention-days: 36500   # phase-gate artifacts are gate inputs; retain effectively forever
