# Weekly cache prune. Removes caches older than 7 days so the per-repo
# 10 GB ceiling does not silently start evicting useful entries.
#
# TESTING.md §20.6.

name: cache-prune

on:
  schedule:
    - cron: '0 4 * * 0'    # 04:00 UTC every Sunday
  workflow_dispatch:

concurrency:
  group: cache-prune
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:

  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Prune caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cutoff=$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
                || date -u -v-7d '+%Y-%m-%dT%H:%M:%SZ')
          gh cache list --limit 200 --json id,key,createdAt | \
            jq -r --arg cutoff "$cutoff" '.[] | select(.createdAt < $cutoff) | .id' | \
            while read -r id; do
              echo "deleting cache id=$id"
              gh cache delete "$id" || true
            done
