# PR gate. Triggered on pull_request and on push to any feature branch.
# Target wall-clock: < 15 minutes.
#
# Architecture and tier definitions: TESTING.md §20.8.

name: pr

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write
  checks: write

jobs:

  # Phase 0: a single job builds lenny-test and runs the early tiers. As
  # higher tiers come online the gate fans out into parallel jobs per tier.

  pr-fast:
    name: pr-fast (changed-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0     # full history for `git diff` resolution
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run pr-fast group
        run: ./bin/lenny-test --group pr-fast --output human

  static:
    name: tier 0 — static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pr-fast]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore tool cache (~/go/bin)
        id: tools-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/go/bin
          key: lenny-go-bin-v1-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            lenny-go-bin-v1-${{ runner.os }}-
      - name: Install static-tier tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          go install mvdan.cc/gofumpt@v0.10.0
          go install golang.org/x/tools/cmd/goimports@v0.45.0
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          go install github.com/bufbuild/buf/cmd/buf@v1.69.0
      - name: Add tool bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Validate maps
        run: ./bin/lenny-test validate-maps
      - name: Validate diagnosis coverage
        run: ./bin/lenny-test validate-diagnosis
      - name: Run static tier
        run: ./bin/lenny-test --tier static --output github-annotations
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verdict-static
          path: tests/results/latest.json
          retention-days: 30

  unit:
    name: tier 1 — unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [pr-fast]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run unit tier
        run: ./bin/lenny-test --tier unit --output github-annotations
      - name: Fetch base branch for diff coverage
        run: git fetch --no-tags --depth=2000 origin main || true
      - name: Coverage report (§22.1 80% floor on changed code)
        run: |
          ./bin/lenny-test coverage --go | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ./bin/lenny-test coverage --diff origin/main --threshold 0.80 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cover-profile
          path: tests/results/cover.out
          retention-days: 30
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verdict-unit
          path: tests/results/latest.json
          retention-days: 30

  component:
    name: tier 2 — component
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run component tier
        run: ./bin/lenny-test --tier component --output github-annotations
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verdict-component
          path: tests/results/latest.json
          retention-days: 30

  contract:
    name: tier 3 — contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run contract tier
        run: ./bin/lenny-test --tier contract --output github-annotations
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verdict-contract
          path: tests/results/latest.json
          retention-days: 30

  integration:
    name: tier 4 — integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The tier hierarchy is gating: failures in static/unit invalidate
    # higher tiers' assumptions. Listing static and unit here
    # short-circuits a wasted integration runner when Tier 0/1 is red.
    needs: [static, unit, component, contract]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run integration tier
        run: ./bin/lenny-test --tier integration --output github-annotations
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verdict-integration
          path: tests/results/latest.json
          retention-days: 30

  e2e-kind-critical:
    name: tier 5 — e2e Kind (critical-path)
    runs-on: ubuntu-latest   # promoted to self-hosted once Tier 5 is wired
    timeout-minutes: 30
    needs: [integration]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run e2e-Kind critical-path subset
        # SkipUnlessAvailable gates on docker + kind; on ubuntu-latest
        # without setup-docker the suite skips cleanly.
        run: ./bin/lenny-test --tier e2e_kind --subset critical-path --output github-annotations
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verdict-e2e-kind
          path: tests/results/latest.json
          retention-days: 30

  conformance-bundled:
    name: tier 10 — conformance (bundled runtimes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Run conformance tier
        run: ./bin/lenny-test --tier conformance --subset bundled-runtimes --output github-annotations
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verdict-conformance
          path: tests/results/latest.json
          retention-days: 30

  docs:
    name: tier 11 — documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pr-fast]
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          node-version: '20'
      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3.12.2
      - name: Check links in docs and spec
        run: |
          set -e
          fail=0
          for f in $(find docs spec -name '*.md' -not -path '*/node_modules/*'); do
            markdown-link-check "$f" -q --config .markdown-link-check.json 2>/dev/null || fail=1
          done
          exit $fail

  pr-summary:
    name: PR roll-up comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, unit, component, contract, integration, e2e-kind-critical, conformance-bundled, docs]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build lenny-test
        run: go build -o bin/lenny-test ./cmd/lenny-test
      - name: Download all verdicts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: tests/results/
          pattern: verdict-*
          merge-multiple: false
      - name: Aggregate verdicts into one Markdown comment
        run: |
          set -euo pipefail
          # The download step places each artifact in its own
          # subdirectory; flatten into tests/results/ so report can
          # walk them.
          find tests/results -name 'latest.json' -print0 \
            | while IFS= read -r -d '' f; do
                cp "$f" "tests/results/$(basename "$(dirname "$f")").json"
              done
          ./bin/lenny-test report --dir tests/results --output markdown > pr-summary.md
          echo "<!-- lenny-test:pr-summary -->" >> pr-summary.md
          cat pr-summary.md
      - name: Post or update comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Look for an existing comment carrying the sigil.
          existing=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- lenny-test:pr-summary -->")) | .id' \
            | head -1)
          if [[ -n "${existing}" ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing}" \
              -F body=@pr-summary.md
            echo "updated comment ${existing}"
          else
            gh pr comment "${PR_NUMBER}" --body-file pr-summary.md
            echo "posted new comment"
          fi
      - name: Fail when the aggregated verdict is not PASS
        # Posted after the comment so reviewers always see the
        # rollup, regardless of overall verdict. Branch-protection
        # rules that require pr-summary now gate on this step.
        run: ./bin/lenny-test report --dir tests/results --output json | python3 -c 'import json,sys; v=json.load(sys.stdin); sys.exit(0 if v["verdict"]=="PASS" else 1)'
