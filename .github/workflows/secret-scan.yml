# Secret scanning. Runs gitleaks against the commits a pull request
# introduces (and against feature-branch pushes). CI fails on any
# positive hit. Covers community fork PRs. See spec §18.3.

name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0     # full history so the scan range resolves

      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo gitleaks/gitleaks --json tagName -q .tagName)
          ver="${tag#v}"
          url="https://github.com/gitleaks/gitleaks/releases/download/${tag}/gitleaks_${ver}_linux_x64.tar.gz"
          echo "Installing gitleaks ${ver}"
          curl -fsSL "${url}" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan committed changes for secrets
        env:
          # On a pull_request the range is base..head; on a push it is
          # the pushed range. The fallback covers a first push with no
          # before-SHA (all-zero) by scanning the most recent commit.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_BASE}" ]]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [[ -n "${PUSH_BEFORE}" && ! "${PUSH_BEFORE}" =~ ^0+$ ]]; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="${PUSH_AFTER}~1..${PUSH_AFTER}"
          fi
          echo "Scanning commit range ${range}"
          gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --log-opts="${range}" \
            --exit-code 1
