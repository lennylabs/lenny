# SPDX-License-Identifier: MIT
#
# The senses driving the name pass over the fixture tree, keyed by file
# and by the occurrence's position in that file.
kind: reserved-phrase-senses
version: 1
entries:
  # The path half of a link destination is prose the register resolves.
  # The fragment of the same destination is an addressable link target,
  # so it takes no entry and is left as it stands.
  - file: docs/reference/links.md
    occurrence: 1
    identifiers:
      - CH-PODLIFECYCLE
  - file: spec/13_security-model.md
    occurrence: 1
    identifiers:
      - LNK-GWCONTROL
  - file: spec/16_observability.md
    occurrence: 1
    identifiers:
      - LNK-POD-GRPC
      - CH-LLMPROXY
    replacement: LNK-POD-GRPC and CH-LLMPROXY links
  - file: pkg/carrier/carrier.go
    occurrence: 1
    identifiers:
      - CH-PODLIFECYCLE
  # The site of this carrier opens its own line inside an element of a
  # package-level composite literal, which the parser attaches to
  # nothing. The trailing comment of the same carrier is outside the
  # position the law governs, so it takes no entry.
  - file: pkg/catalog/catalog.go
    occurrence: 1
    identifiers:
      - CH-PODLIFECYCLE
  # A tracked Go file under sdks/ is a carrier like any other tracked Go
  # file, and this site wraps across two comment lines.
  - file: sdks/runtime/go/runtime/lifecycle_test.go
    occurrence: 1
    identifiers:
      - CH-PODLIFECYCLE
  - file: schemas/lenny-adapter.schema.json
    occurrence: 1
    identifiers:
      - CH-PODLIFECYCLE
  - file: schemas/lenny-adapter.proto
    occurrence: 1
    identifiers:
      - CH-PODLIFECYCLE
  - file: schemas/lenny-adapter.proto
    occurrence: 2
    identifiers:
      - CH-PODLIFECYCLE
  # The first two sites of this carrier sit in its header comment block,
  # which the build constraint separates from the package clause, the
  # third sits in the string literal the pinned-literal register names as
  # pinning a sentence of the specification, and the fourth sits in a
  # comment documenting a declaration. Each names a distinct identifier,
  # so an enumeration that skipped the header block or the pinned literal
  # would write a resolved identifier at the wrong site.
  - file: tests/tier11_docs/route_test.go
    occurrence: 1
    identifiers:
      - CH-PODLIFECYCLE
  - file: tests/tier11_docs/route_test.go
    occurrence: 2
    identifiers:
      - CH-ADAPTEREVENTS
  - file: tests/tier11_docs/route_test.go
    occurrence: 3
    identifiers:
      - LNK-GWCONTROL
  - file: tests/tier11_docs/route_test.go
    occurrence: 4
    identifiers:
      - LNK-GWCONTROL
