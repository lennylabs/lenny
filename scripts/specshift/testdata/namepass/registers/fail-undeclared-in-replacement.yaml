# SPDX-License-Identifier: MIT
#
# The senses driving the name pass over the fixture tree, with every
# site of the tree resolved and one entry whose replacement carries a
# third identifier the specification fixture declares nowhere. The
# replacement is written at the site verbatim, so the run fails on that
# spelling rather than landing it in the tree.
kind: reserved-phrase-senses
version: 1
entries:
  - file: spec/13_security-model.md
    occurrence: 1
    identifiers:
      - LNK-GWCONTROL
  - file: spec/16_observability.md
    occurrence: 1
    identifiers:
      - LNK-POD-GRPC
      - CH-LLMPROXY
    replacement: LNK-POD-GRPC and CH-LLMPROXY and CH-BOGUS links
  - file: pkg/carrier/carrier.go
    occurrence: 1
    identifiers:
      - CH-PODLIFECYCLE
  - file: schemas/lenny-adapter.schema.json
    occurrence: 1
    identifiers:
      - CH-PODLIFECYCLE
  - file: schemas/lenny-adapter.proto
    occurrence: 1
    identifiers:
      - CH-PODLIFECYCLE
  - file: schemas/lenny-adapter.proto
    occurrence: 2
    identifiers:
      - CH-PODLIFECYCLE
  # The first two sites of this carrier sit in its header comment block,
  # which the build constraint separates from the package clause, and the
  # third sits in a comment documenting a declaration. Each names a
  # distinct identifier, so an enumeration that skipped the header block
  # would write a resolved identifier at the wrong site.
  - file: tests/tier11_docs/route_test.go
    occurrence: 1
    identifiers:
      - CH-PODLIFECYCLE
  - file: tests/tier11_docs/route_test.go
    occurrence: 2
    identifiers:
      - CH-ADAPTEREVENTS
  - file: tests/tier11_docs/route_test.go
    occurrence: 3
    identifiers:
      - LNK-GWCONTROL
