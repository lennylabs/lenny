# SPDX-License-Identifier: MIT
#
# A path-keyed register whose every key sits outside the specification
# directory. A run confined to that directory covers none of the paths
# this register is keyed by, so the key-rewrite channel is skipped rather
# than failing an emptiness guard over a register the run cannot reach.
kind: residual-register
version: 1
class: generated-artifacts
entries:
  - member: charts/lenny/values.schema.json
    class: generated-artifacts
    disposition: in-class
    reason: chart schema generated from the values struct tags
  - member: pkg/carrier/carrier.go
    class: generated-artifacts
    disposition: excluded
    reason: hand-authored carrier recorded here under its own path
