# SPDX-License-Identifier: MIT
#
# A residual register fixture for the generated-artifact class. Its
# in-class entries are permanent, because a generated file keeps matching
# the class predicate for as long as it exists.
kind: specshift-residual-register
version: 1
class: generated-artifacts
entries:
  - member: charts/lenny/values.schema.json
    class: generated-artifacts
    disposition: in-class
    reason: chart schema generated from the values struct tags
  - member: pkg/carrier/carrier.go
    class: generated-artifacts
    disposition: excluded
    reason: hand-authored carrier that the marker scan reported once
