#
# A path-keyed register whose every key sits under the specification
# directory. A run confined to that directory covers the paths this
# register is keyed by, so the key-rewrite channel has a register to
# rewrite and its emptiness guard is the condition that decides the run
# rather than a channel that was skipped.
kind: residual-register
version: 1
class: generated-artifacts
entries:
  - member: spec/04_system-components.md
    class: generated-artifacts
    disposition: excluded
    reason: authored section recorded here under the path it is keyed by
  - member: spec/13_security-model.md
    class: generated-artifacts
    disposition: excluded
    reason: authored section recorded here under the path it is keyed by
